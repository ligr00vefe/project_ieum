import org.apache.tools.ant.taskdefs.condition.Os

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.security:spring-security-messaging'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	// Spring Boot 4는 테스트 슬라이스를 모듈별 스타터로 분리한다(@DataJpaTest는 data-jpa-test에 포함).
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// (#9 슬라이스 테스트) @DataJpaTest용 인메모리 DB. H2 사용 + 테스트 전용 H2 방언으로 enum→varchar.
	//   H2 2.4.240은 @Enumerated(STRING)을 native ENUM 컬럼으로 만들고(Hibernate 7 H2Dialect),
	//   그 ENUM 컬럼 + prepared statement가 같은 행의 다른 CHECK 평가를 오염시키는 마찰이 있다.
	//   → H2VarcharEnumDialect가 enum 선언을 varchar로 바꿔 이 문제를 제거한다(엔티티 무수정).
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// XSS 방어용 HTML 새니타이저
	implementation 'org.jsoup:jsoup:1.18.3'

	// 비밀번호 찾기 이메일 발송
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Querydsl Settings
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
}

tasks.named('test') {
	useJUnitPlatform()
}

// =========================================================================
// Tailwind CSS 독립형 CLI 빌드 자동화 설정 (Node.js/npm 의존성 없음)
// =========================================================================
tasks.register('downloadTailwind', Exec) {
    def os = Os.isFamily(Os.FAMILY_WINDOWS) ? "windows-x64.exe" : (Os.isFamily(Os.FAMILY_MAC) ? "macos-x64" : "linux-x64")
    def version = "v3.4.1"

    workingDir projectDir
    commandLine 'curl',
            '-sLO',
            '--ssl-no-revoke',
            '-L',
            '-o',
            'tailwindcss.exe',
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${version}/tailwindcss-${os}"

    doLast {
        def file = new File(projectDir, "tailwindcss-${os}")
        if (file.exists()) {
            file.renameTo(new File(projectDir, Os.isFamily(Os.FAMILY_WINDOWS) ? "tailwindcss.exe" : "tailwindcss"))
            if (!Os.isFamily(Os.FAMILY_WINDOWS)) {
                "chmod +x tailwindcss".execute()
            }
        }
    }
    outputs.file(Os.isFamily(Os.FAMILY_WINDOWS) ? "tailwindcss.exe" : "tailwindcss")
}

tasks.register('buildTailwind', Exec) {
    dependsOn 'downloadTailwind'
    workingDir projectDir
    def exe = Os.isFamily(Os.FAMILY_WINDOWS)
            ? "${projectDir}/tailwindcss.exe"
            : "${projectDir}/tailwindcss"

    commandLine exe,
            '-i', "${projectDir}/src/main/resources/static/css/input.css",
            '-o', "${projectDir}/src/main/resources/static/css/output.css",
            '--minify'
}

processResources.dependsOn buildTailwind

// Querydsl QClass 생성 경로
sourceSets {
    main {
        java {
            srcDirs += layout.buildDirectory.dir("generated/querydsl")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = layout.buildDirectory.dir("generated/querydsl").get().asFile
}

clean {
    delete layout.buildDirectory.dir("generated/querydsl")
}
