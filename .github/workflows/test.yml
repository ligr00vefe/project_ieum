name: test

# 비용 최소화: ubuntu(1x 과금 배수), 문서/개인노트만 바뀐 커밋은 스킵,
# 같은 ref 연속 push 시 이전 run 자동 취소.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'personal/**'
      - 'tasks/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'personal/**'
      - 'tasks/**'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # tailwind(buildTailwind/downloadTailwind)는 스킵한다.
      # output.css는 레포에 커밋돼 있고 백엔드 테스트와 무관하다.
      # CI엔 application-secret.properties가 없으므로 테스트는 H2로 격리된다.
      - name: Run tests (H2, tailwind skipped)
        run: ./gradlew test -x buildTailwind -x downloadTailwind --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
