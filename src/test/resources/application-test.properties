# (#9 슬라이스 + @SpringBootTest 공용 테스트 프로파일)
# H2 인메모리 datasource를 명시한다. @DataJpaTest는 임베디드를 자동 교체하고,
# @SpringBootTest는 이 datasource로 H2를 사용한다.
# 운영 secret(MySQL)을 들이지 않으므로(application-secret.properties) 개인 DB와 무관하다.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ieum;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 테스트 전용 H2 방언: enum 컬럼을 native ENUM 대신 VARCHAR로 선언(H2 native enum + prepared
# statement가 CHECK 평가를 오염시키는 마찰 회피). 엔티티는 운영 MySQL 기준이라 무수정.
spring.jpa.properties.hibernate.dialect=com.project.ieum.testsupport.H2VarcharEnumDialect

spring.main.lazy-initialization=false

# 테스트는 결정론적이어야 하므로 자동 전이 비활성(기본값이지만 의도를 명시)
matching.scheduler.enabled=false

ieum.upload.certification-path=${java.io.tmpdir}/ieum-test-certifications
