# (#9 슬라이스 테스트 전용 프로파일)
# @DataJpaTest가 클래스패스의 임베디드 H2를 자동 구성한다.
# 운영 secret(MySQL)을 들이지 않으므로(application-secret.properties) 개인 DB와 무관하다.

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 테스트 전용 H2 방언: enum 컬럼을 native ENUM 대신 VARCHAR로 선언(H2 native enum + prepared
# statement가 CHECK 평가를 오염시키는 마찰 회피). 엔티티는 운영 MySQL 기준이라 무수정.
spring.jpa.properties.hibernate.dialect=com.project.ieum.testsupport.H2VarcharEnumDialect
