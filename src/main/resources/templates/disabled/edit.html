<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 페이지 헤더 -->
    <div class="flex items-center gap-3 mb-6">
        <a th:href="@{/disabled/mypage}"
           class="w-9 h-9 flex items-center justify-center rounded-xl bg-surface border border-line shadow-sm text-gray-500 hover:text-indigo-600 hover:border-indigo-100 transition-all">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <div>
            <h1 class="text-lg font-extrabold text-ink">회원정보 수정</h1>
            <p class="text-xs text-gray-400 mt-0.5">프로필을 업데이트하세요</p>
        </div>
    </div>

    <!-- 성공 메시지 -->
    <div th:if="${successMessage}"
         class="mb-5 flex items-center gap-3 p-4 bg-green-50 border border-green-100 rounded-2xl">
        <svg class="w-5 h-5 text-green-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-sm text-green-700 font-medium" th:text="${successMessage}"></p>
    </div>

    <form th:action="@{/disabled/mypage/edit}"
          method="post"
          enctype="multipart/form-data"
          th:object="${editDTO}"
          class="space-y-5">

        <!-- 기본 정보 -->
        <div class="bg-surface rounded-2xl border border-line shadow-sm p-6">
            <h2 class="text-sm font-bold text-ink flex items-center gap-2 mb-5">
                <span class="w-6 h-6 bg-indigo-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </span>
                기본 정보
            </h2>
            <div class="space-y-4">
                <!-- 이름 -->
                <div class="space-y-1.5">
                    <label for="name" class="block text-sm font-semibold text-ink-muted">이름 <span class="text-red-500">*</span></label>
                    <input type="text" id="name" th:field="*{name}" placeholder="홍길동"
                           class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <!-- 이메일 (읽기전용) -->
                <div class="space-y-1.5">
                    <label class="block text-sm font-semibold text-ink-muted">이메일</label>
                    <div class="flex items-center px-4 py-3 border border-line rounded-xl bg-surface-muted">
                        <span class="text-sm text-gray-500" th:text="${userEmail}">user@email.com</span>
                        <span class="ml-auto text-xs text-gray-400">변경 불가</span>
                    </div>
                </div>

                <!-- 전화번호 -->
                <div class="space-y-1.5">
                    <label for="phone" class="block text-sm font-semibold text-ink-muted">전화번호 <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" th:field="*{phone}" placeholder="010-0000-0000"
                           class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <!-- 생년월일 + 성별 -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label for="birthDate" class="block text-sm font-semibold text-ink-muted">생년월일</label>
                        <input type="date" id="birthDate" th:field="*{birthDate}"
                               class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                    <div class="space-y-1.5">
                        <label for="gender" class="block text-sm font-semibold text-ink-muted">성별</label>
                        <select id="gender" th:field="*{gender}"
                                class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all appearance-none bg-surface">
                            <option value="">선택해주세요</option>
                            <option value="M">남성</option>
                            <option value="F">여성</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 보호자 정보 -->
        <div class="bg-surface rounded-2xl border border-line shadow-sm p-6">
            <h2 class="text-sm font-bold text-ink flex items-center gap-2 mb-5">
                <span class="w-6 h-6 bg-indigo-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </span>
                보호자 정보 <span class="text-xs text-gray-400 font-normal ml-1">(선택)</span>
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label for="guardianName" class="block text-sm font-semibold text-ink-muted">보호자 이름</label>
                    <input type="text" id="guardianName" th:field="*{guardianName}" placeholder="이름"
                           class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>
                <div class="space-y-1.5">
                    <label for="guardianPhone" class="block text-sm font-semibold text-ink-muted">보호자 연락처</label>
                    <input type="tel" id="guardianPhone" th:field="*{guardianPhone}" placeholder="010-0000-0000"
                           class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>
            </div>
        </div>

        <!-- 장애 정보 -->
        <div class="bg-surface rounded-2xl border border-line shadow-sm p-6">
            <h2 class="text-sm font-bold text-ink flex items-center gap-2 mb-5">
                <span class="w-6 h-6 bg-indigo-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </span>
                장애 정보
            </h2>
            <div class="space-y-5">
                <!-- 장애 유형 -->
                <div class="space-y-3">
                    <label class="block text-sm font-semibold text-ink-muted">
                        장애 유형 <span class="text-xs text-gray-400 font-normal ml-1">(복수 선택 가능)</span>
                    </label>
                    <div class="flex flex-wrap gap-2.5">
                        <th:block th:each="type : ${disabilityTypes}">
                            <div class="relative">
                                <input type="checkbox"
                                       th:field="*{disabilityTypeIds}"
                                       th:value="${type.id}"
                                       th:id="${'dt_' + type.id}"
                                       class="sr-only peer">
                                <label th:for="${'dt_' + type.id}"
                                       class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-line-strong text-ink-muted text-sm font-medium cursor-pointer select-none transition-all hover:border-indigo-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 peer-checked:text-white"
                                       th:text="${type.name}">장애유형</label>
                            </div>
                        </th:block>
                        <!-- 데이터 없을 때 fallback -->
                        <th:block th:if="${disabilityTypes == null or #lists.isEmpty(disabilityTypes)}">
                            <th:block th:each="typeName,stat : ${ {'지체장애','시각장애','청각장애','지적장애','자폐성장애','정신장애'} }">
                                <div class="relative">
                                    <input type="checkbox" th:id="${'dt_s_' + stat.index}"
                                           name="disabilityTypeIds" th:value="${stat.index + 1}"
                                           class="sr-only peer">
                                    <label th:for="${'dt_s_' + stat.index}"
                                           class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-line-strong text-ink-muted text-sm font-medium cursor-pointer select-none transition-all hover:border-indigo-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 peer-checked:text-white"
                                           th:text="${typeName}">장애유형</label>
                                </div>
                            </th:block>
                        </th:block>
                    </div>
                </div>

                <!-- 활동 가능 범위 -->
                <div class="space-y-2">
                    <label for="activityRange" class="block text-sm font-semibold text-ink-muted">
                        활동 가능 범위
                        <span class="text-xs text-gray-400 font-normal ml-1">(예: 집 근처, 단독 외출 불가 등)</span>
                    </label>
                    <textarea id="activityRange" th:field="*{activityRange}" rows="3"
                              placeholder="자유롭게 작성해주세요 (예: 집 주변 이동 가능, 휠체어 사용 중)"
                              class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"></textarea>
                </div>

                <!-- 피해야 할 상황 -->
                <div class="space-y-2">
                    <label for="avoidSituations" class="block text-sm font-semibold text-ink-muted">
                        피해야 할 상황
                        <span class="text-xs text-gray-400 font-normal ml-1">(예: 큰 소음, 대인기피증 등)</span>
                    </label>
                    <textarea id="avoidSituations" th:field="*{avoidSituations}" rows="3"
                              placeholder="자유롭게 작성해주세요 (예: 계단 이용 불가, 장시간 이동 어려움)"
                              class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"></textarea>
                </div>
            </div>
        </div>

        <!-- 의사소통 방식 -->
        <div class="bg-surface rounded-2xl border border-line shadow-sm p-6">
            <h2 class="text-sm font-bold text-ink flex items-center gap-2 mb-5">
                <span class="w-6 h-6 bg-indigo-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                </span>
                의사소통 방식 <span class="text-xs text-gray-400 font-normal ml-1">(복수 선택 가능)</span>
            </h2>
            <div class="space-y-3">
                <th:block th:if="${communicationMethods != null and !#lists.isEmpty(communicationMethods)}">
                    <th:block th:each="method : ${communicationMethods}">
                        <div class="relative">
                            <input type="checkbox"
                                   th:field="*{communicationMethodIds}"
                                   th:value="${method.id}"
                                   th:id="${'cm_' + method.id}"
                                   class="sr-only peer">
                            <label th:for="${'cm_' + method.id}"
                                   class="flex items-center gap-4 w-full p-4 border-2 border-line-strong rounded-2xl cursor-pointer select-none transition-all hover:border-indigo-300 hover:bg-indigo-50/30 peer-checked:border-indigo-500 peer-checked:bg-indigo-50">
                                <div class="cm-circle w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0 transition-all">
                                    <svg class="cm-check w-3 h-3 opacity-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                                    </svg>
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-gray-800" th:text="${method.name}">방법</div>
                                    <div class="text-xs text-gray-400 mt-0.5" th:text="${method.description}"></div>
                                </div>
                            </label>
                        </div>
                    </th:block>
                </th:block>
                <!-- fallback -->
                <th:block th:if="${communicationMethods == null or #lists.isEmpty(communicationMethods)}">
                    <th:block th:each="item,stat : ${ {{'대화 가능','말로 충분히 의사소통을 할 수 있어요'},{'구어','짧은 단어나 짧은 문장으로 소통이 가능해요'},{'수어','수화를 사용하는 활동지원사를 선호해요'},{'기타 방식','AAC, 글쓰기 등 별도 의사소통 방식 사용'}} }">
                        <div class="relative">
                            <input type="checkbox" th:id="${'cm_s_' + stat.index}"
                                   name="communicationMethodIds" th:value="${stat.index + 1}"
                                   class="sr-only peer">
                            <label th:for="${'cm_s_' + stat.index}"
                                   class="flex items-center gap-4 w-full p-4 border-2 border-line-strong rounded-2xl cursor-pointer select-none transition-all hover:border-indigo-300 hover:bg-indigo-50/30 peer-checked:border-indigo-500 peer-checked:bg-indigo-50">
                                <div class="cm-circle w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0">
                                    <svg class="cm-check w-3 h-3 opacity-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                                    </svg>
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-gray-800" th:text="${item[0]}">방법</div>
                                    <div class="text-xs text-gray-400 mt-0.5" th:text="${item[1]}">설명</div>
                                </div>
                            </label>
                        </div>
                    </th:block>
                </th:block>
            </div>
        </div>

        <!-- 성향 태그 -->
        <div class="bg-surface rounded-2xl border border-line shadow-sm p-6">
            <h2 class="text-sm font-bold text-ink flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-indigo-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                    </svg>
                </span>
                나의 성향
            </h2>
            <p class="text-xs text-gray-400 mb-4 ml-8">성향이 가까운 활동지원사를 추천해 드립니다. (복수 선택 가능)</p>
            <div class="flex flex-wrap gap-2.5">
                <th:block th:if="${personalityTags != null and !#lists.isEmpty(personalityTags)}">
                    <th:block th:each="tag : ${personalityTags}">
                        <div class="relative">
                            <input type="checkbox"
                                   th:field="*{personalityTagIds}"
                                   th:value="${tag.id}"
                                   th:id="${'tag_' + tag.id}"
                                   class="sr-only peer">
                            <label th:for="${'tag_' + tag.id}"
                                   class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-line-strong text-ink-muted text-sm font-medium cursor-pointer select-none transition-all hover:border-indigo-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 peer-checked:text-white"
                                   th:text="${tag.name}">태그</label>
                        </div>
                    </th:block>
                </th:block>
                <!-- fallback -->
                <th:block th:if="${personalityTags == null or #lists.isEmpty(personalityTags)}">
                    <th:block th:each="tagName,stat : ${ {'꼼꼼함','차분함','친화력','배려심','조용함','활발함','유머러스','책임감'} }">
                        <div class="relative">
                            <input type="checkbox" th:id="${'tag_s_' + stat.index}"
                                   name="personalityTagIds" th:value="${stat.index + 1}"
                                   class="sr-only peer">
                            <label th:for="${'tag_s_' + stat.index}"
                                   class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-line-strong text-ink-muted text-sm font-medium cursor-pointer select-none transition-all hover:border-indigo-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 peer-checked:text-white"
                                   th:text="${tagName}">태그</label>
                        </div>
                    </th:block>
                </th:block>
            </div>
        </div>

        <!-- MBTI -->
        <div class="bg-surface rounded-2xl border border-line shadow-sm p-6">
            <h2 class="text-sm font-bold text-ink flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-purple-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                </span>
                MBTI 성향
            </h2>
            <p class="text-xs text-gray-400 mb-4 ml-8">MBTI를 등록하면 성향이 맞는 활동지원사 추천에 반영됩니다.</p>

            <!-- 내 MBTI -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-ink-muted mb-3">내 MBTI <span class="text-xs text-gray-400 font-normal">(선택)</span></label>
                <div class="grid grid-cols-4 gap-2">
                    <div class="relative">
                        <input type="radio" id="mbti_none" name="mbtiType" value="" th:checked="${editDTO.mbtiType == null}" class="peer sr-only">
                        <label for="mbti_none"
                               class="block text-center py-2 px-3 rounded-lg border cursor-pointer text-sm transition-all
                                      border-line-strong text-gray-500 hover:border-purple-300
                                      peer-checked:bg-purple-100 peer-checked:border-purple-400 peer-checked:text-purple-700 peer-checked:font-semibold">선택 안함</label>
                    </div>
                    <th:block th:each="mbti : ${mbtiTypes}">
                        <div class="relative">
                            <input type="radio" th:id="${'mbti_' + mbti.name()}" name="mbtiType" th:value="${mbti}" th:checked="${editDTO.mbtiType == mbti}" class="peer sr-only">
                            <label th:for="${'mbti_' + mbti.name()}"
                                   class="block text-center py-2 px-3 rounded-lg border cursor-pointer text-sm transition-all
                                          border-line-strong text-ink-muted hover:border-purple-300
                                          peer-checked:bg-purple-100 peer-checked:border-purple-400 peer-checked:text-purple-700 peer-checked:font-semibold"
                                   th:text="${mbti.label}">MBTI</label>
                        </div>
                    </th:block>
                </div>
            </div>

            <!-- 선호 활동지원사 MBTI -->
            <div class="mb-2">
                <label class="block text-sm font-semibold text-ink-muted mb-1">선호하는 활동지원사 MBTI <span class="text-xs text-gray-400 font-normal">(선택, 최대 4개)</span></label>
                <p class="text-xs text-gray-400 mb-3">선택하면 해당 MBTI 활동지원사가 추천 매칭률에 추가 반영됩니다.</p>
                <div class="grid grid-cols-4 gap-2">
                    <th:block th:each="mbti : ${mbtiTypes}">
                        <div class="relative">
                            <input type="checkbox" th:id="${'prefmbti_' + mbti.name()}" name="preferredMbtiTypes" th:value="${mbti}"
                                   th:checked="${editDTO.preferredMbtiTypes != null and editDTO.preferredMbtiTypes.contains(mbti)}"
                                   class="peer sr-only" onchange="limitMbtiCheck(this, 4)">
                            <label th:for="${'prefmbti_' + mbti.name()}"
                                   class="block text-center py-2 px-3 rounded-lg border cursor-pointer text-sm transition-all
                                          border-line-strong text-ink-muted hover:border-indigo-300
                                          peer-checked:bg-indigo-100 peer-checked:border-indigo-400 peer-checked:text-indigo-700 peer-checked:font-semibold"
                                   th:text="${mbti.label}">MBTI</label>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
        <script>
        function limitMbtiCheck(checkbox, max) {
            var checked = document.querySelectorAll('input[name="preferredMbtiTypes"]:checked');
            if (checked.length > max) {
                checkbox.checked = false;
                alert('최대 ' + max + '개까지 선택 가능합니다.');
            }
        }
        </script>
