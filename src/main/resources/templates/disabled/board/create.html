<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <nav aria-label="breadcrumb">
        <ol class="flex items-center gap-2 text-sm text-gray-400 mb-6 list-none p-0 m-0">
            <li><a th:href="@{/disabled/board}" class="hover:text-indigo-600 transition-colors">게시판</a></li>
            <li aria-hidden="true"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li><span class="text-gray-600 font-medium" aria-current="page">요청 글 작성</span></li>
        </ol>
    </nav>

    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="h-1 bg-indigo-600"></div>
        <div class="p-7 sm:p-8">

            <div class="mb-7">
                <h1 class="text-xl font-bold text-gray-900" th:text="${editMode} ? '도움 요청 수정' : '도움 요청 작성'">도움 요청 작성</h1>
                <p class="text-sm text-gray-500 mt-1">필요한 도움 내용을 자세히 작성해주세요.</p>
            </div>

            <form th:action="${editMode} ? @{/disabled/board/{id}/edit(id=${requestId})} : @{/disabled/board/create}"
                  th:object="${form}" method="post" class="space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- 제목 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">제목 <span class="text-red-500">*</span></label>
                    <input type="text" th:field="*{title}" placeholder="예: 병원 동행이 필요해요 (외래진료)"
                           class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all">
                    <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-xs text-red-500"></p>
                </div>

                <!-- 필요한 도움 (서비스 카테고리) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3">필요한 도움 <span class="text-red-500">*</span></label>
                    <div class="flex flex-wrap gap-x-2 gap-y-3">
                        <th:block th:each="cat : ${serviceCategories}">
                        <label class="cursor-pointer">
                            <input type="radio" th:field="*{serviceCategoryId}" th:value="${cat.id}" class="sr-only peer">
                            <span th:text="${cat.name}"
                                  class="inline-block px-3.5 py-2 text-sm font-medium text-gray-600 bg-gray-50 border border-gray-200 rounded-xl peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 hover:border-indigo-300 transition-all cursor-pointer">서비스</span>
                        </label>
                        </th:block>
                    </div>
                    <p th:if="${#fields.hasErrors('serviceCategoryId')}" th:errors="*{serviceCategoryId}" class="mt-1 text-xs text-red-500"></p>
                </div>

                <!-- 시작/종료 일시 -->
                <input type="hidden" th:field="*{desiredStartDatetime}" id="desiredStartDatetime">
                <input type="hidden" th:field="*{desiredEndDatetime}" id="desiredEndDatetime">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">시작 일시 <span class="text-red-500">*</span></label>
                        <input type="text" id="startPicker" placeholder="날짜와 시작 시간 선택" readonly
                               class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all bg-white cursor-pointer">
                        <p th:if="${#fields.hasErrors('desiredStartDatetime')}" th:errors="*{desiredStartDatetime}" class="mt-1 text-xs text-red-500"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">종료 일시 <span class="text-xs font-normal text-gray-400">(선택)</span></label>
                        <input type="text" id="endPicker" placeholder="종료 시간 선택 (선택)" readonly
                               class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all bg-white cursor-pointer">
                    </div>
                </div>

                <!-- 활동 지역 (카카오 주소 검색) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">활동 지역 <span class="text-red-500">*</span></label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="roadAddressDisplay"
                               th:value="*{roadAddress}"
                               placeholder="도로명주소 검색" readonly
                               class="flex-1 px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50 cursor-pointer focus:outline-none"
                               onclick="searchAddress()">
                        <button type="button" onclick="searchAddress()"
                                class="px-4 py-3 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all">주소 검색</button>
                    </div>
                    <input type="text" th:field="*{addressDetail}" placeholder="상세주소 (건물명, 호수 등)"
                           class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all mb-1">
                    <input type="hidden" th:field="*{roadAddress}" id="roadAddress">
                    <input type="hidden" th:field="*{sido}" id="sido">
                    <input type="hidden" th:field="*{sigungu}" id="sigungu">
                    <input type="hidden" th:field="*{bname}" id="bname">
                    <input type="hidden" th:field="*{zonecode}" id="zonecode">
                    <input type="hidden" th:field="*{bcode}" id="bcode">
                    <p th:if="${#fields.hasErrors('roadAddress')}" th:errors="*{roadAddress}" class="mt-1 text-xs text-red-500"></p>
                </div>

                <!-- 선호 성향 태그 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">원하는 활동지원사 성향 <span class="text-xs font-normal text-gray-400">(선택)</span></label>
                    <p class="text-xs text-gray-400 mb-3">함께 활동하고 싶은 활동지원사의 성향을 선택해 주세요.</p>
                    <div class="flex flex-wrap gap-2">
                        <th:block th:each="tag : ${personalityTags}">
                        <label class="cursor-pointer">
                            <input type="checkbox" th:field="*{personalityTagIds}" th:value="${tag.id}" class="sr-only peer">
                            <span th:text="${'#' + tag.name}"
                                  class="inline-block px-3 py-1.5 text-xs font-medium text-gray-600 bg-gray-50 border border-gray-200 rounded-xl peer-checked:bg-indigo-100 peer-checked:text-indigo-700 peer-checked:border-indigo-200 hover:border-indigo-200 transition-all cursor-pointer">태그</span>
                        </label>
                        </th:block>
                    </div>
                </div>

                <!-- 출발지 / 도착지 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">출발지 / 도착지 <span class="text-xs font-normal text-gray-400">(이동 보조 서비스 시 필수)</span></label>
                    <p class="text-xs text-gray-400 mb-3">이동 보조가 필요한 경우 출발지와 도착지를 입력해주세요.</p>
                    <div class="space-y-3">
                        <div class="flex gap-2 items-center">
                            <span class="flex-shrink-0 w-16 text-xs font-semibold text-indigo-600 bg-indigo-50 border border-indigo-100 rounded-lg px-2 py-2 text-center">출발지</span>
                            <div class="flex flex-1 gap-2">
                                <input type="text" id="departureAddressDisplay"
                                       th:value="*{departureAddress}"
                                       placeholder="출발지 주소 검색" readonly
                                       class="flex-1 px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50 cursor-pointer focus:outline-none"
                                       onclick="searchDeparture()">
                                <button type="button" onclick="searchDeparture()"
                                        class="px-4 py-3 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all whitespace-nowrap">검색</button>
                            </div>
                        </div>
                        <div class="flex gap-2 items-center">
                            <span class="flex-shrink-0 w-16 text-xs font-semibold text-teal-600 bg-teal-50 border border-teal-100 rounded-lg px-2 py-2 text-center">도착지</span>
                            <div class="flex flex-1 gap-2">
                                <input type="text" id="destinationAddressDisplay"
                                       th:value="*{destinationAddress}"
                                       placeholder="도착지 주소 검색" readonly
                                       class="flex-1 px-4 py-3 text-sm border border-gray-200 rounded-xl bg-gray-50 cursor-pointer focus:outline-none"
                                       onclick="searchDestination()">
                                <button type="button" onclick="searchDestination()"
                                        class="px-4 py-3 text-sm font-semibold text-white bg-teal-500 rounded-xl hover:bg-teal-600 transition-all whitespace-nowrap">검색</button>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" th:field="*{departureAddress}" id="departureAddress">
                    <input type="hidden" th:field="*{destinationAddress}" id="destinationAddress">
                </div>

                <!-- 출발지/도착지 경로 지도 (TMap appKey가 있고 두 주소가 모두 입력된 경우에만 노출) -->
                <div th:if="${tmapAppKey != null and !tmapAppKey.isEmpty()}"
                     id="routeMapSection" class="hidden">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">경로 미리보기</label>
                    <div class="rounded-2xl overflow-hidden border border-gray-200 bg-gray-50">
                        <div id="routeMapCanvas" class="w-full" style="height:400px;"></div>
                        <div id="routeInfo" class="px-4 py-3 text-xs text-gray-500 border-t border-gray-100 flex gap-4">
                            <span id="routeDistance"></span>
                            <span id="routeTime"></span>
                        </div>
                    </div>
                </div>

                <!-- 도움 내용 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">상세 내용</label>
                    <textarea th:field="*{body}" rows="5" placeholder="필요한 도움에 대해 자세히 설명해주세요."
                              class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all resize-none"></textarea>
                </div>

                <!-- 특이사항 -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">특이사항 / 주의사항 <span class="text-xs font-normal text-gray-400">(선택)</span></label>
                    <textarea th:field="*{specialNotes}" rows="3" placeholder="알레르기, 주의사항, 기타 요청 등"
                              class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all resize-none"></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <a th:href="@{/disabled/board}"
                       class="flex-1 py-3 text-sm font-semibold text-gray-600 bg-gray-100 rounded-xl text-center hover:bg-gray-200 transition-all">
                        취소
                    </a>
                    <button type="submit"
                            class="flex-1 py-3 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
                        도움 요청 등록하기
                    </button>
                </div>

            </form>
        </div>
    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:inline="javascript">
const PREFILL_START = /*[[${prefillStartDate}]]*/ null;
const PREFILL_END   = /*[[${prefillEndDate}]]*/ null;
document.addEventListener('DOMContentLoaded', function () {
    const pickerConfig = {
        locale: 'ko',
        enableTime: true,
        dateFormat: 'Y-m-d H:i',
        minuteIncrement: 10,
        time_24hr: true,
        onChange: function(selectedDates, dateStr, instance) {
            const hiddenId = instance.element.id === 'startPicker' ? 'desiredStartDatetime' : 'desiredEndDatetime';
            document.getElementById(hiddenId).value = dateStr ? dateStr.replace(' ', 'T') : '';
        }
    };
    const startFp = flatpickr('#startPicker', pickerConfig);
    const endFp   = flatpickr('#endPicker', { ...pickerConfig });

    if (PREFILL_START) {
        const startVal = PREFILL_START + ' 09:00';
        startFp.setDate(startVal, true);
        document.getElementById('desiredStartDatetime').value = PREFILL_START + 'T09:00';
    }
    if (PREFILL_END) {
        const endVal = PREFILL_END + ' 18:00';
        endFp.setDate(endVal, true);
        document.getElementById('desiredEndDatetime').value = PREFILL_END + 'T18:00';
    }
});

function searchAddress() {
    new daum.Postcode({
        oncomplete: function(data) {
            document.getElementById('roadAddressDisplay').value = data.roadAddress;
            document.getElementById('roadAddress').value = data.roadAddress;
            document.getElementById('sido').value = data.sido;
            document.getElementById('sigungu').value = data.sigungu;
            document.getElementById('bname').value = data.bname;
            document.getElementById('zonecode').value = data.zonecode;
            document.getElementById('bcode').value = data.bcode;
        }
    }).open();
}

function searchDeparture() {
    new daum.Postcode({
        oncomplete: function(data) {
            document.getElementById('departureAddressDisplay').value = data.roadAddress;
            document.getElementById('departureAddress').value = data.roadAddress;
            tryDrawRoute();
        }
    }).open();
}

function searchDestination() {
    new daum.Postcode({
        oncomplete: function(data) {
            document.getElementById('destinationAddressDisplay').value = data.roadAddress;
            document.getElementById('destinationAddress').value = data.roadAddress;
            tryDrawRoute();
        }
    }).open();
}
</script>

<!-- TMap 경로 그리기 (appKey 있을 때만) -->
<script th:if="${tmapAppKey != null and !tmapAppKey.isEmpty()}" th:inline="javascript">
(function () {
    var TMAP_KEY = /*[[${tmapAppKey}]]*/ '';
    var routeMap = null, routeMarkers = [], routePolylines = [];

    function geocode(address) {
        var url = 'https://apis.openapi.sk.com/tmap/geo/fullAddrGeo?version=1&addressFlag=F00'
                + '&fullAddr=' + encodeURIComponent(address)
                + '&appKey=' + TMAP_KEY;
        return fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var item = data && data.coordinateInfo && data.coordinateInfo.coordinate
                          && data.coordinateInfo.coordinate[0];
                if (!item || !item.newLon || !item.newLat) return null;
                return { lng: parseFloat(item.newLon), lat: parseFloat(item.newLat) };
            });
    }

    function clearRoute() {
        routePolylines.forEach(function (p) { p.setMap(null); });
        routeMarkers.forEach(function (m) { m.setMap(null); });
        routePolylines = [];
        routeMarkers = [];
    }

    // 두 좌표 사이의 거리(m)로 적절한 줌 레벨 계산
    function calcZoom(start, end) {
        var R = 6371000;
        var dLat = (end.lat - start.lat) * Math.PI / 180;
        var dLng = (end.lng - start.lng) * Math.PI / 180;
        var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(start.lat*Math.PI/180)*Math.cos(end.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
        var distM = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        if (distM > 20000) return 11;
        if (distM > 10000) return 12;
        if (distM > 5000)  return 13;
        if (distM > 2000)  return 14;
        return 15;
    }

    function drawRoute(start, end) {
        clearRoute();

        // 지도 중심을 경로 중간으로, 줌도 경로 거리에 맞게 즉시 이동
        var midLat = (start.lat + end.lat) / 2;
        var midLng = (start.lng + end.lng) / 2;
        routeMap.setCenter(new Tmapv2.LatLng(midLat, midLng));
        routeMap.setZoom(calcZoom(start, end));

        var payload = {
            startX: start.lng.toString(), startY: start.lat.toString(),
            endX:   end.lng.toString(),   endY:   end.lat.toString(),
            reqCoordType: 'WGS84GEO', resCoordType: 'WGS84GEO',
            startName: '출발지', endName: '도착지'
        };

        fetch('https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&appKey=' + TMAP_KEY, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            var features = data && data.features;
            if (!features || !features.length) {
                document.getElementById('routeDistance').textContent = '경로를 찾을 수 없습니다.';
                return;
            }

            // 거리·시간 요약 (첫 번째 feature의 properties)
            var summary = features[0].properties;
            if (summary && summary.totalDistance != null) {
                var distM   = summary.totalDistance;
                var timeSec = summary.totalTime || 0;
                document.getElementById('routeDistance').textContent =
                    '총 거리: ' + (distM >= 1000 ? (distM / 1000).toFixed(1) + 'km' : Math.round(distM) + 'm');
                document.getElementById('routeTime').textContent =
                    '도보 예상: ' + Math.ceil(timeSec / 60) + '분';
            }

            // 폴리라인
            features.forEach(function (f) {
                if (f.geometry.type !== 'LineString') return;
                var path = f.geometry.coordinates.map(function (c) {
                    return new Tmapv2.LatLng(c[1], c[0]);
                });
                routePolylines.push(new Tmapv2.Polyline({
                    path: path, strokeColor: '#4f46e5', strokeWeight: 5,
                    strokeOpacity: 0.9, map: routeMap
                }));
            });

            var PIN_ANCHOR = new Tmapv2.Point(14, 38);
            var PIN_SIZE   = new Tmapv2.Size(28, 38);
            var startMarker = new Tmapv2.Marker({
                position: new Tmapv2.LatLng(start.lat, start.lng),
                map: routeMap, title: '출발지',
                icon:'/images/tmap/depature_icon.png',
                iconSize: PIN_SIZE, iconAnchor: PIN_ANCHOR
            });
            var endMarker = new Tmapv2.Marker({
                position: new Tmapv2.LatLng(end.lat, end.lng),
                map: routeMap, title: '도착지',
                icon:'/images/tmap/destination_icon.png',
                iconSize: PIN_SIZE, iconAnchor: PIN_ANCHOR
            });
            routeMarkers.push(startMarker, endMarker);
        })
        .catch(function (err) {
            console.error('TMap route error', err);
            document.getElementById('routeDistance').textContent = '경로 API 호출에 실패했습니다.';
        });
    }

    function initRouteMap(centerLat, centerLng) {
        if (routeMap) return;
        var canvas = document.getElementById('routeMapCanvas');
        routeMap = new Tmapv2.Map('routeMapCanvas', {
            center: new Tmapv2.LatLng(centerLat, centerLng),
            width:  canvas.clientWidth  + 'px',
            height: canvas.clientHeight + 'px',
            zoom: 14
        });
    }

    window.tryDrawRoute = function () {
        var dep  = document.getElementById('departureAddress').value.trim();
        var dest = document.getElementById('destinationAddress').value.trim();
        if (!dep || !dest) return;

        document.getElementById('routeMapSection').classList.remove('hidden');
        document.getElementById('routeDistance').textContent = '경로를 불러오는 중...';
        document.getElementById('routeTime').textContent = '';

        function whenReady(tries) {
            if (!window.Tmapv2) {
                if (tries < 50) setTimeout(function () { whenReady(tries + 1); }, 100);
                return;
            }
            // 지도가 없으면 임시 중심으로 초기화(이후 geocode 결과로 즉시 이동)
            initRouteMap(37.5665, 126.9780);

            Promise.all([geocode(dep), geocode(dest)]).then(function (results) {
                var start = results[0], end = results[1];
                if (!start || !end) {
                    document.getElementById('routeDistance').textContent = '주소를 좌표로 변환할 수 없습니다.';
                    return;
                }
                drawRoute(start, end);
            }).catch(function () {
                document.getElementById('routeDistance').textContent = '주소 변환에 실패했습니다.';
            });
        }
        whenReady(0);
    };

    // 재게시 등 초기값이 있을 경우 자동 표시
    document.addEventListener('DOMContentLoaded', function () {
        var dep  = document.getElementById('departureAddress').value.trim();
        var dest = document.getElementById('destinationAddress').value.trim();
        if (dep && dest) tryDrawRoute();
