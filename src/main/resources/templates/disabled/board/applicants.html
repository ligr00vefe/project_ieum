<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <nav aria-label="breadcrumb">
        <ol class="flex items-center gap-2 text-sm text-gray-400 mb-6 list-none p-0 m-0">
            <li><a th:href="@{/disabled/board}" class="hover:text-indigo-600 transition-colors">게시판</a></li>
            <li aria-hidden="true"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li><a th:href="@{/disabled/board/{id}(id=${request.id})}" class="hover:text-indigo-600 transition-colors">게시물 상세</a></li>
            <li aria-hidden="true"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li><span class="text-ink-muted font-medium" aria-current="page">지원자 리스트</span></li>
        </ol>
    </nav>

    <div th:if="${message}" th:text="${message}" class="mb-4 rounded-md border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-800"></div>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-xl font-bold text-ink">지원자 리스트</h1>
            <p class="text-sm text-gray-500 mt-1">
                <span th:text="${request.title}">제목</span> ·
                <span class="text-indigo-600 font-semibold" th:text="${#lists.size(applications) + '명 지원'}">0명 지원</span>
            </p>
        </div>
    </div>

    <div class="space-y-4">

        <th:block th:each="application, stat : ${applications}">
        <div th:classappend="${application.status.name() != 'PENDING' ? ' opacity-60' : ''} + ${stat.index == 0 and application.status.name() == 'PENDING' ? ' border-2 border-indigo-200 shadow-sm' : ''}"
             class="bg-surface rounded-2xl border border-line p-5">
            <div class="flex items-start gap-4">
                <div class="relative flex-shrink-0">
                    <div class="relative w-14 h-14 bg-indigo-100 rounded-2xl flex items-center justify-center text-indigo-600 font-bold text-lg"
                         th:text="${#strings.substring(application.caregiver.fullName, 0, 1)}">박
                        <img th:if="${application.caregiver.profileImageUrl != null}"
                             th:src="${application.caregiver.profileImageUrl}"
                             alt="" class="absolute inset-0 w-full h-full object-cover rounded-2xl"
                             onerror="this.remove()">
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-1.5">
                        <div class="flex items-center gap-2">
                            <button type="button"
                                    class="text-base font-bold text-ink hover:text-indigo-600 transition-colors underline-offset-2 hover:underline"
                                    th:attr="data-appl-id=${application.id},
                                             data-name=${application.caregiver.fullName},
                                             data-intro=${application.caregiver.introLong},
                                             data-short=${application.caregiver.introShort},
                                             data-rating=${application.caregiver.avgRating},
                                             data-reviews=${application.caregiver.totalReviews},
                                             data-experience=${application.caregiver.experience},
                                             data-cert=${application.caregiver.certificationType},
                                             data-img=${application.caregiver.profileImageUrl}"
                                    onclick="openProfileModal(this)"
                                    th:text="${application.caregiver.fullName}">이름</button>
                            <span class="px-2 py-0.5 bg-teal-50 text-teal-600 text-xs font-medium rounded-full">활동지원사</span>
                            <span th:if="${application.status.name() == 'ACCEPTED'}"
                                  class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-xs font-medium rounded-full">수락됨</span>
                            <span th:if="${application.status.name() == 'REJECTED' or application.status.name() == 'CANCELLED'}"
                                  class="px-2 py-0.5 bg-surface-hover text-gray-400 text-xs font-medium rounded-full">거절됨</span>
                        </div>
                    </div>
                    <p th:if="${application.caregiver.introShort}"
                       class="text-xs text-gray-400 mb-2.5" th:text="${application.caregiver.introShort}">소개</p>
                    <div class="flex flex-wrap gap-1.5 mb-3">
                        <span th:if="${application.caregiver.hasCertification}"
                              class="px-2 py-1 bg-surface-muted text-gray-500 text-xs rounded-lg">자격증 보유</span>
                        <span th:if="${application.caregiver.certificationType}"
                              class="px-2 py-1 bg-surface-muted text-gray-500 text-xs rounded-lg"
                              th:text="${application.caregiver.certificationType}">자격증</span>
                    </div>
                    <div th:if="${application.status.name() == 'PENDING'}" class="flex gap-2">
                        <form th:action="@{/disabled/board/applications/{aid}/accept(aid=${application.id})}" method="post" class="flex-1">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="requestId" th:value="${request.id}"/>
                            <button type="submit"
                                    class="w-full py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl text-center hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">수락하기</button>
                        </form>
                    </div>
                    <div th:if="${application.status.name() == 'ACCEPTED'}" class="flex gap-2">
                        <a th:href="@{/chat/conversations}"
                           class="flex-1 py-2 text-sm font-semibold text-indigo-600 border border-indigo-200 rounded-xl text-center hover:bg-indigo-50 transition-all">채팅하기</a>
                    </div>
                </div>
            </div>
        </div>
        </th:block>

        <div th:if="${#lists.isEmpty(applications)}" class="rounded-lg border border-dashed border-indigo-200 bg-surface p-8 text-center text-ink-muted">
            아직 지원자가 없습니다.
        </div>

    </div>

</section>

<!-- Caregiver profile modal -->
<div id="profileModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeProfileModal()"></div>
    <div class="relative bg-surface rounded-2xl shadow-xl w-full max-w-md p-6 z-10">
        <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-gray-400 hover:text-ink-muted">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <div class="flex items-center gap-4 mb-4">
            <div id="modal-avatar" class="relative w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center text-indigo-600 font-bold text-xl flex-shrink-0 overflow-hidden"></div>
            <div>
                <h2 id="modal-name" class="text-lg font-bold text-ink"></h2>
                <span class="px-2 py-0.5 bg-teal-50 text-teal-600 text-xs font-medium rounded-full">활동지원사</span>
            </div>
        </div>
        <div class="flex items-center gap-4 mb-4 text-sm text-gray-500">
            <span id="modal-rating" class="flex items-center gap-1">
                <svg class="w-4 h-4 text-yellow-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                <span id="modal-rating-val">-</span>
            </span>
            <span id="modal-reviews"></span>
            <span id="modal-experience"></span>
        </div>
        <div id="modal-cert" class="mb-4 hidden">
            <span class="px-2 py-1 bg-surface-muted text-gray-500 text-xs rounded-lg" id="modal-cert-text"></span>
        </div>
        <div id="modal-short" class="text-sm text-gray-500 mb-3"></div>
        <div id="modal-intro" class="text-sm text-ink-muted leading-relaxed whitespace-pre-line border-t border-line pt-3 max-h-48 overflow-y-auto"></div>
    </div>
</div>

<script>
function openProfileModal(btn) {
    var name = btn.dataset.name || '';
    var intro = btn.dataset.intro || '';
    var short = btn.dataset.short || '';
    var rating = parseFloat(btn.dataset.rating);
    var reviews = parseInt(btn.dataset.reviews, 10);
    var experience = btn.dataset.experience || '';
    var cert = btn.dataset.cert || '';
    var img = btn.dataset.img || '';

    var avatar = document.getElementById('modal-avatar');
    avatar.innerHTML = '';
    if (img && img !== 'null') {
        var imgEl = document.createElement('img');
        imgEl.src = img;
        imgEl.className = 'w-full h-full object-cover';
        imgEl.onerror = function() { avatar.innerHTML = name.charAt(0); };
        avatar.appendChild(imgEl);
    } else {
        avatar.textContent = name.charAt(0);
    }

    document.getElementById('modal-name').textContent = name;
    document.getElementById('modal-rating-val').textContent = isNaN(rating) ? '-' : rating.toFixed(1);
    document.getElementById('modal-reviews').textContent = isNaN(reviews) || reviews === 0 ? '' : '리뷰 ' + reviews + '건';
    document.getElementById('modal-experience').textContent = experience && experience !== 'null' ? '경력 ' + experience : '';
    document.getElementById('modal-short').textContent = short && short !== 'null' ? short : '';
    document.getElementById('modal-intro').textContent = intro && intro !== 'null' ? intro : '';

    var certEl = document.getElementById('modal-cert');
    if (cert && cert !== 'null') {
        document.getElementById('modal-cert-text').textContent = cert;
        certEl.classList.remove('hidden');
    } else {
        certEl.classList.add('hidden');
    }

    document.getElementById('profileModal').classList.remove('hidden');
    document.getElementById('profileModal').classList.add('flex');
}

function closeProfileModal() {
    document.getElementById('profileModal').classList.add('hidden');
    document.getElementById('profileModal').classList.remove('flex');
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeProfileModal();
});
</script>
</th:block>
</html>
