<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <nav aria-label="breadcrumb">
        <ol class="flex items-center gap-2 text-sm text-gray-400 mb-6 list-none p-0 m-0">
            <li><a th:href="@{/disabled/board}" class="hover:text-indigo-600 transition-colors">게시판</a></li>
            <li aria-hidden="true"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li><a th:href="@{/disabled/board/{id}(id=${request.id})}" class="hover:text-indigo-600 transition-colors">게시물 상세</a></li>
            <li aria-hidden="true"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li><span class="text-gray-600 font-medium" aria-current="page">지원자 리스트</span></li>
        </ol>
    </nav>

    <div th:if="${message}" th:text="${message}" class="mb-4 rounded-md border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-800"></div>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-xl font-bold text-gray-900">지원자 리스트</h1>
            <p class="text-sm text-gray-500 mt-1">
                <span th:text="${request.title}">제목</span> ·
                <span class="text-indigo-600 font-semibold" th:text="${#lists.size(applications) + '명 지원'}">0명 지원</span>
            </p>
        </div>
    </div>

    <div class="space-y-4">

        <th:block th:each="application, stat : ${applications}">
        <div th:classappend="${application.status.name() != 'PENDING' ? ' opacity-60' : ''} + ${stat.index == 0 and application.status.name() == 'PENDING' ? ' border-2 border-indigo-200 shadow-sm' : ''}"
             class="bg-white rounded-2xl border border-gray-100 p-5">
            <div class="flex items-start gap-4">
                <div class="relative flex-shrink-0">
                    <div class="relative w-14 h-14 bg-indigo-100 rounded-2xl flex items-center justify-center text-indigo-600 font-bold text-lg"
                         th:text="${#strings.substring(application.caregiver.fullName, 0, 1)}">박
                        <img th:if="${application.caregiver.profileImageUrl != null}"
                             th:src="${application.caregiver.profileImageUrl}"
                             alt="" class="absolute inset-0 w-full h-full object-cover rounded-2xl"
                             onerror="this.remove()">
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-1.5">
                        <div class="flex items-center gap-2">
                            <p class="text-base font-bold text-gray-900" th:text="${application.caregiver.fullName}">이름</p>
                            <span class="px-2 py-0.5 bg-teal-50 text-teal-600 text-xs font-medium rounded-full">활동지원사</span>
                            <span th:if="${application.status.name() == 'ACCEPTED'}"
                                  class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-xs font-medium rounded-full">수락됨</span>
                            <span th:if="${application.status.name() == 'REJECTED' or application.status.name() == 'CANCELLED'}"
                                  class="px-2 py-0.5 bg-gray-100 text-gray-400 text-xs font-medium rounded-full">거절됨</span>
                        </div>
                    </div>
                    <p th:if="${application.caregiver.introShort}"
                       class="text-xs text-gray-400 mb-2.5" th:text="${application.caregiver.introShort}">소개</p>
                    <div class="flex flex-wrap gap-1.5 mb-3">
                        <span th:if="${application.caregiver.hasCertification}"
                              class="px-2 py-1 bg-gray-50 text-gray-500 text-xs rounded-lg">자격증 보유</span>
                        <span th:if="${application.caregiver.certificationType}"
                              class="px-2 py-1 bg-gray-50 text-gray-500 text-xs rounded-lg"
                              th:text="${application.caregiver.certificationType}">자격증</span>
                    </div>
                    <div th:if="${application.status.name() == 'PENDING'}" class="flex gap-2">
                        <form th:action="@{/disabled/board/applications/{aid}/accept(aid=${application.id})}" method="post" class="flex-1">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="requestId" th:value="${request.id}"/>
                            <button type="submit"
                                    class="w-full py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl text-center hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">수락하기</button>
                        </form>
                    </div>
                    <div th:if="${application.status.name() == 'ACCEPTED'}" class="flex gap-2">
                        <a th:href="@{/chat/conversations}"
                           class="flex-1 py-2 text-sm font-semibold text-indigo-600 border border-indigo-200 rounded-xl text-center hover:bg-indigo-50 transition-all">채팅하기</a>
                    </div>
                </div>
            </div>
        </div>
        </th:block>

        <div th:if="${#lists.isEmpty(applications)}" class="rounded-lg border border-dashed border-indigo-200 bg-white p-8 text-center text-slate-600">
            아직 지원자가 없습니다.
        </div>

    </div>

</section>
</th:block>
</html>
