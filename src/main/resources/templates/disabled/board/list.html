<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-4xl mx-auto px-4 sm:px-6 py-8">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">매칭 게시판</h1>
            <p class="text-sm text-gray-500 mt-1">나의 도움 요청을 등록하고 지원자를 찾아보세요.</p>
        </div>
        <a th:href="@{/disabled/board/create}"
           class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            요청 글 작성
        </a>
    </div>

    <!-- 탭 -->
    <div class="flex gap-1 mb-6 border-b border-gray-100">
        <button class="px-4 py-2.5 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 -mb-px">전체</button>
        <button class="px-4 py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors">진행중</button>
        <button class="px-4 py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors">매칭완료</button>
        <button class="px-4 py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors">종료</button>
    </div>

    <!-- 게시글 목록 -->
    <div class="space-y-3">

        <a th:href="@{/disabled/board/1}" class="block bg-white rounded-2xl border border-gray-100 p-5 hover:border-indigo-100 hover:shadow-sm transition-all">
            <div class="flex items-start justify-between">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-xs font-semibold rounded-full">모집중</span>
                        <span class="px-2 py-0.5 bg-orange-50 text-orange-600 text-xs font-medium rounded-full">급구</span>
                    </div>
                    <h3 class="text-base font-semibold text-gray-900 truncate">병원 동행이 필요해요 (외래진료)</h3>
                    <div class="flex items-center gap-3 mt-1.5 text-xs text-gray-400">
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            서울 강남구
                        </span>
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            11/16 (월) 14:00~16:00
                        </span>
                    </div>
                </div>
                <div class="flex flex-col items-end gap-2 ml-4 flex-shrink-0">
                    <span class="text-xs text-gray-400">지원자</span>
                    <span class="text-lg font-bold text-indigo-600">5명</span>
                </div>
            </div>
            <div class="flex items-center gap-1.5 mt-3 pt-3 border-t border-gray-50">
                <span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-xs rounded-md">이동 보조</span>
                <span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-xs rounded-md">약소름 보조</span>
                <span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-xs rounded-md">대기 동행</span>
            </div>
        </a>

        <a th:href="@{/disabled/board/2}" class="block bg-white rounded-2xl border border-gray-100 p-5 hover:border-indigo-100 hover:shadow-sm transition-all opacity-70">
            <div class="flex items-start justify-between">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 bg-teal-50 text-teal-600 text-xs font-semibold rounded-full">매칭완료</span>
                    </div>
                    <h3 class="text-base font-semibold text-gray-900 truncate">수어 가능한 분 찾아요 (당일)</h3>
                    <div class="flex items-center gap-3 mt-1.5 text-xs text-gray-400">
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            서울 마포구
                        </span>
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            11/10 (화) 09:00~
                        </span>
                    </div>
                </div>
                <div class="flex flex-col items-end gap-2 ml-4 flex-shrink-0">
                    <span class="text-xs text-gray-400">지원자</span>
                    <span class="text-lg font-bold text-gray-400">7명</span>
                </div>
            </div>
        </a>

        <a th:href="@{/disabled/board/3}" class="block bg-white rounded-2xl border border-gray-100 p-5 hover:border-indigo-100 hover:shadow-sm transition-all">
            <div class="flex items-start justify-between">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-xs font-semibold rounded-full">모집중</span>
                    </div>
                    <h3 class="text-base font-semibold text-gray-900 truncate">주장 이후 도움 요청합니다</h3>
                    <div class="flex items-center gap-3 mt-1.5 text-xs text-gray-400">
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            서울 서초구
                        </span>
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            11/18 (수) 10:00~
                        </span>
                    </div>
                </div>
                <div class="flex flex-col items-end gap-2 ml-4 flex-shrink-0">
                    <span class="text-xs text-gray-400">지원자</span>
                    <span class="text-lg font-bold text-indigo-600">2명</span>
                </div>
            </div>
        </a>

    </div>
</section>
</th:block>
</html>
