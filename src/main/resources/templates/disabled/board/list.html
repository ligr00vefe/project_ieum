<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">매칭 게시판</h1>
            <p class="text-sm text-gray-500 mt-1">나의 도움 요청을 등록하고 지원자를 찾아보세요.</p>
        </div>
        <a th:href="@{/disabled/board/create}"
           class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            요청 글 작성
        </a>
    </div>

    <div th:if="${message}" th:text="${message}" class="mb-4 rounded-md border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-800"></div>

    <!-- 내 요청 즉시 필터 — 목록이 작아 클라이언트측에서 바로 거른다(서버 호출 없음). -->
    <div th:if="${!#lists.isEmpty(requests)}"
         class="flex flex-col sm:flex-row sm:items-center gap-2 mb-4">
        <div class="relative flex-1">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="dqKeyword" placeholder="제목으로 검색" aria-label="제목으로 검색"
                   class="w-full pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300 bg-white">
        </div>
        <select id="dqStatus" aria-label="상태 필터"
                class="px-3 py-2 text-sm border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
            <option value="">상태 전체</option>
            <option value="OPEN">모집중</option>
            <option value="MATCHED">매칭완료</option>
            <option value="IN_PROGRESS">진행중</option>
            <option value="ENDED">종료</option>
        </select>
        <select id="dqCategory" aria-label="서비스 필터"
                class="px-3 py-2 text-sm border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
            <option value="">서비스 전체</option>
        </select>
    </div>

    <!-- 게시글 목록 -->
    <div class="rounded-2xl border border-gray-200 overflow-hidden bg-white">

        <th:block th:each="request, iter : ${requests}">
        <a th:href="@{/disabled/board/{id}(id=${request.id})}"
           th:classappend="${!iter.last} ? 'border-b border-gray-200'"
           th:attr="data-title=${#strings.toLowerCase(request.title)},data-status=${request.status.name()},data-category=${request.serviceCategory.name}"
           class="board-row flex items-center gap-4 px-5 py-4 hover:bg-indigo-50/50 transition-colors group">

            <!-- 상태 표시 좌측 컬러 바 -->
            <div th:classappend="${request.status.name() == 'OPEN' ? 'bg-indigo-400' : request.status.name() == 'MATCHED' ? 'bg-teal-400' : request.status.name() == 'IN_PROGRESS' ? 'bg-green-400' : 'bg-gray-300'}"
                 class="w-1 h-12 rounded-full flex-shrink-0"></div>

            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                    <span th:text="${request.status.name() == 'OPEN' ? '모집중' : request.status.name() == 'MATCHED' ? '매칭완료' : request.status.name() == 'IN_PROGRESS' ? '진행중' : '종료'}"
                          th:classappend="${request.status.name() == 'OPEN' ? 'bg-indigo-50 text-indigo-600 border-indigo-200' : request.status.name() == 'MATCHED' ? 'bg-teal-50 text-teal-600 border-teal-200' : request.status.name() == 'IN_PROGRESS' ? 'bg-green-50 text-green-600 border-green-200' : 'bg-gray-100 text-gray-500 border-gray-200'}"
                          class="px-2 py-0.5 text-[11px] font-bold rounded-md border">모집중</span>
                    <span th:if="${request.requester.userId == currentUserId}"
                          class="px-2 py-0.5 bg-indigo-100 text-indigo-600 text-[10px] font-bold rounded-md">내 글</span>
                    <span th:text="${request.serviceCategory.name}"
                          class="px-2 py-0.5 bg-gray-100 text-gray-500 text-[11px] font-medium rounded-md">서비스</span>
                </div>
                <h3 class="text-sm font-semibold text-gray-800 truncate group-hover:text-indigo-600 transition-colors"
                    th:text="${request.title}">제목</h3>
                <div class="flex items-center gap-3 mt-1 text-xs text-gray-400">
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span th:text="${request.requester.fullName}">작성자</span>
                    </span>
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span th:text="${request.sido + ' ' + request.sigungu}">서울 강남구</span>
                    </span>
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span th:text="${#temporals.format(request.desiredStartDatetime, 'MM/dd (E) HH:mm')}">일시</span>
                    </span>
                </div>
            </div>

            <svg class="w-4 h-4 text-gray-300 group-hover:text-indigo-400 flex-shrink-0 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </a>
        </th:block>

        <div th:if="${#lists.isEmpty(requests)}" class="py-16 text-center">
            <p class="text-sm font-semibold text-gray-500">등록한 도움 요청이 없어요</p>
            <p class="text-xs text-gray-400 mt-1">새 요청을 작성해 보세요.</p>
        </div>

        <!-- 필터 결과 없음(JS 토글) -->
        <div id="dqNoMatch" class="hidden py-16 text-center">
            <p class="text-sm font-semibold text-gray-500">검색 조건에 맞는 요청이 없어요</p>
            <p class="text-xs text-gray-400 mt-1">검색어나 필터를 바꿔 보세요.</p>
        </div>

    </div>

</section>

<!-- 내 요청 즉시 필터 — 렌더된 행을 키워드·상태·서비스로 거른다(접근성: 입력 즉시 반영). -->
<script>
(function () {
    var kwInput = document.getElementById('dqKeyword');
    var statusSel = document.getElementById('dqStatus');
    var catSel = document.getElementById('dqCategory');
    var noMatch = document.getElementById('dqNoMatch');
    var rows = Array.prototype.slice.call(document.querySelectorAll('.board-row'));
    if (!rows.length || !kwInput) return;

    // 종료 버킷(종료 라벨로 묶이는 상태) — 게시판 상태 라벨 매핑과 일치.
    var ENDED = ['COMPLETED', 'CLOSED'];

    // 서비스 필터 옵션을 렌더된 행에서 distinct로 구성.
    var seen = {};
    rows.forEach(function (row) {
        var cat = row.getAttribute('data-category');
        if (cat && !seen[cat]) {
            seen[cat] = true;
            var opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            catSel.appendChild(opt);
        }
    });

    function statusMatches(rowStatus, selected) {
        if (!selected) return true;
        if (selected === 'ENDED') return ENDED.indexOf(rowStatus) !== -1;
        return rowStatus === selected;
    }

    function applyFilter() {
        var kw = kwInput.value.trim().toLowerCase();
        var st = statusSel.value;
        var cat = catSel.value;
        var visible = 0;
        rows.forEach(function (row) {
            var matchKw = !kw || (row.getAttribute('data-title') || '').indexOf(kw) !== -1;
            var matchSt = statusMatches(row.getAttribute('data-status'), st);
            var matchCat = !cat || row.getAttribute('data-category') === cat;
            var show = matchKw && matchSt && matchCat;
            row.classList.toggle('hidden', !show);
            if (show) visible++;
        });
        noMatch.classList.toggle('hidden', visible !== 0);
    }

    kwInput.addEventListener('input', applyFilter);
    statusSel.addEventListener('change', applyFilter);
    catSel.addEventListener('change', applyFilter);
})();
</script>
</th:block>
</html>
