<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-ink">매칭 게시판</h1>
            <p class="text-sm text-gray-500 mt-1">다른 이용자의 요청을 둘러보고 나의 요청도 등록해 보세요.</p>
        </div>
        <a th:href="@{/disabled/board/create}"
           class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            요청 글 작성
        </a>
    </div>

    <div th:if="${message}" th:text="${message}" class="mb-4 rounded-md border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-800"></div>

    <!-- 동적 검색 — GET 폼(서버 필터링). 키워드 + 서비스 카테고리만(지역·희망일 제외). -->
    <form method="get" th:action="@{/disabled/board}" class="bg-surface border border-line rounded-2xl p-4 mb-4">
        <div class="grid grid-cols-1 gap-3">
            <!-- 키워드 (제목·본문) -->
            <div>
                <label for="keyword" class="block text-xs font-semibold text-gray-500 mb-1">키워드</label>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" id="keyword" name="keyword" th:value="${fKeyword}"
                           placeholder="제목·내용으로 검색"
                           class="w-full pl-9 pr-3 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
                </div>
            </div>

            <!-- 서비스 카테고리 (다중 선택 — 같은 name 체크박스 → 반복 파라미터로 제출) -->
            <fieldset>
                <legend class="block text-xs font-semibold text-gray-500 mb-1.5">서비스 (복수 선택 가능)</legend>
                <div class="flex flex-wrap gap-2">
                    <label th:each="cat : ${serviceCategories}"
                           class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm text-ink-muted border border-line-strong rounded-full cursor-pointer hover:border-indigo-300 transition-colors has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-300 has-[:checked]:text-indigo-700">
                        <input type="checkbox" name="serviceCategoryId" th:value="${cat.id}"
                               th:checked="${fServiceCategoryIds != null and #lists.contains(fServiceCategoryIds, cat.id)}"
                               class="accent-indigo-600">
                        <span th:text="${cat.name}">서비스</span>
                    </label>
                </div>
            </fieldset>
        </div>

        <div class="flex items-center gap-2 mt-4">
            <button type="submit"
                    class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                검색
            </button>
            <a th:if="${fKeyword != null or fServiceCategoryIds != null}" th:href="@{/disabled/board}"
               class="px-4 py-2 text-sm font-semibold text-gray-500 bg-surface-hover rounded-xl hover:bg-gray-200 transition-colors">필터 초기화</a>
        </div>
    </form>

    <!-- 게시글 목록 -->
    <div class="rounded-2xl border border-line-strong overflow-hidden bg-surface">

        <th:block th:each="request, iter : ${requests.content}">
        <a th:href="@{/disabled/board/{id}(id=${request.id})}"
           th:classappend="${!iter.last} ? 'border-b border-line-strong'"
           class="flex items-center gap-4 px-5 py-4 hover:bg-indigo-50/50 transition-colors group">

            <!-- 상태 표시 좌측 컬러 바 -->
            <div th:classappend="${request.status.name() == 'OPEN' ? 'bg-indigo-400' : request.status.name() == 'MATCHED' ? 'bg-teal-400' : request.status.name() == 'IN_PROGRESS' ? 'bg-green-400' : 'bg-gray-300'}"
                 class="w-1 h-12 rounded-full flex-shrink-0"></div>

            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                    <span th:text="${request.status.name() == 'OPEN' ? '모집중' : request.status.name() == 'MATCHED' ? '매칭완료' : request.status.name() == 'IN_PROGRESS' ? '진행중' : '종료'}"
                          th:classappend="${request.status.name() == 'OPEN' ? 'bg-indigo-50 text-indigo-600 border-indigo-200' : request.status.name() == 'MATCHED' ? 'bg-teal-50 text-teal-600 border-teal-200' : request.status.name() == 'IN_PROGRESS' ? 'bg-green-50 text-green-600 border-green-200' : 'bg-surface-hover text-gray-500 border-line-strong'}"
                          class="px-2 py-0.5 text-[11px] font-bold rounded-md border">모집중</span>
                    <span th:if="${request.requester.userId == currentUserId}"
                          class="px-2 py-0.5 bg-indigo-100 text-indigo-600 text-[10px] font-bold rounded-md">내 글</span>
                    <span th:text="${request.serviceCategory.name}"
                          class="px-2 py-0.5 bg-surface-hover text-gray-500 text-[11px] font-medium rounded-md">서비스</span>
                </div>
                <h3 class="text-sm font-semibold text-ink truncate group-hover:text-indigo-600 transition-colors"
                    th:text="${request.title}">제목</h3>
                <div class="flex items-center gap-3 mt-1 text-xs text-gray-400">
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span th:text="${request.requester.fullName}">작성자</span>
                    </span>
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span th:text="${request.sido + ' ' + request.sigungu}">서울 강남구</span>
                    </span>
                    <span class="flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span th:text="${#temporals.format(request.desiredStartDatetime, 'MM/dd (E) HH:mm')}">일시</span>
                    </span>
                </div>
            </div>

            <svg class="w-4 h-4 text-gray-300 group-hover:text-indigo-400 flex-shrink-0 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </a>
        </th:block>

        <!-- 빈 상태 — 검색 여부로 문구 분기. -->
        <div th:if="${requests.totalElements == 0}" class="py-16 text-center">
            <th:block th:if="${fKeyword != null or fServiceCategoryIds != null}">
                <p class="text-sm font-semibold text-gray-500">검색 조건에 맞는 요청이 없어요</p>
                <p class="text-xs text-gray-400 mt-1">검색어나 서비스를 바꿔 보세요.</p>
            </th:block>
            <th:block th:unless="${fKeyword != null or fServiceCategoryIds != null}">
                <p class="text-sm font-semibold text-gray-500">아직 등록된 도움 요청이 없어요</p>
                <p class="text-xs text-gray-400 mt-1">첫 요청을 작성해 보세요.</p>
            </th:block>
        </div>

    </div>

    <!-- 페이지네이션 (공통 fragment) -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, ${pageBaseUrl})}"></div>

</section>
</th:block>
</html>
