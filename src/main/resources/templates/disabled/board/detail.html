<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="flex items-center gap-2 text-sm text-gray-400 mb-6">
        <a th:href="@{/disabled/board}" class="hover:text-indigo-600 transition-colors">게시판</a>
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        <span class="text-gray-600 font-medium">게시물 상세</span>
    </div>

    <div th:if="${message}" th:text="${message}" class="mb-4 rounded-md border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-800"></div>

    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden mb-4">
        <div class="p-6 sm:p-7">

            <div class="flex items-center justify-between mb-5">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-sm flex-shrink-0"
                         th:text="${#strings.substring(request.requester.fullName, 0, 1)}">김</div>
                    <div>
                        <p class="text-sm font-semibold text-gray-900" th:text="${request.requester.fullName + ' 이용자'}">이용자</p>
                        <p class="text-xs text-gray-400" th:text="${#temporals.format(request.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</p>
                    </div>
                </div>
                <div th:if="${request.requester.userId == currentUserId}" class="flex gap-2">
                    <a th:href="@{/disabled/board/{id}/edit(id=${request.id})}"
                       class="px-3 py-1.5 text-xs font-medium text-indigo-600 border border-indigo-200 rounded-lg hover:bg-indigo-50 transition-all">수정</a>
                    <form th:action="@{/disabled/board/{id}/delete(id=${request.id})}" method="post"
                          onsubmit="return confirm('정말 삭제하시겠습니까?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit"
                                class="px-3 py-1.5 text-xs font-medium text-red-500 border border-red-200 rounded-lg hover:bg-red-50 transition-all">삭제</button>
                    </form>
                </div>
                <a th:if="${request.requester.userId != currentUserId}"
                   th:href="@{/disabled/board/create}"
                   class="px-3 py-1.5 text-xs font-medium text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 transition-all">새 요청 작성</a>
            </div>

            <div class="flex items-start gap-3 mb-4">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-2">
                        <span th:text="${request.status.name() == 'OPEN' ? '모집중' : request.status.name() == 'MATCHED' ? '매칭완료' : request.status.name() == 'IN_PROGRESS' ? '진행중' : '종료'}"
                              th:classappend="${request.status.name() == 'OPEN' ? 'bg-indigo-50 text-indigo-600' : request.status.name() == 'MATCHED' ? 'bg-teal-50 text-teal-600' : 'bg-gray-100 text-gray-500'}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">모집중</span>
                    </div>
                    <h1 class="text-xl font-bold text-gray-900" th:text="${request.title}">제목</h1>
                </div>
            </div>

            <div class="space-y-2 mb-5">
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span th:text="${#temporals.format(request.desiredStartDatetime, 'yyyy.MM.dd (E) HH:mm')
                        + (request.desiredEndDatetime != null ? ' ~ ' + #temporals.format(request.desiredEndDatetime, 'HH:mm') : '')}">일시</span>
                </div>
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span th:text="${request.sido + ' ' + request.sigungu + (request.bname != null ? ' ' + request.bname : '')}">지역</span>
                </div>
            </div>

            <div class="mb-5">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">필요한 도움</p>
                <div class="flex flex-wrap gap-1.5">
                    <span th:text="${request.serviceCategory.name}"
                          class="px-3 py-1.5 bg-indigo-50 text-indigo-700 text-xs font-medium rounded-xl border border-indigo-100">서비스</span>
                </div>
            </div>

            <div th:if="${request.body}" class="mb-5">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">상세 내용</p>
                <p class="text-sm text-gray-700 leading-relaxed" th:text="${request.body}">내용</p>
            </div>

            <div th:if="${request.specialNotes}" class="mb-5">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">특이사항</p>
                <p class="text-sm text-gray-700 leading-relaxed" th:text="${request.specialNotes}">특이사항</p>
            </div>

        </div>
    </div>

    <!-- 지원자 리스트 버튼 -->
    <div class="bg-white rounded-2xl border border-indigo-100 p-5 mb-4 flex items-center justify-between">
        <div>
            <p class="text-sm font-semibold text-gray-900">지원자 리스트 보기 · <span class="text-indigo-600" th:text="${applicationCount + '명 지원'}">0명 지원</span></p>
            <p class="text-xs text-gray-400 mt-0.5">지원자를 확인하고 매칭을 진행하세요.</p>
        </div>
        <a th:href="@{/disabled/board/{id}/applicants(id=${request.id})}"
           class="flex items-center gap-1.5 px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
            리스트 보기
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </a>
    </div>

    <!-- 재게시 (마감된 본인 요청을 같은 내용으로 다시 작성) -->
    <div th:if="${request.status.name() == 'CLOSED' and request.requester.userId == currentUserId}"
         class="bg-white rounded-2xl border border-indigo-100 p-5 mb-4 flex items-center justify-between">
        <div>
            <p class="text-sm font-semibold text-gray-900">이 요청을 다시 게시</p>
            <p class="text-xs text-gray-400 mt-0.5">마감된 요청입니다. 같은 내용으로 새 요청을 작성할 수 있어요. (일시는 다시 선택)</p>
        </div>
        <a th:href="@{/disabled/board/{id}/repost(id=${request.id})}"
           class="flex items-center gap-1.5 px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
            재게시
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </a>
    </div>

</section>
</th:block>
</html>
