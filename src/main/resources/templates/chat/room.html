<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대화방</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-gray-50 min-h-screen">
<main class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">대화방</h1>
    <div id="messages" class="bg-white border rounded-xl p-4 h-[520px] overflow-y-auto space-y-2"></div>
    <form id="sendForm" class="mt-4 flex gap-2">
        <input id="messageInput" class="flex-1 border rounded-lg px-3 py-2" placeholder="메시지를 입력하세요">
        <button class="px-4 py-2 rounded-lg bg-blue-600 text-white">전송</button>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">
    const conversationId = /*[[${conversationId}]]*/ 0;
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#messageInput');

    function addMessage(message) {
        const div = document.createElement('div');
        div.className = message.mine ? 'text-right' : 'text-left';
        div.innerHTML = `<span class="inline-block rounded-xl px-3 py-2 bg-gray-100">${message.body}</span>`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    fetch(`/api/chat/conversations/${conversationId}/messages?size=30`)
        .then(res => res.json())
        .then(data => (data.content || []).reverse().forEach(addMessage));

    const client = new StompJs.Client({
        webSocketFactory: () => new SockJS('/ws'),
        onConnect: () => {
            client.subscribe(`/topic/conversations/${conversationId}`, frame => addMessage(JSON.parse(frame.body)));
        }
    });
    client.activate();

    document.querySelector('#sendForm').addEventListener('submit', e => {
        e.preventDefault();
        const body = input.value.trim();
        if (!body) return;
        client.publish({
            destination: `/app/chat/${conversationId}/send`,
            body: JSON.stringify({ body })
        });
        input.value = '';
    });
</script>
</body>
</html>
