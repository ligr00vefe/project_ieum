<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex gap-5" style="height: calc(100vh - 160px); min-height: 600px;">

        <!-- 왼쪽: 프로필 카드 (장애인 뷰, 모바일에서 숨김) -->
        <th:block th:if="${isUser}">
        <div class="chat-profile-sidebar w-72 flex-shrink-0 bg-white rounded-2xl border border-gray-100 shadow-sm p-6 flex flex-col items-center text-center">
            <!-- 아바타 -->
            <div class="w-28 h-28 rounded-2xl overflow-hidden mb-3 flex-shrink-0 shadow-sm">
                <img th:src="${partnerProfileImage ?: '/assets/profile_thumb_img/m01_thumb.png'}"
                     alt="프로필" class="w-full h-full object-cover object-top"
                     style="transform:translateZ(0);">
            </div>
            <!-- 이름 / 직함 -->
            <p class="text-lg font-bold text-gray-900" th:text="${partnerName ?: '박서연'}">박서연</p>
            <p class="text-sm text-gray-400 mt-0.5 mb-4" th:text="${partnerSubtitle ?: '활동지원사'}">사회복지사 2급 · 경력 5년</p>

            <!-- 매칭률 뱃지 -->
            <div class="w-20 h-20 bg-indigo-600 rounded-full flex flex-col items-center justify-center mb-5 shadow-md shadow-indigo-100">
                <span class="text-xl font-extrabold text-white leading-none" th:text="${matchPercent + '%'}">0%</span>
                <span class="text-[10px] font-semibold text-indigo-200 mt-0.5 tracking-wider">MATCH</span>
            </div>

            <!-- 자격·검증 -->
            <div class="w-full text-left mb-5">
                <p class="text-xs font-semibold text-gray-400 mb-2">자격 · 검증</p>
                <ul class="space-y-1.5">
                    <li class="text-sm text-gray-700">🔒 신원 확인 완료</li>
                    <li class="text-sm text-gray-700">📋 사회복지사 2급 검증</li>
                    <li class="text-sm text-gray-700">🤟 수어 통역 자격</li>
                    <li class="text-sm text-gray-700">⭐ 후기 4.9 (32건)</li>
                </ul>
            </div>

            <!-- 액션 버튼 -->
            <div class="w-full space-y-2 mt-auto">
                <button onclick="showMatchConfirmModal()"
                        class="w-full py-3 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
                    ✓ 매칭 확정하기
                </button>
                <a th:href="@{/caregiver/profile}"
                   class="block w-full py-3 text-sm font-semibold text-indigo-600 border border-indigo-200 rounded-xl hover:bg-indigo-50 transition-all text-center">
                    프로필 자세히 보기
                </a>
            </div>
        </div>
        </th:block>

        <!-- 오른쪽: 채팅 영역 -->
        <div class="flex-1 flex flex-col bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

            <!-- 채팅 헤더 -->
            <div class="flex-shrink-0 flex items-center gap-3 px-5 py-4 border-b border-gray-100">
                <!-- 뒤로가기 버튼 (모든 역할) -->
                <a th:href="${isCaregiver} ? @{/caregiver/board/{id}(id=${requestId})} : @{/disabled/board/{id}(id=${requestId})}"
                   class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-50 rounded-lg transition-all flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </a>

                <div class="w-11 h-11 rounded-full overflow-hidden flex-shrink-0 shadow-sm">
                    <img th:src="${partnerProfileImage ?: '/assets/profile_thumb_img/m01_thumb.png'}"
                         alt="프로필" class="w-full h-full object-cover object-top"
                         style="transform:translateZ(0);">
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-gray-900" th:text="${partnerName ?: '박서연 활동지원사'}">박서연 활동지원사</p>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span class="w-2 h-2 bg-teal-400 rounded-full flex-shrink-0"></span>
                        <span class="text-xs text-teal-500 font-medium">지금 접속 중</span>
                    </div>
                </div>

                <!-- 안심 통화 버튼 -->
                <button class="flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-rose-500 border border-rose-200 bg-rose-50 rounded-xl hover:bg-rose-100 transition-all flex-shrink-0">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                    안심 통화
                </button>

                <!-- 매칭률 뱃지 (모든 역할) -->
                <div class="flex-shrink-0 flex flex-col items-center bg-indigo-600 text-white rounded-xl px-2.5 py-1.5">
                    <span class="text-[9px] font-medium opacity-80 leading-none">매칭률</span>
                    <span class="text-sm font-bold leading-none" th:text="${matchPercent + '%'}">0%</span>
                </div>
            </div>

            <!-- 안전 안내 배너 -->
            <div class="flex-shrink-0 mx-5 mt-4 px-4 py-3 bg-amber-50 border border-amber-100 rounded-xl text-center">
                <p class="text-xs text-amber-700 font-medium">🔒 매칭 확정 전 첫 만남은 공공장소에서 진행하실 것을 권장드려요.</p>
            </div>

            <!-- 채팅 메시지 영역 -->
            <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 px-5 py-4">
                <div id="loadingSpinner" class="flex justify-center py-8">
                    <div class="w-6 h-6 border-2 border-indigo-300 border-t-indigo-600 rounded-full animate-spin"></div>
                </div>
            </div>

            <!-- 메시지 입력창 -->
            <div class="flex-shrink-0 px-5 py-4 border-t border-gray-100">
                <div class="flex items-center gap-3">
                    <input id="messageInput" type="text" placeholder="메시지를 입력해주세요"
                           onkeydown="handleKeydown(event)"
                           class="flex-1 text-sm text-gray-800 placeholder-gray-400 bg-gray-50 border border-gray-200 rounded-full px-5 py-3 focus:outline-none focus:border-indigo-300 focus:bg-white transition-all"/>
                    <button onclick="sendMessage()"
                            class="flex-shrink-0 px-5 py-3 bg-indigo-600 text-white text-sm font-bold rounded-full hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100 whitespace-nowrap">
                        전송 →
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- 매칭 확정 모달 (장애인 뷰) -->
<div id="matchConfirmModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="hideMatchConfirmModal()"></div>
    <div class="relative bg-white rounded-3xl shadow-2xl p-7 w-full max-w-sm text-center z-10">
        <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-5">
            <svg class="w-8 h-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
        </div>
        <h2 class="text-lg font-bold text-gray-900 mb-2">매칭을 확정하시겠어요?</h2>
        <p class="text-sm text-gray-500 leading-relaxed mb-6">
            ✔ 활동지원사에게 매칭 확정 알림이 발송됩니다.<br>
            ✔ 활동 일정이 마이페이지에 등록됩니다.
        </p>
        <div class="flex gap-3">
            <button onclick="hideMatchConfirmModal()"
                    class="flex-1 py-3 text-sm font-semibold text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 transition-all">
                취소
            </button>
            <a th:href="@{/matching/confirmed}"
               class="flex-1 py-3 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100 flex items-center justify-center">
                → 매칭 확정하기
            </a>
        </div>
    </div>
</div>

<style>
@media (max-width: 767px) {
    .chat-profile-sidebar { display: none !important; }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">
const CONVERSATION_ID = /*[[${conversationId}]]*/ 0;
const CURRENT_USER_ID = /*[[${currentUser != null ? currentUser.id : null}]]*/ null;
const CURRENT_USER_EMAIL = /*[[${currentUser != null ? currentUser.email : ''}]]*/ '';
const PARTNER_IMAGE = /*[[${partnerProfileImage}]]*/ null;
const DEFAULT_IMAGE = '/assets/profile_thumb_img/m01_thumb.png';

let lastRenderedDate = null;
let polling = null;
let stompClient = null;
let chatSubscription = null;
let webSocketConnected = false;
const renderedMessageIds = new Set();

function fmt(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'});
}
function fmtDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('ko-KR', {year: 'numeric', month: 'long', day: 'numeric'});
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function normalizeMessage(msg) {
    const normalized = { ...msg };
    if (CURRENT_USER_ID !== null && normalized.senderId !== null && normalized.senderId !== undefined) {
        normalized.mine = String(normalized.senderId) === String(CURRENT_USER_ID);
    } else if (CURRENT_USER_EMAIL && normalized.senderName) {
        normalized.mine = normalized.senderName === CURRENT_USER_EMAIL;
    } else {
        normalized.mine = Boolean(normalized.mine);
    }
    return normalized;
}

function messageKey(msg) {
    if (msg.id !== null && msg.id !== undefined) {
        return `message:${msg.id}`;
    }
    if (msg.senderId !== undefined && msg.sentAt && msg.body !== undefined) {
        return `message:${msg.senderId}:${msg.sentAt}:${msg.body}`;
    }
    return null;
}

function rememberRenderedMessage(msg) {
    const key = messageKey(msg);
    if (key) {
        renderedMessageIds.add(key);
    }
}

function hasRenderedMessage(msg) {
    const key = messageKey(msg);
    return key ? renderedMessageIds.has(key) : false;
}

function buildMessage(msg) {
    const time = fmt(msg.sentAt);
    const escaped = escapeHtml(msg.body);
    if (msg.mine) {
        return `<div class="flex items-end gap-2.5 flex-row-reverse">
            <div class="max-w-[70%]">
                <div class="bg-indigo-600 rounded-2xl rounded-br-md px-4 py-3 shadow-sm shadow-indigo-100">
                    <p class="text-sm text-white">${escaped}</p>
                </div>
                <p class="text-[11px] text-gray-400 mt-1 mr-1 text-right">${time}</p>
            </div>
        </div>`;
    } else {
        const img = PARTNER_IMAGE ? PARTNER_IMAGE : DEFAULT_IMAGE;
        return `<div class="flex items-end gap-2.5">
            <div class="w-9 h-9 rounded-full overflow-hidden flex-shrink-0 mb-1 shadow-sm">
                <img src="${img}" alt="프로필" class="w-full h-full object-cover object-top">
            </div>
            <div class="max-w-[70%]">
                <div class="bg-gray-50 border border-gray-100 rounded-2xl rounded-bl-md px-4 py-3">
                    <p class="text-sm text-gray-800">${escaped}</p>
                </div>
                <p class="text-[11px] text-gray-400 mt-1 ml-1">${time}</p>
            </div>
        </div>`;
    }
}

function buildDateDivider(label) {
    return `<div class="flex items-center gap-3 my-2">
        <div class="flex-1 h-px bg-gray-100"></div>
        <span class="text-xs text-gray-400 font-medium flex-shrink-0">${label}</span>
        <div class="flex-1 h-px bg-gray-100"></div>
    </div>`;
}

async function loadMessages() {
    try {
        const res = await fetch(`/api/chat/conversations/${CONVERSATION_ID}/messages?page=0&size=100&sort=sentAt,asc`);
        if (!res.ok) return;
        const data = await res.json();
        const messages = (data.content || []).reverse().map(normalizeMessage);

        const box = document.getElementById('chatMessages');
        lastRenderedDate = null;
        renderedMessageIds.clear();
        let html = '';

        const today = new Date().toDateString();
        const yesterday = new Date(Date.now() - 86400000).toDateString();

        for (const msg of messages) {
            const msgDate = new Date(msg.sentAt).toDateString();
            if (msgDate !== lastRenderedDate) {
                let label;
                if (msgDate === today) label = '오늘';
                else if (msgDate === yesterday) label = '어제';
                else label = fmtDate(msg.sentAt);
                html += buildDateDivider(label);
                lastRenderedDate = msgDate;
            }
            html += buildMessage(msg);
            rememberRenderedMessage(msg);
        }

        if (messages.length === 0) {
            html = `<div data-empty-chat="true" class="flex justify-center py-8">
                <p class="text-sm text-gray-400">아직 메시지가 없습니다. 먼저 인사해보세요!</p>
            </div>`;
        }

        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
    } catch (e) {
        console.error('메시지 로드 실패', e);
    }
}

async function markRead() {
    try {
        await fetch(`/api/chat/conversations/${CONVERSATION_ID}/read`, { method: 'POST',
            headers: { 'X-XSRF-TOKEN': getCsrfToken() }
        });
    } catch (e) { /* 무시 */ }
}

function getCsrfToken() {
    const meta = document.querySelector('meta[name="_csrf"]');
    if (meta) return meta.getAttribute('content');
    const cookie = document.cookie.split(';').find(c => c.trim().startsWith('XSRF-TOKEN='));
    return cookie ? decodeURIComponent(cookie.split('=')[1]) : '';
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.disabled = true;

    try {
        if (canSendByWebSocket()) {
            sendMessageByWebSocket(text);
            return;
        }

        const res = await fetch(`/api/chat/conversations/${CONVERSATION_ID}/messages`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-XSRF-TOKEN': getCsrfToken()
            },
            body: JSON.stringify({ body: text })
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            alert(err.message || '전송에 실패했습니다.');
            input.value = text;
            return;
        }
        const msg = await res.json();
        appendMessage(msg);
    } catch (e) {
        if (webSocketConnected) {
            webSocketConnected = false;
            startPolling();
            try {
                const msg = await sendMessageByRest(text);
                appendMessage(msg);
                return;
            } catch (restError) {
                console.error('REST fallback send failed', restError);
            }
        }
        alert('전송에 실패했습니다.');
        input.value = text;
    } finally {
        input.disabled = false;
        input.focus();
    }
}

function canSendByWebSocket() {
    return webSocketConnected && stompClient && stompClient.connected;
}

function sendMessageByWebSocket(text) {
    stompClient.publish({
        destination: `/app/chat/${CONVERSATION_ID}/send`,
        headers: {
            'content-type': 'application/json',
            'X-XSRF-TOKEN': getCsrfToken()
        },
        body: JSON.stringify({ body: text })
    });
}

async function sendMessageByRest(text) {
    const res = await fetch(`/api/chat/conversations/${CONVERSATION_ID}/messages`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-XSRF-TOKEN': getCsrfToken()
        },
        body: JSON.stringify({ body: text })
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Message send failed');
    }
    return res.json();
}

function appendMessage(msg) {
    msg = normalizeMessage(msg);
    if (hasRenderedMessage(msg)) {
        return false;
    }

    const box = document.getElementById('chatMessages');
    box.querySelector('[data-empty-chat="true"]')?.remove();
    const msgDate = new Date(msg.sentAt).toDateString();
    const today = new Date().toDateString();

    let html = '';
    if (msgDate !== lastRenderedDate) {
        html += buildDateDivider(msgDate === today ? '오늘' : fmtDate(msg.sentAt));
        lastRenderedDate = msgDate;
    }
    html += buildMessage(msg);

    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    while (tmp.firstChild) box.appendChild(tmp.firstChild);
    rememberRenderedMessage(msg);
    box.scrollTop = box.scrollHeight;
    return true;
}

function handleKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function showMatchConfirmModal() {
    document.getElementById('matchConfirmModal').classList.remove('hidden');
}
function hideMatchConfirmModal() {
    document.getElementById('matchConfirmModal').classList.add('hidden');
}

function startPolling() {
    if (polling) {
        return;
    }
    polling = setInterval(async () => {
        await loadMessages();
        await markRead();
    }, 5000);
}

function stopPolling() {
    if (!polling) {
        return;
    }
    clearInterval(polling);
    polling = null;
}

function connectWebSocket() {
    if (!window.SockJS || !window.StompJs) {
        startPolling();
        return;
    }

    stompClient = new StompJs.Client({
        webSocketFactory: () => new SockJS('/ws'),
        reconnectDelay: 5000,
        connectHeaders: {
            'X-XSRF-TOKEN': getCsrfToken()
        },
        debug: () => {}
    });

    stompClient.onConnect = () => {
        webSocketConnected = true;
        stopPolling();

        if (chatSubscription) {
            chatSubscription.unsubscribe();
        }
        chatSubscription = stompClient.subscribe(`/topic/conversations/${CONVERSATION_ID}`, message => {
            const msg = JSON.parse(message.body);
            const appended = appendMessage(msg);
            if (appended) {
                markRead();
            }
        });
    };

    stompClient.onStompError = frame => {
        console.error('STOMP error', frame);
        webSocketConnected = false;
        startPolling();
    };

    stompClient.onWebSocketError = event => {
        console.error('WebSocket error', event);
        webSocketConnected = false;
        startPolling();
    };

    stompClient.onWebSocketClose = () => {
        webSocketConnected = false;
        chatSubscription = null;
        startPolling();
    };

    stompClient.activate();
}

document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('loadingSpinner')?.remove();
    await loadMessages();
    await markRead();
    startPolling();
    connectWebSocket();
});
</script>
</th:block>
</html>
