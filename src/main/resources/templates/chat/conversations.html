<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대화방 목록</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-gray-50 min-h-screen">
<main class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">대화방</h1>
    <div id="conversationList" class="space-y-3"></div>
</main>
<script>
    fetch('/api/chat/conversations')
        .then(res => res.json())
        .then(data => {
            const box = document.querySelector('#conversationList');
            box.innerHTML = (data.content || []).map(item => `
                <a href="/chat/conversations/${item.conversationId}" class="block bg-white border rounded-xl p-4 hover:bg-gray-50">
                    <div class="flex justify-between gap-3">
                        <strong>${item.opponentName || '상대방'}</strong>
                        <span class="text-sm text-gray-500">미읽음 ${item.unreadCount}</span>
                    </div>
                    <p class="text-gray-600 mt-1">${item.lastMessage || '아직 메시지가 없습니다.'}</p>
                </a>
            `).join('');
        });
</script>
</body>
</html>
