<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="min-h-screen bg-surface-alt flex flex-col items-center justify-center gap-6">

    <div class="bg-surface rounded-3xl shadow-sm border border-line p-10 text-center max-w-md w-full mx-4">
        <div class="w-12 h-12 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-ink mb-2">환영합니다 🎉</h1>
        <p class="text-sm text-gray-500 mb-1">케어메이트 홈 페이지입니다.</p>
        <p class="text-xs text-indigo-600 font-medium mb-6" th:text="${email}">user@email.com</p>
        <p class="text-xs text-gray-400 mb-8">이 페이지는 임시 홈 화면입니다. 추후 실제 서비스 화면으로 교체됩니다.</p>
        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="w-full py-3 bg-surface-hover text-ink-muted font-semibold text-sm rounded-xl hover:bg-gray-200 transition-all">
                로그아웃
            </button>
        </form>
    </div>

</body>
</html>
