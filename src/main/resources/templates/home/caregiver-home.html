<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>활동지원사 홈 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center justify-center gap-6">

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-10 text-center max-w-md w-full mx-4">
        <div class="w-12 h-12 bg-teal-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">환영합니다 🎉</h1>
        <p class="text-sm text-gray-500 mb-1">활동지원사 홈 페이지입니다.</p>
        <p class="text-xs text-teal-600 font-medium mb-6" th:text="${email}">user@email.com</p>
        <p class="text-xs text-gray-400 mb-8">이 페이지는 임시 홈 화면입니다. 추후 실제 서비스 화면으로 교체됩니다.</p>
        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="w-full py-3 bg-gray-100 text-gray-700 font-semibold text-sm rounded-xl hover:bg-gray-200 transition-all">
                로그아웃
            </button>
        </form>
    </div>

</body>
</html>
