<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-lg mx-auto px-4 sm:px-6 py-10">

    <!-- 매칭 확정 축하 카드 -->
    <div class="bg-indigo-600 rounded-3xl p-8 text-center text-white mb-6 shadow-lg shadow-indigo-200">
        <div class="w-20 h-20 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-5">
            <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold mb-2">축하해요! 매칭이 확정되었습니다</h1>
        <p class="text-indigo-200 text-sm">
            <th:block th:if="${userName != null}"
                      th:text="${userName} + '과 ' + ${caregiverName} + '의 <br /> 매칭이 확정되었어요.'">
                매칭이 확정되었어요.
            </th:block>
            <th:block th:if="${userName == null}">매칭이 확정되었어요.</th:block>
        </p>
    </div>

    <!-- 활동 일정 카드 -->
    <div class="bg-surface rounded-3xl border border-line shadow-sm p-6 mb-4">
        <h2 class="text-base font-bold text-ink flex items-center gap-2 mb-5">
            <svg class="w-5 h-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            활동 일정
        </h2>

        <div class="space-y-3 text-sm">
            <!-- 날짜 -->
            <div class="flex items-start gap-3 text-ink-muted">
                <svg class="w-4 h-4 text-gray-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <span>
                    <span class="font-semibold text-ink">날짜</span>
                    <span class="ml-1.5" th:text="'· ' + ${dateDisplay}">· 날짜</span>
                </span>
            </div>
            <!-- 시간 -->
            <div class="flex items-start gap-3 text-ink-muted">
                <svg class="w-4 h-4 text-gray-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>
                    <span class="font-semibold text-ink">시간</span>
                    <span class="ml-1.5" th:text="'· ' + ${timeDisplay}">· 시간</span>
                </span>
            </div>
            <!-- 장소 -->
            <div th:if="${location != null}" class="flex items-start gap-3 text-ink-muted">
                <svg class="w-4 h-4 text-gray-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                </svg>
                <span>
                    <span class="font-semibold text-ink">장소</span>
                    <span class="ml-1.5" th:text="'· ' + ${location}">· 장소</span>
                </span>
            </div>
            <!-- 내용 -->
            <div th:if="${requestTitle != null}" class="flex items-start gap-3 text-ink-muted">
                <svg class="w-4 h-4 text-gray-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span>
                    <span class="font-semibold text-ink">내용</span>
                    <span class="ml-1.5" th:text="'· ' + ${requestTitle}">· 내용</span>
                </span>
            </div>
        </div>

        <!-- 파트너 정보 -->
        <div th:if="${partnerName != null}" class="mt-5 pt-4 border-t border-line flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0"
                 th:classappend="${isCaregiver} ? 'bg-indigo-100 text-indigo-600' : 'bg-teal-100 text-teal-600'"
                 th:text="${partnerInitial}">?</div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-ink" th:text="${partnerName}">파트너</p>
                <p th:if="${partnerSubtitle != null}" class="text-xs text-gray-400" th:text="${partnerSubtitle}"></p>
            </div>
        </div>
    </div>

    <!-- 활동지원사 뷰: 안전 케어 가이드 -->
    <th:block th:if="${isCaregiver}">
        <div class="bg-amber-50 border border-amber-100 rounded-2xl p-5 mb-4">
            <div class="flex items-center gap-2 mb-3">
                <svg class="w-4 h-4 text-amber-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
                <h3 class="text-sm font-bold text-amber-800">안전 케어 가이드</h3>
            </div>
            <ul class="space-y-2 text-xs text-amber-700">
                <li class="flex items-start gap-2">
                    <svg class="w-3.5 h-3.5 text-amber-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    활동 30분 전 이용자에게 안내 메시지 발송 권장
                </li>
                <li class="flex items-start gap-2">
                    <svg class="w-3.5 h-3.5 text-amber-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    응급 상황 시 24/7 안전 지원 센터 연락
                </li>
                <li class="flex items-start gap-2">
                    <svg class="w-3.5 h-3.5 text-amber-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    활동 종료 후 "서비스 완료" 버튼을 눌러주세요
                </li>
            </ul>
        </div>
    </th:block>

    <!-- 하단 버튼 -->
    <div class="flex gap-3">
        <a th:href="${isCaregiver} ? @{/caregiver/board} : @{/disabled/board}"
           class="flex-1 py-3 text-sm font-semibold text-ink-muted bg-surface border border-line-strong rounded-xl text-center hover:bg-surface-muted transition-all">
            게시판으로
        </a>
        <a th:href="${conversationId != null} ? @{/chat/conversations/{id}(id=${conversationId})} : @{/chat/conversations}"
           class="flex-1 py-3 text-sm font-bold text-white bg-indigo-600 rounded-xl text-center hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
            채팅 확인하기
        </a>
    </div>

</section>
</th:block>
</html>
