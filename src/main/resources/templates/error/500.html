<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서버 오류 - 이음</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">

    <!-- Top bar -->
    <div class="bg-white border-b border-gray-100 px-4 py-3.5">
        <a th:href="@{/}" class="flex items-center gap-2.5 group w-fit">
            <div class="w-8 h-8 bg-teal-500 rounded-xl flex items-center justify-center group-hover:bg-teal-600 transition-colors">
                <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
                </svg>
            </div>
            <div class="leading-tight">
                <div class="text-[14px] font-bold text-gray-900">이음</div>
                <div class="text-[9px] text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
            </div>
        </a>
    </div>

    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="text-center max-w-md w-full">

            <div class="relative inline-flex items-center justify-center mb-8">
                <div class="w-32 h-32 bg-red-50 rounded-full flex items-center justify-center">
                    <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center">
                        <svg class="w-10 h-10 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                </div>
                <div class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-black px-2.5 py-1 rounded-lg shadow-lg">500</div>
            </div>

            <h1 class="text-2xl font-extrabold text-gray-900 mb-3">서버에 문제가 발생했어요</h1>
            <p class="text-gray-500 text-sm leading-relaxed mb-8">
                일시적인 서버 오류입니다.<br>
                잠시 후 다시 시도해 주세요.
            </p>

            <div th:if="${errorMessage}" class="bg-red-50 border border-red-100 rounded-xl p-4 mb-6 text-left">
                <p class="text-xs font-semibold text-red-600 mb-1">오류 상세</p>
                <p class="text-xs text-red-500 font-mono break-all" th:text="${errorMessage}"></p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a th:href="@{/}"
                   class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 text-white font-semibold text-sm rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-sm shadow-indigo-100">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    홈으로 이동
                </a>
                <button onclick="location.reload()"
                        class="inline-flex items-center justify-center gap-2 px-6 py-3 border-2 border-gray-200 text-gray-700 font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-gray-50 active:scale-[0.98] transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    다시 시도
                </button>
            </div>
            <p class="mt-6 text-xs text-gray-400">
                문제가 지속되면 <a th:href="@{/inquiries}" class="text-indigo-600 hover:underline font-medium">고객센터</a>에 문의해 주세요.
            </p>
        </div>
    </main>
</body>
</html>
