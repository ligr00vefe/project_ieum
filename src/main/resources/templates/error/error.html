<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 발생 - 이음</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md max-w-md text-center">
        <div class="text-6xl font-bold text-orange-600 mb-4">!</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">오류가 발생했습니다</h1>
        <p class="text-gray-600 mb-6" th:text="${error != null ? error : '알 수 없는 오류가 발생했습니다.'}">
            알 수 없는 오류가 발생했습니다.
        </p>
        <a href="/" class="inline-block px-6 py-2 bg-blue-500 text-white font-semibold rounded-lg hover:bg-blue-600 transition">
            홈으로 이동
        </a>
    </div>
</body>
</html>
