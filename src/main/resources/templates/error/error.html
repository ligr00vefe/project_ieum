<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오류 발생 - 이음</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <th:block th:replace="~{layout/prefs :: prefs}"></th:block>
</head>
<body class="min-h-screen bg-surface-alt flex flex-col">

    <!-- Top bar -->
    <div class="bg-surface border-b border-line px-4 py-3.5">
        <a th:href="@{/}" class="flex items-center gap-2.5 group w-fit">
            <div class="w-8 h-8 bg-teal-500 rounded-xl flex items-center justify-center group-hover:bg-teal-600 transition-colors">
                <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
                </svg>
            </div>
            <div class="leading-tight">
                <div class="text-[14px] font-bold text-ink">이음</div>
                <div class="text-[9px] text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
            </div>
        </a>
    </div>

    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="text-center max-w-md w-full">

            <div class="relative inline-flex items-center justify-center mb-8">
                <div class="w-32 h-32 bg-amber-50 rounded-full flex items-center justify-center">
                    <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center">
                        <svg class="w-10 h-10 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
                <div class="absolute -top-2 -right-2 bg-amber-500 text-white text-xs font-black px-2.5 py-1 rounded-lg shadow-lg">오류</div>
            </div>

            <h1 class="text-2xl font-extrabold text-ink mb-3">오류가 발생했습니다</h1>
            <p class="text-gray-500 text-sm leading-relaxed mb-2"
               th:text="${error != null ? error : '요청을 처리하는 중 오류가 발생했습니다.'}">
                요청을 처리하는 중 오류가 발생했습니다.
            </p>
            <p class="text-gray-400 text-xs mb-8">잠시 후 다시 시도하거나 홈으로 이동해 주세요.</p>

            <!-- Status code badge -->
            <div th:if="${status}" class="inline-flex items-center gap-2 px-3 py-1.5 bg-surface-hover rounded-full mb-6">
                <span class="text-xs text-gray-500 font-medium">상태 코드</span>
                <span class="text-xs font-bold text-ink-muted" th:text="${status}"></span>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a th:href="@{/}"
                   class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 text-white font-semibold text-sm rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-sm shadow-indigo-100">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    홈으로 이동
                </a>
                <button onclick="history.back()"
                        class="inline-flex items-center justify-center gap-2 px-6 py-3 border-2 border-line-strong text-ink-muted font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-surface-muted active:scale-[0.98] transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                    이전 페이지
                </button>
            </div>
        </div>
    </main>
</body>
</html>
