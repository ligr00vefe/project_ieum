<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 히어로 헤더 -->
    <div class="bg-indigo-600 rounded-3xl p-7 text-white shadow-lg shadow-indigo-200 relative overflow-hidden mb-6">
        <div class="absolute -top-6 -right-6 w-32 h-32 bg-white/10 rounded-full"></div>
        <div class="absolute -bottom-8 right-20 w-20 h-20 bg-white/5 rounded-full"></div>
        <div class="relative">
            <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
                    </svg>
                </div>
                <span class="text-indigo-200 text-xs font-semibold uppercase tracking-wide">공지사항</span>
            </div>
            <h1 class="text-2xl font-extrabold mb-1">공지사항</h1>
            <p class="text-indigo-200 text-sm">이음의 새로운 소식과 업데이트를 확인하세요.</p>
        </div>
    </div>

    <!-- 목록 -->
    <div class="rounded-2xl border border-line-strong overflow-hidden bg-surface">
        <th:block th:each="notice, iter : ${notices}">
            <a th:href="@{/notices/{id}(id=${notice.id})}"
               th:classappend="${!iter.last} ? 'border-b border-line-strong'"
               class="flex items-center gap-4 px-5 py-4 hover:bg-indigo-50/50 transition-colors group">

                <!-- 번호 -->
                <div class="flex-shrink-0 w-8 text-center">
                    <span th:if="${notice.isPinned}"
                          class="inline-flex items-center justify-center w-6 h-6 bg-amber-400 text-white text-[10px] font-bold rounded-full">📌</span>
                    <span th:unless="${notice.isPinned}"
                          class="text-xs text-gray-300 font-medium" th:text="${iter.index + 1}">1</span>
                </div>

                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span th:if="${notice.isPinned}"
                              class="px-2 py-0.5 bg-amber-50 text-amber-600 text-[11px] font-bold rounded-md">상단 고정</span>
                    </div>
                    <p class="text-sm font-semibold text-ink truncate group-hover:text-indigo-600 transition-colors"
                       th:text="${notice.title}">제목</p>
                </div>

                <div class="flex-shrink-0 text-right">
                    <p class="text-xs text-gray-400 whitespace-nowrap" th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">날짜</p>
                </div>

                <svg class="w-4 h-4 text-gray-300 group-hover:text-indigo-400 flex-shrink-0 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </a>
        </th:block>

        <!-- 빈 상태 -->
        <div th:if="${#lists.isEmpty(notices)}" class="py-16 text-center">
            <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7 text-indigo-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
                </svg>
            </div>
            <p class="text-sm font-semibold text-gray-500">등록된 공지사항이 없어요</p>
            <p class="text-xs text-gray-400 mt-1">새로운 소식을 기다려 주세요.</p>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, '/notices?')}"></div>

</section>
</th:block>
</html>
