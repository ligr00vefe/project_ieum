<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">

<!-- CKEditor content styles -->
<link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.css">
<style>
    .ck-content { font-size: 0.875rem; line-height: 1.75; color: #374151; }
    .ck-content p { margin-bottom: 0.75em; }
    .ck-content h2 { font-size: 1.125rem; font-weight: 700; margin: 1em 0 0.5em; }
    .ck-content h3 { font-size: 1rem; font-weight: 600; margin: 0.75em 0 0.4em; }
    .ck-content ul, .ck-content ol { padding-left: 1.5em; margin-bottom: 0.75em; }
    .ck-content ul { list-style: disc; }
    .ck-content ol { list-style: decimal; }
    .ck-content li { margin-bottom: 0.25em; }
    .ck-content blockquote { border-left: 3px solid #e0e7ff; padding-left: 1em; color: #6366f1; margin: 0.75em 0; }
    .ck-content img { max-width: 100%; height: auto; border-radius: 0.75rem; }
    .ck-content a { color: #4f46e5; text-decoration: underline; }
    .ck-content table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; }
    .ck-content table td, .ck-content table th { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; font-size: 0.8rem; }
    .ck-content table th { background: #f9fafb; font-weight: 600; }
    .ck-content pre { background: #f8fafc; border-radius: 0.5rem; padding: 1rem; overflow-x: auto; font-size: 0.8rem; }
</style>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 브레드크럼 + 관리자 버튼 -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-2 text-sm text-gray-400">
            <a th:href="@{/notices}" class="hover:text-indigo-600 transition-colors">공지사항</a>
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
            <span class="text-ink-muted font-medium">상세</span>
        </div>
        <!-- 관리자만 수정/삭제 -->
        <div th:if="${isAdmin}" class="flex items-center gap-2">
            <a th:href="@{/admin/notices/{id}/edit(id=${notice.id})}"
               class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-indigo-600 border border-indigo-200 rounded-lg hover:bg-indigo-50 transition-all">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                수정
            </a>
            <form th:action="@{/admin/notices/{id}/delete(id=${notice.id})}" method="post" class="inline">
                <button type="submit" onclick="return confirm('공지사항을 삭제하시겠습니까?')"
                        class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-red-500 border border-red-200 rounded-lg hover:bg-red-50 transition-all">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                    삭제
                </button>
            </form>
        </div>
    </div>

    <!-- 공지 카드 -->
    <div class="bg-surface rounded-3xl border border-line shadow-sm overflow-hidden">
        <div class="p-6 sm:p-8">
            <!-- 메타 배지 -->
            <div class="flex items-center gap-2 flex-wrap mb-4">
                <span th:if="${notice.isPinned}"
                      class="flex items-center gap-1 px-2.5 py-1 bg-amber-50 text-amber-600 text-xs font-semibold rounded-full">
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                    </svg>
                    상단 고정
                </span>
                <span class="px-2.5 py-1 bg-indigo-50 text-indigo-600 text-xs font-semibold rounded-full">공지</span>
            </div>

            <!-- 제목 -->
            <h1 class="text-xl font-bold text-ink mb-3" th:text="${notice.title}">제목</h1>

            <!-- 날짜 -->
            <div class="flex items-center gap-4 text-xs text-gray-400 pb-5 border-b border-line">
                <span th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</span>
                <span th:if="${notice.updatedAt != null and notice.updatedAt != notice.createdAt}"
                      th:text="'수정: ' + ${#temporals.format(notice.updatedAt, 'yyyy.MM.dd HH:mm')}">수정일</span>
            </div>

            <!-- 본문 -->
            <div class="ck-content pt-5" th:utext="${notice.body}">내용</div>
        </div>
    </div>

    <!-- 첨부파일 -->
    <div th:if="${attachments != null and !#lists.isEmpty(attachments)}"
         class="mt-4 bg-surface rounded-3xl border border-line shadow-sm p-6">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">첨부파일</h3>
        <div class="space-y-2">
            <div th:each="att : ${attachments}"
                 class="flex items-center gap-3 px-4 py-3 bg-surface-muted rounded-xl border border-line hover:bg-indigo-50 hover:border-indigo-100 transition-colors group">
                <svg class="w-4 h-4 text-gray-400 group-hover:text-indigo-400 flex-shrink-0 transition-colors"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                </svg>
                <div class="min-w-0 flex-1">
                    <a th:href="${att.storedPath}" th:text="${att.originalName}" download
                       class="text-xs font-medium text-ink-muted group-hover:text-indigo-600 truncate block transition-colors">파일명</a>
                    <p class="text-[10px] text-gray-400"
                       th:text="${att.fileSize != null ? (att.fileSize / 1024) + ' KB' : ''}"></p>
                </div>
                <svg class="w-4 h-4 text-gray-300 group-hover:text-indigo-400 flex-shrink-0 transition-colors"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- 목록으로 -->
    <div class="mt-4 flex justify-center">
        <a th:href="@{/notices}"
           class="flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-ink-muted border border-line-strong rounded-xl hover:bg-surface-muted transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            목록으로
        </a>
    </div>

</section>
</th:block>
</html>
