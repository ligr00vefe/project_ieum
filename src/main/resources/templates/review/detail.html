<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-lg mx-auto px-4 sm:px-6 py-8">

    <!-- 뒤로가기 -->
    <a th:href="@{/reviews/my}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-gray-700 mb-5 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        내가 쓴 후기
    </a>

    <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
        <!-- 활동지원사 정보 -->
        <div class="flex items-center gap-3 px-5 py-5 border-b border-gray-50">
            <div class="w-11 h-11 bg-teal-100 rounded-full flex items-center justify-center text-teal-600 font-bold flex-shrink-0"
                 th:text="${review.target.fullName != null ? #strings.substring(review.target.fullName, 0, 1) : '?'}">박</div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-gray-900" th:text="${review.target.fullName + ' 활동지원사'}">활동지원사</p>
                <p class="text-xs text-gray-400 mt-0.5"
                   th:text="${review.helpRequest.serviceCategory != null ? review.helpRequest.serviceCategory.name : ''} + ' · ' + ${review.helpRequest.sido} + ' ' + ${review.helpRequest.sigungu}">서비스 · 지역</p>
            </div>
            <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full flex-shrink-0"
                  th:classappend="${review.visibility.name() == 'PUBLIC'} ? 'bg-indigo-50 text-indigo-500' : 'bg-gray-100 text-gray-400'"
                  th:text="${review.visibility.name() == 'PUBLIC'} ? '공개' : '비공개'">공개</span>
        </div>

        <!-- 평점 + 본문 -->
        <div class="px-5 py-5">
            <div class="flex items-center gap-1.5 mb-3">
                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                    <span th:text="${i <= review.rating ? '★' : '☆'}"
                          th:class="${i <= review.rating ? 'text-yellow-400' : 'text-gray-200'}" class="text-xl"></span>
                </th:block>
                <span class="text-sm font-semibold text-gray-700 ml-1" th:text="${review.rating} + '.0'">5.0</span>
            </div>
            <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap" th:text="${review.body}">후기 내용</p>
            <p class="text-xs text-gray-400 mt-4"
               th:text="${#temporals.format(review.createdAt, 'yyyy년 MM월 dd일', new java.util.Locale('ko'))} + ' 작성'">날짜</p>
        </div>

        <!-- 요청 정보 -->
        <div class="px-5 pb-5">
            <a th:href="@{/disabled/board/{id}(id=${review.helpRequest.id})}"
               class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl hover:bg-indigo-50 hover:border-indigo-100 border border-transparent transition-all">
                <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span class="text-xs text-gray-600 truncate" th:text="${review.helpRequest.title}">요청 제목</span>
                <svg class="w-3.5 h-3.5 text-gray-300 ml-auto flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </a>
        </div>
    </div>

    <!-- 수정 / 삭제 버튼 -->
    <div class="flex gap-3 mt-4">
        <a th:href="@{/reviews/{id}/edit(id=${review.id})}"
           class="flex-1 py-3 text-sm font-semibold text-indigo-600 bg-white border border-indigo-200 rounded-xl text-center hover:bg-indigo-50 transition-all">
            수정하기
        </a>
        <form th:action="@{/reviews/{id}/delete(id=${review.id})}" method="post" class="flex-1"
              onsubmit="return confirm('후기를 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit"
                    class="w-full py-3 text-sm font-semibold text-red-500 bg-white border border-red-100 rounded-xl hover:bg-red-50 transition-all">
                삭제하기
            </button>
        </form>
    </div>

</section>
</th:block>
</html>
