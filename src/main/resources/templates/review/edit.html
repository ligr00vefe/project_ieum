<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-lg mx-auto px-4 sm:px-6 py-8">

    <a th:href="@{/reviews/{id}(id=${review.id})}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-gray-700 mb-5 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        후기 상세
    </a>

    <div class="bg-white rounded-2xl border border-gray-100 p-6">
        <h1 class="text-base font-bold text-gray-900 mb-1">후기 수정</h1>
        <p class="text-xs text-gray-400 mb-5" th:text="${review.target.fullName + ' 활동지원사에 대한 후기'}">활동지원사에 대한 후기</p>

        <form th:action="@{/reviews/{id}/edit(id=${review.id})}" method="post" th:object="${form}" class="space-y-5">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- 평점 -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">평점</label>
                <div class="flex gap-2" id="star-row">
                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                        <button type="button"
                                th:attr="data-val=${i}"
                                th:class="${i <= review.rating ? 'text-yellow-400' : 'text-gray-300'}"
                                class="star-btn text-3xl hover:text-yellow-400 transition-colors">★</button>
                    </th:block>
                </div>
                <input type="hidden" id="ratingInput" name="rating" th:value="${review.rating}"/>
                <p class="text-xs text-red-500 mt-1" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></p>
            </div>

            <!-- 본문 -->
            <div>
                <label for="body" class="block text-sm font-semibold text-gray-700 mb-2">후기 내용</label>
                <textarea id="body" name="body" rows="6"
                          th:text="${review.body}"
                          placeholder="활동지원사에 대한 솔직한 후기를 남겨주세요."
                          class="w-full px-4 py-3 text-sm text-gray-700 border border-gray-200 rounded-xl resize-none placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-transparent transition-all"></textarea>
            </div>

            <!-- 공개 여부 -->
            <div>
                <p class="text-sm font-semibold text-gray-700 mb-2">공개 여부</p>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                        <input type="radio" name="visibility" value="PUBLIC"
                               th:checked="${review.visibility.name() == 'PUBLIC'}"
                               class="accent-indigo-600"> 공개
                    </label>
                    <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                        <input type="radio" name="visibility" value="PRIVATE"
                               th:checked="${review.visibility.name() == 'PRIVATE'}"
                               class="accent-indigo-600"> 비공개
                    </label>
                </div>
            </div>

            <button type="submit"
                    class="w-full py-3 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
                수정 완료
            </button>
        </form>
    </div>

    <script>
        (function () {
            var stars = document.querySelectorAll('.star-btn');
            var input = document.getElementById('ratingInput');
            var current = parseInt(input.value) || 0;

            function paint(val) {
                stars.forEach(function (s) {
                    var v = parseInt(s.dataset.val);
                    s.classList.toggle('text-yellow-400', v <= val);
                    s.classList.toggle('text-gray-300', v > val);
                });
            }

            stars.forEach(function (s) {
                s.addEventListener('click', function () {
                    current = parseInt(s.dataset.val);
                    input.value = current;
                    paint(current);
                });
                s.addEventListener('mouseenter', function () { paint(parseInt(s.dataset.val)); });
                s.addEventListener('mouseleave', function () { paint(current); });
            });

            paint(current);
        })();
    </script>

</section>
</th:block>
</html>
