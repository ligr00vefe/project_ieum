<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<div th:replace="~{layout/nav :: nav}"></div>
<div class="mx-auto w-full max-w-3xl px-4 py-6 sm:px-6 lg:px-8">
    <section class="rounded-lg border border-indigo-100 bg-surface p-6">
        <p class="text-sm font-semibold text-indigo-700">서비스 완료</p>
        <h1 class="mt-1 text-2xl font-bold">후기 작성</h1>
        <p class="mt-2 text-sm text-ink-muted" th:text="${request.title}">요청명</p>
        <form th:action="@{/reviews/requests/{id}(id=${request.id})}" method="post" th:object="${form}" class="mt-6 space-y-5">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label for="rating" class="mb-1 block text-sm font-semibold">평점</label>
                <select id="rating" th:field="*{rating}" required class="w-full rounded-md border border-slate-300 px-3 py-3 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600">
                    <option value="">선택해주세요</option>
                    <option value="5">5점 - 매우 만족</option>
                    <option value="4">4점 - 만족</option>
                    <option value="3">3점 - 보통</option>
                    <option value="2">2점 - 아쉬움</option>
                    <option value="1">1점 - 매우 아쉬움</option>
                </select>
            </div>
            <div>
                <label for="body" class="mb-1 block text-sm font-semibold">후기</label>
                <textarea id="body" th:field="*{body}" rows="5" class="w-full rounded-md border border-slate-300 px-3 py-3 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600"></textarea>
            </div>
            <fieldset>
                <legend class="mb-2 text-sm font-semibold">공개 여부</legend>
                <label class="mr-4 inline-flex items-center gap-2"><input type="radio" th:field="*{visibility}" value="PUBLIC"> 공개</label>
                <label class="inline-flex items-center gap-2"><input type="radio" th:field="*{visibility}" value="PRIVATE"> 비공개</label>
            </fieldset>
            <button type="submit" class="rounded-md bg-indigo-700 px-5 py-3 font-semibold text-white hover:bg-indigo-800">후기 등록</button>
        </form>
    </section>
</div>
</th:block>
</html>
