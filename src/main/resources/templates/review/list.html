<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-lg mx-auto px-4 sm:px-6 py-8">

    <!-- 헤더 -->
    <div class="flex items-center justify-between mb-5">
        <div>
            <h1 class="text-lg font-bold text-gray-900">내가 쓴 후기</h1>
            <p class="text-xs text-gray-400 mt-0.5" th:text="${reviews != null ? reviews.size() : 0} + '건'">0건</p>
        </div>
        <a th:href="@{/disabled/mypage}"
           class="text-xs text-indigo-600 font-semibold hover:text-indigo-800 transition-colors">
            마이페이지 →
        </a>
    </div>

    <!-- 목록 -->
    <div th:if="${reviews != null and !reviews.isEmpty()}" class="space-y-3">
        <a th:each="review : ${reviews}"
           th:href="@{/reviews/{id}(id=${review.id})}"
           class="block bg-white rounded-2xl border border-gray-100 p-5 hover:border-indigo-200 hover:shadow-sm transition-all">
            <div class="flex items-start justify-between gap-3 mb-3">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 bg-teal-100 rounded-full flex items-center justify-center text-teal-600 font-bold text-sm flex-shrink-0"
                         th:text="${review.target.fullName != null ? #strings.substring(review.target.fullName, 0, 1) : '?'}">박</div>
                    <div>
                        <p class="text-sm font-semibold text-gray-900" th:text="${review.target.fullName + ' 활동지원사'}">활동지원사</p>
                        <p class="text-xs text-gray-400"
                           th:text="${review.helpRequest.serviceCategory != null ? review.helpRequest.serviceCategory.name : ''} + ' · ' + ${review.helpRequest.sido} + ' ' + ${review.helpRequest.sigungu}">서비스 · 지역</p>
                    </div>
                </div>
                <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full flex-shrink-0"
                      th:classappend="${review.visibility.name() == 'PUBLIC'} ? 'bg-indigo-50 text-indigo-500' : 'bg-gray-100 text-gray-400'"
                      th:text="${review.visibility.name() == 'PUBLIC'} ? '공개' : '비공개'">공개</span>
            </div>
            <div class="flex items-center gap-1 mb-2">
                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                    <span th:text="${i <= review.rating ? '★' : '☆'}"
                          th:class="${i <= review.rating ? 'text-yellow-400' : 'text-gray-200'}" class="text-sm"></span>
                </th:block>
                <span class="text-xs text-gray-500 ml-1" th:text="${review.rating} + '.0'">5.0</span>
            </div>
            <p class="text-sm text-gray-700 leading-relaxed line-clamp-2" th:text="${review.body}">후기 내용</p>
            <p class="text-xs text-gray-400 mt-2"
               th:text="${#temporals.format(review.createdAt, 'yyyy.MM.dd', new java.util.Locale('ko'))}">날짜</p>
        </a>
    </div>

    <!-- 빈 상태 -->
    <div th:if="${reviews == null or reviews.isEmpty()}"
         class="flex flex-col items-center justify-center py-20 text-center">
        <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-indigo-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
        </div>
        <p class="text-sm font-medium text-gray-500">아직 작성한 후기가 없어요</p>
        <p class="text-xs text-gray-400 mt-1">활동이 완료되면 후기를 작성할 수 있어요</p>
        <a th:href="@{/disabled/mypage}"
           class="mt-5 px-5 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all">
            마이페이지 가기
        </a>
    </div>

</section>
</th:block>
</html>
