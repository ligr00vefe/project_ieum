<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${ogTitle != null ? ogTitle : (title != null ? title + ' - 이음' : '이음 Care Match')}">이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/images/favicon/site.webmanifest">
    <!-- Canonical -->
    <link rel="canonical" th:href="${canonical != null ? canonical : 'https://ieumcare.shop' + requestURI}">
    <!-- SEO -->
    <meta name="robots" th:content="${noindex != null and noindex ? 'noindex, nofollow' : 'index, follow'}">
    <meta name="naver-site-verification" content="ab62bd6a9bf4c44b090e0f5d23593c66bdf47e73" />
    <meta name="google-site-verification" content="htxrcUB9iiKvRCNSFJWeFvoyDNod7OybXizS1ntLAq4" />
    <meta name="keywords" content="이음, 이음케어, 이음 케어, ieum, ieumcare, ieum care, 케어 매칭, care match, 케어 매칭 플랫폼, 활동지원사, 케어메이트, 장애인 활동 지원, 돌봄 서비스">
    <meta name="description" th:content="${description != null ? description : '케어메이트와 활동지원사를 신뢰 기반으로 연결하는 케어 매칭 플랫폼 - 이음(ieum)'}">
    <!-- Open Graph -->
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="이음">
    <meta property="og:url"         th:content="${canonical != null ? canonical : 'https://ieumcare.shop' + requestURI}">
    <meta property="og:title"       th:content="${ogTitle != null ? ogTitle : (title != null ? title + ' - 이음' : '이음')}">
    <meta property="og:description" th:content="${ogDescription != null ? ogDescription : (description != null ? description : '케어메이트와 활동지원사를 신뢰 기반으로 연결하는 케어 매칭 플랫폼 - 이음(ieum)')}">
    <meta property="og:image"       th:content="${ogImage != null ? ogImage : 'https://ieumcare.shop/images/og-default.png'}">
    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       th:content="${ogTitle != null ? ogTitle : (title != null ? title + ' - 이음' : '이음')}">
    <meta name="twitter:description" th:content="${description != null ? description : '케어메이트와 활동지원사를 신뢰 기반으로 연결하는 케어 매칭 플랫폼 - 이음(ieum)'}">
    <meta name="twitter:image"       th:content="${ogImage != null ? ogImage : 'https://ieumcare.shop/images/og-default.png'}">
    <!-- JSON-LD — 메인 페이지에만 Organization 구조화 데이터 삽입 -->
    <script th:if="${jsonLd}" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "이음",
      "url": "https://ieumcare.shop",
      "logo": "https://ieumcare.shop/images/og-default.png",
      "description": "케어메이트와 활동지원사를 신뢰 기반으로 연결하는 케어 매칭 플랫폼",
      "sameAs": []
    }
    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JGX35FLSNT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JGX35FLSNT');
    </script>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <!-- TMap JS SDK — 공식 권장대로 head에 정적 로드. 정적 <script>는 파싱 중 실행되어
         SDK 내부의 document.write가 정상 동작한다(동적 삽입 시 차단·미정의 위험).
         tmapAppKey를 model에 담은 페이지에서만 로드. -->
    <script th:if="${loadTmapSdk == true and tmapAppKey != null and !tmapAppKey.isEmpty()}"
            th:src="@{https://apis.openapi.sk.com/tmap/jsv2(version=1,appKey=${tmapAppKey})}"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- 스킵 내비게이션 -->
    <a href="#main-content"
       class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-indigo-600 focus:text-white focus:rounded-lg focus:text-sm focus:font-semibold focus:shadow-lg">
        본문으로 건너뛰기
    </a>

    <!-- Header -->
    <div th:replace="~{layout/header :: header}"></div>

    <!-- Main Content -->
    <main id="main-content" class="flex-1">
        <th:block th:replace="~{__${content}__ :: content}"></th:block>
    </main>

    <!-- Footer -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- 포커스 가시성 전역 보강 -->
    <style>
        :focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
        .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0 }
        .focus\:not-sr-only:focus { position:static;width:auto;height:auto;padding:inherit;margin:inherit;overflow:visible;clip:auto;white-space:normal }
    </style>

</body>
</html>
