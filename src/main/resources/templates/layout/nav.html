<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" th:if="${currentUser != null}" class="border-b border-indigo-100 bg-indigo-50/70">
    <div class="mx-auto flex w-full max-w-6xl flex-wrap gap-2 px-4 py-3 text-sm sm:px-6 lg:px-8">
        <a th:href="@{/me}" class="rounded-md px-3 py-2 font-semibold text-slate-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600">내 현황</a>
        <a th:if="${currentRole == 'USER'}" th:href="@{/my/requests}" class="rounded-md px-3 py-2 font-semibold text-slate-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600">내 요청</a>
        <a th:if="${currentRole == 'USER'}" th:href="@{/requests/new}" class="rounded-md px-3 py-2 font-semibold text-slate-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600">도움 요청</a>
        <a th:if="${currentRole == 'CAREGIVER'}" th:href="@{/requests}" class="rounded-md px-3 py-2 font-semibold text-slate-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600">매칭 게시판</a>
        <a th:href="@{/chat/conversations}" class="rounded-md px-3 py-2 font-semibold text-slate-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600">채팅</a>
        <a th:href="@{/safety}" class="rounded-md px-3 py-2 font-semibold text-slate-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600">안전 가이드</a>
        <a th:if="${currentRole == 'ADMIN'}" th:href="@{/admin}" class="rounded-md px-3 py-2 font-semibold text-slate-700 hover:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600">관리자</a>
    </div>
</nav>
</body>
</html>
