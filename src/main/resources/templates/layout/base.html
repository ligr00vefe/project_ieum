<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle != null and !pageTitle.isEmpty()} ? ${pageTitle} + ' - 이음' : '장애인 케어메이트 - 이음 | 신뢰 기반 케어 매칭 플랫폼'">이음</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/images/favicon/site.webmanifest">
    <!-- Canonical -->
    <link rel="canonical" th:href="'https://ieumcare.shop' + ${requestURI}">
    <!-- SEO -->
    <meta name="robots" th:content="${noindex != null and noindex ? 'noindex, nofollow' : 'index, follow'}">
    <meta name="naver-site-verification" content="ab62bd6a9bf4c44b090e0f5d23593c66bdf47e73" />
    <meta name="google-site-verification" content="htxrcUB9iiKvRCNSFJWeFvoyDNod7OybXizS1ntLAq4" />
    <meta name="keywords" content="이음, 이음케어, 이음 케어, ieum, ieumcare, ieum care, 케어 매칭, care match, 케어 매칭 플랫폼, 활동지원사, 케어메이트, 장애인 활동 지원, 돌봄 서비스">
    <meta name="description" th:content="${description != null ? description : '케어메이트와 활동지원사를 신뢰 기반으로 연결하는 케어 매칭 플랫폼 - 이음(ieum)'}">
    <!-- Open Graph -->
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="이음">
    <meta property="og:url"         th:content="'https://ieumcare.shop' + ${requestURI}">
    <meta property="og:title"       th:content="${pageTitle} + ' | 이음'">
    <meta property="og:description" th:content="${description != null ? description : '케어메이트와 활동지원사를 신뢰 기반으로 연결하는 케어 매칭 플랫폼 - 이음(ieum)'}">
    <meta property="og:image"       content="https://ieumcare.shop/images/og-default.png">
    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       th:content="${pageTitle} + ' | 이음'">
    <meta name="twitter:description" th:content="${description != null ? description : '케어메이트와 활동지원사를 신뢰 기반으로 연결하는 케어 매칭 플랫폼 - 이음(ieum)'}">
    <meta name="twitter:image"       content="https://ieumcare.shop/images/og-default.png">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JGX35FLSNT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JGX35FLSNT');
    </script>
</head>
<body th:fragment="body(content)" class="min-h-screen bg-[#f6f7ff] text-slate-900">
    <div th:replace="~{layout/header :: header}"></div>
    <div th:replace="~{layout/nav :: nav}"></div>
    <main class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8" th:insert="${content}"></main>
    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
