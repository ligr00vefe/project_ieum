<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="header">
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 lg:h-[68px]">

                <!-- Logo -->
                <a th:href="@{/}" class="flex items-center gap-2.5 group flex-shrink-0">
                    <div class="w-9 h-9 bg-teal-500 rounded-xl flex items-center justify-center shadow-sm group-hover:bg-teal-600 transition-colors">
                        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
                        </svg>
                    </div>
                    <div class="leading-tight">
                        <div class="text-[15px] font-bold text-gray-900 group-hover:text-teal-600 transition-colors">이음</div>
                        <div class="text-[10px] text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
                    </div>
                </a>

                <!-- Desktop Navigation -->
                <nav class="hidden md:flex items-center gap-1" aria-label="주요 메뉴">
                    <a th:href="@{/board}"
                       th:classappend="${currentUri.startsWith('/board') or currentUri.startsWith('/disabled/board') or currentUri.startsWith('/caregiver/board')} ? 'text-indigo-600 bg-indigo-50' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50'"
                       class="px-3.5 py-2 text-sm font-medium rounded-lg transition-all">
                        매칭게시판
                    </a>
                    <a th:href="@{/how-to-use}"
                       th:classappend="${currentUri.startsWith('/how-to-use')} ? 'text-indigo-600 bg-indigo-50' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50'"
                       class="px-3.5 py-2 text-sm font-medium rounded-lg transition-all">
                        이용방법
                    </a>
                    <a th:href="@{/safe-meeting}"
                       th:classappend="${currentUri.startsWith('/safe-meeting')} ? 'text-indigo-600 bg-indigo-50' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50'"
                       class="px-3.5 py-2 text-sm font-medium rounded-lg transition-all">
                        첫만남 안심서비스
                    </a>
                    <a th:href="@{/contact}"
                       th:classappend="${currentUri.startsWith('/contact')} ? 'text-indigo-600 bg-indigo-50' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-50'"
                       class="px-3.5 py-2 text-sm font-medium rounded-lg transition-all">
                        문의
                    </a>
                </nav>

                <!-- Auth Buttons -->
                <div class="hidden md:flex items-center gap-2.5">
                    <!-- 비로그인 상태 -->
                    <th:block th:if="${!isAuthenticated}">
                        <a th:href="@{/login}"
                           class="px-4 py-2 text-sm font-semibold text-gray-700 border border-gray-200 rounded-xl hover:border-gray-300 hover:bg-gray-50 transition-all">
                            로그인
                        </a>
                        <a th:href="@{/register/type-select}"
                           class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
                            회원가입
                        </a>
                    </th:block>

                    <!-- 로그인 상태 - 관리자 -->
                    <th:block th:if="${isAuthenticated and isAdmin}">
                        <a th:href="@{/admin}"
                           class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-gray-800 rounded-xl hover:bg-gray-900 transition-all">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            관리자
                        </a>
                        <form th:action="@{/logout}" method="post" class="inline">
                            <button type="submit"
                                    class="px-4 py-2 text-sm font-semibold text-red-600 border border-red-100 rounded-xl hover:bg-red-50 hover:border-red-200 transition-all">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                    <!-- 로그인 상태 - 일반 사용자 -->
                    <th:block th:if="${isAuthenticated and !isAdmin}">
                        <a th:href="@{/mypage}"
                           class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-gray-700 border border-gray-200 rounded-xl hover:border-gray-300 hover:bg-gray-50 transition-all">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            마이페이지
                        </a>
                        <form th:action="@{/logout}" method="post" class="inline">
                            <button type="submit"
                                    class="px-4 py-2 text-sm font-semibold text-red-600 border border-red-100 rounded-xl hover:bg-red-50 hover:border-red-200 transition-all">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                </div>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn"
                        type="button"
                        onclick="toggleMobileMenu()"
                        class="md:hidden p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
                        aria-label="메뉴 열기"
                        aria-expanded="false"
                        aria-controls="mobile-menu">
                    <svg id="hamburger-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <svg id="close-icon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu"
             class="hidden md:hidden bg-white border-t border-gray-100 shadow-lg"
             role="dialog"
             aria-label="모바일 메뉴">
            <div class="max-w-7xl mx-auto px-4 py-4 space-y-1">
                <a th:href="@{/board}"         class="flex items-center px-4 py-3 text-sm font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">매칭게시판</a>
                <a th:href="@{/how-to-use}"    class="flex items-center px-4 py-3 text-sm font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">이용방법</a>
                <a th:href="@{/safe-meeting}"  class="flex items-center px-4 py-3 text-sm font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">첫만남 안심서비스</a>
                <a th:href="@{/contact}"       class="flex items-center px-4 py-3 text-sm font-medium text-gray-700 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">문의</a>
                <div class="pt-3 mt-3 border-t border-gray-100 space-y-2">
                    <!-- 비로그인 -->
                    <th:block th:if="${!isAuthenticated}">
                        <a th:href="@{/login}"
                           class="flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-gray-700 border border-gray-200 rounded-xl hover:bg-gray-50 transition-all">
                            로그인
                        </a>
                        <a th:href="@{/register/type-select}"
                           class="flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all">
                            회원가입
                        </a>
                    </th:block>
                    <!-- 로그인 - 관리자 -->
                    <th:block th:if="${isAuthenticated and isAdmin}">
                        <a th:href="@{/admin}"
                           class="flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-white bg-gray-800 rounded-xl hover:bg-gray-900 transition-all">
                            관리자
                        </a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                    class="w-full px-4 py-3 text-sm font-semibold text-red-600 border border-red-100 rounded-xl hover:bg-red-50 transition-all">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                    <!-- 로그인 - 일반 사용자 -->
                    <th:block th:if="${isAuthenticated and !isAdmin}">
                        <a th:href="@{/mypage}"
                           class="flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-gray-700 border border-gray-200 rounded-xl hover:bg-gray-50 transition-all">
                            마이페이지
                        </a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                    class="w-full px-4 py-3 text-sm font-semibold text-red-600 border border-red-100 rounded-xl hover:bg-red-50 transition-all">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>
    </header>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-btn');
            const hamburger = document.getElementById('hamburger-icon');
            const close = document.getElementById('close-icon');
            const isOpen = !menu.classList.contains('hidden');

            if (isOpen) {
                menu.classList.add('hidden');
                hamburger.classList.remove('hidden');
                close.classList.add('hidden');
                btn.setAttribute('aria-expanded', 'false');
                btn.setAttribute('aria-label', '메뉴 열기');
            } else {
                menu.classList.remove('hidden');
                hamburger.classList.add('hidden');
                close.classList.remove('hidden');
                btn.setAttribute('aria-expanded', 'true');
                btn.setAttribute('aria-label', '메뉴 닫기');
            }
        }
    </script>
</th:block>
</html>
