<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="header">
    <header class="bg-surface border-b border-line sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 lg:h-[68px]">

                <!-- Logo -->
                <a th:href="@{/}" class="flex items-end gap-2.5 group flex-shrink-0">
                    <img src="/images/logo/logo.png" alt="이음 로고" class="w-11 h-11 object-contain">
                    <div class="leading-tight">
                        <div class="text-base font-bold text-ink group-hover:text-teal-600 transition-colors">이음</div>
                        <div class="text-xs text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
                    </div>
                </a>

                <!-- Desktop Navigation -->
                <nav id="desktop-nav" class="hidden md:flex items-center gap-1" aria-label="주요 메뉴">
                    <a th:href="@{/board}"
                       th:classappend="${currentUri.startsWith('/board') or currentUri.startsWith('/disabled/board') or currentUri.startsWith('/caregiver/board')} ? 'text-indigo-600 bg-indigo-50' : 'text-ink-muted hover:text-ink hover:bg-surface-muted'"
                       th:attr="aria-current=${(currentUri.startsWith('/board') or currentUri.startsWith('/disabled/board') or currentUri.startsWith('/caregiver/board')) ? 'page' : null}"
                       class="px-3.5 py-2 text-sm font-medium rounded-lg transition-all">
                        이음매칭
                    </a>
                    <a th:href="@{/how-to-use}"
                       th:classappend="${currentUri.startsWith('/how-to-use')} ? 'text-indigo-600 bg-indigo-50' : 'text-ink-muted hover:text-ink hover:bg-surface-muted'"
                       th:attr="aria-current=${currentUri.startsWith('/how-to-use') ? 'page' : null}"
                       class="px-3.5 py-2 text-sm font-medium rounded-lg transition-all">
                        이용방법
                    </a>
                    <a th:href="@{/safe-meeting}"
                       th:classappend="${currentUri.startsWith('/safe-meeting')} ? 'text-indigo-600 bg-indigo-50' : 'text-ink-muted hover:text-ink hover:bg-surface-muted'"
                       th:attr="aria-current=${currentUri.startsWith('/safe-meeting') ? 'page' : null}"
                       class="px-3.5 py-2 text-sm font-medium rounded-lg transition-all">
                        첫만남 안심가이드
                    </a>
                    <a th:href="@{/market}"
                       th:classappend="${currentUri.startsWith('/market')} ? 'text-orange-500 bg-orange-50' : 'text-ink-muted hover:text-ink hover:bg-surface-muted'"
                       th:attr="aria-current=${currentUri.startsWith('/market') ? 'page' : null}"
                       class="px-3.5 py-2 text-sm font-medium rounded-lg transition-all">
                        이음마켓
                    </a>
                </nav>

                <!-- Auth Buttons -->
                <div id="desktop-auth" class="hidden md:flex items-center gap-2.5">
                    <!-- 글자 크게 보기 (알림 벨 왼쪽) — 모든 사용자에게 노출 -->
                    <button type="button" id="fontScaleBtn" data-font-scale-toggle aria-label="글자 크게 보기 (150%)"
                            class="flex items-center gap-1.5 px-3 py-2 text-sm font-semibold text-ink-muted border border-line-strong rounded-xl hover:bg-surface-muted transition-all">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a7 7 0 100 14 7 7 0 000-14z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35"/>
                        </svg>
                        <span data-font-scale-label>크게 보기</span>
                    </button>

                    <!-- 비로그인 상태 -->
                    <th:block th:if="${!isAuthenticated}">
                        <a th:href="@{/login}"
                           class="px-4 py-2 text-sm font-semibold text-ink-muted border border-line-strong rounded-xl hover:border-gray-300 hover:bg-surface-muted transition-all">
                            로그인
                        </a>
                        <a th:href="@{/register/type-select}"
                           class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
                            회원가입
                        </a>
                    </th:block>

                    <!-- 로그인 상태 - 관리자 -->
                    <th:block th:if="${isAuthenticated and isAdmin}">
                        <a th:href="@{/admin}"
                           class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-gray-800 rounded-xl hover:bg-gray-900 transition-all">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            관리자
                        </a>
                        <form th:action="@{/logout}" method="post" class="inline">
                            <button type="submit"
                                    class="px-4 py-2 text-sm font-semibold text-red-600 border border-red-100 rounded-xl hover:bg-red-50 hover:border-red-200 transition-all">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                    <!-- 로그인 상태 - 일반 사용자 -->
                    <th:block th:if="${isAuthenticated and !isAdmin}">
                        <!-- 알림 종 + 드롭다운 (비로그인/관리자는 렌더되지 않음) -->
                        <div class="relative">
                            <button type="button" id="notifBtn" aria-label="알림" aria-haspopup="true" aria-expanded="false"
                                    class="relative p-2 text-gray-500 hover:text-ink-muted hover:bg-surface-hover rounded-lg transition-colors">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                                </svg>
                                <span id="notifBadge" class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 flex items-center justify-center bg-red-500 text-white text-[10px] font-bold rounded-full" aria-live="polite">0</span>
                            </button>
                            <div id="notifPanel" class="hidden absolute right-0 mt-2 w-80 max-h-96 overflow-y-auto bg-surface border border-line-strong rounded-xl shadow-lg z-50">
                                <div class="px-4 py-3 border-b border-line flex items-center justify-between">
                                    <span class="text-sm font-bold text-ink">알림</span>
                                    <button type="button" id="notifReadAll" class="text-xs text-indigo-500 hover:text-indigo-700">모두 읽음</button>
                                </div>
                                <div id="notifList" class="divide-y divide-line">
                                    <p class="px-4 py-6 text-center text-xs text-gray-400">불러오는 중...</p>
                                </div>
                            </div>
                        </div>
                        <a th:href="@{/mypage}"
                           class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-ink-muted border border-line-strong rounded-xl hover:border-gray-300 hover:bg-surface-muted transition-all">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            마이페이지
                        </a>
                        <form th:action="@{/logout}" method="post" class="inline">
                            <button type="submit"
                                    class="px-4 py-2 text-sm font-semibold text-red-600 border border-red-100 rounded-xl hover:bg-red-50 hover:border-red-200 transition-all">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                </div>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn"
                        type="button"
                        onclick="toggleMobileMenu()"
                        class="md:hidden p-2 text-gray-500 hover:text-ink-muted hover:bg-surface-hover rounded-lg transition-colors"
                        aria-label="메뉴 열기"
                        aria-expanded="false"
                        aria-controls="mobile-menu">
                    <svg id="hamburger-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    <svg id="close-icon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu"
             class="hidden md:hidden bg-surface border-t border-line shadow-lg"
             role="dialog"
             aria-label="모바일 메뉴">
            <div class="max-w-7xl mx-auto px-4 py-4 space-y-1">
                <button type="button" id="fontScaleBtnMobile" data-font-scale-toggle aria-label="글자 크게 보기 (150%)"
                        class="flex items-center gap-2.5 w-full px-4 py-3 text-sm font-medium text-ink-muted hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a7 7 0 100 14 7 7 0 000-14z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35"/>
                    </svg>
                    <span data-font-scale-label>크게 보기</span>
                </button>
                <a th:href="@{/board}"        class="flex items-center px-4 py-3 text-sm font-medium text-ink-muted hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">이음매칭</a>
                <a th:href="@{/how-to-use}"   class="flex items-center px-4 py-3 text-sm font-medium text-ink-muted hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">이용방법</a>
                <a th:href="@{/safe-meeting}" class="flex items-center px-4 py-3 text-sm font-medium text-ink-muted hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">첫만남 안심가이드</a>
                <a th:href="@{/market}"       class="flex items-center px-4 py-3 text-sm font-medium text-ink-muted hover:text-orange-500 hover:bg-orange-50 rounded-xl transition-all">이음마켓</a>
                <div class="pt-3 mt-3 border-t border-line space-y-2">
                    <!-- 비로그인 -->
                    <th:block th:if="${!isAuthenticated}">
                        <a th:href="@{/login}"
                           class="flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-ink-muted border border-line-strong rounded-xl hover:bg-surface-muted transition-all">
                            로그인
                        </a>
                        <a th:href="@{/register/type-select}"
                           class="flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all">
                            회원가입
                        </a>
                    </th:block>
                    <!-- 로그인 - 관리자 -->
                    <th:block th:if="${isAuthenticated and isAdmin}">
                        <a th:href="@{/admin}"
                           class="flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-white bg-gray-800 rounded-xl hover:bg-gray-900 transition-all">
                            관리자
                        </a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                    class="w-full px-4 py-3 text-sm font-semibold text-red-600 border border-red-100 rounded-xl hover:bg-red-50 transition-all">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                    <!-- 로그인 - 일반 사용자 -->
                    <th:block th:if="${isAuthenticated and !isAdmin}">
                        <a th:href="@{/mypage}"
                           class="flex items-center justify-center w-full px-4 py-3 text-sm font-semibold text-ink-muted border border-line-strong rounded-xl hover:bg-surface-muted transition-all">
                            마이페이지
                        </a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                    class="w-full px-4 py-3 text-sm font-semibold text-red-600 border border-red-100 rounded-xl hover:bg-red-50 transition-all">
                                로그아웃
                            </button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>
    </header>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-btn');
            const hamburger = document.getElementById('hamburger-icon');
            const close = document.getElementById('close-icon');
            const isOpen = !menu.classList.contains('hidden');

            if (isOpen) {
                menu.classList.add('hidden');
                hamburger.classList.remove('hidden');
                close.classList.add('hidden');
                btn.setAttribute('aria-expanded', 'false');
                btn.setAttribute('aria-label', '메뉴 열기');
            } else {
                menu.classList.remove('hidden');
                hamburger.classList.add('hidden');
                close.classList.remove('hidden');
                btn.setAttribute('aria-expanded', 'true');
                btn.setAttribute('aria-label', '메뉴 닫기');
            }
        }

        // 알림 종/뱃지/드롭다운 — 종 버튼은 로그인 일반 사용자에게만 렌더되므로, 없으면 자동 비활성.
        (function () {
            var btn = document.getElementById('notifBtn');
            if (!btn) return;
            var panel = document.getElementById('notifPanel');
            var badge = document.getElementById('notifBadge');
            var list = document.getElementById('notifList');
            var readAllBtn = document.getElementById('notifReadAll');
            var csrfMeta = document.querySelector('meta[name="_csrf"]');
            var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');

            function escapeHtml(s) {
                return (s || '').replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function csrfHeaders() {
                var h = {'Content-Type': 'application/json'};
                if (csrfMeta && csrfHeaderMeta) { h[csrfHeaderMeta.content] = csrfMeta.content; }
                return h;
            }

            function updateBadge(count) {
                var n = count || 0;
                if (n > 0) { badge.textContent = n > 99 ? '99+' : n; badge.classList.remove('hidden'); }
                else { badge.classList.add('hidden'); }
            }

            function refreshBadge() {
                fetch('/api/notifications/unread-count')
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (d) { if (d) updateBadge(d.unreadCount); })
                    .catch(function () {});
            }

            function renderEmpty() {
                list.innerHTML = '<p class="px-4 py-6 text-center text-xs text-gray-400">새 알림이 없습니다.</p>';
            }

            function loadList() {
                list.innerHTML = '<p class="px-4 py-6 text-center text-xs text-gray-400">불러오는 중...</p>';
                fetch('/api/notifications?page=0&size=20')
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (d) {
                        // 읽지 않은 알림만 표시
                        var items = d && d.content ? d.content.filter(function (n) { return !n.hasRead; }) : [];
                        if (items.length === 0) { renderEmpty(); return; }
                        list.innerHTML = items.map(function (n) {
                            return '<button type="button" data-notif-id="' + n.id + '" data-notif-url="' + escapeHtml(n.url || '') + '"'
                                + ' class="w-full text-left px-4 py-3 hover:bg-surface-muted bg-indigo-50/40 flex items-start gap-2">'
                                + '<span class="w-1.5 h-1.5 bg-indigo-500 rounded-full flex-shrink-0 mt-1.5"></span>'
                                + '<span class="min-w-0">'
                                + '<p class="text-xs font-semibold text-gray-800">' + escapeHtml(n.title) + '</p>'
                                + '<p class="text-xs text-gray-500 mt-0.5 break-words">' + escapeHtml(n.content) + '</p>'
                                + '</span></button>';
                        }).join('');
                        // 개별 클릭 → 읽음 처리 + 목록에서 즉시 제거 → URL 이동
                        list.querySelectorAll('[data-notif-id]').forEach(function (el) {
                            el.addEventListener('click', function () {
                                var nid = el.getAttribute('data-notif-id');
                                var nurl = el.getAttribute('data-notif-url');
                                el.remove();
                                var remaining = list.querySelectorAll('[data-notif-id]').length;
                                if (remaining === 0) renderEmpty();
                                fetch('/api/notifications/' + nid + '/read', {method: 'POST', headers: csrfHeaders()})
                                    .then(function (r) { return r.ok ? r.json() : null; })
                                    .then(function (d) { if (d) updateBadge(d.unreadCount); })
                                    .finally(function () { if (nurl) window.location.href = nurl; });
                            });
                        });
                    }).catch(function () { renderEmpty(); });
            }

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (panel.classList.contains('hidden')) {
                    panel.classList.remove('hidden');
                    btn.setAttribute('aria-expanded', 'true');
                    loadList();
                } else {
                    panel.classList.add('hidden');
                    btn.setAttribute('aria-expanded', 'false');
                }
            });

            document.addEventListener('click', function (e) {
                if (!panel.classList.contains('hidden') && !panel.contains(e.target) && !btn.contains(e.target)) {
                    panel.classList.add('hidden');
                    btn.setAttribute('aria-expanded', 'false');
                }
            });

            if (readAllBtn) {
                readAllBtn.addEventListener('click', function () {
                    fetch('/api/notifications/read-all', {method: 'POST', headers: csrfHeaders()})
                        .then(function (r) { return r.ok ? r.json() : null; })
                        .then(function (d) {
                            if (d) updateBadge(d.unreadCount);
                            renderEmpty();
                        }).catch(function () {});
                });
            }

            // 뱃지 실시간 갱신 — SSE 구독이 주 경로, 미지원 브라우저만 1분 폴링 폴백
            function connectBadgeSse() {
                if (!window.EventSource) {
                    setInterval(refreshBadge, 60000);
                    return;
                }
                var es = new EventSource('/api/notifications/stream');
                es.addEventListener('unread', function (e) {
                    try { updateBadge(JSON.parse(e.data).unreadCount); } catch (err) {}
                });
                // 연결이 끊겨도 EventSource가 자동 재연결하므로 별도 처리 불필요
            }

            refreshBadge();
            connectBadgeSse();
            // 탭 포커스 복귀 시 즉시 갱신 (재연결 공백 보정)
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') refreshBadge();
            });
        })();
    </script>
</th:block>
</html>
