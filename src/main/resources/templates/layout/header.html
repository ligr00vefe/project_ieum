<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="border-b border-indigo-100 bg-white">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
        <a th:href="@{/}" class="inline-flex items-center gap-2 rounded-md text-lg font-bold text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-700 text-white">이</span>
            <span>이음</span>
        </a>

        <div class="flex items-center gap-2">
            <a th:if="${currentUser == null}" th:href="@{/login}" class="rounded-md border border-indigo-200 px-4 py-2 text-sm font-semibold text-indigo-700 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">로그인</a>
            <a th:if="${currentUser == null}" th:href="@{/register}" class="rounded-md bg-indigo-700 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">회원가입</a>

            <a th:if="${currentUser != null}" th:href="@{/notifications}" class="rounded-md px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">알림</a>
            <a th:if="${currentUser != null}" th:href="@{/me}" class="rounded-md px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">마이페이지</a>
            <form th:if="${currentUser != null}" th:action="@{/logout}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="rounded-md border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">로그아웃</button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
