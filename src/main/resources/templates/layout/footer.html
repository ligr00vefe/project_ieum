<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="footer">
    <footer class="bg-gray-900 text-white">
        <!-- Main Footer -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-14 pb-10">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">

                <!-- Brand -->
                <div class="sm:col-span-2 lg:col-span-1">
                    <a th:href="@{/}" class="flex items-center gap-2.5 mb-5 group w-fit">
                        <div class="w-9 h-9 bg-teal-500 rounded-xl flex items-center justify-center group-hover:bg-teal-400 transition-colors">
                            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
                            </svg>
                        </div>
                        <div class="leading-tight">
                            <div class="text-base font-bold text-white">이음</div>
                            <div class="text-[10px] text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
                        </div>
                    </a>
                    <p class="text-sm text-gray-400 leading-relaxed mb-6">
                        케어메이트와 활동지원사를<br>
                        신뢰 기반으로 연결하는<br>
                        케어 매칭 플랫폼입니다.
                    </p>
                    <!-- Social Links -->
                    <div class="flex items-center gap-3">
                        <button onclick="alert('준비중입니다.')" aria-label="인스타그램"
                           class="w-8 h-8 bg-gray-800 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 transition-all cursor-pointer">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                            </svg>
                        </button>
                        <button onclick="alert('준비중입니다.')" aria-label="카카오톡"
                           class="w-8 h-8 bg-gray-800 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 transition-all cursor-pointer">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 3C6.48 3 2 6.71 2 11.25c0 2.91 1.87 5.48 4.7 6.97l-1.2 4.47 5.16-3.42c.43.06.87.09 1.32.09 5.52 0 10-3.71 10-8.25C22 6.71 17.52 3 12 3z"/>
                            </svg>
                        </button>
                        <button onclick="alert('준비중입니다.')" aria-label="네이버 밴드"
                           class="w-8 h-8 bg-gray-800 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 transition-all cursor-pointer">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.01 13.635l-5.514 3.637c-.285.188-.648.194-.939.016L5.003 13.65A1.04 1.04 0 014.5 12.75V8.5A1.5 1.5 0 016 7h12a1.5 1.5 0 011.5 1.5v4.224a1.04 1.04 0 01-.49.911zM8 10.5a.5.5 0 000 1h8a.5.5 0 000-1H8zm0 2a.5.5 0 000 1h5a.5.5 0 000-1H8z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Service Links -->
                <div>
                    <h3 class="text-sm font-semibold text-white uppercase tracking-wider mb-5">서비스</h3>
                    <ul class="space-y-3">
                        <li><a th:href="@{/how-to-use}" class="text-sm text-gray-400 hover:text-white transition-colors">이용방법</a></li>
                        <li><a th:href="@{/board}" class="text-sm text-gray-400 hover:text-white transition-colors">매칭 게시판</a></li>
                        <li><a th:href="@{/safe-meeting}" class="text-sm text-gray-400 hover:text-white transition-colors">첫만남 안심가이드</a></li>
                        <li><a th:href="@{/market}" class="text-sm text-gray-400 hover:text-white transition-colors">이음마켓</a></li>
                        <li><a th:href="@{/register/type-select}" class="text-sm text-gray-400 hover:text-white transition-colors">회원가입</a></li>
                    </ul>
                </div>

                <!-- Support Links -->
                <div>
                    <h3 class="text-sm font-semibold text-white uppercase tracking-wider mb-5">고객 지원</h3>
                    <ul class="space-y-3">
                        <li><a th:href="@{/notices}" class="text-sm text-gray-400 hover:text-white transition-colors">공지사항</a></li>
                        <li><a th:href="@{/contact}" class="text-sm text-gray-400 hover:text-white transition-colors">문의</a></li>
                    </ul>
                </div>

                <!-- Contact Info -->
                <div>
                    <h3 class="text-sm font-semibold text-white uppercase tracking-wider mb-5">연락처</h3>
                    <ul class="space-y-3">
                        <li class="flex items-start gap-2.5">
                            <svg class="w-4 h-4 text-gray-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <span class="text-sm text-gray-400">contact@ieum.kr</span>
                        </li>
                        <li class="flex items-start gap-2.5">
                            <svg class="w-4 h-4 text-gray-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                            </svg>
                            <div class="text-sm text-gray-400">
                                <div>02-1234-5678</div>
                                <div class="text-xs text-gray-500 mt-0.5">평일 09:00 – 18:00</div>
                            </div>
                        </li>
                        <li class="flex items-start gap-2.5">
                            <svg class="w-4 h-4 text-gray-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            <span class="text-sm text-gray-400">서울특별시 강남구<br>테헤란로 123</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="border-t border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <p class="text-xs text-gray-500 order-2 sm:order-1">
                        &copy; 2024 이음 Care Match. All rights reserved.
                    </p>
                    <div class="flex items-center gap-5 order-1 sm:order-2">
                        <a th:href="@{/privacy}" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">
                            개인정보처리방침
                        </a>
                        <a th:href="@{/terms}" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">
                            이용약관
                        </a>
                        <a href="#" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">
                            사업자 정보
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</th:block>
</html>
