<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-ink">매칭 게시판</h1>
        <p class="text-sm text-gray-500 mt-1">나의 조건과 맞는 도움 요청을 찾아보세요.</p>
    </div>

    <!-- 위치 기반 정렬 컨트롤 -->
    <div class="flex flex-wrap items-center gap-2 mb-3">
        <button type="button" id="nearbyBtn"
                class="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm font-semibold text-indigo-600 bg-indigo-50 border border-indigo-100 rounded-xl hover:bg-indigo-100 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            내 주변 순으로 보기
        </button>
        <button type="button" id="mapPickBtn"
                th:if="${tmapAppKey != null and !tmapAppKey.isEmpty()}"
                class="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm font-semibold text-ink-muted bg-surface border border-line-strong rounded-xl hover:border-indigo-300 hover:text-indigo-600 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
            </svg>
            지도에서 선택
        </button>
        <span th:if="${locationSorted}"
              class="inline-flex items-center px-2.5 py-1 text-xs font-semibold text-teal-700 bg-teal-50 border border-teal-100 rounded-full">
            내 위치 기준 가까운 순
        </span>
        <a th:if="${locationSorted}" th:href="@{/caregiver/board}"
           class="text-xs text-gray-400 hover:text-indigo-600 underline underline-offset-2">전체 보기</a>
    </div>

    <!-- 동적 검색 필터 — GET 폼 제출(서버 필터링). lat/lng는 hidden으로 보존해 위치정렬과 함께 검색. -->
    <form method="get" th:action="@{/caregiver/board}" id="searchForm"
          class="bg-surface border border-line rounded-2xl p-4 mb-4">
        <input type="hidden" name="lat" th:if="${lat != null}" th:value="${lat}">
        <input type="hidden" name="lng" th:if="${lng != null}" th:value="${lng}">

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <!-- 키워드 (제목·본문) -->
            <div class="lg:col-span-3">
                <label for="keyword" class="block text-xs font-semibold text-gray-500 mb-1">키워드</label>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" id="keyword" name="keyword" th:value="${fKeyword}"
                           placeholder="제목·내용으로 검색"
                           class="w-full pl-9 pr-3 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
                </div>
            </div>

            <!-- 시/도 -->
            <div>
                <label for="sido" class="block text-xs font-semibold text-gray-500 mb-1">시/도</label>
                <select id="sido" name="sido"
                        class="w-full px-3 py-2 text-sm border border-line-strong rounded-xl bg-surface focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
                    <option value="">전체</option>
                    <option th:each="entry : ${regionMap}" th:value="${entry.key}" th:text="${entry.key}"
                            th:selected="${entry.key == fSido}">서울</option>
                </select>
            </div>

            <!-- 시/군/구 (시/도 선택에 따라 JS로 채움) -->
            <div>
                <label for="sigungu" class="block text-xs font-semibold text-gray-500 mb-1">시/군/구</label>
                <select id="sigungu" name="sigungu"
                        class="w-full px-3 py-2 text-sm border border-line-strong rounded-xl bg-surface focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
                    <option value="">전체</option>
                </select>
            </div>

            <!-- 서비스 카테고리 (다중 선택 — 같은 name 체크박스 → 반복 파라미터로 제출) -->
            <fieldset class="sm:col-span-2 lg:col-span-3">
                <legend class="block text-xs font-semibold text-gray-500 mb-1.5">서비스 (복수 선택 가능)</legend>
                <div class="flex flex-wrap gap-2">
                    <label th:each="cat : ${serviceCategories}"
                           class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm text-ink-muted border border-line-strong rounded-full cursor-pointer hover:border-indigo-300 transition-colors has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-300 has-[:checked]:text-indigo-700">
                        <input type="checkbox" name="serviceCategoryId" th:value="${cat.id}"
                               th:checked="${fServiceCategoryIds != null and #lists.contains(fServiceCategoryIds, cat.id)}"
                               class="accent-indigo-600">
                        <span th:text="${cat.name}">서비스</span>
                    </label>
                </div>
            </fieldset>

            <!-- 희망 시작일 범위 -->
            <div>
                <label for="fromDate" class="block text-xs font-semibold text-gray-500 mb-1">희망일(부터)</label>
                <input type="date" id="fromDate" name="fromDate" th:value="${fFromDate}"
                       class="w-full px-3 py-2 text-sm border border-line-strong rounded-xl bg-surface focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
            </div>
            <div>
                <label for="toDate" class="block text-xs font-semibold text-gray-500 mb-1">희망일(까지)</label>
                <input type="date" id="toDate" name="toDate" th:value="${fToDate}"
                       class="w-full px-3 py-2 text-sm border border-line-strong rounded-xl bg-surface focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
            </div>
        </div>

        <div class="flex items-center gap-2 mt-4">
            <button type="submit"
                    class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                검색
            </button>
            <a th:if="${hasFilter}" th:href="@{/caregiver/board(lat=${lat},lng=${lng})}"
               class="px-4 py-2 text-sm font-semibold text-gray-500 bg-surface-hover rounded-xl hover:bg-gray-200 transition-colors">필터 초기화</a>
        </div>
    </form>
    <!-- 위치 안내 메시지(거부/미지원 시 노출) -->
    <p id="geoMsg" class="hidden mb-3 text-xs text-gray-500" role="status" aria-live="polite"></p>

    <!-- 게시글 목록 -->
    <div class="space-y-3">

        <th:block th:each="request : ${requests.content}">
        <a th:href="@{/caregiver/board/{id}(id=${request.id})}"
           class="block bg-surface rounded-2xl border border-line p-5 hover:border-indigo-100 hover:shadow-sm transition-all">
            <div class="flex items-start justify-between">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-2">
                        <span th:text="${request.status.name() == 'OPEN' ? '모집중' : request.status.name() == 'MATCHED' ? '매칭완료' : request.status.name() == 'IN_PROGRESS' ? '진행중' : '종료'}"
                              th:classappend="${request.status.name() == 'OPEN' ? 'bg-indigo-50 text-indigo-600' : 'bg-teal-50 text-teal-600'}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">모집중</span>
                    </div>
                    <h3 class="text-base font-semibold text-ink truncate" th:text="${request.title}">제목</h3>
                    <div class="flex items-center gap-3 mt-1.5 text-xs text-gray-400">
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span th:text="${request.sido + ' ' + request.sigungu}">서울 강남구</span>
                        </span>
                        <span class="flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            <span th:text="${#temporals.format(request.desiredStartDatetime, 'MM/dd (E) HH:mm')}">일시</span>
                        </span>
                        <span th:if="${distanceMap != null and distanceMap.containsKey(request.id)}"
                              class="inline-flex items-center gap-1 px-2 py-0.5 text-indigo-600 bg-indigo-50 rounded-full font-medium"
                              th:title="'대략적인 직선 거리입니다'">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                            <span th:text="${distanceMap.get(request.id)}">약 2.5km</span>
                        </span>
                    </div>
                    <div class="flex items-center gap-1.5 mt-3">
                        <span th:text="${request.serviceCategory.name}"
                              class="px-2 py-0.5 bg-surface-muted text-gray-500 text-xs rounded-md">서비스</span>
                    </div>
                </div>
            </div>
        </a>
        </th:block>

        <div th:if="${requests.empty}" class="rounded-lg border border-dashed border-indigo-200 bg-surface p-8 text-center text-ink-muted">
            열린 도움 요청이 없습니다.
        </div>

    </div>

    <!-- 페이지네이션 (정렬·검색 필터 파라미터를 pageBaseUrl로 모두 유지) -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, ${pageBaseUrl})}"></div>

</section>

<!-- 지도 위치 선택 모달 (TMap appKey 있을 때만) -->
<div th:if="${tmapAppKey != null and !tmapAppKey.isEmpty()}"
     id="mapModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     th:attr="data-lat=${lat},data-lng=${lng}"
     role="dialog" aria-modal="true" aria-labelledby="mapModalTitle">
    <div id="mapBackdrop" class="absolute inset-0 bg-black/40"></div>
    <div class="relative bg-surface rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-line">
            <h2 id="mapModalTitle" class="text-base font-semibold text-ink">지도에서 위치 선택</h2>
            <button type="button" id="mapClose" aria-label="닫기"
                    class="text-gray-400 hover:text-ink-muted transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="px-5 py-3 border-b border-line flex flex-wrap gap-2">
            <div class="relative flex-1 min-w-[12rem]">
                <input type="text" id="poiSearch" placeholder="장소·주소 검색 (예: 강남역)"
                       class="w-full pl-3 pr-3 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-300">
            </div>
            <button type="button" id="poiSearchBtn"
                    class="px-3.5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors whitespace-nowrap">검색</button>
            <button type="button" id="myLocBtn"
                    class="inline-flex items-center gap-1 px-3.5 py-2 text-sm font-semibold text-ink-muted bg-surface-hover rounded-xl hover:bg-gray-200 transition-colors whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                현재 위치
            </button>
        </div>
        <div id="mapCanvas" class="w-full h-[28rem] bg-surface-hover"></div>
        <div class="px-5 py-4">
            <p id="mapMsg" class="text-sm text-gray-500">지도를 누르거나 검색해 기준 위치를 정하세요.</p>
            <div class="flex gap-2 mt-4">
                <button type="button" id="mapCancel"
                        class="flex-1 py-2.5 text-sm font-semibold text-ink-muted bg-surface-hover rounded-xl hover:bg-gray-200 transition-colors">취소</button>
                <button type="button" id="mapConfirm"
                        class="flex-1 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">이 위치로 찾기</button>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    var btn = document.getElementById('nearbyBtn');
    var msg = document.getElementById('geoMsg');
    if (!btn) return;

    function goTo(lat, lng) {
        // 위치 기반 사용 시 지역 필터(시/도·시군구)는 자동 해제(상호 배타). 키워드·서비스·날짜는 유지.
        var params = new URLSearchParams(window.location.search);
        params.delete('sido');
        params.delete('sigungu');
        params.set('lat', lat);
        params.set('lng', lng);
        params.set('page', '0');
        window.location.assign('/caregiver/board?' + params.toString());
    }
    function showMsg(text) {
        if (!msg) return;
        msg.textContent = text;
        msg.classList.remove('hidden');
    }

    btn.addEventListener('click', function () {
        // 같은 세션에서 이미 받은 위치는 재사용해 권한 재요청을 피한다.
        var cached = sessionStorage.getItem('caregiverBoardGeo');
        if (cached) {
            try {
                var p = JSON.parse(cached);
                if (p && !isNaN(p.lat) && !isNaN(p.lng)) {
                    goTo(p.lat, p.lng);
                    return;
                }
                sessionStorage.removeItem('caregiverBoardGeo'); // 손상·구버전 캐시 폐기 후 새로 요청
            } catch (e) {
                sessionStorage.removeItem('caregiverBoardGeo'); // 캐시 손상 시 폐기 후 새로 요청
            }
        }
        if (!navigator.geolocation) {
            showMsg('이 브라우저는 위치 기능을 지원하지 않습니다. 시작시각 순으로 표시합니다.');
            return;
        }
        btn.disabled = true;
        btn.textContent = '위치 확인 중...';
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                var lat = pos.coords.latitude, lng = pos.coords.longitude;
                sessionStorage.setItem('caregiverBoardGeo', JSON.stringify({ lat: lat, lng: lng }));
                goTo(lat, lng);
            },
            function () {
                btn.disabled = false;
                btn.textContent = '내 주변 순으로 보기';
                showMsg('위치를 허용하면 가까운 순으로 볼 수 있어요. 지금은 시작시각 순으로 표시합니다.');
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    });
})();
</script>

<!-- 시/도 → 시/군/구 cascade — 서버가 내려준 지역 맵으로 선택 시 시군구 옵션을 갱신(점진적 향상). -->
<script th:inline="javascript">
(function () {
    var REGION_MAP = /*[[${regionMap}]]*/ {};
    var SELECTED_SIGUNGU = /*[[${fSigungu}]]*/ '';
    var sidoSel = document.getElementById('sido');
    var sigunguSel = document.getElementById('sigungu');
    if (!sidoSel || !sigunguSel) return;

    function fillSigungu(sido, selected) {
        // '전체' 옵션 1개만 남기고 재구성.
        sigunguSel.innerHTML = '<option value="">전체</option>';
        var list = REGION_MAP[sido] || [];
        list.forEach(function (sg) {
            var opt = document.createElement('option');
            opt.value = sg;
            opt.textContent = sg;
            if (sg === selected) opt.selected = true;
            sigunguSel.appendChild(opt);
        });
    }

    // 초기 렌더 — 현재 선택된 시/도의 시군구 목록 + 기존 선택값 복원.
    fillSigungu(sidoSel.value, SELECTED_SIGUNGU);
    // 시/도 변경 시 시군구 목록 교체(선택 초기화).
    sidoSel.addEventListener('change', function () {
        fillSigungu(sidoSel.value, '');
    });
})();
</script>

<!-- 지도 제어 — TMap SDK는 layout head에서 파싱 초기에 로드된다. -->
<script th:if="${tmapAppKey != null and !tmapAppKey.isEmpty()}">
(function () {
    var modal = document.getElementById('mapModal');
    var openBtn = document.getElementById('mapPickBtn');
    if (!modal || !openBtn) return;

    var DEFAULT = { lat: 37.5665, lng: 126.9780 }; // 서울시청
    var THRESHOLD_M = 1000; // 이 값(m)을 넘는 측위 정확도는 신뢰하지 않고 수동 지정을 안내
    var map = null, marker = null, picked = null;

    // 세션에 기억된 사용자 지정 위치(지도 확정·내 주변 보기에서 저장). 네이버식 위치 사전 지정.
    function rememberedCoord() {
        try {
            var p = JSON.parse(sessionStorage.getItem('caregiverBoardGeo'));
            if (p && !isNaN(p.lat) && !isNaN(p.lng)) return { lat: p.lat, lng: p.lng };
        } catch (e) { /* 캐시 손상 무시 */ }
        return null;
    }

    function startCoord() {
        // 현재 정렬 좌표(URL) → 세션에 기억된 위치 → 기본값(서울시청) 순으로 지도 초기 중심을 정한다.
        var la = parseFloat(modal.getAttribute('data-lat'));
        var ln = parseFloat(modal.getAttribute('data-lng'));
        if (!isNaN(la) && !isNaN(ln)) return { lat: la, lng: ln };
        return rememberedCoord() || DEFAULT;
    }

    function initMap() {
        var c = startCoord();
        picked = c;
        // Tmapv2.Map은 width/height를 px 문자열로 받는다. 모달이 보인 뒤 컨테이너 실측값을 넘긴다
        // ('100%'는 레이아웃 타이밍에 따라 0px로 잡혀 지도가 로드돼도 안 보일 수 있음).
        var canvas = document.getElementById('mapCanvas');
        var w = canvas.clientWidth || 480;
        var h = canvas.clientHeight || 320;
        map = new Tmapv2.Map('mapCanvas', {
            center: new Tmapv2.LatLng(c.lat, c.lng),
            width: w + 'px', height: h + 'px', zoom: 14
        });
        marker = new Tmapv2.Marker({
            position: new Tmapv2.LatLng(c.lat, c.lng), map: map, draggable: true
        });
        map.addListener('click', function (e) {
            var ll = e.latLng;
            marker.setPosition(ll);
            picked = { lat: ll.lat(), lng: ll.lng() };
        });
        marker.addListener('dragend', function () {
            var ll = marker.getPosition();
            picked = { lat: ll.lat(), lng: ll.lng() };
        });
    }

    function openModal() {
        modal.classList.remove('hidden');
        // 지도는 보인 뒤 초기화해야 컨테이너 크기를 잡는다(숨김 상태 init 시 0px).
        // 모달 표시 직후엔 레이아웃이 아직 반영되지 않으므로 짧게 지연해 크기를 확정한 뒤 init.
        if (!map) {
            setTimeout(function () { waitForSdk(0); }, 60);
        }
    }
    // SDK는 비동기 동적 로드 — 준비될 때까지 잠깐 폴링하고, 끝내 실패하면 폴백 안내.
    function waitForSdk(tries) {
        if (window.Tmapv2) {
            initMap();
            return;
        }
        if (tries >= 40) { // 약 4초
            closeModal();
            var m = document.getElementById('geoMsg');
            if (m) {
                m.textContent = '지도를 불러오지 못했습니다. "내 주변 순으로 보기"를 이용해 주세요.';
                m.classList.remove('hidden');
            }
            return;
        }
        setTimeout(function () { waitForSdk(tries + 1); }, 100);
    }
    function closeModal() { modal.classList.add('hidden'); }

    function setMsg(text) {
        var m = document.getElementById('mapMsg');
        if (m) m.textContent = text;
    }

    // 지도 중심·마커·선택 좌표를 한 번에 이동(검색·현재위치 공용).
    function moveTo(lat, lng) {
        if (!map || !marker) return;
        var ll = new Tmapv2.LatLng(lat, lng);
        map.setCenter(ll);
        marker.setPosition(ll);
        picked = { lat: lat, lng: lng };
    }

    // 장소 검색 — 서버 프록시(/poi-search)로 좌표를 받아 첫 결과로 이동.
    function searchPoi() {
        var input = document.getElementById('poiSearch');
        var kw = input.value.trim();
        if (!kw) return;
        if (!map) { setMsg('지도가 아직 준비되지 않았습니다.'); return; }
        setMsg('검색 중...');
        fetch('/caregiver/board/poi-search?keyword=' + encodeURIComponent(kw))
            .then(function (r) { return r.json(); })
            .then(function (list) {
                if (!list || !list.length) { setMsg('검색 결과가 없습니다.'); return; }
                var p = list[0];
                moveTo(p.lat, p.lng);
                setMsg('"' + p.name + '" 위치로 이동했습니다.');
            })
            .catch(function () { setMsg('검색에 실패했습니다.'); });
    }

    // 현재 위치로 지도 이동.
    function myLocation() {
        if (!navigator.geolocation) { setMsg('이 브라우저는 위치 기능을 지원하지 않습니다.'); return; }
        setMsg('현재 위치 확인 중...');
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                var acc = Math.round(pos.coords.accuracy);
                // PC는 GPS가 없어 WiFi/IP 측위 오차가 km 단위로 큰 경우가 많다(네이버 지도도 PC에선
                // 수동 지정으로 우회). 정확도가 나쁘면 잘못된 곳으로 옮겨 오도하지 않고 수동 지정을 안내한다.
                if (acc > THRESHOLD_M) {
                    setMsg('현재 위치 정확도가 낮습니다(약 ' + acc + 'm). 지도를 클릭하거나 장소를 검색해 직접 지정해 주세요.');
                    return;
                }
                moveTo(pos.coords.latitude, pos.coords.longitude);
                setMsg('현재 위치로 이동했습니다. (정확도 약 ' + acc + 'm)');
            },
            function () { setMsg('현재 위치를 가져오지 못했습니다. 지도를 클릭하거나 장소를 검색해 직접 지정해 주세요.'); },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    openBtn.addEventListener('click', openModal);
    document.getElementById('mapClose').addEventListener('click', closeModal);
    document.getElementById('mapCancel').addEventListener('click', closeModal);
    document.getElementById('mapBackdrop').addEventListener('click', closeModal);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
    });
    document.getElementById('poiSearchBtn').addEventListener('click', searchPoi);
    document.getElementById('poiSearch').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); searchPoi(); }
    });
    document.getElementById('myLocBtn').addEventListener('click', myLocation);
    document.getElementById('mapConfirm').addEventListener('click', function () {
        if (!picked) return;
        // 사용자가 직접 지정한 위치를 세션에 기억 — 다음 지도 열기·내 주변 보기에서 재사용(사전 지정).
        sessionStorage.setItem('caregiverBoardGeo', JSON.stringify({ lat: picked.lat, lng: picked.lng }));
        // 위치 기반 사용 시 지역 필터(시/도·시군구)는 자동 해제(상호 배타). 키워드·서비스·날짜는 유지.
        var params = new URLSearchParams(window.location.search);
        params.delete('sido');
        params.delete('sigungu');
        params.set('lat', picked.lat);
        params.set('lng', picked.lng);
        params.set('page', '0');
        window.location.assign('/caregiver/board?' + params.toString());
    });
})();
</script>
</th:block>
</html>
