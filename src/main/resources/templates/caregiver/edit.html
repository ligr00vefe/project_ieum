<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 페이지 헤더 -->
    <div class="flex items-center gap-3 mb-6">
        <a th:href="@{/caregiver/mypage}" aria-label="마이페이지로 돌아가기"
           class="w-9 h-9 flex items-center justify-center rounded-xl bg-white border border-gray-100 shadow-sm text-gray-500 hover:text-teal-600 hover:border-teal-100 transition-all">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <div>
            <h1 class="text-lg font-extrabold text-gray-900">회원정보 수정</h1>
            <p class="text-xs text-gray-400 mt-0.5">활동지원사 프로필을 업데이트하세요</p>
        </div>
    </div>

    <!-- 성공 메시지 -->
    <div th:if="${successMessage}" role="status"
         class="mb-5 flex items-center gap-3 p-4 bg-green-50 border border-green-100 rounded-2xl">
        <svg class="w-5 h-5 text-green-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-sm text-green-700 font-medium" th:text="${successMessage}"></p>
    </div>

    <form th:action="@{/caregiver/mypage/edit}"
          method="post"
          enctype="multipart/form-data"
          th:object="${editDTO}"
          class="space-y-5">

        <!-- 기본 정보 -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
            <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2 mb-5">
                <span class="w-6 h-6 bg-teal-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </span>
                기본 정보
            </h2>
            <div class="space-y-4">
                <!-- 이름 -->
                <div class="space-y-1.5">
                    <label for="name" class="block text-sm font-semibold text-gray-700">이름 <span class="text-red-500">*</span></label>
                    <input type="text" id="name" th:field="*{name}" placeholder="홍길동"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
                </div>

                <!-- 이메일 (읽기전용) -->
                <div class="space-y-1.5">
                    <label class="block text-sm font-semibold text-gray-700">이메일</label>
                    <div class="flex items-center px-4 py-3 border border-gray-100 rounded-xl bg-gray-50">
                        <span class="text-sm text-gray-500" th:text="${userEmail}">caregiver@email.com</span>
                        <span class="ml-auto text-xs text-gray-400">변경 불가</span>
                    </div>
                </div>

                <!-- 전화번호 -->
                <div class="space-y-1.5">
                    <label for="phone" class="block text-sm font-semibold text-gray-700">전화번호 <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" th:field="*{phone}" placeholder="010-0000-0000"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
                </div>

                <!-- 생년월일 + 성별 -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label for="birthDate" class="block text-sm font-semibold text-gray-700">생년월일</label>
                        <input type="date" id="birthDate" th:field="*{birthDate}"
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
                    </div>
                    <div class="space-y-1.5">
                        <label for="gender" class="block text-sm font-semibold text-gray-700">성별</label>
                        <select id="gender" th:field="*{gender}"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all appearance-none bg-white">
                            <option value="">선택해주세요</option>
                            <option value="M">남성</option>
                            <option value="F">여성</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 자기소개 -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
            <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2 mb-5">
                <span class="w-6 h-6 bg-teal-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                    </svg>
                </span>
                자기소개
            </h2>
            <div class="space-y-4">
                <div class="space-y-1.5">
                    <label for="introShort" class="block text-sm font-semibold text-gray-700">한 줄 소개</label>
                    <input type="text" id="introShort" th:field="*{introShort}"
                           placeholder="나를 한 줄로 소개해주세요 (예: 따뜻하고 꼼꼼한 활동지원사입니다)"
                           maxlength="120"
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
                </div>
                <div class="space-y-1.5">
                    <label for="introLong" class="block text-sm font-semibold text-gray-700">상세 소개</label>
                    <textarea id="introLong" th:field="*{introLong}" rows="4"
                              placeholder="경력, 특기, 이용자와 함께하고 싶은 활동 등을 자유롭게 작성해주세요"
                              class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all resize-none"></textarea>
                </div>
            </div>
        </div>

        <!-- 자격증 -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
            <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2 mb-5">
                <span class="w-6 h-6 bg-teal-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                    </svg>
                </span>
                자격증 정보
            </h2>
            <div class="space-y-4">
                <!-- 보유 여부 -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <input type="radio" id="cert_yes" name="hasCertification" value="true"
                               th:checked="${editDTO.hasCertification == true}"
                               class="sr-only peer" onchange="toggleCertField(true)">
                        <label for="cert_yes"
                               class="flex items-center justify-center gap-2 w-full py-3.5 border-2 border-gray-200 rounded-xl cursor-pointer select-none transition-all hover:border-teal-300 peer-checked:border-teal-500 peer-checked:bg-teal-50 font-semibold text-sm text-gray-700 peer-checked:text-teal-700">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                            </svg>
                            예, 보유 중
                        </label>
                    </div>
                    <div class="relative">
                        <input type="radio" id="cert_no" name="hasCertification" value="false"
                               th:checked="${editDTO.hasCertification != true}"
                               class="sr-only peer" onchange="toggleCertField(false)">
                        <label for="cert_no"
                               class="flex items-center justify-center gap-2 w-full py-3.5 border-2 border-gray-200 rounded-xl cursor-pointer select-none transition-all hover:border-gray-300 peer-checked:border-gray-400 peer-checked:bg-gray-50 font-semibold text-sm text-gray-700">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                            아니오
                        </label>
                    </div>
                </div>

                <!-- 자격증 이름 입력 (보유 시) -->
                <div id="cert-field" th:classappend="${editDTO.hasCertification == true} ? '' : 'hidden'">
                    <div class="space-y-1.5">
                        <label for="certificationType" class="block text-sm font-semibold text-gray-700">자격증 종류</label>
                        <input type="text" id="certificationType" th:field="*{certificationType}"
                               placeholder="예: 사회복지사 2급"
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
                    </div>
                </div>

                <!-- 미보유 안내 -->
                <div id="no-cert-info" th:classappend="${editDTO.hasCertification == true} ? 'hidden' : ''">
                    <div class="p-4 bg-gray-50 border border-gray-100 rounded-xl">
                        <p class="text-sm text-gray-500 leading-relaxed">
                            자격증이 없어도 활동 가능합니다.<br>
                            <span class="text-gray-400 text-xs">단, 자격증 보유 시 매칭 우선순위가 높아집니다.</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 활동 정보 -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
            <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2 mb-5">
                <span class="w-6 h-6 bg-teal-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </span>
                활동 정보
            </h2>
            <div class="space-y-6">

                <!-- 경력 -->
                <div class="space-y-3">
                    <label class="block text-sm font-semibold text-gray-700">경력 <span class="text-red-500">*</span></label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                        <th:block th:each="exp,stat : ${ {'1년 미만','1-3년','3-5년','5년 이상'} }">
                            <div class="relative">
                                <input type="radio"
                                       th:id="${'exp_' + stat.index}"
                                       name="experience"
                                       th:value="${exp}"
                                       th:checked="${editDTO.experience == exp}"
                                       class="sr-only peer">
                                <label th:for="${'exp_' + stat.index}"
                                       class="flex items-center justify-center w-full py-3 border-2 border-gray-200 rounded-xl cursor-pointer select-none text-sm font-semibold text-gray-600 transition-all hover:border-teal-300 hover:text-teal-600 peer-checked:bg-teal-500 peer-checked:border-teal-500 peer-checked:text-white"
                                       th:text="${exp}">경력</label>
                            </div>
                        </th:block>
                    </div>
                </div>

                <!-- 가능 업무 -->
                <div class="space-y-3">
                    <label class="block text-sm font-semibold text-gray-700">
                        가능 업무 <span class="text-xs text-gray-400 font-normal ml-1">(복수 선택)</span>
                    </label>
                    <div class="flex flex-wrap gap-2.5">
                        <th:block th:each="cat,stat : ${ {'이동 보조','병원 동행','의사소통 보조','일상생활','장기 케어','야간 보호'} }">
                            <div class="relative">
                                <input type="checkbox"
                                       th:id="${'cat_' + stat.index}"
                                       name="serviceCategories"
                                       th:value="${cat}"
                                       th:checked="${editDTO.serviceCategories != null and #lists.contains(editDTO.serviceCategories, cat)}"
                                       class="sr-only peer">
                                <label th:for="${'cat_' + stat.index}"
                                       class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-gray-200 text-gray-700 text-sm font-medium cursor-pointer select-none transition-all hover:border-teal-300 peer-checked:bg-teal-500 peer-checked:border-teal-500 peer-checked:text-white"
                                       th:text="${cat}">업무</label>
                            </div>
                        </th:block>
                    </div>
                </div>

                <!-- 가능 시간대 -->
                <div class="space-y-3">
                    <label class="block text-sm font-semibold text-gray-700">
                        가능 시간대 <span class="text-xs text-gray-400 font-normal ml-1">(복수 선택)</span>
                    </label>
                    <div class="flex flex-wrap gap-2.5">
                        <th:block th:each="slot,stat : ${ {'오전 (09-12)','오후 (12-18)','저녁 (18-22)','주말','공휴일','야간'} }">
                            <div class="relative">
                                <input type="checkbox"
                                       th:id="${'time_' + stat.index}"
                                       name="availableTimeSlots"
                                       th:value="${slot}"
                                       th:checked="${editDTO.availableTimeSlots != null and #lists.contains(editDTO.availableTimeSlots, slot)}"
                                       class="sr-only peer">
                                <label th:for="${'time_' + stat.index}"
                                       class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-gray-200 text-gray-700 text-sm font-medium cursor-pointer select-none transition-all hover:border-teal-300 peer-checked:bg-teal-500 peer-checked:border-teal-500 peer-checked:text-white"
                                       th:text="${slot}">시간</label>
                            </div>
                        </th:block>
                    </div>
                </div>

                <!-- 활동 가능 지역 -->
                <div class="space-y-3">
                    <label class="block text-sm font-semibold text-gray-700">활동 가능 지역 <span class="text-red-500">*</span></label>

                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </div>
                        <input type="text" id="region-search"
                               placeholder="지역 검색 (예: 강남구, 마포구)"
                               autocomplete="off"
                               class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all"
                               oninput="filterRegions(this.value)">
                    </div>

                    <!-- 지역 목록 -->
                    <div id="region-list"
                         class="max-h-48 overflow-y-auto border border-gray-200 rounded-xl divide-y divide-gray-50 hidden">
                        <th:block th:each="region : ${regions}">
                            <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-teal-50 cursor-pointer transition-colors">
                                <input type="checkbox"
                                       name="regionIds"
                                       th:value="${region.id}"
                                       th:checked="${editDTO.regionIds != null and #lists.contains(editDTO.regionIds, region.id)}"
                                       class="w-4 h-4 rounded text-teal-500 border-gray-300 focus:ring-teal-500"
                                       onchange="updateSelectedRegions(this, [[${region.sido}]], [[${region.sigungu}]])">
                                <span class="text-sm text-gray-700">
                                    <span th:text="${region.sido}" class="text-gray-500"></span>
                                    <span th:text="${' ' + region.sigungu}" class="font-medium"></span>
                                </span>
                            </label>
                        </th:block>
                    </div>

                    <!-- 선택된 지역 태그 -->
                    <div id="selected-regions" class="flex flex-wrap gap-2 min-h-[2.5rem]">
                        <!-- 기존 선택 지역 태그 (서버에서 주입) -->
                        <th:block th:if="${regions != null}">
                            <th:block th:each="region : ${regions}">
                                <div th:if="${editDTO.regionIds != null and #lists.contains(editDTO.regionIds, region.id)}"
                                     th:id="${'region-tag-' + region.id}"
                                     class="flex items-center gap-1.5 px-3 py-1.5 bg-teal-500 text-white text-xs font-medium rounded-lg">
                                    <span th:text="${region.sido + ' ' + region.sigungu}"></span>
                                    <button type="button"
                                            th:onclick="|removeRegion('${region.id}', this)|"
                                            class="ml-0.5 w-3.5 h-3.5 flex items-center justify-center hover:bg-teal-400 rounded-full transition-colors">
                                        <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
                                        </svg>
                                    </button>
                                </div>
                            </th:block>
                        </th:block>
                        <div class="flex items-center gap-1.5 px-3 py-1.5 bg-teal-50 border border-teal-200 text-teal-700 text-xs font-medium rounded-lg"
                             id="region-placeholder"
                             th:classappend="${editDTO.regionIds != null and !#lists.isEmpty(editDTO.regionIds)} ? 'hidden' : ''">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            </svg>
                            지역을 검색해서 추가하세요
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 성향 태그 -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
            <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-teal-100 rounded-lg flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                    </svg>
                </span>
                나의 케어 스타일
            </h2>
            <p class="text-xs text-gray-400 mb-4 ml-8">이용자가 선택한 선호 성향과 비교하여 매칭률이 산출됩니다. (복수 선택 가능)</p>
            <div class="flex flex-wrap gap-2.5">
                <th:block th:if="${personalityTags != null and !#lists.isEmpty(personalityTags)}">
                    <th:block th:each="tag : ${personalityTags}">
                        <div class="relative">
                            <input type="checkbox"
                                   th:field="*{personalityTagIds}"
                                   th:value="${tag.id}"
                                   th:id="${'tag_' + tag.id}"
                                   class="sr-only peer">
                            <label th:for="${'tag_' + tag.id}"
                                   class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-gray-200 text-gray-700 text-sm font-medium cursor-pointer select-none transition-all hover:border-teal-300 peer-checked:bg-teal-500 peer-checked:border-teal-500 peer-checked:text-white"
                                   th:text="${tag.name}">태그</label>
                        </div>
                    </th:block>
                </th:block>
                <!-- fallback -->
                <th:block th:if="${personalityTags == null or #lists.isEmpty(personalityTags)}">
                    <th:block th:each="tagName,stat : ${ {'꼼꼼함','차분함','친화력','배려심','조용함','활발함','유머러스','책임감'} }">
                        <div class="relative">
                            <input type="checkbox" th:id="${'tag_s_' + stat.index}"
                                   name="personalityTagIds" th:value="${stat.index + 1}"
                                   class="sr-only peer">
                            <label th:for="${'tag_s_' + stat.index}"
                                   class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-gray-200 text-gray-700 text-sm font-medium cursor-pointer select-none transition-all hover:border-teal-300 peer-checked:bg-teal-500 peer-checked:border-teal-500 peer-checked:text-white"
                                   th:text="${tagName}">태그</label>
                        </div>
                    </th:block>
                </th:block>
            </div>
        </div>

        <!-- 저장 버튼 -->
        <div class="flex gap-3 pb-4">
            <a th:href="@{/caregiver/mypage}"
               class="flex-1 py-3.5 border-2 border-gray-200 text-gray-700 font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-gray-50 transition-all flex items-center justify-center">
                취소
            </a>
            <button type="submit"
                    class="flex-[2] py-3.5 bg-teal-500 text-white font-semibold text-sm rounded-xl hover:bg-teal-500 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 transition-all shadow-sm shadow-teal-100 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
                저장하기
            </button>
        </div>
    </form>
</section>

<script>

    function toggleCertField(hasCert) {
        document.getElementById('cert-field').classList.toggle('hidden', !hasCert);
        document.getElementById('no-cert-info').classList.toggle('hidden', hasCert);
    }

    function filterRegions(query) {
        const list = document.getElementById('region-list');
        const labels = list.querySelectorAll('label');
        const q = query.trim().toLowerCase();
        if (!q) { list.classList.add('hidden'); return; }
        list.classList.remove('hidden');
        labels.forEach(label => {
            label.style.display = label.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    }

    function updateSelectedRegions(checkbox, sido, sigungu) {
        const container = document.getElementById('selected-regions');
        const placeholder = document.getElementById('region-placeholder');
        const tagId = 'region-tag-' + checkbox.value;

        if (checkbox.checked) {
            if (placeholder) placeholder.classList.add('hidden');
            const tag = document.createElement('div');
            tag.id = tagId;
            tag.className = 'flex items-center gap-1.5 px-3 py-1.5 bg-teal-500 text-white text-xs font-medium rounded-lg';
            tag.innerHTML = `
                <span>${sido} ${sigungu}</span>
                <button type="button" onclick="removeRegion('${checkbox.value}', this)"
                        class="ml-0.5 w-3.5 h-3.5 flex items-center justify-center hover:bg-teal-400 rounded-full transition-colors">
                    <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>`;
            container.appendChild(tag);
        } else {
            const tag = document.getElementById(tagId);
            if (tag) tag.remove();
            checkPlaceholder();
        }
    }

    function removeRegion(value, btn) {
        const checkbox = document.querySelector(`input[name="regionIds"][value="${value}"]`);
        if (checkbox) checkbox.checked = false;
        btn.closest('div').remove();
        checkPlaceholder();
    }

    function checkPlaceholder() {
        const container = document.getElementById('selected-regions');
        const placeholder = document.getElementById('region-placeholder');
        const tags = container.querySelectorAll('[id^="region-tag-"]');
        if (tags.length === 0 && placeholder) placeholder.classList.remove('hidden');
    }
</script>
</th:block>
</html>
