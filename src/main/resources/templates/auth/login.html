<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('로그인')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>
<main class="mx-auto flex min-h-[calc(100vh-160px)] w-full max-w-md items-center px-4 py-10">
    <section class="w-full rounded-lg border border-indigo-100 bg-white p-6 shadow-sm">
        <p class="text-sm font-semibold text-indigo-700">다시 만나 반갑습니다</p>
        <h1 class="mt-2 text-2xl font-bold text-slate-950">로그인</h1>
        <p class="mt-2 text-sm text-slate-600">나의 상황과 너의 케어가 만나는 안전한 연결을 시작하세요.</p>

        <div th:if="${loginError}" class="mt-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
            이메일 또는 비밀번호를 확인해주세요.
        </div>
        <div th:if="${logoutMessage}" class="mt-4 rounded-md border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-700">
            안전하게 로그아웃되었습니다.
        </div>

        <form th:action="@{/login}" method="post" class="mt-6 space-y-4">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div>
                <label for="email" class="mb-1 block text-sm font-semibold text-slate-800">이메일</label>
                <input id="email" name="email" type="email" autocomplete="username" required class="w-full rounded-md border border-slate-300 px-3 py-3 text-base focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600">
            </div>
            <div>
                <label for="password" class="mb-1 block text-sm font-semibold text-slate-800">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-md border border-slate-300 px-3 py-3 text-base focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600">
            </div>
            <button type="submit" class="w-full rounded-md bg-indigo-700 px-4 py-3 font-semibold text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">로그인</button>
        </form>

        <p class="mt-5 text-center text-sm text-slate-600">
            아직 계정이 없나요?
            <a th:href="@{/register}" class="font-semibold text-indigo-700 underline-offset-4 hover:underline">회원가입</a>
        </p>
    </section>
</main>
</body>
</html>
