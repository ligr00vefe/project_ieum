<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">

    <!-- Top bar -->
    <div class="bg-white border-b border-gray-100 px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a th:href="@{/}" class="flex items-center gap-2.5 group">
                <div class="w-8 h-8 bg-teal-500 rounded-xl flex items-center justify-center group-hover:bg-teal-600 transition-colors">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
                    </svg>
                </div>
                <div class="leading-tight">
                    <div class="text-[14px] font-bold text-gray-900">이음</div>
                    <div class="text-[9px] text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
                </div>
            </a>
            <a th:href="@{/login}"
               class="text-sm text-gray-500 hover:text-indigo-600 transition-colors font-medium">
                로그인으로 돌아가기
            </a>
        </div>
    </div>

    <!-- Main -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-[420px]">

            <!-- Header text -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-extrabold text-gray-900 mb-2">비밀번호 찾기</h1>
                <p class="text-sm text-gray-500">가입한 이메일로 재설정 안내를 보내드려요</p>
            </div>

            <!-- Card -->
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">

                <!-- 안내(열거 방지: 가입 여부와 무관하게 동일) -->
                <div th:if="${sent}"
                     class="flex items-start gap-3 p-4 bg-green-50 border border-green-100 rounded-xl mb-6">
                    <svg class="w-4 h-4 text-green-500 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <div>
                        <p class="text-sm text-green-700 font-medium">입력하신 이메일이 가입되어 있다면 재설정 안내를 보냈습니다.</p>
                        <p class="text-xs text-green-600 mt-1">메일이 오지 않으면 스팸함을 확인하거나 잠시 후 다시 시도해 주세요.</p>
                    </div>
                </div>

                <!-- 개발용 재설정 링크(메일 인프라 전, app.password-reset.expose-link=true일 때만) -->
                <div th:if="${devResetLink}"
                     class="p-4 bg-amber-50 border border-amber-100 rounded-xl mb-6">
                    <p class="text-xs text-amber-700 font-semibold mb-1">[개발용] 재설정 링크</p>
                    <a th:href="${devResetLink}" class="text-xs text-amber-800 underline break-all" th:text="${devResetLink}">/password/reset?token=...</a>
                </div>

                <!-- Error message -->
                <div th:if="${errorMessage}"
                     class="flex items-center gap-3 p-4 bg-red-50 border border-red-100 rounded-xl mb-6">
                    <svg class="w-4 h-4 text-red-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p class="text-sm text-red-700 font-medium" th:text="${errorMessage}">오류가 발생했습니다.</p>
                </div>

                <form th:action="@{/password/forgot}" method="post" class="space-y-5" novalidate>
                    <div class="space-y-1.5">
                        <label for="email" class="block text-sm font-semibold text-gray-700">이메일</label>
                        <input type="email"
                               id="email"
                               name="email"
                               autocomplete="email"
                               placeholder="example@email.com"
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                               required>
                    </div>

                    <button type="submit"
                            class="w-full py-3.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl hover:bg-indigo-700 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all shadow-sm shadow-indigo-100">
                        재설정 링크 받기
                    </button>
                </form>
            </div>

            <!-- Bottom link -->
            <p class="text-center mt-6 text-sm text-gray-500">
                비밀번호가 기억나셨나요?
                <a th:href="@{/login}" class="text-indigo-600 font-semibold hover:underline ml-1">로그인</a>
            </p>
        </div>
    </main>
</body>
</html>
