<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 헤더 -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">문의 게시판</h1>
            <p class="text-sm text-gray-500 mt-1">궁금한 점을 남겨주시면 빠르게 답변 드리겠습니다.</p>
        </div>
        <a th:href="@{/inquiries/new}"
           class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            문의하기
        </a>
    </div>

    <!-- 플래시 메시지 -->
    <div th:if="${message}" class="mb-4 px-4 py-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-700" th:text="${message}"></div>
    <div th:if="${error}"   class="mb-4 px-4 py-3 rounded-xl bg-red-50  border border-red-200  text-sm text-red-600"  th:text="${error}"></div>

    <!-- 카테고리 필터 탭 -->
    <div class="flex items-center gap-2 mb-4 flex-wrap">
        <a th:href="@{/inquiries(page=0)}"
           th:classappend="${selectedCategory == null} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체</a>
        <th:block th:each="cat : ${categories}">
        <a th:href="@{/inquiries(category=${cat.name()}, page=0)}"
           th:text="${cat.label()}"
           th:classappend="${selectedCategory == cat.name()} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">카테고리</a>
        </th:block>
    </div>

    <!-- 목록 테이블 -->
    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-100 bg-slate-50">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">분류</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">제목</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">작성자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">등록일</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="inquiry : ${inquiries}">

                <!-- 비밀글 + 타인 글: 마스킹 -->
                <tr th:if="${inquiry.isSecret and inquiry.author.id != currentUserId and !isAdmin}" class="opacity-60">
                    <td class="px-5 py-3.5">
                        <span th:text="${inquiry.category.label()}" class="px-2 py-0.5 text-xs font-medium rounded-md bg-slate-100 text-slate-500">분류</span>
                    </td>
                    <td class="px-5 py-3.5">
                        <div class="flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            <span class="text-slate-400 italic text-sm">비밀글입니다.</span>
                        </div>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${inquiry.status.name() == 'PENDING' ? '답변 대기' : '답변 완료'}"
                              th:classappend="${inquiry.status.name() == 'PENDING'} ? 'bg-amber-50 text-amber-600' : 'bg-teal-50 text-teal-600'"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs" th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd')}">-</td>
                </tr>

                <!-- 정상 표시 -->
                <tr th:unless="${inquiry.isSecret and inquiry.author.id != currentUserId and !isAdmin}"
                    class="hover:bg-slate-50 transition-colors cursor-pointer"
                    th:onclick="|location.href='@{/inquiries/{id}(id=${inquiry.id})}'|">
                    <td class="px-5 py-3.5">
                        <span th:text="${inquiry.category.label()}" class="px-2 py-0.5 text-xs font-medium rounded-md bg-slate-100 text-slate-500">분류</span>
                    </td>
                    <td class="px-5 py-3.5">
                        <div class="flex items-center gap-1.5">
                            <svg th:if="${inquiry.isSecret}" class="w-3.5 h-3.5 text-slate-400 flex-shrink-0"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            <span class="font-medium text-slate-800 truncate max-w-xs" th:text="${inquiry.title}">제목</span>
                            <span th:if="${inquiry.author.id == currentUserId}"
                                  class="px-1.5 py-0.5 text-[10px] font-semibold bg-indigo-100 text-indigo-500 rounded-full flex-shrink-0">내 글</span>
                        </div>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs" th:text="${inquiry.author?.email ?: '-'}">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${inquiry.status.name() == 'PENDING' ? '답변 대기' : '답변 완료'}"
                              th:classappend="${inquiry.status.name() == 'PENDING'} ? 'bg-amber-50 text-amber-600' : 'bg-teal-50 text-teal-600'"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs" th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd')}">-</td>
                </tr>

                </th:block>
                <tr th:if="${#lists.isEmpty(inquiries)}">
                    <td colspan="5" class="px-5 py-12 text-center text-sm text-slate-400">문의가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div th:if="${inquiryPage.totalPages > 1}" class="flex items-center justify-center gap-1 mt-6">

        <!-- 이전 -->
        <a th:if="${!inquiryPage.first}"
           th:href="@{/inquiries(category=${selectedCategory}, page=${currentPage - 1})}"
           class="px-3 py-2 text-sm text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <span th:if="${inquiryPage.first}" class="px-3 py-2 text-slate-300">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </span>

        <!-- 페이지 번호 -->
        <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
            <a th:if="${i != currentPage}"
               th:href="@{/inquiries(category=${selectedCategory}, page=${i})}"
               th:text="${i + 1}"
               class="px-3.5 py-2 text-sm text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">1</a>
            <span th:if="${i == currentPage}"
                  th:text="${i + 1}"
                  class="px-3.5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg">1</span>
        </th:block>

        <!-- 다음 -->
        <a th:if="${!inquiryPage.last}"
           th:href="@{/inquiries(category=${selectedCategory}, page=${currentPage + 1})}"
           class="px-3 py-2 text-sm text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </a>
        <span th:if="${inquiryPage.last}" class="px-3 py-2 text-slate-300">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </span>

    </div>

</section>
</th:block>
</html>
