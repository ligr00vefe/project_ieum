<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 히어로 헤더 -->
    <div class="bg-indigo-50 rounded-3xl p-7 border border-indigo-100 relative overflow-hidden mb-6">
        <div class="absolute -top-6 -right-6 w-32 h-32 bg-indigo-100/50 rounded-full"></div>
        <div class="absolute -bottom-8 right-20 w-20 h-20 bg-indigo-100/30 rounded-full"></div>
        <div class="relative flex items-center justify-between">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 bg-indigo-100 rounded-xl flex items-center justify-center">
                        <svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                        </svg>
                    </div>
                    <span class="text-indigo-400 text-xs font-semibold uppercase tracking-wide">고객 지원</span>
                </div>
                <h1 class="text-2xl font-extrabold mb-1 text-indigo-900">문의 게시판</h1>
                <p class="text-indigo-400 text-sm">궁금한 점을 남겨주시면 빠르게 답변 드리겠습니다.</p>
            </div>
            <a th:href="@{/inquiries/new}"
               class="flex-shrink-0 flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                문의하기
            </a>
        </div>
    </div>

    <!-- 플래시 메시지 -->
    <div th:if="${message}" class="mb-4 px-4 py-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-700" th:text="${message}"></div>
    <div th:if="${error}"   class="mb-4 px-4 py-3 rounded-xl bg-red-50  border border-red-200  text-sm text-red-600"  th:text="${error}"></div>

    <!-- 검색창 -->
    <form th:action="@{/inquiries}" method="get" class="flex items-center gap-2 mb-4">
        <input type="hidden" name="category" th:value="${selectedCategory}"/>
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="제목으로 검색..."
               class="flex-1 px-4 py-2.5 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <button type="submit"
                class="px-4 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all">
            검색
        </button>
        <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
           th:href="@{/inquiries(category=${selectedCategory})}"
           class="px-4 py-2.5 text-sm font-semibold text-gray-500 border border-line-strong rounded-xl hover:bg-surface-muted transition-all">
            초기화
        </a>
    </form>

    <!-- 카테고리 필터 -->
    <div class="flex items-center gap-2 mb-5 flex-wrap">
        <a th:href="@{/inquiries(page=0)}"
           th:classappend="${selectedCategory == null} ? 'bg-indigo-100 text-indigo-700' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-muted'"
           class="px-4 py-2 rounded-xl text-sm font-semibold transition-all">전체</a>
        <th:block th:each="cat : ${categories}">
            <a th:href="@{/inquiries(category=${cat.name()}, page=0)}"
               th:text="${cat.label()}"
               th:classappend="${selectedCategory == cat.name()} ? 'bg-indigo-100 text-indigo-700' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-muted'"
               class="px-4 py-2 rounded-xl text-sm font-semibold transition-all">카테고리</a>
        </th:block>
    </div>

    <!-- 문의 목록 카드 -->
    <div class="rounded-2xl border border-line-strong overflow-hidden bg-surface">

        <th:block th:each="inquiry, iter : ${inquiries}">

            <!-- 비밀글 + 타인 글: 마스킹 -->
            <div th:if="${inquiry.isSecret and inquiry.author.id != currentUserId and !isAdmin}"
                 th:classappend="${!iter.last} ? 'border-b border-line-strong'"
                 class="px-5 py-4 flex items-center gap-4 bg-surface-muted">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span th:text="${inquiry.category.label()}"
                              class="px-2 py-0.5 bg-gray-200 text-gray-500 text-xs font-medium rounded-md">분류</span>
                        <span class="px-2 py-0.5 bg-gray-200 text-gray-400 text-xs font-medium rounded-md flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            비밀글
                        </span>
                    </div>
                    <p class="text-sm font-medium text-gray-400 italic">비밀글입니다.</p>
                </div>
                <div class="flex-shrink-0 text-right">
                    <span th:text="${inquiry.status.name() == 'PENDING' ? '답변 대기' : '답변 완료'}"
                          th:classappend="${inquiry.status.name() == 'PENDING'} ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-teal-50 text-teal-600 border-teal-200'"
                          class="px-2.5 py-1 text-xs font-semibold rounded-full border">상태</span>
                    <p class="text-xs text-gray-400 mt-1.5" th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd')}">날짜</p>
                </div>
            </div>

            <!-- 정상 표시 -->
            <a th:unless="${inquiry.isSecret and inquiry.author.id != currentUserId and !isAdmin}"
               th:href="@{/inquiries/{id}(id=${inquiry.id})}"
               th:classappend="${!iter.last} ? 'border-b border-line-strong'"
               class="flex items-center gap-4 px-5 py-4 hover:bg-indigo-50/50 transition-colors group">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span th:text="${inquiry.category.label()}"
                              class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[11px] font-semibold rounded-md border border-indigo-100">분류</span>
                        <span th:if="${inquiry.isSecret}"
                              class="px-2 py-0.5 bg-surface-hover text-gray-500 text-[11px] font-medium rounded-md flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            비밀글
                        </span>
                        <span th:if="${inquiry.author.id == currentUserId}"
                              class="px-1.5 py-0.5 bg-indigo-100 text-indigo-600 text-[10px] font-bold rounded-md">내 글</span>
                    </div>
                    <p class="text-sm font-semibold text-ink truncate group-hover:text-indigo-600 transition-colors"
                       th:text="${inquiry.title}">제목</p>
                    <p class="text-xs text-gray-400 mt-0.5" th:text="${inquiry.author?.email ?: '-'}">작성자</p>
                </div>
                <div class="flex-shrink-0 text-right ml-4">
                    <span th:text="${inquiry.status.name() == 'PENDING' ? '답변 대기' : '답변 완료'}"
                          th:classappend="${inquiry.status.name() == 'PENDING'} ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-teal-50 text-teal-600 border-teal-200'"
                          class="px-2.5 py-1 text-xs font-semibold rounded-full border whitespace-nowrap">상태</span>
                    <p class="text-xs text-gray-400 mt-1.5 whitespace-nowrap" th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd')}">날짜</p>
                </div>
                <svg class="w-4 h-4 text-gray-300 group-hover:text-indigo-400 flex-shrink-0 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </a>

        </th:block>

        <!-- 빈 상태 -->
        <div th:if="${#lists.isEmpty(inquiries)}" class="py-16 text-center">
            <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7 text-indigo-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
            </div>
            <p class="text-sm font-semibold text-gray-500">문의 내역이 없어요</p>
            <p class="text-xs text-gray-400 mt-1 mb-4">궁금한 점이 있으시면 문의를 남겨주세요.</p>
            <a th:href="@{/inquiries/new}"
               class="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                문의하기
            </a>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, '/inquiries?' + (selectedCategory != null ? 'category=' + selectedCategory + '&' : ''))}"></div>

</section>
</th:block>
</html>
