<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">

<!-- CKEditor 5 v41 -->
<link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.css">
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<style>
    .ck-editor__editable { min-height: 360px; }
    .ck-content img { max-width: 100%; height: auto; }
</style>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 브레드크럼 -->
    <nav aria-label="breadcrumb">
        <ol class="flex items-center gap-2 text-sm text-gray-400 mb-6 list-none p-0 m-0">
            <li><a th:href="@{/inquiries}" class="hover:text-indigo-600 transition-colors">문의 게시판</a></li>
            <li aria-hidden="true"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li><span class="text-gray-600 font-medium" aria-current="page">문의하기</span></li>
        </ol>
    </nav>

    <form id="inquiryForm" th:action="@{/inquiries/new}" th:object="${form}" method="post" class="flex flex-col gap-4">

        <!-- 카테고리 + 비밀글 -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm px-5 py-4">
            <div class="flex items-center gap-6 flex-wrap">
                <div class="flex items-center gap-2">
                    <label for="category" class="text-sm font-semibold text-gray-700 whitespace-nowrap">분류</label>
                    <select id="category" th:field="*{category}"
                            class="text-sm border border-gray-200 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition bg-white">
                        <option value="" disabled>선택하세요</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.name()}"
                                th:text="${cat.label()}">카테고리</option>
                    </select>
                    <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-xs text-red-500"></p>
                </div>
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" th:field="*{secret}"
                           class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-300 cursor-pointer">
                    <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <span class="text-sm font-medium text-gray-600">비밀글</span>
                </label>
            </div>
        </div>

        <!-- 제목 -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm px-5 py-4">
            <label for="title" class="sr-only">제목</label>
            <input type="text" id="title" th:field="*{title}" maxlength="200"
                   placeholder="제목을 입력하세요"
                   class="w-full text-base font-semibold text-gray-900 placeholder-gray-300 bg-transparent focus:outline-none border-none">
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1.5 text-xs text-red-500" role="alert"></p>
        </div>

        <!-- 내용 (CKEditor) -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">내용</p>
            <div id="ckEditorTarget"></div>
            <textarea id="bodyTextarea" th:field="*{body}" class="hidden"></textarea>
            <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}" class="mt-1.5 text-xs text-red-500"></p>
        </div>

        <!-- 하단 버튼 -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm px-5 py-4 flex items-center justify-end gap-2">
            <a th:href="@{/inquiries}"
               class="px-4 py-2 text-sm font-medium text-gray-600 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                취소
            </a>
            <button type="submit"
                    class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm shadow-indigo-100">
                등록
            </button>
        </div>

    </form>

</section>

<script th:inline="javascript">
(function () {
    const csrfToken  = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';
    const initialData = document.getElementById('bodyTextarea').value || '';

    function UploadAdapterPlugin(editor) {
        editor.plugins.get('FileRepository').createUploadAdapter = (loader) => ({
            upload() {
                return loader.file.then(file => new Promise((resolve, reject) => {
                    const fd = new FormData();
                    fd.append('upload', file);
                    fetch('/inquiries/editor-image', {
                        method: 'POST',
                        headers: { [csrfHeader]: csrfToken },
                        body: fd
                    })
                    .then(r => r.ok ? r.json() : Promise.reject('업로드 실패'))
                    .then(data => resolve({ default: data.url }))
                    .catch(reject);
                }));
            },
            abort() {}
        });
    }

    ClassicEditor.create(document.getElementById('ckEditorTarget'), {
        extraPlugins: [UploadAdapterPlugin],
        toolbar: {
            items: [
                'heading', '|',
                'bold', 'italic', '|',
                'bulletedList', 'numberedList', '|',
                'blockQuote', 'link', '|',
                'uploadImage', '|',
                'undo', 'redo'
            ]
        },
        image: {
            toolbar: ['imageStyle:alignLeft', 'imageStyle:alignCenter', 'imageStyle:alignRight', '|', 'resizeImage']
        },
        initialData
    }).then(editor => {
        document.getElementById('inquiryForm').addEventListener('submit', () => {
            document.getElementById('bodyTextarea').value = editor.getData();
        });
    }).catch(err => {
        console.error('CKEditor 초기화 오류:', err);
    });
})();
</script>

</th:block>
</html>
