<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<section class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 브레드크럼 -->
    <div class="flex items-center gap-3 mb-5">
        <a th:href="@{/inquiries/{id}(id=${inquiry.id})}"
           class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            문의 상세
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-sm font-medium text-slate-700">수정</span>
    </div>

    <form th:action="@{/inquiries/{id}/edit(id=${inquiry.id})}" th:object="${form}" method="post" class="flex flex-col gap-4">

        <!-- 카테고리 + 비밀글 -->
        <div class="bg-white rounded-2xl border border-slate-100 px-5 py-4">
            <div class="flex items-center gap-6 flex-wrap">
                <div class="flex items-center gap-2">
                    <label for="category" class="text-sm font-medium text-slate-600 whitespace-nowrap">분류</label>
                    <select id="category" th:field="*{category}"
                            class="text-sm border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition bg-white">
                        <option th:each="cat : ${categories}"
                                th:value="${cat.name()}"
                                th:text="${cat.label()}">카테고리</option>
                    </select>
                    <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}"
                       class="text-xs text-red-500"></p>
                </div>
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" th:field="*{secret}"
                           class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-300 cursor-pointer">
                    <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <span class="text-sm font-medium text-slate-600">비밀글</span>
                </label>
            </div>
        </div>

        <!-- 제목 -->
        <div class="bg-white rounded-2xl border border-slate-100 px-5 py-4">
            <input type="text" th:field="*{title}" maxlength="200"
                   placeholder="제목을 입력하세요"
                   class="w-full text-sm font-medium text-slate-900 placeholder-slate-300 bg-transparent focus:outline-none border-none">
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}"
               class="mt-1.5 text-xs text-red-500"></p>
        </div>

        <!-- 본문 -->
        <div class="bg-white rounded-2xl border border-slate-100 p-5">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">내용</h3>
            <textarea th:field="*{body}" rows="10"
                      placeholder="문의 내용을 자세히 입력해주세요"
                      class="w-full text-sm text-slate-800 placeholder-slate-300 bg-transparent focus:outline-none border-none resize-none leading-relaxed"></textarea>
            <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}"
               class="mt-1.5 text-xs text-red-500"></p>
        </div>

        <!-- 하단 버튼 -->
        <div class="bg-white rounded-2xl border border-slate-100 px-5 py-4 flex items-center justify-end gap-2">
            <a th:href="@{/inquiries/{id}(id=${inquiry.id})}"
               class="px-4 py-2 text-sm font-medium text-slate-600 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
                취소
            </a>
            <button type="submit"
                    class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm shadow-indigo-100">
                수정 완료
            </button>
        </div>

    </form>

</section>
</th:block>
</html>
