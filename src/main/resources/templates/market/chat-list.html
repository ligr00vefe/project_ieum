<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('마켓 채팅 - 이음마켓')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>

<main class="mx-auto w-full max-w-2xl px-4 py-6 sm:px-6 lg:px-8">

    <div class="mb-5">
        <p class="text-sm font-semibold text-orange-500">이음 마켓</p>
        <h1 class="mt-1 text-2xl font-bold">마켓 채팅</h1>
    </div>

    <section class="space-y-2">
        <a th:each="chat : ${chats.content}"
           th:href="@{/market/chat/{id}(id=${chat.id})}"
           class="flex items-center gap-4 rounded-2xl border border-slate-100 bg-white p-4 shadow-sm hover:shadow-md transition-all block">

            <div class="w-14 h-14 rounded-xl bg-slate-100 overflow-hidden flex-shrink-0 flex items-center justify-center text-slate-300">
                <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14"/>
                </svg>
            </div>

            <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                        <p class="text-xs text-slate-400 truncate" th:text="${chat.post.title}">상품명</p>
                        <p class="text-sm font-semibold text-slate-800 truncate"
                           th:text="${chat.seller.id == currentUserId} ? ${chat.buyer.email} : ${chat.seller.email}">
                            상대방
                        </p>
                    </div>
                    <span class="text-xs rounded-lg px-2 py-1 font-semibold flex-shrink-0"
                          th:text="${chat.post.status.name() == 'SOLD'} ? '거래완료' : (${chat.post.status.name() == 'RESERVED'} ? '예약중' : '판매중')"
                          th:classappend="${chat.post.status.name() == 'SOLD'} ? 'bg-slate-100 text-slate-500'
                                        : (${chat.post.status.name() == 'RESERVED'} ? 'bg-amber-100 text-amber-700'
                                        : 'bg-green-100 text-green-700')">판매중</span>
                </div>
                <p class="mt-1 text-xs text-slate-400 truncate"
                   th:text="${chat.lastMessageAt != null} ? ${#temporals.format(chat.lastMessageAt, 'MM.dd HH:mm')} : ''"></p>
            </div>
        </a>

        <div th:if="${chats.empty}"
             class="rounded-2xl border border-dashed border-slate-200 bg-white p-10 text-center text-slate-400">
            <p class="font-semibold mb-1">진행 중인 채팅이 없습니다.</p>
            <a th:href="@{/market}" class="text-sm text-orange-500 hover:underline">마켓 둘러보기 →</a>
        </div>
    </section>
</main>
</body>
</html>
