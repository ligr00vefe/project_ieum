<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('마켓 채팅 - 이음마켓')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>

<main class="mx-auto w-full max-w-2xl px-4 py-6 sm:px-6 lg:px-8">

    <div class="mb-5">
        <p class="text-sm font-semibold text-orange-500">이음 마켓</p>
        <h1 class="mt-1 text-2xl font-bold">마켓 채팅</h1>
    </div>

    <section class="space-y-2">
        <a th:each="chat : ${chats.content}"
           th:href="@{/market/chat/{id}(id=${chat.chatId})}"
           class="flex items-center gap-3 rounded-2xl border border-slate-100 bg-white p-4 shadow-sm hover:shadow-md transition-all block">

            <!-- 상품 썸네일 -->
            <div class="w-16 h-16 rounded-xl bg-slate-100 overflow-hidden flex-shrink-0 flex items-center justify-center text-slate-300">
                <img th:if="${chat.postThumbnailUrl != null}"
                     th:src="${chat.postThumbnailUrl}"
                     th:alt="${chat.postTitle}"
                     class="w-full h-full object-cover">
                <svg th:unless="${chat.postThumbnailUrl != null}"
                     class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </div>

            <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2 mb-1">
                    <!-- 상품명 + 상태 배지 -->
                    <p class="text-xs font-semibold text-slate-700 truncate" th:text="${chat.postTitle}">상품명</p>
                    <span class="text-[11px] rounded-full px-2 py-0.5 font-semibold flex-shrink-0 whitespace-nowrap"
                          th:text="${chat.postStatusLabel}"
                          th:classappend="${chat.postStatusLabel == '판매완료'} ? 'bg-slate-100 text-slate-500'
                                        : (${chat.postStatusLabel == '예약중'} ? 'bg-amber-100 text-amber-700'
                                        : 'bg-green-100 text-green-700')">판매중</span>
                </div>
                <!-- 상대방 이름 -->
                <p class="text-sm font-bold text-slate-800 truncate" th:text="${chat.opponentEmail}">상대방</p>
                <!-- 마지막 메시지 + 시각 -->
                <div class="flex items-center justify-between mt-1 gap-2">
                    <p class="text-xs text-slate-400 truncate"
                       th:text="${chat.lastMessage != null} ? ${chat.lastMessage} : '대화를 시작해보세요'">메시지</p>
                    <p class="text-[11px] text-slate-300 flex-shrink-0"
                       th:if="${chat.lastMessageAt != null}"
                       th:text="${#temporals.format(chat.lastMessageAt, 'MM.dd HH:mm')}">시각</p>
                </div>
            </div>
        </a>

        <div th:if="${chats.empty}"
             class="rounded-2xl border border-dashed border-slate-200 bg-white p-10 text-center text-slate-400">
            <p class="font-semibold mb-1">진행 중인 채팅이 없습니다.</p>
            <a th:href="@{/market}" class="text-sm text-orange-500 hover:underline">마켓 둘러보기 →</a>
        </div>
    </section>
</main>
</body>
</html>
