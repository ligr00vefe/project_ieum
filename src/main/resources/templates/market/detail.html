<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('상품 상세 - 이음마켓')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>

<main class="mx-auto w-full max-w-4xl px-4 py-6 sm:px-6 lg:px-8">

    <div th:if="${message}" th:text="${message}"
         class="mb-4 rounded-xl border border-orange-200 bg-orange-50 px-4 py-3 text-sm text-orange-800"></div>

    <div class="grid gap-6 lg:grid-cols-[1fr_320px]">

        <!-- 왼쪽: 이미지 슬라이드 + 상품 정보 -->
        <div class="space-y-5">

            <!-- 이미지 슬라이드 -->
            <div class="rounded-2xl overflow-hidden bg-slate-100 relative" th:if="${!images.isEmpty()}">
                <div id="slideContainer" class="relative aspect-[4/3]">
                    <div th:each="img, stat : ${images}"
                         th:attr="data-slide=${stat.index}"
                         class="slide absolute inset-0 transition-opacity duration-300"
                         th:classappend="${stat.first} ? 'opacity-100' : 'opacity-0 pointer-events-none'">
                        <img th:src="${img.imageUrl}" th:alt="${post.title}"
                             class="w-full h-full object-contain bg-slate-100">
                    </div>
                </div>
                <button th:if="${images.size() > 1}" onclick="prevSlide()"
                        class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/40 hover:bg-black/60 text-white rounded-full flex items-center justify-center transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <button th:if="${images.size() > 1}" onclick="nextSlide()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/40 hover:bg-black/60 text-white rounded-full flex items-center justify-center transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                <div th:if="${images.size() > 1}" class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5">
                    <button th:each="img, stat : ${images}"
                            th:attr="data-dot=${stat.index}"
                            th:onclick="'goToSlide(' + ${stat.index} + ')'"
                            class="dot w-2 h-2 rounded-full transition-all"
                            th:classappend="${stat.first} ? 'bg-white' : 'bg-white/50'"></button>
                </div>
                <div th:if="${images.size() > 1}"
                     class="absolute top-3 right-3 bg-black/50 text-white text-xs px-2 py-1 rounded-lg">
                    <span id="slideCounter">1</span> / <span th:text="${images.size()}">5</span>
                </div>
            </div>

            <!-- 이미지 없을 때 -->
            <div th:if="${images.isEmpty()}"
                 class="rounded-2xl bg-slate-100 aspect-[4/3] flex items-center justify-center text-slate-300">
                <svg class="w-20 h-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </div>

            <!-- 상품 정보 -->
            <div class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-slate-400" th:text="${post.categoryName}">전자기기</span>
                    <span class="rounded-lg px-2.5 py-1 text-xs font-bold"
                          th:text="${post.statusLabel}"
                          th:classappend="${post.status.name() == 'ACTIVE'} ? 'bg-green-100 text-green-700'
                                        : (${post.status.name() == 'RESERVED'} ? 'bg-amber-100 text-amber-700'
                                        : 'bg-slate-100 text-slate-500')">판매중</span>
                </div>
                <h1 class="text-xl font-bold text-slate-900" th:text="${post.title}">상품명</h1>
                <p class="mt-2 text-2xl font-bold text-orange-500"
                   th:text="${#numbers.formatInteger(post.price, 1, 'COMMA') + '원'}">10,000원</p>
                <div class="mt-3 flex items-center gap-3 text-sm text-slate-400">
                    <span>📍 <span th:text="${post.sigungu}">강남구</span></span>
                    <span>·</span>
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2024.01.01</span>
                    <span>·</span>
                    <span>채팅 <span th:text="${post.chatCount}">0</span></span>
                </div>
                <div th:if="${post.description != null and !post.description.isEmpty()}"
                     class="mt-5 pt-5 border-t border-slate-100">
                    <p class="whitespace-pre-line text-sm leading-7 text-slate-700"
                       th:text="${post.description}">상품 설명</p>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 판매자 정보 + 액션 버튼 -->
        <aside class="space-y-4">

            <!-- 판매자 카드 -->
            <div class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm">
                <h2 class="text-sm font-semibold text-slate-500 mb-3">판매자 정보</h2>
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 font-bold text-lg"
                         th:text="${post.sellerEmail.substring(0,1).toUpperCase()}">A</div>
                    <div>
                        <p class="font-semibold text-slate-800" th:text="${post.sellerEmail}">user@example.com</p>
                        <p class="text-xs text-slate-400">이음 마켓 판매자</p>
                    </div>
                </div>
            </div>

            <!-- 판매자 관리 버튼 -->
            <div th:if="${isSeller}" class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm space-y-2">
                <p class="text-sm font-semibold text-slate-600 mb-3">게시글 관리</p>
                <form th:if="${post.status.name() == 'ACTIVE'}"
                      th:action="@{/market/{id}/reserve(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="w-full rounded-xl border border-amber-300 py-2.5 text-sm font-semibold text-amber-600 hover:bg-amber-50 transition-all">
                        예약중으로 변경
                    </button>
                </form>
                <form th:if="${post.status.name() == 'RESERVED'}"
                      th:action="@{/market/{id}/cancel-reserve(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="w-full rounded-xl border border-slate-200 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-all">
                        예약 취소
                    </button>
                </form>
                <a th:href="@{/market/{id}/edit(id=${post.id})}"
                   class="block w-full rounded-xl border border-slate-200 py-2.5 text-center text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-all">
                    수정하기
                </a>
                <form th:action="@{/market/{id}/remove(id=${post.id})}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="w-full rounded-xl border border-red-100 py-2.5 text-sm font-semibold text-red-500 hover:bg-red-50 transition-all">
                        삭제하기
                    </button>
                </form>
            </div>

            <!-- 구매자 채팅 버튼 -->
            <div th:if="${!isSeller and currentUser != null}"
                 class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500 mb-3">관심있는 상품이라면 판매자에게 채팅을 보내보세요.</p>
                <form th:action="@{/market/{id}/chat(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            th:disabled="${post.status.name() == 'SOLD' or post.status.name() == 'REMOVED'}"
                            class="w-full rounded-xl bg-orange-500 py-3 text-sm font-bold text-white hover:bg-orange-600 transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        💬 채팅하기
                    </button>
                </form>
            </div>

            <!-- 비로그인 -->
            <div th:if="${currentUser == null}"
                 class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm text-center">
                <p class="text-sm text-slate-500 mb-3">채팅을 하려면 로그인이 필요합니다.</p>
                <a th:href="@{/login}"
                   class="block w-full rounded-xl bg-orange-500 py-2.5 text-sm font-bold text-white hover:bg-orange-600 transition-all">
                    로그인하기
                </a>
            </div>

            <a th:href="@{/market}"
               class="block text-center text-sm text-slate-400 hover:text-slate-600 transition-colors">
                ← 목록으로
            </a>
        </aside>
    </div>
</main>

<script th:inline="javascript">
const TOTAL_SLIDES = /*[[${images.size()}]]*/ 0;
let currentSlide = 0;

function goToSlide(idx) {
    if (TOTAL_SLIDES <= 1) return;
    document.querySelector(`.slide[data-slide="${currentSlide}"]`)?.classList.replace('opacity-100', 'opacity-0');
    document.querySelector(`.slide[data-slide="${currentSlide}"]`)?.classList.add('pointer-events-none');
    document.querySelector(`.dot[data-dot="${currentSlide}"]`)?.classList.replace('bg-white', 'bg-white/50');
    currentSlide = idx;
    document.querySelector(`.slide[data-slide="${currentSlide}"]`)?.classList.replace('opacity-0', 'opacity-100');
    document.querySelector(`.slide[data-slide="${currentSlide}"]`)?.classList.remove('pointer-events-none');
    document.querySelector(`.dot[data-dot="${currentSlide}"]`)?.classList.replace('bg-white/50', 'bg-white');
    const counter = document.getElementById('slideCounter');
    if (counter) counter.textContent = currentSlide + 1;
}
function prevSlide() { goToSlide((currentSlide - 1 + TOTAL_SLIDES) % TOTAL_SLIDES); }
function nextSlide() { goToSlide((currentSlide + 1) % TOTAL_SLIDES); }
</script>
</body>
</html>
