<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
<style>
/* 라이트박스 열릴 때 배경 어둡게 */
.glightbox-open { overflow: hidden; }
.gslide-image img { max-height: 90vh; object-fit: contain; }
/* 메인 슬라이드 이미지에 커서 포인터 */
.slide-link { display:block; width:100%; height:100%; cursor:zoom-in; }
</style>
<div class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">

    <div th:if="${message}" th:text="${message}"
         class="mb-4 rounded-xl border border-orange-200 bg-orange-50 px-4 py-3 text-sm text-orange-800"></div>

    <!-- 상단: 이미지(좌) + 판매자/액션(우) — 50:50 -->
    <div class="grid gap-6 lg:grid-cols-2">

        <!-- 왼쪽: 이미지 슬라이더 -->
        <div class="space-y-2">

            <!-- 이미지 슬라이더 -->
            <div th:if="${!images.isEmpty()}" class="space-y-2">
                <!-- 메인 슬라이드 -->
                <div class="rounded-2xl overflow-hidden bg-slate-100 relative">
                    <div class="relative aspect-[4/3]">
                        <div th:each="img, stat : ${images}"
                             th:attr="data-slide=${stat.index}"
                             class="slide absolute inset-0 transition-opacity duration-300"
                             th:classappend="${stat.first} ? 'opacity-100' : 'opacity-0 pointer-events-none'">
                            <a th:href="${img.imageUrl}"
                               class="glightbox slide-link"
                               data-gallery="market-gallery"
                               th:attr="data-glightbox=${'title=' + post.title}">
                                <img th:src="${img.imageUrl}" th:alt="${post.title}"
                                     class="w-full h-full object-contain bg-slate-100">
                            </a>
                        </div>
                    </div>
                    <!-- 화살표: 이미지 2개 이상일 때만 -->
                    <button th:if="${images.size() > 1}" onclick="prevSlide()"
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/40 hover:bg-black/60 text-white rounded-full flex items-center justify-center transition-all z-10">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <button th:if="${images.size() > 1}" onclick="nextSlide()"
                            class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/40 hover:bg-black/60 text-white rounded-full flex items-center justify-center transition-all z-10">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                    <!-- 카운터: 2개 이상일 때만 -->
                    <div th:if="${images.size() > 1}"
                         class="absolute top-3 right-3 bg-black/50 text-white text-xs px-2 py-1 rounded-lg z-10">
                        <span id="slideCounter">1</span> / <span th:text="${images.size()}">1</span>
                    </div>
                </div>
                <!-- 썸네일 탭: 2개 이상일 때만 -->
                <div th:if="${images.size() > 1}" class="flex gap-2 overflow-x-auto pb-1">
                    <button th:each="img, stat : ${images}"
                            th:attr="data-thumb=${stat.index}"
                            th:onclick="'goToSlide(' + ${stat.index} + ')'"
                            class="thumb flex-shrink-0 w-16 h-16 rounded-xl overflow-hidden border-2 transition-all"
                            th:classappend="${stat.first} ? 'border-orange-400' : 'border-transparent opacity-60'">
                        <img th:src="${img.imageUrl}" th:alt="${post.title}"
                             class="w-full h-full object-cover">
                    </button>
                </div>
            </div>

            <!-- 이미지 없을 때 -->
            <div th:if="${images.isEmpty()}"
                 class="rounded-2xl bg-slate-100 aspect-[4/3] flex items-center justify-center text-slate-300">
                <svg class="w-20 h-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </div>
        </div>

        <!-- 오른쪽: 상품 요약 + 판매자 정보 + 액션 버튼 -->
        <aside class="space-y-4">

            <!-- 상품 요약 -->
            <div class="rounded-2xl border border-slate-100 bg-surface p-5 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-slate-400" th:text="${post.categoryName}">전자기기</span>
                    <span class="rounded-lg px-2.5 py-1 text-xs font-bold"
                          th:text="${post.statusLabel}"
                          th:classappend="${post.status.name() == 'ACTIVE'} ? 'bg-green-100 text-green-700'
                                        : (${post.status.name() == 'RESERVED'} ? 'bg-amber-100 text-amber-700'
                                        : 'bg-slate-100 text-slate-500')">판매중</span>
                </div>
                <h1 class="text-xl font-bold text-slate-900" th:text="${post.title}">상품명</h1>
                <p th:if="${!post.sharing}" class="mt-2 text-2xl font-bold text-orange-500"
                   th:text="${#numbers.formatInteger(post.price, 1, 'COMMA') + '원'}">10,000원</p>
                <p th:if="${post.sharing}" class="mt-2 text-2xl font-bold text-teal-500">무료 나눔</p>
                <div class="mt-3 flex items-center gap-3 text-sm text-slate-400">
                    <span>📍 <span th:text="${post.sigungu}">강남구</span></span>
                    <span>·</span>
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2024.01.01</span>
                    <span>·</span>
                    <span>채팅 <span th:text="${post.chatCount}">0</span></span>
                </div>
            </div>

            <!-- 판매자 카드 -->
            <div class="rounded-2xl border border-slate-100 bg-surface p-5 shadow-sm">
                <h2 class="text-sm font-semibold text-slate-500 mb-3">판매자 정보</h2>
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 font-bold text-lg"
                         th:text="${post.sellerEmail.substring(0,1).toUpperCase()}">A</div>
                    <div>
                        <p class="font-semibold text-slate-800" th:text="${post.sellerEmail}">user@example.com</p>
                        <p class="text-xs text-slate-400">이음 마켓 판매자</p>
                    </div>
                </div>
            </div>

            <!-- 판매자 관리 버튼 -->
            <div th:if="${isSeller}" class="rounded-2xl border border-slate-100 bg-surface p-5 shadow-sm space-y-2">
                <div class="flex items-center justify-between mb-3">
                    <p class="text-sm font-semibold text-slate-600">게시글 관리</p>
                    <a th:href="@{/market/chats}"
                       class="flex items-center gap-1 rounded-lg bg-orange-50 border border-orange-200 px-3 py-1.5 text-xs font-semibold text-orange-600 hover:bg-orange-100 transition-all">
                        💬 채팅 목록
                        <span th:if="${post.chatCount > 0}"
                              class="ml-0.5 rounded-full bg-orange-500 text-white text-[10px] px-1.5 py-0.5"
                              th:text="${post.chatCount}">0</span>
                    </a>
                </div>
                <form th:if="${post.status.name() == 'ACTIVE'}"
                      th:action="@{/market/{id}/reserve(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="w-full rounded-xl border border-amber-300 py-2.5 text-sm font-semibold text-amber-600 hover:bg-amber-50 transition-all">
                        예약중으로 변경
                    </button>
                </form>
                <form th:if="${post.status.name() == 'RESERVED'}"
                      th:action="@{/market/{id}/cancel-reserve(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="w-full rounded-xl border border-slate-200 py-2.5 text-sm font-semibold text-slate-600 hover:bg-surface-alt transition-all">
                        예약 취소
                    </button>
                </form>
                <a th:href="@{/market/{id}/edit(id=${post.id})}"
                   class="block w-full rounded-xl border border-slate-200 py-2.5 text-center text-sm font-semibold text-slate-600 hover:bg-surface-alt transition-all">
                    수정하기
                </a>
                <form th:action="@{/market/{id}/remove(id=${post.id})}" method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="w-full rounded-xl border border-red-100 py-2.5 text-sm font-semibold text-red-500 hover:bg-red-50 transition-all">
                        삭제하기
                    </button>
                </form>
            </div>

            <!-- 구매자 채팅 버튼 -->
            <div th:if="${!isSeller and currentUser != null}"
                 class="rounded-2xl border border-slate-100 bg-surface p-5 shadow-sm">
                <p class="text-sm text-slate-500 mb-3">관심있는 상품이라면 판매자에게 채팅을 보내보세요.</p>
                <form th:action="@{/market/{id}/chat(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            th:disabled="${post.status.name() == 'SOLD' or post.status.name() == 'REMOVED'}"
                            class="w-full rounded-xl bg-orange-500 py-3 text-sm font-bold text-white hover:bg-orange-600 transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        💬 채팅하기
                    </button>
                </form>
            </div>

            <!-- 비로그인 -->
            <div th:if="${currentUser == null}"
                 class="rounded-2xl border border-slate-100 bg-surface p-5 shadow-sm text-center">
                <p class="text-sm text-slate-500 mb-3">채팅을 하려면 로그인이 필요합니다.</p>
                <a th:href="@{/login}"
                   class="block w-full rounded-xl bg-orange-500 py-2.5 text-sm font-bold text-white hover:bg-orange-600 transition-all">
                    로그인하기
                </a>
            </div>

            <a th:href="@{/market}"
               class="block text-center text-sm text-slate-400 hover:text-slate-600 transition-colors">
                ← 목록으로
            </a>
        </aside>
    </div>

    <!-- 하단: 상품 설명 — 전체 폭 -->
    <div th:if="${post.description != null and !post.description.isEmpty()}"
         class="mt-6 rounded-2xl border border-slate-100 bg-surface p-6 shadow-sm">
        <h2 class="text-sm font-semibold text-slate-500 mb-4">상품 설명</h2>
        <p class="whitespace-pre-line text-sm leading-7 text-slate-700"
           th:text="${post.description}">상품 설명</p>
    </div>

</div>

<script th:inline="javascript">
const TOTAL_SLIDES = /*[[${images.size()}]]*/ 0;
let currentSlide = 0;

function goToSlide(idx) {
    if (TOTAL_SLIDES <= 1) return;

    // 이전 슬라이드 숨기기
    const prevSlideEl = document.querySelector(`.slide[data-slide="${currentSlide}"]`);
    if (prevSlideEl) {
        prevSlideEl.classList.replace('opacity-100', 'opacity-0');
        prevSlideEl.classList.add('pointer-events-none');
    }
    // 이전 썸네일 비활성
    const prevThumb = document.querySelector(`.thumb[data-thumb="${currentSlide}"]`);
    if (prevThumb) {
        prevThumb.classList.replace('border-orange-400', 'border-transparent');
        prevThumb.classList.add('opacity-60');
    }

    currentSlide = idx;

    // 새 슬라이드 보이기
    const nextSlideEl = document.querySelector(`.slide[data-slide="${currentSlide}"]`);
    if (nextSlideEl) {
        nextSlideEl.classList.replace('opacity-0', 'opacity-100');
        nextSlideEl.classList.remove('pointer-events-none');
    }
    // 새 썸네일 활성
    const nextThumb = document.querySelector(`.thumb[data-thumb="${currentSlide}"]`);
    if (nextThumb) {
        nextThumb.classList.replace('border-transparent', 'border-orange-400');
        nextThumb.classList.remove('opacity-60');
        nextThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }

    const counter = document.getElementById('slideCounter');
    if (counter) counter.textContent = currentSlide + 1;
}
function prevSlide() { goToSlide((currentSlide - 1 + TOTAL_SLIDES) % TOTAL_SLIDES); }
function nextSlide() { goToSlide((currentSlide + 1) % TOTAL_SLIDES); }
</script>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>
(function () {
    var lb = GLightbox({
        selector: '.glightbox',
        gallery: 'market-gallery',
        touchNavigation: true,
        keyboardNavigation: true,
        closeButton: true,
        loop: true,
        zoomable: true,
        draggable: true,
        openEffect: 'fade',
        closeEffect: 'fade',
    });

    /* 현재 슬라이드 인덱스에 맞춰 라이트박스 열기 */
    document.querySelectorAll('.glightbox').forEach(function (el, i) {
        el.addEventListener('click', function (e) {
            e.preventDefault();
            lb.openAt(currentSlide);
        });
    });

    /* 라이트박스에서 슬라이드 이동 시 메인 슬라이더도 동기화 */
    lb.on('slide_changed', function (data) {
        goToSlide(data.current.index);
    });
})();
</script>
</th:block>
</html>
