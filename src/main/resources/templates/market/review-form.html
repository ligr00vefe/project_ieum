<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('후기 작성 - 이음마켓')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>

<main class="mx-auto w-full max-w-lg px-4 py-6 sm:px-6 lg:px-8">

    <div class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
        <p class="text-sm font-semibold text-orange-500">거래 완료</p>
        <h1 class="mt-1 text-2xl font-bold">거래 후기 작성</h1>

        <!-- 거래 상품 요약 -->
        <div class="mt-4 rounded-xl bg-slate-50 p-3 flex items-center gap-3">
            <div class="w-12 h-12 rounded-lg bg-slate-200 flex-shrink-0 flex items-center justify-center text-slate-400 text-xs">사진</div>
            <div>
                <p class="text-sm font-bold text-slate-800" th:text="${post.title}">상품명</p>
                <p class="text-xs text-slate-400"
                   th:text="${#numbers.formatInteger(post.price, 1, 'COMMA') + '원'}">10,000원</p>
            </div>
        </div>

        <form th:action="@{/market/review/{id}(id=${chat.id})}"
              method="post"
              th:object="${form}"
              class="mt-6 space-y-5">
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- 별점 -->
            <div>
                <label class="mb-2 block text-sm font-semibold">별점</label>
                <div class="flex gap-1" id="starRating">
                    <th:block th:each="i : ${#numbers.sequence(1,5)}">
                        <button type="button"
                                th:attr="data-value=${i}"
                                onclick="setRating(this)"
                                class="star-btn text-3xl text-slate-200 hover:text-amber-400 transition-colors">★</button>
                    </th:block>
                </div>
                <input type="hidden" id="ratingInput" th:field="*{rating}">
                <p th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"
                   class="mt-1 text-sm text-red-600"></p>
            </div>

            <!-- 후기 본문 -->
            <div>
                <label for="body" class="mb-1 block text-sm font-semibold">
                    후기 <span class="text-slate-400 font-normal">(선택)</span>
                </label>
                <textarea id="body" th:field="*{body}" rows="5"
                          placeholder="판매자와의 거래는 어떠셨나요? 솔직한 후기를 남겨주세요."
                          class="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-200 resize-none"></textarea>
            </div>

            <!-- 공개 여부 -->
            <fieldset>
                <legend class="mb-2 text-sm font-semibold">공개 여부</legend>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="radio" th:field="*{visibility}" value="PUBLIC"
                               class="text-orange-500 focus:ring-orange-400">
                        공개
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="radio" th:field="*{visibility}" value="PRIVATE"
                               class="text-orange-500 focus:ring-orange-400">
                        비공개
                    </label>
                </div>
                <p th:if="${#fields.hasErrors('visibility')}" th:errors="*{visibility}"
                   class="mt-1 text-sm text-red-600"></p>
            </fieldset>

            <button type="submit"
                    class="w-full rounded-xl bg-orange-500 py-3 text-sm font-bold text-white hover:bg-orange-600 transition-all">
                후기 등록하기
            </button>
        </form>
    </div>
</main>

<script>
function setRating(btn) {
    const value = parseInt(btn.getAttribute('data-value'));
    document.getElementById('ratingInput').value = value;
    document.querySelectorAll('.star-btn').forEach((star, idx) => {
        star.classList.toggle('text-amber-400', idx < value);
        star.classList.toggle('text-slate-200', idx >= value);
    });
}
const existing = document.getElementById('ratingInput').value;
if (existing) {
    const btn = document.querySelector(`.star-btn[data-value="${existing}"]`);
    if (btn) setRating(btn);
}
</script>
</body>
</html>
