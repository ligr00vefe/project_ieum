<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<div class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

    <!-- 페이지 헤더 -->
    <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
        <div>
            <p class="text-sm font-semibold text-orange-500">중고거래</p>
            <h1 class="mt-1 text-2xl font-bold">이음 마켓</h1>
            <p class="mt-1 text-sm text-slate-500">가까운 이웃과 물건을 사고파세요.</p>
        </div>
        <a th:if="${currentUserId != null}" th:href="@{/market/new}"
           class="rounded-xl bg-orange-500 px-4 py-2.5 text-sm font-bold text-white hover:bg-orange-600 transition-all shadow-sm">
            + 상품 등록
        </a>
    </div>

    <!-- 플래시 메시지 -->
    <div th:if="${message}" th:text="${message}"
         class="mb-4 rounded-xl border border-orange-200 bg-orange-50 px-4 py-3 text-sm text-orange-800"></div>

    <!-- 판매 / 나눔 탭 -->
    <div class="mb-5 flex gap-1 border-b border-slate-200">
        <a th:href="@{/market(sharing=false)}"
           th:classappend="${!condition.sharing} ? 'border-b-2 border-orange-500 text-orange-600 font-bold' : 'text-slate-500 hover:text-slate-800'"
           class="flex items-center gap-1.5 px-5 py-2.5 text-sm transition-colors -mb-px">
            💰 판매
        </a>
        <a th:href="@{/market(sharing=true)}"
           th:classappend="${condition.sharing} ? 'border-b-2 border-teal-500 text-teal-600 font-bold' : 'text-slate-500 hover:text-slate-800'"
           class="flex items-center gap-1.5 px-5 py-2.5 text-sm transition-colors -mb-px">
            🤝 나눔
        </a>
    </div>

    <!-- 검색/필터 바 -->
    <form th:action="@{/market}" method="get" class="mb-6 flex flex-wrap gap-2">
        <!-- sharing 값 유지 -->
        <input type="hidden" name="sharing" th:value="${condition.sharing}">
        <select name="categoryId" id="categorySelect"
                class="rounded-xl border border-slate-200 bg-surface px-3 py-2 text-sm focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-300">
            <option value="">전체 카테고리</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"
                    th:selected="${condition.categoryId == cat.id}">카테고리</option>
        </select>
        <input type="text" name="keyword"
               th:value="${condition.keyword}"
               placeholder="상품명 검색"
               class="rounded-xl border border-slate-200 bg-surface px-3 py-2 text-sm flex-1 min-w-[140px] focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-300">
        <th:block th:if="${!condition.sharing}">
            <input type="number" name="minPrice"
                   th:value="${condition.minPrice}"
                   placeholder="최소 가격"
                   class="w-28 rounded-xl border border-slate-200 bg-surface px-3 py-2 text-sm focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-300">
            <input type="number" name="maxPrice"
                   th:value="${condition.maxPrice}"
                   placeholder="최대 가격"
                   class="w-28 rounded-xl border border-slate-200 bg-surface px-3 py-2 text-sm focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-300">
        </th:block>
        <button type="submit"
                class="rounded-xl bg-slate-800 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700 transition-all">
            검색
        </button>
        <a th:href="@{/market(sharing=${condition.sharing})}"
           class="rounded-xl border border-slate-200 px-4 py-2 text-sm text-slate-500 hover:bg-surface-alt transition-all">초기화</a>
    </form>

    <!-- 내 상품 섹션 (로그인 사용자 전용, 상단 우선 표시) -->
    <div th:if="${currentUserId != null and !myPosts.isEmpty()}" class="mb-8">
        <div class="mb-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-orange-500">내 상품</span>
                <span class="rounded-full bg-orange-100 text-orange-600 text-xs font-semibold px-2 py-0.5"
                      th:text="${myPosts.size()}">0</span>
            </div>
            <a th:href="@{/market/chats}"
               class="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-orange-500 transition-colors">
                💬 채팅 목록 보기 →
            </a>
        </div>
        <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <article th:each="post : ${myPosts}"
                     class="group rounded-2xl border-2 border-orange-200 bg-surface shadow-sm hover:shadow-md transition-all overflow-hidden">
                <a th:href="@{/market/{id}(id=${post.id})}" class="block">
                    <div class="relative h-48 bg-slate-100 overflow-hidden">
                        <img th:if="${post.thumbnailUrl != null}"
                             th:src="${post.thumbnailUrl}"
                             th:alt="${post.title}"
                             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div th:if="${post.thumbnailUrl == null}"
                             class="w-full h-full flex items-center justify-center text-slate-300">
                            <svg class="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <!-- 내 상품 배지 -->
                        <span class="absolute top-2 left-2 rounded-lg bg-orange-500 px-2 py-1 text-xs font-bold text-white">내 상품</span>
                        <span th:if="${post.status.name() != 'ACTIVE'}"
                              class="absolute top-2 right-2 rounded-lg px-2 py-1 text-xs font-bold text-white"
                              th:classappend="${post.status.name() == 'RESERVED'} ? 'bg-amber-500' : 'bg-surface-alt0'"
                              th:text="${post.statusLabel}">예약중</span>
                    </div>
                </a>
                <div class="p-4">
                    <p class="text-xs text-slate-400 mb-1" th:text="${post.categoryName}">전자기기</p>
                    <h2 class="font-bold text-slate-900 truncate">
                        <a th:href="@{/market/{id}(id=${post.id})}"
                           th:text="${post.title}"
                           class="hover:text-orange-500 transition-colors">상품명</a>
                    </h2>
                    <p th:if="${!post.sharing}" class="mt-1.5 text-lg font-bold text-orange-500"
                       th:text="${#numbers.formatInteger(post.price, 1, 'COMMA') + '원'}">10,000원</p>
                    <p th:if="${post.sharing}" class="mt-1.5 text-lg font-bold text-teal-500">무료 나눔</p>
                    <div class="mt-2 flex items-center justify-between text-xs text-slate-400">
                        <span th:text="${post.sigungu}">강남구</span>
                        <a th:href="@{/market/chats}"
                           th:if="${post.chatCount > 0}"
                           class="flex items-center gap-1 text-orange-500 hover:text-orange-600 font-semibold transition-colors">
                            💬 <span th:text="${post.chatCount}">0</span>
                        </a>
                        <span th:unless="${post.chatCount > 0}" class="text-slate-300">채팅 없음</span>
                    </div>
                </div>
                <!-- 빠른 관리 링크 -->
                <div class="border-t border-slate-100 px-4 py-2 flex items-center gap-3 bg-surface-alt">
                    <a th:href="@{/market/{id}/edit(id=${post.id})}"
                       class="text-xs text-slate-500 hover:text-orange-500 transition-colors">수정</a>
                    <span class="text-slate-200">|</span>
                    <a th:href="@{/market/{id}(id=${post.id})}"
                       class="text-xs text-slate-500 hover:text-orange-500 transition-colors">상세보기</a>
                </div>
            </article>
        </section>
        <div class="mt-6 border-t border-slate-100"></div>
    </div>

    <!-- 전체 상품 목록 그리드 -->
    <div th:if="${!myPosts.isEmpty()}" class="mb-3">
        <span class="text-sm font-semibold text-slate-500">다른 상품</span>
    </div>
    <section id="postGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <th:block th:each="post : ${posts.content}"
                  th:if="${currentUserId == null or post.sellerId != currentUserId}">
        <article class="group rounded-2xl border border-slate-100 bg-surface shadow-sm hover:shadow-md transition-all overflow-hidden">
            <a th:href="@{/market/{id}(id=${post.id})}" class="block">
                <div class="relative h-48 bg-slate-100 overflow-hidden">
                    <img th:if="${post.thumbnailUrl != null}"
                         th:src="${post.thumbnailUrl}"
                         th:alt="${post.title}"
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                    <div th:if="${post.thumbnailUrl == null}"
                         class="w-full h-full flex items-center justify-center text-slate-300">
                        <svg class="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <span th:if="${post.sharing and post.status.name() == 'ACTIVE'}"
                          class="absolute top-2 left-2 rounded-lg bg-teal-500 px-2 py-1 text-xs font-bold text-white">나눔</span>
                    <span th:if="${post.status.name() != 'ACTIVE'}"
                          class="absolute top-2 left-2 rounded-lg px-2 py-1 text-xs font-bold text-white"
                          th:classappend="${post.status.name() == 'RESERVED'} ? 'bg-amber-500' : 'bg-surface-alt0'"
                          th:text="${post.statusLabel}">예약중</span>
                </div>
            </a>
            <div class="p-4">
                <p class="text-xs text-slate-400 mb-1" th:text="${post.categoryName}">카테고리</p>
                <h2 class="font-bold text-slate-900 truncate">
                    <a th:href="@{/market/{id}(id=${post.id})}"
                       th:text="${post.title}"
                       class="hover:text-orange-500 transition-colors">상품명</a>
                </h2>
                <p th:if="${!post.sharing}" class="mt-1.5 text-lg font-bold text-orange-500"
                   th:text="${#numbers.formatInteger(post.price, 1, 'COMMA') + '원'}">10,000원</p>
                <p th:if="${post.sharing}" class="mt-1.5 text-lg font-bold text-teal-500">무료 나눔</p>
                <div class="mt-2 flex items-center justify-between text-xs text-slate-400">
                    <span th:text="${post.sigungu}">강남구</span>
                    <span th:text="${#temporals.format(post.createdAt, 'MM.dd')}">01.01</span>
                </div>
            </div>
        </article>
        </th:block>
    </section>

    <!-- 빈 결과 -->
    <div th:if="${posts.empty}" id="emptyMessage"
         class="rounded-2xl border border-dashed border-slate-200 bg-surface p-12 text-center text-slate-400 mt-4">
        <p class="text-lg font-semibold mb-1">등록된 상품이 없습니다.</p>
        <p class="text-sm">첫 번째로 상품을 등록해보세요!</p>
    </div>
    <div th:unless="${posts.empty}" id="emptyMessage"
         class="hidden rounded-2xl border border-dashed border-slate-200 bg-surface p-12 text-center text-slate-400 mt-4">
        <p class="text-lg font-semibold mb-1">등록된 상품이 없습니다.</p>
        <p class="text-sm">첫 번째로 상품을 등록해보세요!</p>
    </div>

    <!-- 무한 스크롤 센티넬 + 로딩 스피너 -->
    <div id="infiniteScrollSentinel" class="mt-8 flex flex-col items-center gap-3 py-4">
        <div id="loadingSpinner" class="hidden flex items-center gap-2 text-sm text-slate-400">
            <svg class="animate-spin w-5 h-5 text-orange-400" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
            불러오는 중...
        </div>
        <p id="endMessage" class="hidden text-xs text-slate-300">마지막 상품입니다</p>
    </div>

</div>

<!-- Axios — 데이터 조회(무한스크롤/카테고리 필터) HTTP 클라이언트 -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script th:inline="javascript">
(function () {
    // 서버에서 넘겨받은 초기 페이지 정보
    const INITIAL_LAST   = /*[[${posts.last}]]*/ true;
    const CURRENT_USER_ID = /*[[${currentUserId}]]*/ null;

    // 현재 URL 쿼리 파라미터를 그대로 API 호출에 재사용
    const searchParams = new URLSearchParams(window.location.search);
    searchParams.set('size', '3');

    let nextPage   = 1;          // 첫 페이지(0)는 SSR로 렌더됨
    let isLoading  = false;
    let isLast     = INITIAL_LAST;

    const grid          = document.getElementById('postGrid');
    const spinner       = document.getElementById('loadingSpinner');
    const endMsg        = document.getElementById('endMessage');
    const sentinel      = document.getElementById('infiniteScrollSentinel');
    const emptyMessage  = document.getElementById('emptyMessage');
    const categorySelect = document.getElementById('categorySelect');

    if (isLast) {
        endMsg.classList.remove('hidden');
    }

    // ── 카드 HTML 빌더 (Thymeleaf 렌더와 동일한 구조) ──────────────────────────
    function buildCard(post) {
        const statusActive   = post.status === 'ACTIVE';
        const statusReserved = post.status === 'RESERVED';
        const isMine         = CURRENT_USER_ID && post.sellerId === CURRENT_USER_ID;
        if (isMine) return '';   // 내 상품은 상단 내 상품 섹션에만 표시

        const price = post.sharing
            ? `<p class="mt-1.5 text-lg font-bold text-teal-500">무료 나눔</p>`
            : `<p class="mt-1.5 text-lg font-bold text-orange-500">${Number(post.price).toLocaleString('ko-KR')}원</p>`;

        const imgEl = post.thumbnailUrl
            ? `<img src="${escHtml(post.thumbnailUrl)}" alt="${escHtml(post.title)}"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">`
            : `<div class="w-full h-full flex items-center justify-center text-slate-300">
                 <svg class="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                         d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                 </svg>
               </div>`;

        let badge = '';
        if (!statusActive) {
            const bc = statusReserved ? 'bg-amber-500' : 'bg-surface-alt0';
            badge = `<span class="absolute top-2 left-2 rounded-lg ${bc} px-2 py-1 text-xs font-bold text-white">${escHtml(post.statusLabel)}</span>`;
        } else if (post.sharing) {
            badge = `<span class="absolute top-2 left-2 rounded-lg bg-teal-500 px-2 py-1 text-xs font-bold text-white">나눔</span>`;
        }

        let date = '';
        if (post.createdAt) {
            let d;
            if (Array.isArray(post.createdAt)) {
                // Jackson 기본: [year, month, day, hour, minute, second, nano]
                d = new Date(post.createdAt[0], post.createdAt[1] - 1, post.createdAt[2]);
            } else {
                d = new Date(post.createdAt);
            }
            date = (d.getMonth() + 1).toString().padStart(2, '0') + '.' + d.getDate().toString().padStart(2, '0');
        }

        return `
        <article class="group rounded-2xl border border-slate-100 bg-surface shadow-sm hover:shadow-md transition-all overflow-hidden">
          <a href="/market/${post.id}" class="block">
            <div class="relative h-48 bg-slate-100 overflow-hidden">
              ${imgEl}${badge}
            </div>
          </a>
          <div class="p-4">
            <p class="text-xs text-slate-400 mb-1">${escHtml(post.categoryName)}</p>
            <h2 class="font-bold text-slate-900 truncate">
              <a href="/market/${post.id}" class="hover:text-orange-500 transition-colors">${escHtml(post.title)}</a>
            </h2>
            ${price}
            <div class="mt-2 flex items-center justify-between text-xs text-slate-400">
              <span>${escHtml(post.sigungu || '')}</span>
              <span>${date}</span>
            </div>
          </div>
        </article>`;
    }

    function escHtml(str) {
        return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── 다음 페이지 로드 ─────────────────────────────────────────────────────
    async function loadNextPage() {
        if (isLoading || isLast) return;
        isLoading = true;
        spinner.classList.remove('hidden');

        try {
            searchParams.set('page', nextPage);
            const { data } = await axios.get('/market/api/posts', { params: Object.fromEntries(searchParams) });

            data.content.forEach(post => {
                const html = buildCard(post);
                if (html) grid.insertAdjacentHTML('beforeend', html);
            });

            isLast = data.last;
            nextPage++;

            if (isLast) {
                endMsg.classList.remove('hidden');
                observer.disconnect();
            }
        } catch (e) {
            console.error('무한 스크롤 로드 실패', e);
        } finally {
            isLoading = false;
            spinner.classList.add('hidden');
        }
    }

    // ── IntersectionObserver ─────────────────────────────────────────────────
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) loadNextPage();
    }, { rootMargin: '200px' });   // 하단 200px 전에 미리 트리거

    if (!isLast) observer.observe(sentinel);

    // ── 카테고리 변경 시 즉시 재조회 ─────────────────────────────────────────
    async function reloadByCategory() {
        if (isLoading) return;
        isLoading = true;
        spinner.classList.remove('hidden');
        endMsg.classList.add('hidden');
        emptyMessage.classList.add('hidden');
        observer.disconnect();

        searchParams.set('categoryId', categorySelect.value);
        searchParams.set('page', '0');

        try {
            const { data } = await axios.get('/market/api/posts', { params: Object.fromEntries(searchParams) });

            grid.innerHTML = '';
            data.content.forEach(post => {
                const html = buildCard(post);
                if (html) grid.insertAdjacentHTML('beforeend', html);
            });

            isLast   = data.last;
            nextPage = 1;

            if (data.content.length === 0) {
                emptyMessage.classList.remove('hidden');
            }
            if (isLast) {
                endMsg.classList.remove('hidden');
            } else {
                observer.observe(sentinel);
            }
        } catch (e) {
            console.error('카테고리 필터 재조회 실패', e);
        } finally {
            isLoading = false;
            spinner.classList.add('hidden');
        }
    }

    categorySelect.addEventListener('change', reloadByCategory);
})();
</script>
</th:block>
</html>
