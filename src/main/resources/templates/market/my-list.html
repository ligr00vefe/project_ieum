<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<div class="mx-auto w-full max-w-3xl px-4 py-6 sm:px-6 lg:px-8">

    <div class="mb-5 flex items-center justify-between">
        <div>
            <p class="text-sm font-semibold text-orange-500">이음 마켓</p>
            <h1 class="mt-1 text-2xl font-bold">내 판매 목록</h1>
        </div>
        <a th:href="@{/market/new}"
           class="rounded-xl bg-orange-500 px-4 py-2.5 text-sm font-bold text-white hover:bg-orange-600 transition-all">
            + 등록
        </a>
    </div>

    <div th:if="${message}" th:text="${message}"
         class="mb-4 rounded-xl border border-orange-200 bg-orange-50 px-4 py-3 text-sm text-orange-800"></div>

    <section class="space-y-3">
        <article th:each="post : ${posts}"
                 class="flex gap-4 rounded-2xl border border-slate-100 bg-surface p-4 shadow-sm">
            <div class="w-20 h-20 rounded-xl overflow-hidden bg-slate-100 flex-shrink-0">
                <img th:if="${post.thumbnailUrl != null}"
                     th:src="${post.thumbnailUrl}" th:alt="${post.title}"
                     class="w-full h-full object-cover">
                <div th:if="${post.thumbnailUrl == null}"
                     class="w-full h-full flex items-center justify-center text-slate-300">
                    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <h2 class="font-bold text-slate-900 truncate">
                            <a th:href="@{/market/{id}(id=${post.id})}"
                               th:text="${post.title}"
                               class="hover:text-orange-500 transition-colors">상품명</a>
                        </h2>
                        <p class="text-sm font-bold text-orange-500 mt-0.5"
                           th:text="${#numbers.formatInteger(post.price, 1, 'COMMA') + '원'}">10,000원</p>
                    </div>
                    <span class="rounded-lg px-2 py-1 text-xs font-bold flex-shrink-0"
                          th:text="${post.statusLabel}"
                          th:classappend="${post.status.name() == 'ACTIVE'} ? 'bg-green-100 text-green-700'
                                        : (${post.status.name() == 'RESERVED'} ? 'bg-amber-100 text-amber-700'
                                        : 'bg-slate-100 text-slate-500')">판매중</span>
                </div>
                <p class="mt-1.5 text-xs text-slate-400"
                   th:text="${post.sigungu + ' · ' + #temporals.format(post.createdAt, 'yyyy.MM.dd')}">강남구 · 2024.01.01</p>
            </div>
        </article>

        <div th:if="${posts.isEmpty()}"
             class="rounded-2xl border border-dashed border-slate-200 bg-surface p-10 text-center text-slate-400">
            <p class="font-semibold mb-1">등록한 상품이 없습니다.</p>
            <a th:href="@{/market/new}" class="text-sm text-orange-500 hover:underline">첫 상품을 등록해보세요 →</a>
        </div>
    </section>
</div>
</th:block>
</html>
