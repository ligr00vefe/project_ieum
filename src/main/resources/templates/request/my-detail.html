<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('내 요청 상세')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="mx-auto w-full max-w-4xl px-4 py-6 sm:px-6 lg:px-8">
    <section class="rounded-lg border border-indigo-100 bg-white p-6 shadow-sm">
        <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
                <p class="text-sm font-semibold text-indigo-700" th:text="${request.status}">OPEN</p>
                <h1 class="mt-2 text-2xl font-bold" th:text="${request.title}">요청</h1>
                <p class="mt-2 text-sm text-slate-600" th:text="${request.serviceCategory.nameKo + ' · ' + request.region.sigungu + ' ' + request.region.dong}">분류</p>
            </div>
            <a th:href="@{/my/requests/{id}/applications(id=${request.id})}" class="rounded-md bg-indigo-700 px-4 py-3 font-semibold text-white hover:bg-indigo-800">지원자 보기</a>
        </div>
        <p class="mt-6 whitespace-pre-line leading-7 text-slate-700" th:text="${request.body}">내용</p>
        <div class="mt-6 flex flex-wrap gap-2">
            <a th:if="${request.status.name() == 'OPEN'}" th:href="@{/my/requests/{id}/edit(id=${request.id})}" class="rounded-md border border-slate-300 px-4 py-2 font-semibold text-slate-700 hover:bg-slate-50">수정</a>
            <form th:if="${request.status.name() == 'OPEN'}" th:action="@{/my/requests/{id}/cancel(id=${request.id})}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="rounded-md border border-red-200 px-4 py-2 font-semibold text-red-700 hover:bg-red-50">취소</button>
            </form>
            <form th:if="${request.status.name() == 'MATCHED'}" th:action="@{/requests/{id}/start(id=${request.id})}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="rounded-md bg-indigo-700 px-4 py-2 font-semibold text-white hover:bg-indigo-800">활동 시작</button>
            </form>
            <form th:if="${request.status.name() == 'IN_PROGRESS'}" th:action="@{/requests/{id}/complete(id=${request.id})}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="rounded-md bg-indigo-700 px-4 py-2 font-semibold text-white hover:bg-indigo-800">활동 완료</button>
            </form>
            <a th:if="${request.status.name() == 'COMPLETED'}" th:href="@{/reviews/requests/{id}/new(id=${request.id})}" class="rounded-md bg-indigo-700 px-4 py-2 font-semibold text-white hover:bg-indigo-800">후기 작성</a>
        </div>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
