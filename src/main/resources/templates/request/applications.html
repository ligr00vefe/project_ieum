<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('지원자 리스트')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <p class="text-sm font-semibold text-indigo-700">지원자 확인</p>
    <h1 class="mt-1 text-2xl font-bold" th:text="${request.title}">요청</h1>
    <section class="mt-5 space-y-3">
        <article th:each="application : ${applications}" class="rounded-lg border border-indigo-100 bg-white p-5">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h2 class="text-lg font-bold" th:text="${application.caregiver.fullName}">활동지원사</h2>
                    <p class="mt-1 text-sm text-slate-600" th:text="${application.caregiver.introShort ?: '소개가 아직 없습니다.'}">소개</p>
                    <p class="mt-1 text-sm text-slate-600" th:text="${'평점 ' + application.caregiver.avgRating + ' · 후기 ' + application.caregiver.totalReviews + '개'}">평점</p>
                </div>
                <span class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-semibold text-indigo-700" th:text="${application.status}">PENDING</span>
            </div>
            <div th:if="${application.status.name() == 'PENDING'}" class="mt-4 flex flex-wrap gap-2">
                <form th:action="@{/applications/{id}/accept(id=${application.id})}" method="post">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="rounded-md bg-indigo-700 px-4 py-2 font-semibold text-white hover:bg-indigo-800">수락</button>
                </form>
            </div>
        </article>
        <div th:if="${#lists.isEmpty(applications)}" class="rounded-lg border border-dashed border-indigo-200 bg-white p-8 text-center text-slate-600">아직 지원자가 없습니다.</div>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
