<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<div th:replace="~{layout/nav :: nav}"></div>
<div class="mx-auto grid w-full max-w-6xl gap-5 px-4 py-6 sm:px-6 lg:grid-cols-[1fr_360px] lg:px-8">
    <section class="rounded-lg border border-indigo-100 bg-surface p-6 shadow-sm">
        <p class="text-sm font-semibold text-indigo-700" th:text="${request.serviceCategory.nameKo}">외출 보조</p>
        <h1 class="mt-2 text-2xl font-bold" th:text="${request.title}">도움 요청</h1>
        <dl class="mt-5 grid gap-3 text-sm sm:grid-cols-2">
            <div class="rounded-md bg-indigo-50 p-3"><dt class="font-semibold">지역</dt><dd th:text="${request.region.sido + ' ' + request.region.sigungu + ' ' + request.region.dong}">서울</dd></div>
            <div class="rounded-md bg-indigo-50 p-3"><dt class="font-semibold">희망 일시</dt><dd th:text="${request.desiredDate + ' ' + request.desiredStartTime + ' - ' + request.desiredEndTime}">일시</dd></div>
        </dl>
        <div class="mt-6">
            <h2 class="font-bold">도움 내용</h2>
            <p class="mt-2 whitespace-pre-line leading-7 text-ink-muted" th:text="${request.body}">내용</p>
        </div>
        <div class="mt-6">
            <h2 class="font-bold">주의사항</h2>
            <p class="mt-2 whitespace-pre-line leading-7 text-ink-muted" th:text="${request.specialNotes ?: '등록된 주의사항이 없습니다.'}">주의사항</p>
        </div>
    </section>

    <aside class="space-y-5">
        <section th:if="${currentRole == 'CAREGIVER'}" class="rounded-lg border border-indigo-100 bg-surface p-5 shadow-sm">
            <h2 class="text-lg font-bold">지원하기</h2>
            <p class="mt-2 text-sm text-ink-muted">지원 즉시 대화방이 열립니다. 궁금한 점을 첫 메시지로 남겨보세요.</p>
            <form th:action="@{/requests/{id}/apply(id=${request.id})}" method="post" th:object="${applyRequest}" class="mt-4 space-y-3">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="firstMessage" class="block text-sm font-semibold">첫 메시지</label>
                <textarea id="firstMessage" th:field="*{firstMessage}" rows="4" class="w-full rounded-md border border-slate-300 px-3 py-3 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600"></textarea>
                <button type="submit" class="w-full rounded-md bg-indigo-700 px-4 py-3 font-semibold text-white hover:bg-indigo-800">지원하기</button>
            </form>
        </section>

        <section class="rounded-lg border border-indigo-100 bg-surface p-5 shadow-sm">
            <h2 class="text-lg font-bold">추천 활동지원사</h2>
            <div class="mt-3 space-y-3">
                <article th:each="caregiver : ${recommendations}" class="rounded-md border border-indigo-100 p-3">
                    <div class="flex items-center justify-between gap-2">
                        <strong th:text="${caregiver.fullName}">이름</strong>
                        <span class="rounded-full bg-indigo-700 px-3 py-1 text-sm font-semibold text-white" th:text="${caregiver.score + '%'}">95%</span>
                    </div>
                    <p class="mt-1 text-sm text-ink-muted" th:text="${caregiver.introShort ?: '소개가 아직 없습니다.'}">소개</p>
                </article>
                <p th:if="${#lists.isEmpty(recommendations)}" class="text-sm text-ink-muted">추천 후보가 아직 없습니다.</p>
            </div>
        </section>
    </aside>
</div>
</th:block>
</html>
