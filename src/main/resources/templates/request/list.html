<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<div th:replace="~{layout/nav :: nav}"></div>
<div class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <div class="mb-5 flex flex-wrap items-end justify-between gap-3">
        <div>
            <p class="text-sm font-semibold text-indigo-700">구인 게시판</p>
            <h1 class="mt-1 text-2xl font-bold">매칭 게시판</h1>
            <p class="mt-2 text-sm text-slate-600">이용자가 올린 도움 요청을 확인하고, 맞는 요청에 지원하세요.</p>
        </div>
        <a th:if="${currentRole == 'USER'}" th:href="@{/requests/new}" class="rounded-md bg-indigo-700 px-4 py-3 font-semibold text-white hover:bg-indigo-800">요청 작성</a>
    </div>

    <div th:if="${message}" th:text="${message}" class="mb-4 rounded-md border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-800"></div>

    <section class="space-y-3">
        <article th:each="request : ${requests.content}" class="rounded-lg border border-indigo-100 bg-surface p-5 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-3">
                <div>
                    <h2 class="text-lg font-bold">
                        <a th:href="@{/requests/{id}(id=${request.id})}" th:text="${request.title}" class="rounded-sm hover:text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-600">도움 요청</a>
                    </h2>
                    <p class="mt-2 text-sm text-slate-600" th:text="${request.serviceCategory.nameKo + ' · ' + request.region.sigungu + ' ' + request.region.dong}">외출 보조</p>
                </div>
                <span class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-semibold text-indigo-700" th:text="${request.status}">OPEN</span>
            </div>
            <p class="mt-3 line-clamp-2 text-sm leading-6 text-slate-700" th:text="${request.body}">내용</p>
            <p class="mt-3 text-sm text-slate-600" th:text="${request.desiredDate + ' ' + request.desiredStartTime + ' - ' + request.desiredEndTime}">일시</p>
        </article>
        <div th:if="${requests.empty}" class="rounded-lg border border-dashed border-indigo-200 bg-surface p-8 text-center text-slate-600">
            열린 도움 요청이 없습니다.
        </div>
    </section>
</div>
</th:block>
</html>
