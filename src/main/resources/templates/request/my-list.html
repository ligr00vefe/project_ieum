<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="content">
<div th:replace="~{layout/nav :: nav}"></div>
<div class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <div class="mb-5 flex flex-wrap items-end justify-between gap-3">
        <div>
            <p class="text-sm font-semibold text-indigo-700">이용자 대시보드</p>
            <h1 class="mt-1 text-2xl font-bold">내 요청</h1>
        </div>
        <a th:href="@{/requests/new}" class="rounded-md bg-indigo-700 px-4 py-3 font-semibold text-white hover:bg-indigo-800">새 요청 작성</a>
    </div>
    <div th:if="${message}" th:text="${message}" class="mb-4 rounded-md border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-800"></div>
    <section class="space-y-3">
        <article th:each="request : ${requests}" class="rounded-lg border border-indigo-100 bg-white p-5">
            <div class="flex flex-wrap justify-between gap-3">
                <div>
                    <h2 class="text-lg font-bold"><a th:href="@{/my/requests/{id}(id=${request.id})}" th:text="${request.title}">요청</a></h2>
                    <p class="mt-1 text-sm text-slate-600" th:text="${request.serviceCategory.nameKo + ' · ' + request.desiredDate}">일시</p>
                </div>
                <span class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-semibold text-indigo-700" th:text="${request.status}">OPEN</span>
            </div>
        </article>
        <div th:if="${#lists.isEmpty(requests)}" class="rounded-lg border border-dashed border-indigo-200 bg-white p-8 text-center text-slate-600">등록된 요청이 없습니다.</div>
    </section>
</div>
</th:block>
</html>
