<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장애 정보 입력</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center mb-8">장애 정보 입력</h1>
        <form th:action="@{/register/disabled/step2}" method="post" th:object="${disabilityInfo}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">장애 유형</label>
                <div class="space-y-2">
                    <div th:each="type : ${disabilityTypes}" class="flex items-center">
                        <input type="checkbox" th:field="*{disabilityTypeIds}" th:value="${type.id}" class="mr-2">
                        <label th:text="${type.nameKo}" class="text-gray-700"></label>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">활동 가능 범위</label>
                <textarea th:field="*{activityRange}" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">피해야 할 상황</label>
                <textarea th:field="*{avoidSituations}" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">다음</button>
        </form>
    </div>
</body>
</html>
