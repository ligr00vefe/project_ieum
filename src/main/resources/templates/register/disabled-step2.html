<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장애 정보 입력 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <th:block th:replace="~{layout/prefs :: prefs}"></th:block>
    <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
</head>
<body class="min-h-screen bg-surface-alt flex flex-col">
    <div th:replace="~{fragments/register-header :: header('badge')}"></div>

    <main class="flex-1 flex items-start justify-center px-4 py-8">
        <div class="w-full max-w-lg">

            <!-- Step indicator -->
            <nav aria-label="가입 단계" class="mb-6 px-1">
                <ol class="flex items-center gap-2 w-full list-none p-0 m-0">
                <th:block th:each="i : ${#numbers.sequence(1, 4)}">
                    <li class="flex-shrink-0" th:attr="aria-current=${i == 2} ? 'step' : null">
                    <div th:classappend="${i == 2} ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : (${i < 2} ? 'bg-indigo-200 text-indigo-600' : 'bg-gray-200 text-gray-400')"
                         class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all">
                        <th:block th:if="${i < 2}">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                            </svg>
                            <span class="sr-only" th:text="'단계 ' + ${i} + ' 완료'"></span>
                        </th:block>
                        <th:block th:if="${i == 2}">
                            <span th:text="${i}" aria-hidden="true"></span>
                            <span class="sr-only">단계 2 현재</span>
                        </th:block>
                        <th:block th:if="${i > 2}">
                            <span th:text="${i}" aria-hidden="true"></span>
                            <span class="sr-only" th:text="'단계 ' + ${i}"></span>
                        </th:block>
                    </div>
                    </li>
                    <li th:if="${i < 4}" aria-hidden="true"
                        th:classappend="${i < 2} ? 'bg-indigo-300' : 'bg-gray-200'"
                        class="flex-1 h-0.5 min-w-[2rem] rounded-full"></li>
                </th:block>
                </ol>
            </nav>

            <!-- Card -->
            <div class="bg-surface rounded-3xl shadow-sm border border-line overflow-hidden">
                <div class="h-1 bg-surface-hover">
                    <div class="h-1 bg-indigo-600 rounded-full transition-all duration-500" style="width: 50%"></div>
                </div>

                <div class="p-7 sm:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">STEP 2 / 4</span>
                        <span class="text-xs text-gray-400 font-medium">장애 정보</span>
                    </div>

                    <h2 class="text-2xl font-extrabold text-ink mb-1">장애 정보를 알려주세요</h2>
                    <p class="text-sm text-gray-500 mb-7">정확한 매칭을 위해 필요한 정보입니다.</p>

                    <form th:action="@{/register/disabled/step2}"
                          method="post"
                          th:object="${disabilityInfo}"
                          class="space-y-7"
                          id="step2Form"
                          novalidate>
                        <input type="hidden" id="direction" name="direction" value="forward">

                        <!-- Disability Types -->
                        <div class="space-y-3">
                            <label class="block text-sm font-semibold text-ink-muted">
                                장애 유형 <span class="text-red-500">*</span>
                                <span class="text-xs text-gray-400 font-normal ml-1">(복수 선택 가능)</span>
                            </label>
                            <div class="flex flex-wrap gap-2.5">
                                <th:block th:each="type : ${disabilityTypes}">
                                    <div class="relative">
                                        <input type="checkbox"
                                               th:field="*{disabilityTypeIds}"
                                               th:value="${type.id}"
                                               th:id="${'dt_' + type.id}"
                                               class="sr-only peer">
                                        <label th:for="${'dt_' + type.id}"
                                               class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-line-strong text-ink-muted text-sm font-medium cursor-pointer select-none transition-all hover:border-indigo-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 peer-checked:text-white peer-focus:ring-2 peer-focus:ring-indigo-500 peer-focus:ring-offset-1"
                                               th:text="${type.name}">장애유형</label>
                                    </div>
                                </th:block>
                                <!-- Fallback static options if no data -->
                                <th:block th:if="${disabilityTypes == null or #lists.isEmpty(disabilityTypes)}">
                                    <th:block th:each="typeName : ${ {'지체장애','시각장애','청각장애','지적장애','자폐성장애','정신장애'} }">
                                        <div class="relative">
                                            <input type="checkbox" th:id="${'dt_static_' + typeStat.index}"
                                                   name="disabilityTypeIds" th:value="${typeStat.index + 1}"
                                                   class="sr-only peer">
                                            <label th:for="${'dt_static_' + typeStat.index}"
                                                   class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-line-strong text-ink-muted text-sm font-medium cursor-pointer select-none transition-all hover:border-indigo-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 peer-checked:text-white"
                                                   th:text="${typeName}">장애유형</label>
                                        </div>
                                    </th:block>
                                </th:block>
                            </div>
                            <p th:if="${#fields.hasErrors('disabilityTypeIds')}" th:errors="*{disabilityTypeIds}"
                               class="text-xs text-red-500 mt-1"></p>
                        </div>

                        <!-- Activity Range -->
                        <div class="space-y-2">
                            <label for="activityRange" class="block text-sm font-semibold text-ink-muted">
                                활동 가능 범위
                                <span class="text-xs text-gray-400 font-normal ml-1">(예: 집 근처, 단독 외출 불가 등)</span>
                            </label>
                            <textarea id="activityRange"
                                      th:field="*{activityRange}"
                                      rows="3"
                                      placeholder="자유롭게 작성해주세요 (예: 집 주변 이동 가능, 휠체어 사용 중)"
                                      class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"></textarea>
                        </div>

                        <!-- Avoid Situations -->
                        <div class="space-y-2">
                            <label for="avoidSituations" class="block text-sm font-semibold text-ink-muted">
                                피해야 할 상황
                                <span class="text-xs text-gray-400 font-normal ml-1">(예: 큰 소음, 대인기피증 등)</span>
                            </label>
                            <textarea id="avoidSituations"
                                      th:field="*{avoidSituations}"
                                      rows="3"
                                      placeholder="자유롭게 작성해주세요 (예: 계단 이용 불가, 장시간 이동 어려움)"
                                      class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="goBack()"
                                    class="flex-1 py-3.5 border-2 border-line-strong text-ink-muted font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-surface-muted active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                                </svg>
                                이전
                            </button>
                            <button type="submit"
                                    class="flex-[2] py-3.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl hover:bg-indigo-700 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all flex items-center justify-center gap-1.5">
                                다음 단계
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script>
        function goBack() {
            document.getElementById('direction').value = 'back';
            document.getElementById('step2Form').submit();
        }
    </script>
</body>
</html>
