<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 유형 선택</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center mb-8">회원가입</h1>
        <form th:action="@{/register/type}" method="post" class="space-y-4">
            <button type="submit" name="type" value="disabled" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">장애인</button>
            <button type="submit" name="type" value="caregiver" class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 transition">활동지원사</button>
        </form>
    </div>
</body>
</html>
