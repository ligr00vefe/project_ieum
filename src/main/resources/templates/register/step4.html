<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>성향 입력</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center mb-8">성향 입력</h1>
        <form th:action="@{/register/{type}/step4(type=${userType})}" method="post" th:object="${personalityTagInfo}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">성향 태그</label>
                <div class="space-y-2">
                    <div th:each="tag : ${personalityTags}" class="flex items-center">
                        <input type="checkbox" th:field="*{personalityTagIds}" th:value="${tag.id}" class="mr-2">
                        <label th:text="${tag.nameKo}" class="text-gray-700"></label>
                    </div>
                </div>
            </div>
            <button type="submit" class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 transition">완료</button>
        </form>
    </div>
</body>
</html>
