<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성향 입력 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">

    <!-- Top bar -->
    <div class="bg-white border-b border-gray-100 px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a th:href="@{/}" class="flex items-center gap-2.5 group">
                <div class="w-8 h-8 bg-teal-500 rounded-xl flex items-center justify-center group-hover:bg-teal-600 transition-colors">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
                    </svg>
                </div>
                <div class="leading-tight">
                    <div class="text-[14px] font-bold text-gray-900">이음</div>
                    <div class="text-[9px] text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
                </div>
            </a>
            <span th:if="${userType == 'caregiver'}"
                  class="px-3 py-1 bg-teal-50 text-teal-700 text-xs font-semibold rounded-full border border-teal-100">
                활동지원사 가입
            </span>
            <span th:if="${userType == 'disabled'}"
                  class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full border border-indigo-100">
                이음인 가입
            </span>
        </div>
    </div>

    <main class="flex-1 flex items-start justify-center px-4 py-8">
        <div class="w-full max-w-lg">

            <!-- Step indicator (all filled) -->
            <div class="flex items-center gap-2 mb-6 px-1">
                <th:block th:each="i : ${#numbers.sequence(1, 4)}">
                    <div th:classappend="${i == 4} ? (${userType == 'caregiver'} ? 'bg-teal-500 text-white shadow-md shadow-teal-200' : 'bg-indigo-600 text-white shadow-md shadow-indigo-200') : (${userType == 'caregiver'} ? 'bg-teal-200 text-teal-600' : 'bg-indigo-200 text-indigo-600')"
                         class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all flex-shrink-0">
                        <th:block th:if="${i < 4}">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                            </svg>
                        </th:block>
                        <th:block th:if="${i == 4}" th:text="${i}"></th:block>
                    </div>
                    <div th:if="${i < 4}"
                         th:classappend="${userType == 'caregiver'} ? 'bg-teal-200' : 'bg-indigo-200'"
                         class="flex-1 h-0.5 min-w-[2rem] rounded-full"></div>
                </th:block>
            </div>

            <!-- Card -->
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="h-1 bg-gray-100">
                    <div th:classappend="${userType == 'caregiver'} ? 'bg-teal-500' : 'bg-indigo-600'"
                         class="h-1 rounded-full transition-all duration-500" style="width: 100%"></div>
                </div>

                <div class="p-7 sm:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <span th:classappend="${userType == 'caregiver'} ? 'text-teal-600' : 'text-indigo-600'"
                              class="text-xs font-bold uppercase tracking-wider">STEP 4 / 4</span>
                        <span class="text-xs text-gray-400 font-medium">본인 성향</span>
                    </div>

                    <h2 class="text-2xl font-extrabold text-gray-900 mb-1"
                        th:text="${userType == 'caregiver'} ? '당신의 케어 스타일은?' : '당신의 성향은 어떤가요?'">
                        성향은 어떤가요?
                    </h2>
                    <p class="text-sm text-gray-500 mb-2"
                       th:text="${userType == 'caregiver'} ? '이용자가 선택한 선호 성향과 비교하여 매칭률(%)이 산출됩니다.' : '성향 가까운 활동지원사를 추천해 드립니다.'">
                        성향을 정확하게 선택할수록 좋은 매칭을 만납니다.
                    </p>
                    <p class="text-xs text-gray-400 mb-7">복수 선택 가능</p>

                    <form th:action="@{/register/{type}/step4(type=${userType})}"
                          method="post"
                          th:object="${personalityTagInfo}"
                          class="space-y-6"
                          novalidate>

                        <!-- Personality tags -->
                        <div class="space-y-3">
                            <div class="flex flex-wrap gap-2.5">
                                <th:block th:if="${personalityTags != null and !#lists.isEmpty(personalityTags)}">
                                    <th:block th:each="tag : ${personalityTags}">
                                        <div class="relative">
                                            <input type="checkbox"
                                                   th:field="*{personalityTagIds}"
                                                   th:value="${tag.id}"
                                                   th:id="${'tag_' + tag.id}"
                                                   class="sr-only peer">
                                            <label th:for="${'tag_' + tag.id}"
                                                   th:classappend="${userType == 'caregiver'} ? 'hover:border-teal-300 peer-checked:bg-teal-500 peer-checked:border-teal-500' : 'hover:border-indigo-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600'"
                                                   class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-gray-200 text-gray-700 text-sm font-medium cursor-pointer select-none transition-all peer-checked:text-white peer-focus:ring-2 peer-focus:ring-offset-1"
                                                   th:text="${tag.nameKo}">태그</label>
                                        </div>
                                    </th:block>
                                </th:block>

                                <!-- Fallback static tags -->
                                <th:block th:if="${personalityTags == null or #lists.isEmpty(personalityTags)}">
                                    <th:block th:each="tagName,stat : ${ {'꼼꼼함','자분함','친화력','노선 사람 경계','진취적 활용','활발함','다소 산만','동일상황 가능','조용함','배려심','책임감','유머러스'} }">
                                        <div class="relative">
                                            <input type="checkbox"
                                                   th:id="${'tag_s_' + stat.index}"
                                                   name="personalityTagIds"
                                                   th:value="${stat.index + 1}"
                                                   class="sr-only peer">
                                            <label th:for="${'tag_s_' + stat.index}"
                                                   th:classappend="${userType == 'caregiver'} ? 'hover:border-teal-300 peer-checked:bg-teal-500 peer-checked:border-teal-500' : 'hover:border-indigo-300 peer-checked:bg-indigo-600 peer-checked:border-indigo-600'"
                                                   class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-gray-200 text-gray-700 text-sm font-medium cursor-pointer select-none transition-all peer-checked:text-white"
                                                   th:text="${tagName}">태그</label>
                                        </div>
                                    </th:block>
                                </th:block>
                            </div>
                        </div>

                        <!-- Matching info box -->
                        <div th:classappend="${userType == 'caregiver'} ? 'bg-teal-50 border-teal-100' : 'bg-indigo-50 border-indigo-100'"
                             class="p-4 rounded-xl border">
                            <div class="flex items-start gap-2.5">
                                <svg class="w-4 h-4 mt-0.5 flex-shrink-0"
                                     th:classappend="${userType == 'caregiver'} ? 'text-teal-500' : 'text-indigo-500'"
                                     fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                <div>
                                    <p class="text-xs font-semibold mb-1"
                                       th:classappend="${userType == 'caregiver'} ? 'text-teal-700' : 'text-indigo-700'">
                                        매칭 알고리즘 적용 방식
                                    </p>
                                    <p class="text-xs leading-relaxed"
                                       th:classappend="${userType == 'caregiver'} ? 'text-teal-600' : 'text-indigo-600'"
                                       th:text="${userType == 'caregiver'} ? '선택한 성향과 이용자가 선택한 선호 성향을 비교하여 매칭률(%)이 높아질수록 매칭에서 상위에 노출됩니다.' : '성향 가까운 활동지원사가 매칭 목록 상단에 표시되며, 정확한 성향 입력이 좋은 매칭을 만듭니다.'">
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex gap-3 pt-2">
                            <a th:href="${userType == 'caregiver'} ? @{/register/caregiver/step3} : @{/register/disabled/step3}"
                               class="flex-1 py-3.5 border-2 border-gray-200 text-gray-700 font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-gray-50 active:scale-[0.98] transition-all text-center flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                                </svg>
                                이전
                            </a>
                            <button type="submit"
                                    th:classappend="${userType == 'caregiver'} ? 'bg-teal-500 hover:bg-teal-600 focus:ring-teal-500 shadow-teal-100' : 'bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-500 shadow-indigo-100'"
                                    class="flex-[2] py-3.5 text-white font-semibold text-sm rounded-xl active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 transition-all shadow-sm flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                가입 완료하기
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
