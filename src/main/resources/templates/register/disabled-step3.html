<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>의사소통 방식</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center mb-8">의사소통 방식</h1>
        <form th:action="@{/register/disabled/step3}" method="post" th:object="${communicationInfo}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">의사소통 방식</label>
                <div class="space-y-2">
                    <div th:each="method : ${communicationMethods}" class="flex items-center">
                        <input type="checkbox" th:field="*{communicationMethodIds}" th:value="${method.id}" class="mr-2">
                        <label th:text="${method.nameKo}" class="text-gray-700"></label>
                    </div>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">다음</button>
        </form>
    </div>
</body>
</html>
