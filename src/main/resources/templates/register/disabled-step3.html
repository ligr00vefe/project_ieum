<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의사소통 방식 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">
    <div th:replace="~{fragments/register-header :: header('badge')}"></div>

    <main class="flex-1 flex items-start justify-center px-4 py-8">
        <div class="w-full max-w-lg">

            <!-- Step indicator -->
            <div class="flex items-center gap-2 mb-6 px-1">
                <th:block th:each="i : ${#numbers.sequence(1, 4)}">
                    <div th:classappend="${i == 3} ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : (${i < 3} ? 'bg-indigo-200 text-indigo-600' : 'bg-gray-200 text-gray-400')"
                         class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all flex-shrink-0">
                        <th:block th:if="${i < 3}">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                            </svg>
                        </th:block>
                        <th:block th:if="${i >= 3}" th:text="${i}"></th:block>
                    </div>
                    <div th:if="${i < 4}"
                         th:classappend="${i < 3} ? 'bg-indigo-300' : 'bg-gray-200'"
                         class="flex-1 h-0.5 min-w-[2rem] rounded-full"></div>
                </th:block>
            </div>

            <!-- Card -->
            <div class="bg-surface rounded-3xl shadow-sm border border-line overflow-hidden">
                <div class="h-1 bg-surface-hover">
                    <div class="h-1 bg-indigo-600 rounded-full transition-all duration-500" style="width: 75%"></div>
                </div>

                <div class="p-7 sm:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">STEP 3 / 4</span>
                        <span class="text-xs text-gray-400 font-medium">의사소통 방식</span>
                    </div>

                    <h2 class="text-2xl font-extrabold text-ink mb-1">어떻게 소통하시나요?</h2>
                    <p class="text-sm text-gray-500 mb-7">선호하는 의사소통 방식을 알려주세요.<br>활동지원사 매칭의 핵심 조건이 됩니다.</p>

                    <form th:action="@{/register/disabled/step3}"
                          method="post"
                          th:object="${communicationInfo}"
                          class="space-y-4"
                          id="step3Form"
                          novalidate>
                        <input type="hidden" id="direction" name="direction" value="forward">

                        <!-- Communication Methods as radio-style cards -->
                        <div class="space-y-3">
                            <th:block th:if="${communicationMethods != null and !#lists.isEmpty(communicationMethods)}">
                                <th:block th:each="method : ${communicationMethods}">
                                    <div class="relative">
                                        <input type="checkbox"
                                               th:field="*{communicationMethodIds}"
                                               th:value="${method.id}"
                                               th:id="${'cm_' + method.id}"
                                               class="sr-only peer">
                                        <label th:for="${'cm_' + method.id}"
                                               class="flex items-center gap-4 w-full p-4 border-2 border-line-strong rounded-2xl cursor-pointer select-none transition-all hover:border-indigo-300 hover:bg-indigo-50/30 peer-checked:border-indigo-500 peer-checked:bg-indigo-50">
                                            <!-- 왼쪽 원: 체크 시 인디고 배경 + 체크 아이콘 -->
                                            <div class="cm-circle w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0 transition-all">
                                                <svg class="cm-check w-3 h-3 opacity-0 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                                                </svg>
                                            </div>
                                            <div>
                                                <div class="text-sm font-semibold text-gray-800" th:text="${method.name}">방법</div>
                                                <div class="text-xs text-gray-400 mt-0.5" th:text="${method.description}"></div>
                                            </div>
                                        </label>
                                    </div>
                                </th:block>
                            </th:block>

                            <!-- Fallback static options -->
                            <th:block th:if="${communicationMethods == null or #lists.isEmpty(communicationMethods)}">
                                <th:block th:each="item,stat : ${ {{'대화 가능','말로 충분히 의사소통을 할 수 있어요'},{'구어','짧은 단어나 짧은 문장으로 소통의 가능해요'},{'수어','수화를 사용하는 활동지원사를 선호해요'},{'기타 방식','AAC, 글쓰기 등 별도 의사소통 방식 사용'}} }">
                                    <div class="relative">
                                        <input type="checkbox"
                                               th:id="${'cm_static_' + stat.index}"
                                               name="communicationMethodIds"
                                               th:value="${stat.index + 1}"
                                               class="sr-only peer">
                                        <label th:for="${'cm_static_' + stat.index}"
                                               class="flex items-center gap-4 w-full p-4 border-2 border-line-strong rounded-2xl cursor-pointer select-none transition-all hover:border-indigo-300 hover:bg-indigo-50/30 peer-checked:border-indigo-500 peer-checked:bg-indigo-50">
                                            <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center flex-shrink-0 transition-all peer-checked:bg-indigo-100">
                                                <svg class="w-5 h-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                                                </svg>
                                            </div>
                                            <div class="flex-1">
                                                <div class="text-sm font-semibold text-gray-800" th:text="${item[0]}">대화 가능</div>
                                                <div class="text-xs text-gray-400 mt-0.5" th:text="${item[1]}">설명</div>
                                            </div>
                                            <div class="ml-auto w-5 h-5 rounded-full bg-indigo-600 flex items-center justify-center opacity-0 scale-75 transition-all peer-checked:opacity-100 peer-checked:scale-100 flex-shrink-0">
                                                <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                                                </svg>
                                            </div>
                                        </label>
                                    </div>
                                </th:block>
                            </th:block>
                        </div>

                        <!-- Buttons -->
                        <div class="flex gap-3 pt-3">
                            <button type="button" onclick="goBack()"
                                    class="flex-1 py-3.5 border-2 border-line-strong text-ink-muted font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-surface-muted active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                                </svg>
                                이전
                            </button>
                            <button type="submit"
                                    class="flex-[2] py-3.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl hover:bg-indigo-700 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all flex items-center justify-center gap-1.5">
                                다음 단계
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        function goBack() {
            document.getElementById('direction').value = 'back';
            document.getElementById('step3Form').submit();
        }
    </script>
    <style>
        /* peer-checked:가 label 내부 자식에 적용 안 되므로 CSS 직접 처리 */
        .peer:checked ~ label .cm-circle {
            border-color: #6366f1;
            background-color: #6366f1;
        }
        .peer:checked ~ label .cm-check {
            opacity: 1;
            color: white;
        }
    </style>
</body>
</html>
