<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>활동 정보 입력 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <th:block th:replace="~{layout/prefs :: prefs}"></th:block>
    <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
</head>
<body class="min-h-screen bg-surface-alt flex flex-col">
    <div th:replace="~{fragments/register-header :: header('badge')}"></div>

    <main class="flex-1 flex items-start justify-center px-4 py-8">
        <div class="w-full max-w-lg">

            <!-- Step indicator -->
            <div class="flex items-center gap-2 mb-6 px-1">
                <th:block th:each="i : ${#numbers.sequence(1, 4)}">
                    <div th:classappend="${i == 3} ? 'bg-teal-500 text-white shadow-md shadow-teal-100' : (${i < 3} ? 'bg-teal-200 text-teal-600' : 'bg-gray-200 text-gray-400')"
                         class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all flex-shrink-0">
                        <th:block th:if="${i < 3}">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                            </svg>
                        </th:block>
                        <th:block th:if="${i >= 3}" th:text="${i}"></th:block>
                    </div>
                    <div th:if="${i < 4}"
                         th:classappend="${i < 3} ? 'bg-teal-200' : 'bg-gray-200'"
                         class="flex-1 h-0.5 min-w-[2rem] rounded-full"></div>
                </th:block>
            </div>

            <!-- Card -->
            <div class="bg-surface rounded-3xl shadow-sm border border-line overflow-hidden">
                <div class="h-1 bg-surface-hover">
                    <div class="h-1 bg-teal-500 rounded-full transition-all duration-500" style="width: 75%"></div>
                </div>

                <div class="p-7 sm:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <span class="text-xs font-bold text-teal-600 uppercase tracking-wider">STEP 3 / 4</span>
                        <span class="text-xs text-gray-400 font-medium">활동 정보</span>
                    </div>

                    <h2 class="text-2xl font-extrabold text-ink mb-1">활동 정보를 입력해주세요</h2>
                    <p class="text-sm text-gray-500 mb-7">이음 매칭 시 활용되는 핵심 조건입니다.</p>

                    <form th:action="@{/register/caregiver/step3}"
                          method="post"
                          th:object="${activityInfo}"
                          class="space-y-7"
                          id="step3Form"
                          novalidate>
                        <input type="hidden" id="direction" name="direction" value="forward">

                        <!-- Experience -->
                        <div class="space-y-3">
                            <label class="block text-sm font-semibold text-ink-muted">
                                경력 <span class="text-red-500">*</span>
                            </label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                                <th:block th:each="exp,stat : ${ {'1년 미만','1-3년','3-5년','5년 이상'} }">
                                    <div class="relative">
                                        <input type="radio"
                                               th:id="${'exp_' + stat.index}"
                                               name="experience"
                                               th:value="${exp}"
                                               th:checked="${activityInfo?.experience == exp}"
                                               class="sr-only peer">
                                        <label th:for="${'exp_' + stat.index}"
                                               class="flex items-center justify-center w-full py-3 border-2 border-line-strong rounded-xl cursor-pointer select-none text-sm font-semibold text-ink-muted transition-all hover:border-teal-300 hover:text-teal-600 peer-checked:bg-teal-500 peer-checked:border-teal-500 peer-checked:text-white"
                                               th:text="${exp}">경력</label>
                                    </div>
                                </th:block>
                            </div>
                        </div>

                        <!-- Service categories -->
                        <div class="space-y-3">
                            <label class="block text-sm font-semibold text-ink-muted">
                                가능 업무
                                <span class="text-xs text-gray-400 font-normal ml-1">(복수 선택)</span>
                            </label>
                            <div class="flex flex-wrap gap-2.5">
                                <th:block th:each="cat,stat : ${ {'이동 보조','병원 동행','의사소통 보조','일상생활','장기 케어','야간 보호'} }">
                                    <div class="relative">
                                        <input type="checkbox"
                                               th:id="${'cat_' + stat.index}"
                                               name="serviceCategories"
                                               th:value="${cat}"
                                               th:checked="${activityInfo?.serviceCategories != null and #lists.contains(activityInfo.serviceCategories, cat)}"
                                               class="sr-only peer">
                                        <label th:for="${'cat_' + stat.index}"
                                               class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-line-strong text-ink-muted text-sm font-medium cursor-pointer select-none transition-all hover:border-teal-300 peer-checked:bg-teal-500 peer-checked:border-teal-500 peer-checked:text-white"
                                               th:text="${cat}">업무</label>
                                    </div>
                                </th:block>
                            </div>
                        </div>

                        <!-- Available times -->
                        <div class="space-y-3">
                            <label class="block text-sm font-semibold text-ink-muted">
                                가능 시간대
                                <span class="text-xs text-gray-400 font-normal ml-1">(복수 선택)</span>
                            </label>
                            <div class="flex flex-wrap gap-2.5">
                                <th:block th:each="slot,stat : ${ {'오전 (09-12)','오후 (12-18)','저녁 (18-22)','주말','공휴일','야간'} }">
                                    <div class="relative">
                                        <input type="checkbox"
                                               th:id="${'time_' + stat.index}"
                                               name="availableTimeSlots"
                                               th:value="${slot}"
                                               th:checked="${activityInfo?.availableTimeSlots != null and #lists.contains(activityInfo.availableTimeSlots, slot)}"
                                               class="sr-only peer">
                                        <label th:for="${'time_' + stat.index}"
                                               class="inline-flex items-center px-4 py-2.5 rounded-xl border-2 border-line-strong text-ink-muted text-sm font-medium cursor-pointer select-none transition-all hover:border-teal-300 peer-checked:bg-teal-500 peer-checked:border-teal-500 peer-checked:text-white"
                                               th:text="${slot}">시간</label>
                                    </div>
                                </th:block>
                            </div>
                        </div>

                        <!-- Activity regions -->
                        <div class="space-y-3">
                            <label class="block text-sm font-semibold text-ink-muted">
                                활동 가능 지역 <span class="text-red-500">*</span>
                            </label>

                            <!-- Region search input -->
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                    <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    </svg>
                                </div>
                                <input type="text"
                                       id="region-search"
                                       placeholder="지역 검색 (예: 강남구, 마포구)"
                                       autocomplete="off"
                                       class="w-full pl-10 pr-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all"
                                       oninput="filterRegions(this.value)">
                            </div>

                            <!-- Region list (scrollable) -->
                            <div id="region-list"
                                 class="max-h-48 overflow-y-auto border border-line-strong rounded-xl divide-y divide-gray-50 hidden">
                                <th:block th:each="region : ${regions}">
                                    <label class="flex items-center gap-3 px-4 py-2.5 hover:bg-teal-50 cursor-pointer transition-colors">
                                        <input type="checkbox"
                                               th:field="*{regionIds}"
                                               th:value="${region.id}"
                                               class="w-4 h-4 rounded text-teal-500 border-gray-300 focus:ring-teal-500"
                                               onchange="updateSelectedRegions(this, [[${region.sido}]], [[${region.sigungu}]])">
                                        <span class="text-sm text-ink-muted">
                                            <span th:text="${region.sido}" class="text-gray-500"></span>
                                            <span th:text="${' ' + region.sigungu}" class="font-medium"></span>
                                        </span>
                                    </label>
                                </th:block>
                            </div>

                            <!-- Selected region tags display -->
                            <div id="selected-regions" class="flex flex-wrap gap-2 min-h-[2.5rem]">
                                <!-- Selected regions appear here as tags -->
                                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-teal-50 border border-teal-200 text-teal-700 text-xs font-medium rounded-lg" id="region-placeholder">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                    </svg>
                                    지역을 검색해서 추가하세요
                                </div>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="goBack()"
                                    class="flex-1 py-3.5 border-2 border-line-strong text-ink-muted font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-surface-muted active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                                </svg>
                                이전
                            </button>
                            <button type="submit"
                                    class="flex-[2] py-3.5 bg-teal-500 text-white font-semibold text-sm rounded-xl hover:bg-teal-500 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 transition-all flex items-center justify-center gap-1.5">
                                다음 단계
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        function filterRegions(query) {
            const list = document.getElementById('region-list');
            const labels = list.querySelectorAll('label');
            const q = query.trim().toLowerCase();

            if (!q) {
                list.classList.add('hidden');
                return;
            }
            list.classList.remove('hidden');
            labels.forEach(label => {
                const text = label.textContent.toLowerCase();
                label.style.display = text.includes(q) ? '' : 'none';
            });
        }

        function updateSelectedRegions(checkbox, sido, sigungu) {
            const container = document.getElementById('selected-regions');
            const placeholder = document.getElementById('region-placeholder');
            const tagId = 'region-tag-' + checkbox.value;

            if (checkbox.checked) {
                if (placeholder) placeholder.classList.add('hidden');
                const tag = document.createElement('div');
                tag.id = tagId;
                tag.className = 'flex items-center gap-1.5 px-3 py-1.5 bg-teal-500 text-white text-xs font-medium rounded-lg';
                tag.innerHTML = `
                    <span>${sido} ${sigungu}</span>
                    <button type="button" onclick="removeRegion('${checkbox.value}', this)"
                            class="ml-0.5 w-3.5 h-3.5 flex items-center justify-center hover:bg-teal-400 rounded-full transition-colors">
                        <svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                `;
                container.appendChild(tag);
            } else {
                const tag = document.getElementById(tagId);
                if (tag) tag.remove();
                checkPlaceholder();
            }
        }

        function removeRegion(value, btn) {
            const checkbox = document.querySelector(`input[value="${value}"][type="checkbox"]`);
            if (checkbox) checkbox.checked = false;
            btn.closest('div').remove();
            checkPlaceholder();
        }

        function checkPlaceholder() {
            const container = document.getElementById('selected-regions');
            const placeholder = document.getElementById('region-placeholder');
            const tags = container.querySelectorAll('[id^="region-tag-"]');
            if (tags.length === 0 && placeholder) placeholder.classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('direction').value = 'back';
            document.getElementById('step3Form').submit();
        }
    </script>
</body>
</html>
