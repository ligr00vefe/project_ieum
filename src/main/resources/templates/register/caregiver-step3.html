<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>활동 정보</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center mb-8">활동 정보</h1>
        <form th:action="@{/register/caregiver/step3}" method="post" th:object="${activityInfo}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">경력</label>
                <textarea th:field="*{experience}" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">활동 가능 지역</label>
                <div class="space-y-2 max-h-48 overflow-y-auto">
                    <div th:each="region : ${regions}" class="flex items-center">
                        <input type="checkbox" th:field="*{regionIds}" th:value="${region.id}" class="mr-2">
                        <label th:text="${region.sido} + ' ' + ${region.sigungu}" class="text-gray-700"></label>
                    </div>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">다음</button>
        </form>
    </div>
</body>
</html>
