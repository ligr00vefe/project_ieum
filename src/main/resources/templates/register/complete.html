<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가입 완료 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col">

    <!-- Top bar -->
    <div class="bg-white border-b border-gray-100 px-4 py-3.5">
        <div class="max-w-7xl mx-auto">
            <a th:href="@{/}" class="flex items-center gap-2.5 group w-fit">
                <div class="w-8 h-8 bg-teal-500 rounded-xl flex items-center justify-center group-hover:bg-teal-600 transition-colors">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
                    </svg>
                </div>
                <div class="leading-tight">
                    <div class="text-[14px] font-bold text-gray-900">이음</div>
                    <div class="text-[9px] text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
                </div>
            </a>
        </div>
    </div>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md text-center">

            <!-- Success animation -->
            <div class="relative inline-flex mb-8">
                <!-- Outer glow rings -->
                <div class="absolute inset-0 rounded-full bg-green-100 animate-ping opacity-30 scale-125"></div>
                <div class="absolute inset-0 rounded-full bg-green-50 scale-110"></div>
                <!-- Icon -->
                <div class="relative w-24 h-24 bg-green-500 rounded-full flex items-center justify-center shadow-xl shadow-green-200">
                    <svg class="w-12 h-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
            </div>

            <!-- Text -->
            <h1 class="text-3xl font-extrabold text-gray-900 mb-3">가입이 완료되었습니다!</h1>
            <p class="text-gray-500 text-base leading-relaxed mb-2">
                이음 가족이 되신 것을 환영합니다 🎉
            </p>
            <p class="text-gray-400 text-sm mb-10">
                이제 로그인하고 나에게 맞는 케어 파트너를<br>찾아보세요.
            </p>

            <!-- What's next card -->
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 text-left mb-8">
                <h2 class="text-sm font-bold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                    다음 단계 안내
                </h2>
                <ul class="space-y-3">
                    <li class="flex items-start gap-3">
                        <div class="w-6 h-6 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                            <span class="text-xs font-bold text-indigo-600">1</span>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">로그인</p>
                            <p class="text-xs text-gray-400 mt-0.5">가입한 이메일과 비밀번호로 로그인하세요.</p>
                        </div>
                    </li>
                    <li class="flex items-start gap-3">
                        <div class="w-6 h-6 bg-indigo-100 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                            <span class="text-xs font-bold text-indigo-600">2</span>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">프로필 완성</p>
                            <p class="text-xs text-gray-400 mt-0.5">마이페이지에서 프로필 사진과 추가 정보를 입력하세요.</p>
                        </div>
                    </li>
                    <li class="flex items-start gap-3">
                        <div class="w-6 h-6 bg-teal-100 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                            <span class="text-xs font-bold text-teal-600">3</span>
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">매칭 시작</p>
                            <p class="text-xs text-gray-400 mt-0.5">매칭 게시판에서 나에게 맞는 파트너를 찾아보세요.</p>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Action buttons -->
            <div class="flex flex-col sm:flex-row gap-3">
                <a th:href="@{/login}"
                   class="flex-1 inline-flex items-center justify-center gap-2 py-3.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-sm shadow-indigo-100">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    로그인하기
                </a>
                <a th:href="@{/}"
                   class="flex-1 inline-flex items-center justify-center gap-2 py-3.5 border-2 border-gray-200 text-gray-700 font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-gray-50 active:scale-[0.98] transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    홈으로 이동
                </a>
            </div>
        </div>
    </main>

</body>
</html>
