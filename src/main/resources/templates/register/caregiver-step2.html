<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자격증 입력 - 이음 Care Match</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
    <th:block th:replace="~{layout/prefs :: prefs}"></th:block>
    <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
</head>
<body class="min-h-screen bg-surface-alt flex flex-col">
    <div th:replace="~{fragments/register-header :: header('badge')}"></div>

    <main class="flex-1 flex items-start justify-center px-4 py-8">
        <div class="w-full max-w-lg">

            <!-- Step indicator -->
            <nav aria-label="가입 단계" class="mb-6 px-1">
                <ol class="flex items-center gap-2 w-full list-none p-0 m-0">
                <th:block th:each="i : ${#numbers.sequence(1, 4)}">
                    <li class="flex-shrink-0" th:attr="aria-current=${i == 2} ? 'step' : null">
                    <div th:classappend="${i == 2} ? 'bg-teal-500 text-white shadow-md shadow-teal-100' : (${i < 2} ? 'bg-teal-200 text-teal-600' : 'bg-gray-200 text-gray-400')"
                         class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all">
                        <th:block th:if="${i < 2}">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                            </svg>
                            <span class="sr-only" th:text="'단계 ' + ${i} + ' 완료'"></span>
                        </th:block>
                        <th:block th:if="${i == 2}">
                            <span th:text="${i}" aria-hidden="true"></span>
                            <span class="sr-only">단계 2 현재</span>
                        </th:block>
                        <th:block th:if="${i > 2}">
                            <span th:text="${i}" aria-hidden="true"></span>
                            <span class="sr-only" th:text="'단계 ' + ${i}"></span>
                        </th:block>
                    </div>
                    </li>
                    <li th:if="${i < 4}" aria-hidden="true"
                        th:classappend="${i < 2} ? 'bg-teal-200' : 'bg-gray-200'"
                        class="flex-1 h-0.5 min-w-[2rem] rounded-full"></li>
                </th:block>
                </ol>
            </nav>

            <!-- Card -->
            <div class="bg-surface rounded-3xl shadow-sm border border-line overflow-hidden">
                <div class="h-1 bg-surface-hover">
                    <div class="h-1 bg-teal-500 rounded-full transition-all duration-500" style="width: 50%"></div>
                </div>

                <div class="p-7 sm:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <span class="text-xs font-bold text-teal-600 uppercase tracking-wider">STEP 2 / 4</span>
                        <span class="text-xs text-gray-400 font-medium">자격증 정보</span>
                    </div>

                    <h2 class="text-2xl font-extrabold text-ink mb-1">자격증을 보유하고 계신가요?</h2>
                    <p class="text-sm text-gray-500 mb-7">이음 신뢰를 위한 자격증 검증 단계입니다.</p>

                    <form th:action="@{/register/caregiver/step2}"
                          method="post"
                          th:object="${certificationInfo}"
                          class="space-y-6"
                          id="step2Form"
                          novalidate>
                        <input type="hidden" id="direction" name="direction" value="forward">

                        <!-- Has Certification toggle -->
                        <div class="space-y-3">
                            <label class="block text-sm font-semibold text-ink-muted">
                                자격증 보유 여부 <span class="text-red-500">*</span>
                            </label>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="relative">
                                    <input type="radio"
                                           th:field="*{hasCertification}"
                                           value="true"
                                           id="cert_yes"
                                           class="sr-only peer"
                                           onchange="toggleCertFields(true)">
                                    <label for="cert_yes"
                                           class="flex items-center justify-center gap-2.5 w-full py-3.5 border-2 border-line-strong rounded-xl cursor-pointer select-none transition-all hover:border-teal-300 peer-checked:border-teal-500 peer-checked:bg-teal-50 font-semibold text-sm text-ink-muted peer-checked:text-teal-700">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                                        </svg>
                                        예, 보유 중
                                    </label>
                                </div>
                                <div class="relative">
                                    <input type="radio"
                                           th:field="*{hasCertification}"
                                           value="false"
                                           id="cert_no"
                                           class="sr-only peer"
                                           onchange="toggleCertFields(false)">
                                    <label for="cert_no"
                                           class="flex items-center justify-center gap-2.5 w-full py-3.5 border-2 border-line-strong rounded-xl cursor-pointer select-none transition-all hover:border-gray-300 peer-checked:border-gray-400 peer-checked:bg-surface-muted font-semibold text-sm text-ink-muted">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                        </svg>
                                        아니오
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Certificate list (shown when hasCertification = true) -->
                        <div id="cert-fields"
                             th:classappend="${certificationInfo?.hasCertification == true} ? '' : 'hidden'"
                             class="space-y-4">
                            <!-- Certificate inputs container -->
                            <div id="cert-list" class="space-y-3">
                                <div class="flex items-center gap-2">
                                    <div class="flex-1">
                                        <label for="certificationType" class="block text-xs font-semibold text-gray-500 mb-1.5">자격증 1</label>
                                        <input type="text"
                                               id="certificationType"
                                               th:field="*{certificationType}"
                                               placeholder="예: 사회복지사 2급"
                                               class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
                                    </div>
                                </div>
                            </div>

                            <!-- Add more certs -->
                            <button type="button"
                                    onclick="addCertField()"
                                    class="w-full py-3 border-2 border-dashed border-line-strong text-gray-500 text-sm font-semibold rounded-xl hover:border-teal-300 hover:text-teal-600 hover:bg-teal-50 transition-all flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                                </svg>
                                자격증 추가하기
                            </button>
                        </div>

                        <!-- No cert info box -->
                        <div id="no-cert-info"
                             th:classappend="${certificationInfo?.hasCertification == false or certificationInfo?.hasCertification == null} ? '' : 'hidden'"
                             class="p-4 bg-surface-muted border border-line rounded-xl">
                            <p class="text-sm text-gray-500 leading-relaxed">
                                자격증이 없어도 가입 가능합니다.<br>
                                <span class="text-gray-400 text-xs">단, 자격증 보유 시 매칭 우선순위가 높아집니다.</span>
                            </p>
                        </div>

                        <!-- Buttons -->
                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="goBack()"
                                    class="flex-1 py-3.5 border-2 border-line-strong text-ink-muted font-semibold text-sm rounded-xl hover:border-gray-300 hover:bg-surface-muted active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                                </svg>
                                이전
                            </button>
                            <button type="submit"
                                    class="flex-[2] py-3.5 bg-teal-500 text-white font-semibold text-sm rounded-xl hover:bg-teal-500 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 transition-all flex items-center justify-center gap-1.5">
                                다음 단계
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        let certCount = 1;

        function toggleCertFields(hasCert) {
            const certFields = document.getElementById('cert-fields');
            const noCertInfo = document.getElementById('no-cert-info');
            if (hasCert) {
                certFields.classList.remove('hidden');
                noCertInfo.classList.add('hidden');
            } else {
                certFields.classList.add('hidden');
                noCertInfo.classList.remove('hidden');
            }
        }

        function addCertField() {
            certCount++;
            const inputId = 'additionalCert_' + certCount;
            const list = document.getElementById('cert-list');
            const div = document.createElement('div');
            div.className = 'flex items-center gap-2';
            div.innerHTML = `
                <div class="flex-1">
                    <label for="${inputId}" class="block text-xs font-semibold text-gray-500 mb-1.5">자격증 ${certCount}</label>
                    <input type="text" id="${inputId}" name="additionalCertification" placeholder="자격증명을 입력하세요"
                           class="w-full px-4 py-3 border border-line-strong rounded-xl text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all">
                </div>
                <button type="button" aria-label="자격증 ${certCount} 삭제" onclick="this.parentElement.remove();"
                        class="mt-6 w-9 h-9 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            `;
            list.appendChild(div);
        }

        // Init state on load
        document.addEventListener('DOMContentLoaded', function() {
            const certYes = document.getElementById('cert_yes');
            const certNo = document.getElementById('cert_no');
            if (certYes.checked) toggleCertFields(true);
            else if (certNo.checked) toggleCertFields(false);
        });

        function goBack() {
            document.getElementById('direction').value = 'back';
            document.getElementById('step2Form').submit();
        }
    </script>
</body>
</html>
