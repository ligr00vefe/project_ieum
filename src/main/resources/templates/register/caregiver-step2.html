<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자격증 입력</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold text-center mb-8">자격증 입력</h1>
        <form th:action="@{/register/caregiver/step2}" method="post" th:object="${certificationInfo}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">자격증 보유 여부</label>
                <div class="space-x-4">
                    <label class="inline-flex items-center">
                        <input type="radio" th:field="*{hasCertification}" value="true" required class="mr-2">
                        <span>예</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" th:field="*{hasCertification}" value="false" class="mr-2">
                        <span>아니오</span>
                    </label>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">자격증 종류</label>
                <input type="text" th:field="*{certificationType}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600 transition">다음</button>
        </form>
    </div>
</body>
</html>
