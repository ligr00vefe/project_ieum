<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<section class="max-w-lg mx-auto px-4 sm:px-6 py-10">

    <nav aria-label="breadcrumb">
        <ol class="flex items-center gap-2 text-sm text-gray-400 mb-6 list-none p-0 m-0">
            <li><a th:href="@{/mypage}" class="hover:text-indigo-600 transition-colors">마이페이지</a></li>
            <li aria-hidden="true"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></li>
            <li><span class="text-gray-600 font-medium" aria-current="page">비밀번호 변경</span></li>
        </ol>
    </nav>

    <div th:if="${errorMessage}" th:text="${errorMessage}" role="alert"
         class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>
    <div th:if="${successMessage}" th:text="${successMessage}" role="status"
         class="mb-4 rounded-xl border border-teal-200 bg-teal-50 px-4 py-3 text-sm text-teal-700"></div>

    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-7">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 bg-indigo-100 rounded-2xl flex items-center justify-center">
                <svg class="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-base font-bold text-gray-900">비밀번호 변경</h1>
                <p class="text-xs text-gray-400 mt-0.5">현재 비밀번호를 확인 후 새 비밀번호를 설정하세요.</p>
            </div>
        </div>

        <form th:action="@{/mypage/password}" method="post" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div>
                <label for="currentPassword" class="block text-xs font-semibold text-gray-500 mb-1.5">현재 비밀번호</label>
                <input type="password" id="currentPassword" name="currentPassword" required
                       autocomplete="current-password"
                       placeholder="현재 비밀번호를 입력하세요"
                       class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all"/>
            </div>

            <div>
                <label for="newPassword" class="block text-xs font-semibold text-gray-500 mb-1.5">새 비밀번호</label>
                <input type="password" id="newPassword" name="newPassword" required minlength="8"
                       autocomplete="new-password"
                       placeholder="새 비밀번호 (8자 이상)"
                       class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all"/>
            </div>

            <div>
                <label for="confirmPassword" class="block text-xs font-semibold text-gray-500 mb-1.5">새 비밀번호 확인</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8"
                       autocomplete="new-password"
                       placeholder="새 비밀번호를 다시 입력하세요"
                       class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all"/>
            </div>

            <div class="pt-2 flex gap-3">
                <a th:href="@{/mypage}"
                   class="flex-1 py-3 text-sm font-semibold text-gray-600 bg-white border border-gray-200 rounded-xl text-center hover:bg-gray-50 transition-all">
                    취소
                </a>
                <button type="submit"
                        class="flex-1 py-3 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-all shadow-sm shadow-indigo-100">
                    변경하기
                </button>
            </div>
        </form>

        <div class="mt-5 text-center">
            <a th:href="@{/password/forgot}"
               class="text-sm text-gray-400 hover:text-indigo-600 transition-colors underline underline-offset-2">
                비밀번호를 잊어버리셨나요?
            </a>
        </div>
    </div>

</section>

<script>
    const PW_REGEX = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$/;
    const newPw = document.getElementById('newPassword');
    const confirmPw = document.getElementById('confirmPassword');

    function addHint(input, id) {
        let hint = document.getElementById(id);
        if (!hint) {
            hint = document.createElement('p');
            hint.id = id;
            hint.className = 'text-xs mt-1 hidden';
            input.parentElement.appendChild(hint);
        }
        return hint;
    }

    newPw.addEventListener('input', function () {
        const hint = addHint(newPw, 'new-pw-hint');
        const valid = PW_REGEX.test(newPw.value);
        newPw.classList.toggle('border-red-300', !valid && newPw.value.length > 0);
        newPw.classList.toggle('border-green-300', valid);
        hint.classList.remove('hidden');
        if (valid) {
            hint.textContent = '✓ 사용 가능한 비밀번호입니다.';
            hint.className = 'text-xs mt-1 text-green-600';
        } else if (newPw.value.length > 0) {
            hint.textContent = '영문·숫자·특수문자(@$!%*#?&)를 포함한 8자 이상으로 입력해주세요.';
            hint.className = 'text-xs mt-1 text-red-500';
        } else {
            hint.classList.add('hidden');
        }
    });

    confirmPw.addEventListener('input', function () {
        const hint = addHint(confirmPw, 'confirm-pw-hint');
        if (!confirmPw.value) { hint.classList.add('hidden'); return; }
        const match = newPw.value === confirmPw.value;
        hint.classList.remove('hidden');
        hint.textContent = match ? '✓ 비밀번호가 일치합니다.' : '비밀번호가 일치하지 않습니다.';
        hint.className = 'text-xs mt-1 ' + (match ? 'text-green-600' : 'text-red-500');
    });

    document.querySelector('form').addEventListener('submit', function (e) {
        if (!PW_REGEX.test(newPw.value)) {
            e.preventDefault();
            newPw.focus();
            alert('비밀번호는 영문·숫자·특수문자(@$!%*#?&)를 포함한 8자 이상으로 입력해주세요.');
            return;
        }
        if (newPw.value !== confirmPw.value) {
            e.preventDefault();
            confirmPw.focus();
        }
    });
</script>
</th:block>
</html>
