<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('이음')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>
<main class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
    <section class="grid gap-8 lg:grid-cols-[1.05fr_0.95fr] lg:items-center">
        <div>
            <p class="text-sm font-bold uppercase tracking-wide text-indigo-700">Care Match</p>
            <h1 class="mt-3 text-4xl font-bold leading-tight text-slate-950 sm:text-5xl">나의 상황과 너의 케어가 만나는 곳, 이음.</h1>
            <p class="mt-5 max-w-2xl text-lg leading-8 text-slate-700">장애 유형, 생활 방식, 의사소통 방식, 이동 상황을 바탕으로 가장 적합한 활동지원사를 안전하게 연결합니다.</p>
            <div class="mt-7 flex flex-wrap gap-3">
                <a th:href="@{/register}" class="rounded-md bg-indigo-700 px-5 py-3 font-semibold text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">가입 시작하기</a>
                <a th:href="@{/requests}" class="rounded-md border border-indigo-200 bg-white px-5 py-3 font-semibold text-indigo-700 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">매칭 게시판 보기</a>
            </div>
        </div>
        <div class="rounded-lg border border-indigo-100 bg-white p-5 shadow-sm">
            <img th:src="@{/assets/헤더.jpg}" alt="이음 서비스 소개 이미지" class="h-auto w-full rounded-md object-cover">
        </div>
    </section>

    <section class="mt-10 grid gap-4 md:grid-cols-3">
        <article class="rounded-lg border border-indigo-100 bg-white p-5">
            <h2 class="text-lg font-bold text-slate-950">성향 기반 매칭</h2>
            <p class="mt-2 text-sm leading-6 text-slate-700">시간과 거리뿐 아니라 소통 방식, 피해야 할 상황, 케어 스타일을 함께 봅니다.</p>
        </article>
        <article class="rounded-lg border border-indigo-100 bg-white p-5">
            <h2 class="text-lg font-bold text-slate-950">첫 만남 안전</h2>
            <p class="mt-2 text-sm leading-6 text-slate-700">지원 직후 채팅으로 동선과 주의사항을 확인하고 안전 체크리스트를 제공합니다.</p>
        </article>
        <article class="rounded-lg border border-indigo-100 bg-white p-5">
            <h2 class="text-lg font-bold text-slate-950">당사자 중심 케어</h2>
            <p class="mt-2 text-sm leading-6 text-slate-700">이용자가 자신의 조건과 선호를 직접 선택하고 매칭을 확정합니다.</p>
        </article>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
