<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('마이페이지')}"></head>
<body class="min-h-screen bg-[#f6f7ff] text-slate-900">
<div th:replace="~{layout/header :: header}"></div>
<div th:replace="~{layout/nav :: nav}"></div>
<main class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <section class="rounded-lg border border-indigo-100 bg-white p-6">
        <p class="text-sm font-semibold text-indigo-700">이용자 마이페이지</p>
        <h1 class="mt-1 text-2xl font-bold">내 매칭 현황</h1>
        <div class="mt-5 grid gap-3 sm:grid-cols-3">
            <a th:href="@{/requests/new}" class="rounded-md bg-indigo-700 p-4 font-semibold text-white hover:bg-indigo-800">도움 요청 작성</a>
            <a th:href="@{/my/requests}" class="rounded-md border border-indigo-100 bg-indigo-50 p-4 font-semibold text-indigo-800 hover:bg-indigo-100">내 요청 보기</a>
            <a th:href="@{/chat/conversations}" class="rounded-md border border-indigo-100 bg-white p-4 font-semibold text-slate-800 hover:bg-indigo-50">채팅방</a>
        </div>
    </section>
    <section class="mt-5 space-y-3">
        <article th:each="request : ${requests}" class="rounded-lg border border-indigo-100 bg-white p-5">
            <div class="flex flex-wrap justify-between gap-3">
                <div>
                    <h2 class="font-bold"><a th:href="@{/my/requests/{id}(id=${request.id})}" th:text="${request.title}">요청</a></h2>
                    <p class="mt-1 text-sm text-slate-600" th:text="${request.desiredDate + ' · ' + request.serviceCategory.nameKo}">정보</p>
                </div>
                <span th:text="${request.status}" class="rounded-full bg-indigo-50 px-3 py-1 text-sm font-semibold text-indigo-700">OPEN</span>
            </div>
        </article>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
