<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">

<!-- 뒤로가기 -->
<div class="flex items-center gap-3 mb-5">
    <a th:href="@{/admin/popups}"
       class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-ink-muted transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        팝업 목록
    </a>
    <span class="text-slate-300">/</span>
    <span class="text-sm font-medium text-ink-muted">상세</span>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Main Content -->
    <div class="lg:col-span-2 space-y-4">

        <!-- 팝업명 및 상태 -->
        <div class="bg-surface rounded-2xl border border-line p-6">
            <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                    <h2 class="text-2xl font-bold text-ink" th:text="${popup.name}">팝업명</h2>
                    <p class="text-sm text-slate-500 mt-1"
                       th:text="${#temporals.format(popup.createdAt, 'yyyy년 MM월 dd일 HH:mm')}">-</p>
                </div>
                <span th:if="${popup.enabled && !popup.isExpired()}"
                      class="px-3 py-1 text-xs font-semibold rounded-full bg-teal-50 text-teal-600">활성</span>
                <span th:if="${!popup.enabled}"
                      class="px-3 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-400">비활성</span>
                <span th:if="${popup.isExpired()}"
                      class="px-3 py-1 text-xs font-semibold rounded-full bg-red-50 text-red-600">만료됨</span>
            </div>
        </div>

        <!-- 내용 -->
        <div class="bg-surface rounded-2xl border border-line p-6">
            <h3 class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-4">내용</h3>
            <div class="prose prose-sm max-w-none text-ink-muted"
                 th:utext="${popup.content}">내용</div>
        </div>

    </div>

    <!-- Sidebar -->
    <div class="space-y-4">

        <!-- 정보 -->
        <div class="bg-surface rounded-2xl border border-line p-5 space-y-3">
            <div>
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wide mb-1">상태</p>
                <p th:if="${popup.enabled && !popup.isExpired()}"
                   class="text-sm font-medium text-teal-600">활성 중</p>
                <p th:if="${!popup.enabled}"
                   class="text-sm font-medium text-slate-400">비활성</p>
                <p th:if="${popup.isExpired()}"
                   class="text-sm font-medium text-red-600">만료됨</p>
            </div>
            <div class="border-t border-line pt-3">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wide mb-1">만료일시</p>
                <p class="text-sm font-medium text-ink-muted"
                   th:text="${#temporals.format(popup.expiresAt, 'yyyy.MM.dd HH:mm')}">-</p>
            </div>
            <div class="border-t border-line pt-3">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wide mb-1">생성일</p>
                <p class="text-sm font-medium text-ink-muted"
                   th:text="${#temporals.format(popup.createdAt, 'yyyy.MM.dd HH:mm')}">-</p>
            </div>
            <div class="border-t border-line pt-3">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wide mb-1">최근 수정</p>
                <p class="text-sm font-medium text-ink-muted"
                   th:text="${#temporals.format(popup.updatedAt, 'yyyy.MM.dd HH:mm')}">-</p>
            </div>
        </div>

        <!-- 액션 버튼 -->
        <div class="bg-surface rounded-2xl border border-line p-5 space-y-2">
            <a th:href="@{/admin/popups/{id}/edit(id=${popup.id})}"
               class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-medium text-indigo-600 border border-indigo-200 rounded-xl hover:bg-indigo-50 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                수정
            </a>
            <form th:action="@{/admin/popups/{id}/toggle(id=${popup.id})}" method="post">
                <button type="submit"
                        th:text="${popup.enabled ? '비활성화' : '활성화'}"
                        th:classappend="${popup.enabled} ? 'bg-surface-alt text-ink-muted border-line-strong hover:bg-slate-100' : 'bg-teal-50 text-teal-600 border-teal-200 hover:bg-teal-100'"
                        class="w-full px-4 py-2.5 text-sm font-medium border rounded-xl transition-colors">
                </button>
            </form>
            <form th:action="@{/admin/popups/{id}/delete(id=${popup.id})}" method="post"
                  onsubmit="return confirm('팝업을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.');">
                <button type="submit"
                        class="w-full px-4 py-2.5 text-sm font-medium text-red-600 border border-red-200 rounded-xl hover:bg-red-50 transition-colors">
                    삭제
                </button>
            </form>
        </div>

    </div>

</div>

</th:block>
</html>
