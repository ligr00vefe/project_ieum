<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='팝업 관리'">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-slate-900">팝업 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">팝업을 작성하고 표시 상태를 관리하세요.</p>
        </div>
        <a th:href="@{/admin/popups/new}"
           class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm shadow-indigo-100">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            새 팝업 작성
        </a>
    </div>

    <div th:if="${message}"
         class="mb-4 px-4 py-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-100 bg-slate-50">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">팝업명</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">만료일</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">등록일</th>
                    <th class="px-5 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="popup : ${popups}">
                <tr class="hover:bg-slate-50 transition-colors"
                    th:classappend="${!popup.enabled} ? 'opacity-60' : ''">
                    <td class="px-5 py-3.5">
                        <a th:href="@{/admin/popups/{id}(id=${popup.id})}"
                           class="font-medium text-slate-800 hover:text-indigo-600 transition-colors"
                           th:text="${popup.name}">팝업명</a>
                    </td>
                    <td class="px-5 py-3.5">
                        <span th:if="${popup.enabled && !popup.isExpired()}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full bg-teal-50 text-teal-600">활성</span>
                        <span th:if="${!popup.enabled}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full bg-slate-100 text-slate-400">비활성</span>
                        <span th:if="${popup.isExpired()}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full bg-red-50 text-red-600">만료됨</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs"
                        th:text="${#temporals.format(popup.expiresAt, 'yyyy.MM.dd HH:mm')}">-</td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs"
                        th:text="${#temporals.format(popup.createdAt, 'yyyy.MM.dd')}">-</td>
                    <td class="px-5 py-3.5">
                        <div class="flex items-center justify-end gap-3">
                            <form th:action="@{/admin/popups/{id}/toggle(id=${popup.id})}" method="post" class="inline">
                                <button type="submit"
                                        th:text="${popup.enabled ? '비활성화' : '활성화'}"
                                        class="text-xs font-medium text-slate-400 hover:text-slate-700 transition-colors">활성화</button>
                            </form>
                            <a th:href="@{/admin/popups/{id}/edit(id=${popup.id})}"
                               class="text-xs font-medium text-indigo-500 hover:text-indigo-700">수정</a>
                            <form th:action="@{/admin/popups/{id}/delete(id=${popup.id})}" method="post" class="inline">
                                <button type="submit"
                                        onclick="return confirm('삭제하시겠습니까?')"
                                        class="text-xs font-medium text-red-400 hover:text-red-600 transition-colors">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </th:block>
                <tr th:if="${#lists.isEmpty(popups)}">
                    <td colspan="5" class="px-5 py-10 text-center text-sm text-slate-400">팝업이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, '/admin/popups?')}"></div>

</div>
</th:block>
</html>
