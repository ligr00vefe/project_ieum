<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">

<!-- 뒤로가기 -->
<div class="flex items-center gap-3 mb-5">
    <a th:href="@{/admin/popups}"
       class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        팝업 목록
    </a>
    <span class="text-slate-300">/</span>
    <span class="text-sm font-medium text-slate-700"
          th:text="${popupId != null ? '수정' : '새 팝업 작성'}">작성</span>
</div>

<!-- CKEditor 5 v41 classic build -->
<link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.css">
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>

<style>
    .ck-editor__editable { min-height: 480px; }
    .ck-content img { max-width: 100%; height: auto; }
</style>

<form id="popupForm"
      th:action="${popupId != null ? '/admin/popups/' + popupId + '/edit' : '/admin/popups/new'}"
      th:object="${form}"
      method="post"
      class="flex flex-col gap-4">

    <!-- 팝업명 -->
    <div class="bg-surface rounded-2xl border border-line px-5 py-4">
        <input type="text" th:field="*{name}"
               placeholder="팝업명을 입력하세요"
               class="w-full text-sm font-medium text-ink placeholder-slate-300 bg-transparent focus:outline-none border-none">
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
           class="mt-1.5 text-xs text-red-500"></p>
    </div>

    <!-- 기간 선택 -->
    <div class="bg-surface rounded-2xl border border-line px-5 py-4">
        <h3 class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-3">팝업 표시 기간</h3>
        <div class="flex flex-wrap gap-x-8 gap-y-2">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" value="HOUR_1" th:field="*{duration}"
                       class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-400 cursor-pointer">
                <span class="text-sm text-ink-muted">1시간</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" value="HOUR_24" th:field="*{duration}"
                       class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-400 cursor-pointer">
                <span class="text-sm text-ink-muted">하루</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" value="WEEK_1" th:field="*{duration}"
                       class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-400 cursor-pointer">
                <span class="text-sm text-ink-muted">일주일</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" value="MONTH_1" th:field="*{duration}"
                       class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-400 cursor-pointer">
                <span class="text-sm text-ink-muted">한달</span>
            </label>
        </div>
        <p th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"
           class="mt-1.5 text-xs text-red-500"></p>
    </div>

    <!-- 클릭 링크 (선택) -->
    <div class="bg-surface rounded-2xl border border-line px-5 py-4">
        <h3 class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-1">팝업 클릭 링크 <span class="text-slate-400 font-normal normal-case">(선택)</span></h3>
        <p class="text-[11px] text-slate-400 mb-3">입력하면 팝업 이미지 클릭 시 해당 URL로 이동합니다.</p>
        <input type="url" th:field="*{linkUrl}"
               placeholder="https://example.com"
               class="w-full text-sm text-slate-700 placeholder-slate-300 bg-surface-alt border border-line-strong rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-transparent">
    </div>

    <!-- 레이아웃 선택 -->
    <div class="bg-surface rounded-2xl border border-line px-5 py-4">
        <h3 class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-3">팝업 레이아웃</h3>
        <div class="flex flex-wrap gap-3">
            <label class="cursor-pointer group" style="width:130px;">
                <input type="radio" value="AUTO" th:field="*{layout}" class="sr-only peer">
                <div class="border-2 border-line-strong peer-checked:border-indigo-500 rounded-xl p-3 flex flex-col items-center gap-1.5 transition-all group-hover:border-indigo-300" style="height:100px;">
                    <div class="flex gap-1 items-end mt-1">
                        <div class="w-5 bg-slate-200 rounded" style="height:22px"></div>
                        <div class="w-5 bg-slate-200 rounded" style="height:32px"></div>
                        <div class="w-5 bg-slate-200 rounded" style="height:16px"></div>
                    </div>
                    <span class="text-xs font-semibold text-ink-muted">자동</span>
                    <span class="text-[10px] text-slate-400">내용에 맞게</span>
                </div>
            </label>
            <label class="cursor-pointer group" style="width:130px;">
                <input type="radio" value="SQUARE" th:field="*{layout}" class="sr-only peer">
                <div class="border-2 border-line-strong peer-checked:border-indigo-500 rounded-xl p-3 flex flex-col items-center gap-1.5 transition-all group-hover:border-indigo-300" style="height:100px;">
                    <div class="w-9 h-9 bg-slate-200 rounded mt-1"></div>
                    <span class="text-xs font-semibold text-ink-muted">정사각형</span>
                    <span class="text-[10px] text-slate-400">520 × 520</span>
                </div>
            </label>
            <label class="cursor-pointer group" style="width:130px;">
                <input type="radio" value="PORTRAIT" th:field="*{layout}" class="sr-only peer">
                <div class="border-2 border-line-strong peer-checked:border-indigo-500 rounded-xl p-3 flex flex-col items-center gap-1.5 transition-all group-hover:border-indigo-300" style="height:100px;">
                    <div class="w-6 h-10 bg-slate-200 rounded mt-1"></div>
                    <span class="text-xs font-semibold text-ink-muted">세로형</span>
                    <span class="text-[10px] text-slate-400">420 × 680</span>
                </div>
            </label>
            <label class="cursor-pointer group" style="width:130px;">
                <input type="radio" value="LANDSCAPE" th:field="*{layout}" class="sr-only peer">
                <div class="border-2 border-line-strong peer-checked:border-indigo-500 rounded-xl p-3 flex flex-col items-center gap-1.5 transition-all group-hover:border-indigo-300" style="height:100px;">
                    <div class="w-11 h-6 bg-slate-200 rounded mt-1"></div>
                    <span class="text-xs font-semibold text-ink-muted">가로형</span>
                    <span class="text-[10px] text-slate-400">700 × 460</span>
                </div>
            </label>
        </div>
    </div>

    <!-- 내용 (CKEditor 5 v41) -->
    <div class="bg-surface rounded-2xl border border-line p-5">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">내용</h3>
        <div id="ckEditorTarget"></div>
        <textarea id="contentTextarea" th:field="*{content}" class="hidden"></textarea>
        <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}"
           class="mt-1.5 text-xs text-red-500"></p>
    </div>

    <!-- 하단 버튼 -->
    <div class="bg-surface rounded-2xl border border-line px-5 py-4 flex items-center justify-end gap-2">
        <a th:href="@{/admin/popups}"
           class="px-4 py-2 text-sm font-medium text-ink-muted border border-line-strong rounded-xl hover:bg-surface-alt transition-colors">
            취소
        </a>
        <button type="submit"
                class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm shadow-indigo-100"
                th:text="${popupId != null ? '수정 완료' : '등록'}">등록</button>
    </div>

</form>

<script th:inline="javascript">
(function () {
    const csrfToken  = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';
    const initialData = document.getElementById('contentTextarea').value || '';

    // 커스텀 이미지 업로드 어댑터
    function UploadAdapterPlugin(editor) {
        editor.plugins.get('FileRepository').createUploadAdapter = (loader) => ({
            upload() {
                return loader.file.then(file => new Promise((resolve, reject) => {
                    const fd = new FormData();
                    fd.append('upload', file);
                    fetch('/admin/popups/editor-image', {
                        method: 'POST',
                        headers: { [csrfHeader]: csrfToken },
                        body: fd
                    })
                    .then(r => r.ok ? r.json() : Promise.reject('업로드 실패'))
                    .then(data => resolve({ default: data.url }))
                    .catch(reject);
                }));
            },
            abort() {}
        });
    }

    // v41 classic 빌드: ClassicEditor가 전역에 바로 노출됨
    ClassicEditor.create(document.getElementById('ckEditorTarget'), {
        extraPlugins: [UploadAdapterPlugin],
        toolbar: {
            items: [
                'heading', '|',
                'bold', 'italic', '|',
                'bulletedList', 'numberedList', '|',
                'outdent', 'indent', '|',
                'blockQuote', 'link', '|',
                'uploadImage', 'insertTable', '|',
                'undo', 'redo'
            ]
        },
        image: {
            toolbar: [
                'imageStyle:alignLeft', 'imageStyle:alignCenter', 'imageStyle:alignRight',
                '|',
                'imageStyle:block', 'imageStyle:side'
            ]
        },
        table: {
            contentToolbar: ['tableColumn', 'tableRow', 'mergeTableCells']
        },
        initialData
    }).then(editor => {
        document.getElementById('popupForm').addEventListener('submit', () => {
            document.getElementById('contentTextarea').value = editor.getData();
        });
    }).catch(err => {
        console.error('CKEditor 초기화 오류:', err);
        document.getElementById('ckEditorTarget').textContent = '에디터 로드 실패: ' + err.message;
    });
})();
</script>

</th:block>
</html>
