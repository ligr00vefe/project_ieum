<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='회원 상세'">

    <div class="flex items-center gap-3 mb-6">
        <a th:href="@{/admin/users}"
           class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            회원 목록
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-sm font-medium text-slate-700" th:text="${user.email}">이메일</span>
    </div>

    <div th:if="${message}"
         class="mb-4 px-4 py-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

        <!-- 기본 정보 -->
        <div class="lg:col-span-2 space-y-4">
            <div class="bg-surface rounded-2xl border border-line p-5">
                <h3 class="text-sm font-semibold text-slate-700 mb-4">기본 정보</h3>
                <dl class="space-y-3">
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">이메일</dt>
                        <dd class="text-sm text-slate-800 font-medium" th:text="${user.email}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">전화번호</dt>
                        <dd class="text-sm text-slate-800" th:text="${user.phone ?: '-'}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">역할</dt>
                        <dd>
                            <span th:text="${user.role.name() == 'USER' ? '이용자' : user.role.name() == 'CAREGIVER' ? '활동지원사' : '관리자'}"
                                  th:classappend="${user.role.name() == 'USER' ? 'bg-indigo-50 text-indigo-600' : (user.role.name() == 'CAREGIVER' ? 'bg-amber-50 text-amber-600' : 'bg-slate-100 text-ink-muted')}"
                                  class="px-2 py-0.5 text-xs font-semibold rounded-full">역할</span>
                        </dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">가입일</dt>
                        <dd class="text-sm text-slate-800"
                            th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy.MM.dd HH:mm') : '-'}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">최근 로그인</dt>
                        <dd class="text-sm text-slate-800"
                            th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy.MM.dd HH:mm') : '-'}">-</dd>
                    </div>
                </dl>
            </div>

            <!-- 요청 내역 -->
            <div class="bg-surface rounded-2xl border border-line overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-50">
                    <h3 class="text-sm font-semibold text-slate-700">도움 요청 내역</h3>
                </div>
                <div class="divide-y divide-slate-50">
                    <th:block th:each="req : ${requests}">
                    <div class="flex items-center justify-between px-5 py-3">
                        <div class="min-w-0 flex-1">
                            <p class="text-sm text-slate-700 truncate" th:text="${req.title}">제목</p>
                            <p class="text-xs text-slate-400 mt-0.5"
                               th:text="${#temporals.format(req.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</p>
                        </div>
                        <span th:text="${req.status.name() == 'OPEN' ? '모집중' :
                                         req.status.name() == 'MATCHED' ? '매칭완료' :
                                         req.status.name() == 'IN_PROGRESS' ? '진행중' :
                                         req.status.name() == 'COMPLETED' ? '완료' : '종료'}"
                              th:classappend="${req.status.name() == 'OPEN' ? 'bg-indigo-50 text-indigo-600' : (req.status.name() == 'COMPLETED' ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-500')}"
                              class="ml-3 flex-shrink-0 px-2 py-0.5 text-xs font-semibold rounded-full">상태</span>
                    </div>
                    </th:block>
                    <div th:if="${#lists.isEmpty(requests)}"
                         class="px-5 py-8 text-center text-sm text-slate-400">요청 내역이 없습니다.</div>
                </div>
            </div>
        </div>

        <!-- 상태 변경 -->
        <div class="space-y-4">
            <div class="bg-surface rounded-2xl border border-line p-5">
                <h3 class="text-sm font-semibold text-slate-700 mb-4">상태 관리</h3>
                <div class="mb-4">
                    <p class="text-xs text-slate-400 mb-1.5">현재 상태</p>
                    <span th:text="${user.status.name() == 'ACTIVE' ? '활성' :
                                     user.status.name() == 'PAUSED' ? '일시중지' :
                                     user.status.name() == 'WARNED' ? '경고' :
                                     user.status.name() == 'BANNED' ? '정지' : '탈퇴'}"
                          th:classappend="${user.status.name() == 'ACTIVE' ? 'bg-teal-50 text-teal-600' : (user.status.name() == 'WARNED' ? 'bg-amber-50 text-amber-600' : (user.status.name() == 'BANNED' ? 'bg-red-50 text-red-500' : 'bg-slate-100 text-slate-500'))}"
                          class="inline-block px-2.5 py-1 text-xs font-semibold rounded-full">상태</span>
                </div>
                <div class="space-y-2">
                    <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post">
                        <input type="hidden" name="status" value="ACTIVE">
                        <button type="submit"
                                th:disabled="${user.status.name() == 'ACTIVE'}"
                                class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-teal-200 text-teal-700 hover:bg-teal-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                            활성화
                        </button>
                    </form>
                    <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post">
                        <input type="hidden" name="status" value="PAUSED">
                        <button type="submit"
                                th:disabled="${user.status.name() == 'PAUSED'}"
                                class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-line-strong text-ink-muted hover:bg-surface-alt disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                            일시중지
                        </button>
                    </form>
                    <form th:action="@{/admin/users/{id}/status(id=${user.id})}" method="post">
                        <input type="hidden" name="status" value="BANNED">
                        <button type="submit"
                                th:disabled="${user.status.name() == 'BANNED'}"
                                class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-red-100 text-red-600 hover:bg-red-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                            계정 정지 (BAN)
                        </button>
                    </form>
                    <!-- 경고 회원 초기화 버튼 -->
                    <form th:if="${user.status.name() == 'WARNED'}"
                          th:action="@{/admin/users/{id}/warn/reset(id=${user.id})}" method="post"
                          onsubmit="return confirm('경고 상태를 초기화하고 활성 회원으로 변경하시겠습니까?')">
                        <button type="submit"
                                class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-amber-200 text-amber-700 hover:bg-amber-50 transition-colors">
                            경고 초기화 (활성 전환)
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>

</div>
</th:block>
</html>
