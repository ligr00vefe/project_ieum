<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='회원 관리'">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-slate-900">회원 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">전체 회원을 조회하고 상태를 관리하세요.</p>
        </div>
    </div>

    <!-- 필터 -->
    <div class="flex items-center gap-2 mb-4">
        <a th:href="@{/admin/users}"
           th:classappend="${selectedRole == null} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체</a>
        <a th:href="@{/admin/users(role='USER')}"
           th:classappend="${selectedRole == 'USER'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">이용자</a>
        <a th:href="@{/admin/users(role='CAREGIVER')}"
           th:classappend="${selectedRole == 'CAREGIVER'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">활동지원사</a>
        <a th:href="@{/admin/users(role='ADMIN')}"
           th:classappend="${selectedRole == 'ADMIN'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">관리자</a>
    </div>

    <!-- 테이블 -->
    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-100 bg-slate-50">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">이메일</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">역할</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">가입일</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">최근 로그인</th>
                    <th class="px-5 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="user : ${users}">
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-5 py-3.5 font-medium text-slate-800" th:text="${user.email}">이메일</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${user.role.name() == 'USER' ? '이용자' : user.role.name() == 'CAREGIVER' ? '활동지원사' : '관리자'}"
                              th:classappend="${user.role.name() == 'USER'} ? 'bg-indigo-50 text-indigo-600' :
                                              ${user.role.name() == 'CAREGIVER'} ? 'bg-amber-50 text-amber-600' : 'bg-slate-100 text-slate-600'"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">역할</span>
                    </td>
                    <td class="px-5 py-3.5">
                        <span th:text="${user.status.name() == 'ACTIVE' ? '활성' :
                                         user.status.name() == 'PAUSED' ? '일시중지' :
                                         user.status.name() == 'BANNED' ? '정지' : '탈퇴'}"
                              th:classappend="${user.status.name() == 'ACTIVE'} ? 'bg-teal-50 text-teal-600' :
                                              ${user.status.name() == 'BANNED'} ? 'bg-red-50 text-red-500' : 'bg-slate-100 text-slate-500'"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy.MM.dd') : '-'}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy.MM.dd') : '-'}">-</td>
                    <td class="px-5 py-3.5 text-right">
                        <a th:href="@{/admin/users/{id}(id=${user.id})}"
                           class="text-xs font-medium text-indigo-500 hover:text-indigo-700">상세</a>
                    </td>
                </tr>
                </th:block>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="6" class="px-5 py-10 text-center text-sm text-slate-400">회원이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</th:block>
</html>
