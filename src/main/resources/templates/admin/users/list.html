<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='회원 관리'">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-ink">회원 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">전체 회원을 조회하고 상태를 관리하세요.</p>
        </div>
    </div>

    <!-- 검색창 -->
    <form th:action="@{/admin/users}" method="get" class="flex items-center gap-2 mb-4">
        <input type="hidden" name="role" th:value="${selectedRole}"/>
        <input type="hidden" name="warnedOnly" th:value="${warnedOnly}"/>
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="이메일로 검색..."
               class="flex-1 px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <button type="submit"
                class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
            검색
        </button>
        <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
           th:href="@{/admin/users(role=${selectedRole})}"
           class="px-4 py-2 text-sm font-semibold text-slate-500 border border-line-strong rounded-xl hover:bg-surface-alt transition-colors">
            초기화
        </a>
    </form>

    <!-- 필터 -->
    <div class="flex items-center gap-2 mb-4 flex-wrap">
        <a th:href="@{/admin/users}"
           th:classappend="${selectedRole == null and !warnedOnly} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체</a>
        <a th:href="@{/admin/users(role='USER')}"
           th:classappend="${selectedRole == 'USER'} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">이용자</a>
        <a th:href="@{/admin/users(role='CAREGIVER')}"
           th:classappend="${selectedRole == 'CAREGIVER'} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">활동지원사</a>
        <a th:href="@{/admin/users(role='ADMIN')}"
           th:classappend="${selectedRole == 'ADMIN'} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">관리자</a>
        <a th:href="@{/admin/users(warnedOnly=true)}"
           th:classappend="${warnedOnly} ? 'bg-amber-500 text-white' : 'bg-surface text-amber-600 border border-amber-200 hover:bg-amber-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">⚠ 경고 회원</a>
    </div>

    <!-- 테이블 -->
    <div class="bg-surface rounded-2xl border border-line overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-line bg-surface-alt">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">이메일</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">역할</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">가입일</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">최근 로그인</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-line">
                <th:block th:each="user : ${users}">
                <tr class="hover:bg-surface-alt transition-colors cursor-pointer"
                    th:onclick="|location.href='@{/admin/users/{id}(id=${user.id})}'|">
                    <td class="px-5 py-3.5 font-medium text-ink" th:text="${user.email}">이메일</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${user.roleLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${user.roleClass}">역할</span>
                    </td>
                    <td class="px-5 py-3.5">
                        <span th:text="${user.statusLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${user.statusClass}">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy.MM.dd') : '-'}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt, 'yyyy.MM.dd') : '-'}">-</td>
                </tr>
                </th:block>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5" class="px-5 py-10 text-center text-sm text-slate-400">회원이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, ${'/admin/users?' + (warnedOnly ? 'warnedOnly=true&' : '') + (selectedRole != null ? 'role=' + selectedRole + '&' : '') + (keyword != null ? 'keyword=' + keyword + '&' : '')})}"></div>

</div>
</th:block>
</html>
