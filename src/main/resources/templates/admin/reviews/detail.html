<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='리뷰 상세'">

    <div class="flex items-center gap-3 mb-6">
        <a th:href="@{/admin/reviews}"
           class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            리뷰 목록
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-sm font-medium text-slate-700">리뷰 #<span th:text="${review.id}"></span></span>
    </div>

    <div th:if="${message}"
         class="mb-4 px-4 py-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

        <!-- 리뷰 상세 정보 -->
        <div class="lg:col-span-2 space-y-4">
            <div class="bg-surface rounded-2xl border border-line p-5">
                <h3 class="text-sm font-semibold text-slate-700 mb-4">리뷰 정보</h3>
                <dl class="space-y-3">
                    <div class="flex gap-4">
                        <dt class="w-28 text-xs text-slate-400 flex-shrink-0 pt-0.5">작성자</dt>
                        <dd class="text-sm text-slate-800 font-medium" th:text="${review.author?.fullName ?: '-'}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-28 text-xs text-slate-400 flex-shrink-0 pt-0.5">대상 활동지원사</dt>
                        <dd class="text-sm text-slate-800" th:text="${review.target?.fullName ?: '-'}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-28 text-xs text-slate-400 flex-shrink-0 pt-0.5">평점</dt>
                        <dd>
                            <div class="flex items-center gap-1">
                                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                    <svg th:classappend="${i <= review.rating} ? 'text-amber-400' : 'text-slate-200'"
                                         class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                    </svg>
                                </th:block>
                                <span class="ml-1 text-sm font-semibold text-slate-700" th:text="${review.rating} + ' / 5'">-</span>
                            </div>
                        </dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-28 text-xs text-slate-400 flex-shrink-0 pt-0.5">공개 여부</dt>
                        <dd>
                            <span th:text="${review.visibility.name() == 'PUBLIC' ? '공개' : '숨김'}"
                                  th:classappend="${review.visibility.name() == 'PUBLIC'} ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-400'"
                                  class="px-2 py-0.5 text-xs font-semibold rounded-full">공개</span>
                        </dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-28 text-xs text-slate-400 flex-shrink-0 pt-0.5">등록일</dt>
                        <dd class="text-sm text-slate-800"
                            th:text="${#temporals.format(review.createdAt, 'yyyy.MM.dd HH:mm')}">-</dd>
                    </div>
                </dl>
            </div>

            <!-- 리뷰 본문 -->
            <div class="bg-surface rounded-2xl border border-line p-5">
                <h3 class="text-sm font-semibold text-slate-700 mb-3">리뷰 내용</h3>
                <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap"
                   th:text="${review.body != null ? review.body : '(내용 없음)'}">내용</p>
            </div>

            <!-- 연결된 도움 요청 -->
            <div th:if="${review.helpRequest != null}" class="bg-surface rounded-2xl border border-line p-5">
                <h3 class="text-sm font-semibold text-slate-700 mb-3">연결된 도움 요청</h3>
                <dl class="space-y-2">
                    <div class="flex gap-4">
                        <dt class="w-28 text-xs text-slate-400 flex-shrink-0 pt-0.5">제목</dt>
                        <dd class="text-sm text-slate-800" th:text="${review.helpRequest.title}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-28 text-xs text-slate-400 flex-shrink-0 pt-0.5">요청일</dt>
                        <dd class="text-sm text-slate-500"
                            th:text="${#temporals.format(review.helpRequest.createdAt, 'yyyy.MM.dd')}">-</dd>
                    </div>
                </dl>
                <a th:href="@{/admin/matching/{id}(id=${review.helpRequest.id})}"
                   class="inline-flex items-center gap-1 mt-3 text-xs text-indigo-500 hover:text-indigo-700">
                    매칭 상세 보기
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>
        </div>

        <!-- 관리 액션 -->
        <div class="space-y-4">
            <div class="bg-surface rounded-2xl border border-line p-5">
                <h3 class="text-sm font-semibold text-slate-700 mb-4">공개 상태 관리</h3>
                <form th:action="@{/admin/reviews/{id}/visibility(id=${review.id})}" method="post">
                    <input type="hidden" name="from" value="detail">
                    <input type="hidden" name="visibility"
                           th:value="${review.visibility.name() == 'PUBLIC' ? 'PRIVATE' : 'PUBLIC'}">
                    <button type="submit"
                            th:text="${review.visibility.name() == 'PUBLIC' ? '숨김 처리' : '공개 처리'}"
                            th:class="${review.visibility.name() == 'PUBLIC'} ? 'w-full px-3 py-2 text-xs font-medium rounded-xl border border-line-strong text-ink-muted hover:bg-surface-alt transition-colors' : 'w-full px-3 py-2 text-xs font-medium rounded-xl border border-teal-200 text-teal-700 hover:bg-teal-50 transition-colors'">
                        숨김 처리
                    </button>
                </form>
            </div>
        </div>

    </div>

</div>
</th:block>
</html>
