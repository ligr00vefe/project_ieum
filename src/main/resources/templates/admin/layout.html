<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title != null ? title + ' — 이음 관리자' : '이음 관리자'}">이음 관리자</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex">

<!-- Sidebar -->
<aside class="w-60 min-h-screen bg-white border-r border-slate-200 flex flex-col fixed top-0 left-0 z-40">

    <!-- Logo -->
    <div class="h-16 flex items-center gap-2.5 px-5 border-b border-slate-100">
        <div class="w-8 h-8 bg-teal-500 rounded-xl flex items-center justify-center flex-shrink-0">
            <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/>
            </svg>
        </div>
        <div>
            <div class="text-[13px] font-bold text-gray-900">이음</div>
            <div class="text-[10px] text-slate-400 font-medium -mt-0.5">관리자</div>
        </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 py-4 px-3 space-y-0.5 overflow-y-auto">

        <a th:href="@{/admin/dashboard}"
           th:classappend="${activeMenu == 'dashboard'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            대시보드
        </a>

        <div class="pt-3 pb-1 px-3">
            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">관리</span>
        </div>

        <a th:href="@{/admin/users}"
           th:classappend="${activeMenu == 'users'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            회원 관리
        </a>

        <a th:href="@{/admin/matching}"
           th:classappend="${activeMenu == 'matching'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            매칭 관리
        </a>

        <a th:href="@{/admin/reviews}"
           th:classappend="${activeMenu == 'reviews'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
            </svg>
            리뷰 관리
        </a>

        <a th:href="@{/admin/reports}"
           th:classappend="${activeMenu == 'reports'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            신고 관리
        </a>

        <div class="pt-3 pb-1 px-3">
            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">마켓</span>
        </div>

        <a th:href="@{/admin/market/posts}"
           th:classappend="${activeMenu == 'market-posts'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
            거래 관리
        </a>

        <a th:href="@{/admin/market/chats}"
           th:classappend="${activeMenu == 'market-chats'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/>
            </svg>
            채팅 관리
        </a>

        <div class="pt-3 pb-1 px-3">
            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">게시판</span>
        </div>

        <a th:href="@{/admin/notices}"
           th:classappend="${activeMenu == 'notices'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
            </svg>
            공지사항
        </a>

        <a th:href="@{/admin/inquiries}"
           th:classappend="${activeMenu == 'inquiries'} ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            문의 관리
        </a>

    </nav>

    <!-- Logout -->
    <div class="p-3 border-t border-slate-100">
        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-500 hover:bg-red-50 hover:text-red-600 transition-colors">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                로그아웃
            </button>
        </form>
    </div>
</aside>

<!-- Main -->
<div class="ml-60 flex-1 flex flex-col min-h-screen">

    <!-- Top bar -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center px-6 sticky top-0 z-30">
        <h1 class="text-base font-semibold text-slate-900" th:text="${title ?: '관리자'}">관리자</h1>
        <div class="ml-auto flex items-center gap-2">
            <a th:href="@{/}" target="_blank"
               class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-500 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
                사이트 보기
            </a>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 p-6">
        <th:block th:replace="${content}"></th:block>
    </main>
</div>

</body>
</html>
