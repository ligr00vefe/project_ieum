<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div>

    <div class="flex items-center gap-3 mb-6">
        <a th:href="@{/admin/matching}"
           class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-ink-muted transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            매칭 목록
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-sm font-medium text-ink-muted" th:text="${request.title}">제목</span>
    </div>

    <div th:if="${message}"
         class="mb-4 px-4 py-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

        <div class="lg:col-span-2 space-y-4">
            <div class="bg-surface rounded-2xl border border-line p-5">
                <div class="flex items-start justify-between mb-4">
                    <h3 class="text-base font-semibold text-ink" th:text="${request.title}">제목</h3>
                    <span th:with="st=${request.status != null ? request.status.name() : 'CLOSED'}"
                          th:text="${st == 'OPEN' ? '모집중' : st == 'MATCHED' ? '매칭완료' : st == 'IN_PROGRESS' ? '진행중' : st == 'COMPLETED' ? '완료' : '종료'}"
                          th:class="${st == 'OPEN' ? 'ml-3 flex-shrink-0 px-2.5 py-1 text-xs font-semibold rounded-full bg-indigo-50 text-indigo-600' :
                                     st == 'IN_PROGRESS' ? 'ml-3 flex-shrink-0 px-2.5 py-1 text-xs font-semibold rounded-full bg-teal-50 text-teal-600' :
                                     st == 'COMPLETED' ? 'ml-3 flex-shrink-0 px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-500' :
                                                         'ml-3 flex-shrink-0 px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-100 text-slate-400'}">상태</span>
                </div>
                <dl class="space-y-3 text-sm">
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">요청자</dt>
                        <dd class="text-ink" th:text="${request.requester != null ? request.requester.fullName : '-'}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">서비스 분류</dt>
                        <dd class="text-ink" th:text="${request.serviceCategory != null ? request.serviceCategory.name : '-'}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">희망 시작</dt>
                        <dd class="text-ink"
                            th:text="${request.desiredStartDatetime != null ? #temporals.format(request.desiredStartDatetime, 'yyyy.MM.dd HH:mm') : '-'}">-</dd>
                    </div>
                    <div class="flex gap-4" th:if="${request.desiredEndDatetime != null}">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">희망 종료</dt>
                        <dd class="text-ink"
                            th:text="${#temporals.format(request.desiredEndDatetime, 'yyyy.MM.dd HH:mm')}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">주소</dt>
                        <dd class="text-ink"
                            th:text="${(request.roadAddress ?: '') + (request.addressDetail != null ? ' ' + request.addressDetail : '')}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">지역</dt>
                        <dd class="text-ink-muted"
                            th:text="${(request.sido ?: '') + ' ' + (request.sigungu ?: '')}">-</dd>
                    </div>
                    <div class="flex gap-4" th:if="${request.specialNotes != null and !#strings.isEmpty(request.specialNotes)}">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">특이사항</dt>
                        <dd class="text-ink" th:text="${request.specialNotes}">-</dd>
                    </div>
                    <div class="flex gap-4" th:if="${request.body != null and !#strings.isEmpty(request.body)}">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">내용</dt>
                        <dd class="text-ink-muted whitespace-pre-line" th:text="${request.body}">-</dd>
                    </div>
                    <div class="flex gap-4">
                        <dt class="w-24 text-xs text-slate-400 flex-shrink-0 pt-0.5">등록일</dt>
                        <dd class="text-ink"
                            th:text="${request.createdAt != null ? #temporals.format(request.createdAt, 'yyyy.MM.dd HH:mm') : '-'}">-</dd>
                    </div>
                </dl>
            </div>
        </div>

        <!-- 관리 액션 -->
        <div class="space-y-4">
            <div class="bg-surface rounded-2xl border border-line p-5">
                <h3 class="text-sm font-semibold text-ink-muted mb-4">관리 액션</h3>
                <form th:action="@{/admin/matching/{id}/close(id=${request.id})}" method="post"
                      th:if="${request.status != null and request.status.name() != 'COMPLETED' and request.status.name() != 'CLOSED'}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            onclick="return confirm('이 요청을 강제 종료하시겠습니까?')"
                            class="w-full px-3 py-2 text-xs font-medium rounded-xl border border-red-100 text-red-600 hover:bg-red-50 transition-colors">
                        강제 종료
                    </button>
                </form>
                <p th:if="${request.status == null or request.status.name() == 'COMPLETED' or request.status.name() == 'CLOSED'}"
                   class="text-xs text-slate-400 text-center py-2">이미 종료된 요청입니다.</p>
            </div>
        </div>

    </div>

</div>
</th:block>
</html>
