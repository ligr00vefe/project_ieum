<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='매칭 정보 수정'">

    <div class="flex items-center gap-3 mb-6">
        <a th:href="@{/admin/matching/{id}(id=${request.id})}"
           class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-ink-muted transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            매칭 상세
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-sm font-medium text-ink-muted">정보 수정</span>
    </div>

    <div th:if="${error}"
         class="mb-4 px-4 py-3 rounded-xl bg-red-50 border border-red-100 text-sm text-red-600"
         th:text="${error}"></div>

    <div class="max-w-2xl">
        <form th:action="@{/admin/matching/{id}/edit(id=${request.id})}" method="post"
              class="bg-surface rounded-2xl border border-line p-5 space-y-4">

            <h3 class="text-sm font-semibold text-ink-muted">요청 정보 수정</h3>

            <div>
                <label for="title" class="block text-xs text-slate-400 mb-1.5">제목 <span class="text-red-500">*</span></label>
                <input type="text" id="title" name="title" required maxlength="255"
                       th:value="${request.title}"
                       class="w-full px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
            </div>

            <div>
                <label for="body" class="block text-xs text-slate-400 mb-1.5">내용</label>
                <textarea id="body" name="body" rows="4"
                          class="w-full px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"
                          th:text="${request.body}"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="desiredStartDatetime" class="block text-xs text-slate-400 mb-1.5">희망 시작 <span class="text-red-500">*</span></label>
                    <input type="datetime-local" id="desiredStartDatetime" name="desiredStartDatetime" required
                           th:value="${request.desiredStartDatetime != null ? #temporals.format(request.desiredStartDatetime, 'yyyy-MM-dd''T''HH:mm') : ''}"
                           class="w-full px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
                </div>
                <div>
                    <label for="desiredEndDatetime" class="block text-xs text-slate-400 mb-1.5">희망 종료</label>
                    <input type="datetime-local" id="desiredEndDatetime" name="desiredEndDatetime"
                           th:value="${request.desiredEndDatetime != null ? #temporals.format(request.desiredEndDatetime, 'yyyy-MM-dd''T''HH:mm') : ''}"
                           class="w-full px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
                </div>
            </div>

            <!-- 기본 주소 (읽기 전용 — 좌표 재계산이 필요해 관리자 화면에서는 수정 불가) -->
            <div>
                <label class="block text-xs text-slate-400 mb-1.5">주소</label>
                <input type="text" disabled
                       th:value="${(request.roadAddress ?: '-') + (request.addressDetail != null ? ' ' + request.addressDetail : '')}"
                       class="w-full px-4 py-2 text-sm border border-line rounded-xl bg-surface-alt text-slate-400 cursor-not-allowed"/>
                <p class="mt-1 text-[11px] text-slate-400">기본 주소는 좌표 재계산이 필요해 이 화면에서 수정할 수 없습니다.</p>
            </div>

            <div class="grid grid-cols-1 gap-3">
                <div>
                    <label for="departureAddress" class="block text-xs text-slate-400 mb-1.5">출발지 주소</label>
                    <input type="text" id="departureAddress" name="departureAddress" maxlength="255"
                           th:value="${request.departureAddress}" placeholder="예: 서울특별시 중구 세종대로 110"
                           class="w-full px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
                </div>
                <div>
                    <label for="destinationAddress" class="block text-xs text-slate-400 mb-1.5">도착지 주소</label>
                    <input type="text" id="destinationAddress" name="destinationAddress" maxlength="255"
                           th:value="${request.destinationAddress}" placeholder="예: 서울특별시 종로구 사직로 161"
                           class="w-full px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
                </div>
            </div>

            <div>
                <label for="specialNotes" class="block text-xs text-slate-400 mb-1.5">특이사항</label>
                <textarea id="specialNotes" name="specialNotes" rows="3"
                          class="w-full px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"
                          th:text="${request.specialNotes}"></textarea>
            </div>

            <div class="flex items-center gap-2 pt-2">
                <button type="submit"
                        class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
                    저장
                </button>
                <a th:href="@{/admin/matching/{id}(id=${request.id})}"
                   class="px-4 py-2 text-sm font-semibold text-slate-500 border border-line-strong rounded-xl hover:bg-surface-alt transition-colors">
                    취소
                </a>
            </div>
        </form>
    </div>

</div>
</th:block>
</html>
