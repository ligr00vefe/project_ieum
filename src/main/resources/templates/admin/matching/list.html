<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='매칭 관리'">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-slate-900">매칭 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">전체 도움 요청을 조회하고 관리하세요.</p>
        </div>
    </div>

    <!-- 필터 -->
    <div class="flex items-center gap-2 mb-4 flex-wrap">
        <a th:href="@{/admin/matching}"
           th:classappend="${selectedStatus == null} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체</a>
        <a th:href="@{/admin/matching(status='OPEN')}"
           th:classappend="${selectedStatus == 'OPEN'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">모집중</a>
        <a th:href="@{/admin/matching(status='MATCHED')}"
           th:classappend="${selectedStatus == 'MATCHED'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">매칭완료</a>
        <a th:href="@{/admin/matching(status='IN_PROGRESS')}"
           th:classappend="${selectedStatus == 'IN_PROGRESS'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">진행중</a>
        <a th:href="@{/admin/matching(status='COMPLETED')}"
           th:classappend="${selectedStatus == 'COMPLETED'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">완료</a>
        <a th:href="@{/admin/matching(status='CLOSED')}"
           th:classappend="${selectedStatus == 'CLOSED'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">종료</a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-100 bg-slate-50">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">제목</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">요청자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">지역</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">희망일시</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                    <th class="px-5 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="req : ${requests}">
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-5 py-3.5">
                        <p class="font-medium text-slate-800 truncate max-w-xs" th:text="${req.title}">제목</p>
                    </td>
                    <td class="px-5 py-3.5 text-slate-600 text-xs"
                        th:text="${req.requester?.fullName ?: '-'}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${req.sido + ' ' + req.sigungu}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${#temporals.format(req.desiredStartDatetime, 'MM/dd HH:mm')}">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${req.status.name() == 'OPEN' ? '모집중' :
                                         req.status.name() == 'MATCHED' ? '매칭완료' :
                                         req.status.name() == 'IN_PROGRESS' ? '진행중' :
                                         req.status.name() == 'COMPLETED' ? '완료' : '종료'}"
                              th:classappend="${req.status.name() == 'OPEN'} ? 'bg-indigo-50 text-indigo-600' :
                                              ${req.status.name() == 'IN_PROGRESS'} ? 'bg-teal-50 text-teal-600' :
                                              ${req.status.name() == 'COMPLETED'} ? 'bg-slate-100 text-slate-500' : 'bg-slate-100 text-slate-400'"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-right">
                        <a th:href="@{/admin/matching/{id}(id=${req.id})}"
                           class="text-xs font-medium text-indigo-500 hover:text-indigo-700">상세</a>
                    </td>
                </tr>
                </th:block>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="6" class="px-5 py-10 text-center text-sm text-slate-400">요청이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</th:block>
</html>
