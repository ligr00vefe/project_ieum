<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='매칭 관리'">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-ink">매칭 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">전체 도움 요청을 조회하고 관리하세요.</p>
        </div>
    </div>

    <!-- 검색창 -->
    <form th:action="@{/admin/matching}" method="get" class="flex items-center gap-2 mb-4">
        <input type="hidden" name="status" th:value="${selectedStatus}"/>
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="제목으로 검색..."
               class="flex-1 px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <button type="submit"
                class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
            검색
        </button>
        <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
           th:href="@{/admin/matching(status=${selectedStatus})}"
           class="px-4 py-2 text-sm font-semibold text-slate-500 border border-line-strong rounded-xl hover:bg-surface-alt transition-colors">
            초기화
        </a>
    </form>

    <!-- 필터 -->
    <div class="flex items-center gap-2 mb-4 flex-wrap">
        <a th:href="@{/admin/matching}"
           th:classappend="${selectedStatus == null} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체</a>
        <a th:href="@{/admin/matching(status='OPEN')}"
           th:classappend="${selectedStatus == 'OPEN'} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">모집중</a>
        <a th:href="@{/admin/matching(status='MATCHED')}"
           th:classappend="${selectedStatus == 'MATCHED'} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">매칭완료</a>
        <a th:href="@{/admin/matching(status='IN_PROGRESS')}"
           th:classappend="${selectedStatus == 'IN_PROGRESS'} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">진행중</a>
        <a th:href="@{/admin/matching(status='COMPLETED')}"
           th:classappend="${selectedStatus == 'COMPLETED'} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">완료</a>
        <a th:href="@{/admin/matching(status='CLOSED')}"
           th:classappend="${selectedStatus == 'CLOSED'} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">종료</a>
    </div>

    <div class="bg-surface rounded-2xl border border-line overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-line bg-surface-alt">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">제목</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">요청자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">지역</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">희망일시</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-line">
                <th:block th:each="req : ${requests}">
                <tr class="hover:bg-surface-alt transition-colors cursor-pointer"
                    th:onclick="|location.href='@{/admin/matching/{id}(id=${req.id})}'|">
                    <td class="px-5 py-3.5">
                        <p class="font-medium text-ink truncate max-w-xs" th:text="${req.title}">제목</p>
                    </td>
                    <td class="px-5 py-3.5 text-ink-muted text-xs" th:text="${req.requesterName}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${req.sido + ' ' + req.sigungu}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${#temporals.format(req.desiredStartDatetime, 'MM/dd HH:mm')}">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${req.statusLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${req.statusClass}">상태</span>
                    </td>
                </tr>
                </th:block>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="5" class="px-5 py-10 text-center text-sm text-slate-400">요청이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, '/admin/matching?' + (selectedStatus != null ? 'status=' + selectedStatus + '&' : ''))}"></div>

</div>
</th:block>
</html>
