<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">

<!-- 뒤로가기 -->
<div class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-3">
        <a th:href="@{/admin/notices}"
           class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            공지사항 목록
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-sm font-medium text-slate-700">상세</span>
    </div>

    <!-- 수정 / 삭제 버튼 -->
    <div class="flex items-center gap-2">
        <a th:href="@{/admin/notices/{id}/edit(id=${notice.id})}"
           class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-ink-muted border border-line-strong rounded-xl hover:bg-surface-alt transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
            수정
        </a>
        <form th:action="@{/admin/notices/{id}/delete(id=${notice.id})}" method="post" class="inline">
            <button type="submit"
                    onclick="return confirm('공지사항을 삭제하시겠습니까?')"
                    class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-red-500 border border-red-200 rounded-xl hover:bg-red-50 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                삭제
            </button>
        </form>
    </div>
</div>

<!-- 메타 정보 -->
<div class="bg-surface rounded-2xl border border-line px-5 py-4 flex items-center gap-4 flex-wrap mb-4">
    <span th:if="${notice.isPinned}"
          class="flex items-center gap-1 px-2.5 py-1 bg-amber-50 text-amber-600 text-xs font-semibold rounded-full">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
            <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3z"/>
        </svg>
        상단 고정
    </span>
    <span th:text="${notice.isPublic ? '공개' : '비공개'}"
          th:classappend="${notice.isPublic} ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-400'"
          class="px-2.5 py-1 text-xs font-semibold rounded-full">공개</span>
    <span class="text-xs text-slate-400"
          th:text="'작성자: ' + ${notice.author?.email ?: '-'}"></span>
    <span class="text-xs text-slate-400"
          th:text="'등록일: ' + ${#temporals.format(notice.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
    <span th:if="${notice.updatedAt != null and notice.updatedAt != notice.createdAt}"
          class="text-xs text-slate-400"
          th:text="'수정일: ' + ${#temporals.format(notice.updatedAt, 'yyyy.MM.dd HH:mm')}"></span>
</div>

<!-- 제목 -->
<div class="bg-surface rounded-2xl border border-line px-5 py-4 mb-4">
    <h1 class="text-base font-semibold text-ink" th:text="${notice.title}">제목</h1>
</div>

<!-- 본문 -->
<div class="bg-surface rounded-2xl border border-line p-6 mb-4">
    <div class="ck-content prose max-w-none text-sm text-slate-800 leading-relaxed"
         th:utext="${notice.body}"></div>
</div>

<!-- 첨부파일 -->
<div th:if="${attachments != null and !#lists.isEmpty(attachments)}"
     class="bg-surface rounded-2xl border border-line p-5">
    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">첨부파일</h3>
    <div class="space-y-1.5">
        <div th:each="att : ${attachments}"
             class="flex items-center gap-3 px-3 py-2.5 bg-surface-alt rounded-xl border border-line hover:bg-indigo-50 hover:border-indigo-100 transition-colors group">
            <svg class="w-4 h-4 text-slate-400 group-hover:text-indigo-400 flex-shrink-0 transition-colors"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
            </svg>
            <div class="min-w-0 flex-1">
                <a th:href="${att.storedPath}" th:text="${att.originalName}" download
                   class="text-xs font-medium text-slate-700 group-hover:text-indigo-600 truncate block transition-colors">파일명</a>
                <p class="text-[10px] text-slate-400"
                   th:text="${att.fileSize != null ? (att.fileSize / 1024) + ' KB' : ''}"></p>
            </div>
            <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-400 flex-shrink-0 transition-colors"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
        </div>
    </div>
</div>

<!-- CKEditor 5 본문 스타일 -->
<link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.css">
<style>
    .ck-content img { max-width: 100%; height: auto; }
    .ck-content h2 { font-size: 1.25rem; font-weight: 700; margin: 1.25rem 0 0.5rem; }
    .ck-content h3 { font-size: 1.1rem; font-weight: 600; margin: 1rem 0 0.4rem; }
    .ck-content ul, .ck-content ol { padding-left: 1.5rem; margin: 0.5rem 0; }
    .ck-content ul { list-style: disc; }
    .ck-content ol { list-style: decimal; }
    .ck-content blockquote { border-left: 3px solid #e2e8f0; padding-left: 1rem; color: #64748b; margin: 0.75rem 0; }
    .ck-content pre { background: #f8fafc; border-radius: 0.5rem; padding: 1rem; overflow-x: auto; font-size: 0.8rem; }
    .ck-content table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; }
    .ck-content table td, .ck-content table th { border: 1px solid #e2e8f0; padding: 0.5rem 0.75rem; font-size: 0.8rem; }
    .ck-content table th { background: #f8fafc; font-weight: 600; }
    .ck-content .image { margin: 1rem auto; }
    .ck-content .image.image-style-align-left { float: left; margin-right: 1rem; }
    .ck-content .image.image-style-align-right { float: right; margin-left: 1rem; }
    .ck-content .image.image-style-align-center { margin: 1rem auto; display: table; }
</style>

</th:block>
</html>
