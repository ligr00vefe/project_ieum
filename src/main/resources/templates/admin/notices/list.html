<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='공지사항'">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-slate-900">공지사항</h2>
            <p class="text-sm text-slate-500 mt-0.5">공지사항을 등록하고 관리하세요.</p>
        </div>
        <a th:href="@{/admin/notices/new}"
           class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm shadow-indigo-100">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            새 공지 작성
        </a>
    </div>

    <div th:if="${message}"
         class="mb-4 px-4 py-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-100 bg-slate-50">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide w-8"></th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">제목</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">작성자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">공개</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">등록일</th>
                    <th class="px-5 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="notice : ${notices}">
                <tr class="hover:bg-slate-50 transition-colors"
                    th:classappend="${!notice.isPublic} ? 'opacity-60' : ''">
                    <td class="px-5 py-3.5 text-center">
                        <svg th:if="${notice.isPinned}" class="w-3.5 h-3.5 text-amber-400 mx-auto" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM6.343 5.657a1 1 0 00-1.414 1.414l.707.707a1 1 0 001.414-1.414l-.707-.707zM13.657 5.657a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707zM10 8a4 4 0 100 8 4 4 0 000-8zM2 11a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zM15 11a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1zM6.343 14.343a1 1 0 000 1.414l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 0zM13.657 14.343a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0z"/>
                        </svg>
                    </td>
                    <td class="px-5 py-3.5">
                        <a th:href="@{/admin/notices/{id}(id=${notice.id})}"
                           class="font-medium text-slate-800 hover:text-indigo-600 truncate max-w-sm block transition-colors"
                           th:text="${notice.title}">제목</a>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs"
                        th:text="${notice.author?.email ?: '-'}">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${notice.isPublic ? '공개' : '비공개'}"
                              th:classappend="${notice.isPublic} ? 'bg-teal-50 text-teal-600' : 'bg-slate-100 text-slate-400'"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">공개</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs"
                        th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">-</td>
                    <td class="px-5 py-3.5">
                        <div class="flex items-center justify-end gap-3">
                            <form th:action="@{/admin/notices/{id}/pin(id=${notice.id})}" method="post" class="inline">
                                <button type="submit"
                                        th:text="${notice.isPinned ? '고정해제' : '고정'}"
                                        class="text-xs font-medium text-slate-400 hover:text-slate-700 transition-colors">고정</button>
                            </form>
                            <form th:action="@{/admin/notices/{id}/visibility(id=${notice.id})}" method="post" class="inline">
                                <button type="submit"
                                        th:text="${notice.isPublic ? '비공개' : '공개'}"
                                        class="text-xs font-medium text-slate-400 hover:text-slate-700 transition-colors">비공개</button>
                            </form>
                            <a th:href="@{/admin/notices/{id}/edit(id=${notice.id})}"
                               class="text-xs font-medium text-indigo-500 hover:text-indigo-700">수정</a>
                            <form th:action="@{/admin/notices/{id}/delete(id=${notice.id})}" method="post" class="inline">
                                <button type="submit"
                                        onclick="return confirm('삭제하시겠습니까?')"
                                        class="text-xs font-medium text-red-400 hover:text-red-600 transition-colors">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </th:block>
                <tr th:if="${#lists.isEmpty(notices)}">
                    <td colspan="6" class="px-5 py-10 text-center text-sm text-slate-400">공지사항이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</th:block>
</html>
