<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-slate-900">거래 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">이음마켓에 등록된 전체 상품을 조회하고 관리하세요.</p>
        </div>
    </div>

    <!-- 검색 + 날짜 필터 -->
    <form th:action="@{/admin/market/posts}" method="get" class="flex flex-wrap items-center gap-2 mb-4">
        <input type="hidden" name="status" th:value="${selectedStatus}"/>
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="상품명, 등록자 이메일로 검색..."
               class="flex-1 min-w-[200px] px-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <input type="date" name="from" th:value="${from}"
               class="px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <span class="text-xs text-slate-400">~</span>
        <input type="date" name="to" th:value="${to}"
               class="px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <button type="submit"
                class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
            검색
        </button>
        <a th:href="@{/admin/market/posts}"
           class="px-4 py-2 text-sm font-semibold text-slate-500 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
            초기화
        </a>
    </form>

    <!-- 상태 필터 탭 -->
    <div class="flex items-center gap-2 mb-4 flex-wrap">
        <a th:href="@{/admin/market/posts(keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == null} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체</a>
        <a th:href="@{/admin/market/posts(status='ACTIVE', keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == 'ACTIVE'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">판매중</a>
        <a th:href="@{/admin/market/posts(status='RESERVED', keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == 'RESERVED'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">예약중</a>
        <a th:href="@{/admin/market/posts(status='SOLD', keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == 'SOLD'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">판매완료</a>
        <a th:href="@{/admin/market/posts(status='REMOVED', keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == 'REMOVED'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">삭제됨</a>
    </div>

    <!-- 플래시 메시지 -->
    <div th:if="${message}" class="mb-4 px-4 py-3 bg-teal-50 border border-teal-200 rounded-xl text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-100 bg-slate-50">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상품명</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">카테고리</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">등록자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">가격</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">등록일</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="post : ${posts.content}">
                <tr class="hover:bg-slate-50 transition-colors cursor-pointer"
                    th:onclick="|location.href='@{/admin/market/posts/{id}(id=${post.id})}'|">
                    <td class="px-5 py-3.5">
                        <p class="font-medium text-slate-800 truncate max-w-[180px]" th:text="${post.title}">상품명</p>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs" th:text="${post.categoryName}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs" th:text="${post.sellerEmail}">-</td>
                    <td class="px-5 py-3.5 text-slate-700 text-xs font-medium"
                        th:text="${#numbers.formatInteger(post.price, 1, 'COMMA') + '원'}">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${post.statusLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${post.statusClass}">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs"
                        th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">-</td>
                </tr>
                </th:block>
                <tr th:if="${posts.empty}">
                    <td colspan="6" class="px-5 py-10 text-center text-sm text-slate-400">상품이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, '/admin/market/posts?' + (selectedStatus != null ? 'status=' + selectedStatus + '&' : '') + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : ''))}"></div>

</div>
</th:block>
</html>
