<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-ink">거래 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">이음마켓에 등록된 전체 상품을 조회하고 관리하세요.</p>
        </div>
    </div>

    <!-- 검색 + 날짜 필터 -->
    <form th:action="@{/admin/market/posts}" method="get" class="flex flex-wrap items-center gap-2 mb-4">
        <input type="hidden" name="sharing" th:value="${sharing}" th:if="${sharing != null}"/>
        <input type="hidden" name="status"  th:value="${selectedStatus}" th:if="${selectedStatus != null}"/>
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="상품명, 등록자 이메일로 검색..."
               class="flex-1 min-w-[200px] px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <input type="date" name="from" th:value="${from}"
               class="px-3 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <span class="text-xs text-slate-400">~</span>
        <input type="date" name="to" th:value="${to}"
               class="px-3 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <button type="submit"
                class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
            검색
        </button>
        <a th:href="@{/admin/market/posts}"
           class="px-4 py-2 text-sm font-semibold text-slate-500 border border-line-strong rounded-xl hover:bg-surface-alt transition-colors">
            초기화
        </a>
    </form>

    <!-- 판매 / 나눔 최상위 탭 -->
    <div class="flex items-center gap-1 mb-3">
        <a th:href="@{/admin/market/posts(keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${sharing == null} ? 'bg-slate-700 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors">전체</a>
        <a th:href="@{/admin/market/posts(sharing=false, keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${sharing != null and !sharing} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors">판매</a>
        <a th:href="@{/admin/market/posts(sharing=true, keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${sharing != null and sharing} ? 'bg-emerald-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors">나눔</a>
    </div>

    <!-- 상태 서브 탭 (나눔 여부에 따라 레이블 변경) -->
    <div class="flex items-center gap-2 mb-4 flex-wrap pl-1">
        <!-- 전체 탭 -->
        <a th:href="${sharing != null ? '/admin/market/posts?sharing=' + sharing + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/posts?' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == null} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors">전체</a>
        <!-- ACTIVE -->
        <a th:href="${sharing != null ? '/admin/market/posts?sharing=' + sharing + '&status=ACTIVE' + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/posts?status=ACTIVE&' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == 'ACTIVE'} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors"
           th:text="${sharing != null and sharing} ? '나눔중' : '판매중'">판매중</a>
        <!-- RESERVED -->
        <a th:href="${sharing != null ? '/admin/market/posts?sharing=' + sharing + '&status=RESERVED' + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/posts?status=RESERVED&' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == 'RESERVED'} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors">예약중</a>
        <!-- SOLD -->
        <a th:href="${sharing != null ? '/admin/market/posts?sharing=' + sharing + '&status=SOLD' + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/posts?status=SOLD&' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == 'SOLD'} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors"
           th:text="${sharing != null and sharing} ? '나눔완료' : '판매완료'">판매완료</a>
        <!-- REMOVED -->
        <a th:href="${sharing != null ? '/admin/market/posts?sharing=' + sharing + '&status=REMOVED' + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/posts?status=REMOVED&' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == 'REMOVED'} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors">삭제됨</a>
    </div>

    <!-- 플래시 메시지 -->
    <div th:if="${message}" class="mb-4 px-4 py-3 bg-teal-50 border border-teal-200 rounded-xl text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="bg-surface rounded-2xl border border-line overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-line bg-surface-alt">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상품명</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">구분</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">카테고리</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">등록자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">가격</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">등록일</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="post : ${posts.content}">
                <tr class="hover:bg-surface-alt transition-colors cursor-pointer"
                    th:onclick="|location.href='@{/admin/market/posts/{id}(id=${post.id})}'|">
                    <td class="px-5 py-3.5">
                        <p class="font-medium text-slate-800 truncate max-w-[180px]" th:text="${post.title}">상품명</p>
                    </td>
                    <td class="px-5 py-3.5">
                        <span th:if="${post.sharing}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-50 text-emerald-600">나눔</span>
                        <span th:unless="${post.sharing}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full bg-indigo-50 text-indigo-600">판매</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs" th:text="${post.categoryName}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs" th:text="${post.sellerEmail}">-</td>
                    <td class="px-5 py-3.5 text-slate-700 text-xs font-medium">
                        <span th:if="${post.sharing}" class="text-slate-400">무료</span>
                        <span th:unless="${post.sharing}"
                              th:text="${#numbers.formatInteger(post.price, 1, 'COMMA') + '원'}">-</span>
                    </td>
                    <td class="px-5 py-3.5">
                        <span th:text="${post.statusLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${post.statusClass}">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs"
                        th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">-</td>
                </tr>
                </th:block>
                <tr th:if="${posts.empty}">
                    <td colspan="7" class="px-5 py-10 text-center text-sm text-slate-400">상품이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 — Controller에서 안전하게 만든 pageBaseUrl 사용 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, ${pageBaseUrl})}"></div>

</div>
</th:block>
</html>
