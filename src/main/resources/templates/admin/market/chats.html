<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-ink">채팅 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">마켓 채팅 내역을 조회하고 관리하세요. 삭제된 상품의 채팅도 확인할 수 있습니다.</p>
        </div>
    </div>

    <!-- 검색 + 날짜 필터 -->
    <form th:action="@{/admin/market/chats}" method="get" class="flex flex-wrap items-center gap-2 mb-4">
        <input type="hidden" name="sharing"    th:value="${sharing}"        th:if="${sharing != null}"/>
        <input type="hidden" name="postStatus" th:value="${selectedStatus}" th:if="${selectedStatus != null}"/>
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="상품명, 등록자·구매자 이메일로 검색..."
               class="flex-1 min-w-[220px] px-4 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <input type="date" name="from" th:value="${from}"
               class="px-3 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <span class="text-xs text-slate-400">~</span>
        <input type="date" name="to" th:value="${to}"
               class="px-3 py-2 text-sm border border-line-strong rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <button type="submit"
                class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
            검색
        </button>
        <a th:href="@{/admin/market/chats}"
           class="px-4 py-2 text-sm font-semibold text-slate-500 border border-line-strong rounded-xl hover:bg-surface-alt transition-colors">
            초기화
        </a>
    </form>

    <!-- 판매 / 나눔 최상위 탭 -->
    <div class="flex items-center gap-1 mb-3">
        <a th:href="@{/admin/market/chats(keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${sharing == null} ? 'bg-slate-700 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors">전체</a>
        <a th:href="@{/admin/market/chats(sharing=false, keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${sharing != null and !sharing} ? 'bg-indigo-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors">판매 상품</a>
        <a th:href="@{/admin/market/chats(sharing=true, keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${sharing != null and sharing} ? 'bg-emerald-600 text-white' : 'bg-surface text-ink-muted border border-line-strong hover:bg-surface-alt'"
           class="px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors">나눔 상품</a>
    </div>

    <!-- 상품 상태 서브 탭 -->
    <div class="flex items-center gap-2 mb-4 flex-wrap pl-1">
        <a th:href="${sharing != null ? '/admin/market/chats?sharing=' + sharing + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/chats?' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == null} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors">전체</a>
        <a th:href="${sharing != null ? '/admin/market/chats?sharing=' + sharing + '&postStatus=ACTIVE' + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/chats?postStatus=ACTIVE&' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == 'ACTIVE'} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors"
           th:text="${sharing != null and sharing} ? '나눔중 상품' : '판매중 상품'">판매중 상품</a>
        <a th:href="${sharing != null ? '/admin/market/chats?sharing=' + sharing + '&postStatus=RESERVED' + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/chats?postStatus=RESERVED&' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == 'RESERVED'} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors">예약중 상품</a>
        <a th:href="${sharing != null ? '/admin/market/chats?sharing=' + sharing + '&postStatus=SOLD' + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/chats?postStatus=SOLD&' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == 'SOLD'} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors"
           th:text="${sharing != null and sharing} ? '나눔완료 상품' : '판매완료 상품'">판매완료 상품</a>
        <a th:href="${sharing != null ? '/admin/market/chats?sharing=' + sharing + '&postStatus=REMOVED' + (keyword != null ? '&keyword=' + keyword : '') + (from != null ? '&from=' + from : '') + (to != null ? '&to=' + to : '') + '&page=0' : '/admin/market/chats?postStatus=REMOVED&' + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : '') + 'page=0'}"
           th:classappend="${selectedStatus == 'REMOVED'} ? 'bg-indigo-100 text-indigo-700 font-semibold' : 'bg-surface text-slate-500 border border-line-strong hover:bg-surface-alt'"
           class="px-3 py-1 rounded-lg text-xs transition-colors">삭제된 상품</a>
    </div>

    <!-- 플래시 메시지 -->
    <div th:if="${message}" class="mb-4 px-4 py-3 bg-teal-50 border border-teal-200 rounded-xl text-sm text-teal-700"
         th:text="${message}"></div>

    <!-- overflow-x-auto + table min-w: 관리자 페이지는 반응형 미고려. 화면이 좁아지면 제목 줄바꿈 대신 가로 스크롤. -->
    <div class="bg-surface rounded-2xl border border-line overflow-x-auto">
        <table class="w-full min-w-[1000px] text-sm">
            <thead>
                <tr class="border-b border-line bg-surface-alt">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">상품명</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">구분</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">상품 상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">등록자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">받는이</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">채팅 상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">마지막 메시지</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">시작일</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-line">
                <th:block th:each="chat : ${chats.content}">
                <tr class="hover:bg-surface-alt transition-colors cursor-pointer"
                    th:onclick="|location.href='@{/market/chat/{id}(id=${chat.id})}'|">
                    <!-- 상품명 칸: 다른 컬럼과 조화롭게 고정 최대폭 안에서 말줄임. -->
                    <td class="px-5 py-3.5">
                        <p class="font-medium text-ink truncate max-w-[240px]" th:text="${chat.postTitle}">상품명</p>
                    </td>
                    <td class="px-5 py-3.5">
                        <span th:if="${chat.sharing}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-50 text-emerald-600">나눔</span>
                        <span th:unless="${chat.sharing}"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full bg-indigo-50 text-indigo-600">판매</span>
                    </td>
                    <td class="px-5 py-3.5">
                        <span th:text="${chat.postStatusLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${chat.postStatusClass}">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs whitespace-nowrap" th:text="${chat.registrantEmail}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs whitespace-nowrap" th:text="${chat.receiverEmail}">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${chat.chatStatusLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${chat.chatStatusClass}">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs">
                        <span th:if="${chat.lastMessageAt != null}"
                              th:text="${#temporals.format(chat.lastMessageAt, 'MM.dd HH:mm')}">-</span>
                        <span th:unless="${chat.lastMessageAt != null}" class="text-slate-300">-</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs"
                        th:text="${#temporals.format(chat.createdAt, 'yyyy.MM.dd')}">-</td>
                </tr>
                </th:block>
                <tr th:if="${chats.empty}">
                    <td colspan="8" class="px-5 py-10 text-center text-sm text-slate-400">채팅 내역이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 — Controller에서 안전하게 만든 pageBaseUrl 사용 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, ${pageBaseUrl})}"></div>

</div>
</th:block>
</html>
