<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div>

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-slate-900">채팅 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">마켓 채팅 내역을 조회하고 관리하세요. 삭제된 상품의 채팅도 확인할 수 있습니다.</p>
        </div>
    </div>

    <!-- 검색 + 날짜 필터 -->
    <form th:action="@{/admin/market/chats}" method="get" class="flex flex-wrap items-center gap-2 mb-4">
        <input type="hidden" name="postStatus" th:value="${selectedStatus}"/>
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="상품명, 판매자·구매자 이메일로 검색..."
               class="flex-1 min-w-[220px] px-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <input type="date" name="from" th:value="${from}"
               class="px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <span class="text-xs text-slate-400">~</span>
        <input type="date" name="to" th:value="${to}"
               class="px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300"/>
        <button type="submit"
                class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors">
            검색
        </button>
        <a th:href="@{/admin/market/chats}"
           class="px-4 py-2 text-sm font-semibold text-slate-500 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
            초기화
        </a>
    </form>

    <!-- 상품 상태별 필터 탭 -->
    <div class="flex items-center gap-2 mb-4 flex-wrap">
        <a th:href="@{/admin/market/chats(keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == null} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체</a>
        <a th:href="@{/admin/market/chats(postStatus='ACTIVE', keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == 'ACTIVE'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">판매중 상품</a>
        <a th:href="@{/admin/market/chats(postStatus='RESERVED', keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == 'RESERVED'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">예약중 상품</a>
        <a th:href="@{/admin/market/chats(postStatus='SOLD', keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == 'SOLD'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">판매완료 상품</a>
        <a th:href="@{/admin/market/chats(postStatus='REMOVED', keyword=${keyword}, from=${from}, to=${to}, page=0)}"
           th:classappend="${selectedStatus == 'REMOVED'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">삭제된 상품</a>
    </div>

    <!-- 플래시 메시지 -->
    <div th:if="${message}" class="mb-4 px-4 py-3 bg-teal-50 border border-teal-200 rounded-xl text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-100 bg-slate-50">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상품명</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상품 상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">판매자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">구매자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">채팅 상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">마지막 메시지</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">시작일</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="chat : ${chats.content}">
                <tr class="hover:bg-slate-50 transition-colors cursor-pointer"
                    th:onclick="|location.href='@{/market/chat/{id}(id=${chat.id})}'|">
                    <td class="px-5 py-3.5">
                        <p class="font-medium text-slate-800 truncate max-w-[160px]" th:text="${chat.postTitle}">상품명</p>
                    </td>
                    <td class="px-5 py-3.5">
                        <span th:text="${chat.postStatusLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${chat.postStatusClass}">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs" th:text="${chat.sellerEmail}">-</td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs" th:text="${chat.buyerEmail}">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${chat.chatStatusLabel}"
                              th:class="'px-2 py-0.5 text-xs font-semibold rounded-full ' + ${chat.chatStatusClass}">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs">
                        <span th:if="${chat.lastMessageAt != null}"
                              th:text="${#temporals.format(chat.lastMessageAt, 'MM.dd HH:mm')}">-</span>
                        <span th:unless="${chat.lastMessageAt != null}" class="text-slate-300">-</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs"
                        th:text="${#temporals.format(chat.createdAt, 'yyyy.MM.dd')}">-</td>
                </tr>
                </th:block>
                <tr th:if="${chats.empty}">
                    <td colspan="7" class="px-5 py-10 text-center text-sm text-slate-400">채팅 내역이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="~{fragments/pagination :: pager(${currentPage}, ${totalPages}, ${startPage}, ${endPage}, '/admin/market/chats?' + (selectedStatus != null ? 'postStatus=' + selectedStatus + '&' : '') + (keyword != null ? 'keyword=' + keyword + '&' : '') + (from != null ? 'from=' + from + '&' : '') + (to != null ? 'to=' + to + '&' : ''))}"></div>

</div>
</th:block>
</html>
