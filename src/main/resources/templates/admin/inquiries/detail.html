<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='문의 상세'">

    <!-- 브레드크럼 -->
    <div class="flex items-center gap-3 mb-6">
        <a th:href="@{/admin/inquiries}"
           class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            문의 목록
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-sm font-medium text-slate-700" th:text="${inquiry.title}">제목</span>
    </div>

    <!-- 플래시 메시지 -->
    <div th:if="${message}"
         class="mb-4 px-4 py-3 rounded-xl bg-teal-50 border border-teal-200 text-sm text-teal-700"
         th:text="${message}"></div>

    <div class="max-w-2xl space-y-4">

        <!-- 문의 내용 -->
        <div class="bg-white rounded-2xl border border-slate-100 p-6">
            <div class="flex items-center gap-2 mb-4">
                <span th:text="${inquiry.category.label()}"
                      class="px-2 py-0.5 text-xs font-medium rounded-md bg-slate-100 text-slate-500">분류</span>
                <span th:if="${inquiry.isSecret}"
                      class="flex items-center gap-1 px-2 py-0.5 text-xs font-medium rounded-md bg-slate-100 text-slate-500">
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    비밀글
                </span>
            </div>

            <h3 class="text-base font-semibold text-slate-900 mb-3" th:text="${inquiry.title}">제목</h3>

            <dl class="space-y-2 mb-4 text-xs text-slate-400">
                <div class="flex gap-3">
                    <dt>작성자</dt>
                    <dd th:text="${inquiry.author?.email ?: '-'}">-</dd>
                </div>
                <div class="flex gap-3">
                    <dt>등록일</dt>
                    <dd th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd HH:mm')}">-</dd>
                </div>
            </dl>

            <div class="border-t border-slate-100 pt-4">
                <p class="text-sm text-slate-700 whitespace-pre-line leading-relaxed"
                   th:text="${inquiry.body}">내용</p>
            </div>
        </div>

        <!-- 답변 상태 관리 — 항상 표시 -->
        <div class="bg-white rounded-2xl border border-slate-100 px-5 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-sm font-semibold text-slate-700">답변 상태</span>
                <span th:text="${inquiry.status.name() == 'PENDING' ? '미답변' : '답변완료'}"
                      th:classappend="${inquiry.status.name() == 'PENDING'} ? 'bg-red-50 text-red-500' : 'bg-teal-50 text-teal-600'"
                      class="px-2.5 py-1 text-xs font-semibold rounded-full">상태</span>
            </div>
            <form th:action="@{/admin/inquiries/{id}/status(id=${inquiry.id})}" method="post">
                <button type="submit"
                        th:text="${inquiry.status.name() == 'PENDING' ? '답변완료로 변경' : '미답변으로 변경'}"
                        th:classappend="${inquiry.status.name() == 'PENDING'} ? 'bg-teal-50 text-teal-600 border-teal-200 hover:bg-teal-100' : 'bg-red-50 text-red-500 border-red-200 hover:bg-red-100'"
                        class="px-3.5 py-1.5 text-xs font-semibold rounded-xl border transition-colors">
                    상태 변경
                </button>
            </form>
        </div>

        <!-- 기존 답변 표시 -->
        <div th:if="${inquiry.reply != null}"
             class="bg-indigo-50 rounded-2xl border border-indigo-100 p-6">
            <div class="flex items-center gap-2 mb-3">
                <svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                </svg>
                <span class="text-sm font-semibold text-indigo-700">등록된 답변</span>
                <span class="text-xs text-indigo-400 ml-auto"
                      th:text="${#temporals.format(inquiry.reply.createdAt, 'yyyy.MM.dd HH:mm')}">-</span>
            </div>
            <p class="text-sm text-indigo-800 whitespace-pre-line leading-relaxed"
               th:text="${inquiry.reply.body}">답변 내용</p>
        </div>

        <!-- 답변 작성/수정 폼 -->
        <div class="bg-white rounded-2xl border border-slate-100 p-6">
            <h4 class="text-sm font-semibold text-slate-700 mb-4"
                th:text="${inquiry.reply != null ? '답변 수정' : '답변 작성'}">답변 작성</h4>
            <form th:action="@{/admin/inquiries/{id}/reply(id=${inquiry.id})}"
                  th:object="${replyForm}" method="post" class="space-y-4">
                <div>
                    <textarea th:field="*{body}" rows="6"
                              th:text="${inquiry.reply != null ? inquiry.reply.body : ''}"
                              placeholder="답변 내용을 입력하세요"
                              class="w-full px-4 py-3 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition resize-none"></textarea>
                    <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}"
                       class="mt-1 text-xs text-red-500"></p>
                </div>
                <div class="flex justify-end">
                    <button type="submit"
                            th:text="${inquiry.reply != null ? '답변 수정' : '답변 등록'}"
                            class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm shadow-indigo-100">
                        답변 등록
                    </button>
                </div>
            </form>
        </div>

    </div>

</div>
</th:block>
</html>
