<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::content})}">
<th:block th:fragment="content">
<div th:attr="data-page-title='문의 관리'">

    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-slate-900">문의 관리</h2>
            <p class="text-sm text-slate-500 mt-0.5">사용자 문의를 확인하고 답변하세요.</p>
        </div>
    </div>

    <!-- 답변 상태 필터 -->
    <div class="flex items-center gap-2 mb-3">
        <a th:href="@{/admin/inquiries(category=${selectedCategory}, page=0)}"
           th:classappend="${selectedStatus == null} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체</a>
        <a th:href="@{/admin/inquiries(status='PENDING', category=${selectedCategory}, page=0)}"
           th:classappend="${selectedStatus == 'PENDING'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">미답변</a>
        <a th:href="@{/admin/inquiries(status='ANSWERED', category=${selectedCategory}, page=0)}"
           th:classappend="${selectedStatus == 'ANSWERED'} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">답변완료</a>
    </div>

    <!-- 카테고리 필터 -->
    <div class="flex items-center gap-2 mb-4">
        <a th:href="@{/admin/inquiries(status=${selectedStatus}, page=0)}"
           th:classappend="${selectedCategory == null} ? 'bg-slate-700 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">전체 분류</a>
        <th:block th:each="cat : ${categories}">
        <a th:href="@{/admin/inquiries(status=${selectedStatus}, category=${cat.name()}, page=0)}"
           th:text="${cat.label()}"
           th:classappend="${selectedCategory == cat.name()} ? 'bg-slate-700 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'"
           class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors">카테고리</a>
        </th:block>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="border-b border-slate-100 bg-slate-50">
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">분류</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">제목</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">작성자</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">상태</th>
                    <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">등록일</th>
                    <th class="px-5 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <th:block th:each="inquiry : ${inquiries}">
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-5 py-3.5">
                        <span th:text="${inquiry.category.label()}"
                              class="px-2 py-0.5 text-xs font-medium rounded-md bg-slate-100 text-slate-500">분류</span>
                    </td>
                    <td class="px-5 py-3.5">
                        <div class="flex items-center gap-1.5">
                            <svg th:if="${inquiry.isSecret}" class="w-3.5 h-3.5 text-slate-400 flex-shrink-0"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            <p class="font-medium text-slate-800 truncate max-w-xs" th:text="${inquiry.title}">제목</p>
                        </div>
                    </td>
                    <td class="px-5 py-3.5 text-slate-500 text-xs" th:text="${inquiry.author?.email ?: '-'}">-</td>
                    <td class="px-5 py-3.5">
                        <span th:text="${inquiry.status.name() == 'PENDING' ? '미답변' : '답변완료'}"
                              th:classappend="${inquiry.status.name() == 'PENDING'} ? 'bg-red-50 text-red-500' : 'bg-teal-50 text-teal-600'"
                              class="px-2 py-0.5 text-xs font-semibold rounded-full">상태</span>
                    </td>
                    <td class="px-5 py-3.5 text-slate-400 text-xs"
                        th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd HH:mm')}">-</td>
                    <td class="px-5 py-3.5 text-right">
                        <a th:href="@{/admin/inquiries/{id}(id=${inquiry.id})}"
                           class="text-xs font-medium text-indigo-500 hover:text-indigo-700">답변하기</a>
                    </td>
                </tr>
                </th:block>
                <tr th:if="${#lists.isEmpty(inquiries)}">
                    <td colspan="6" class="px-5 py-10 text-center text-sm text-slate-400">문의가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div th:if="${inquiryPage.totalPages > 1}" class="flex items-center justify-center gap-1 mt-6">

        <!-- 이전 -->
        <a th:if="${!inquiryPage.first}"
           th:href="@{/admin/inquiries(status=${selectedStatus}, category=${selectedCategory}, page=${currentPage - 1})}"
           class="px-3 py-2 text-sm text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <span th:if="${inquiryPage.first}" class="px-3 py-2 text-slate-300">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </span>

        <!-- 페이지 번호 -->
        <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
            <a th:if="${i != currentPage}"
               th:href="@{/admin/inquiries(status=${selectedStatus}, category=${selectedCategory}, page=${i})}"
               th:text="${i + 1}"
               class="px-3.5 py-2 text-sm text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">1</a>
            <span th:if="${i == currentPage}"
                  th:text="${i + 1}"
                  class="px-3.5 py-2 text-sm font-semibold text-white bg-indigo-600 rounded-lg">1</span>
        </th:block>

        <!-- 다음 -->
        <a th:if="${!inquiryPage.last}"
           th:href="@{/admin/inquiries(status=${selectedStatus}, category=${selectedCategory}, page=${currentPage + 1})}"
           class="px-3 py-2 text-sm text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </a>
        <span th:if="${inquiryPage.last}" class="px-3 py-2 text-slate-300">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </span>

    </div>

</div>
</th:block>
</html>
