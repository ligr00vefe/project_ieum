<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  회원가입/로그인 플로우 공통 상단바 fragment
  파라미터:
    mode  - 'login-link'    : 오른쪽에 "로그인 →" 링크 (type-select 페이지)
          - 'register-link' : 오른쪽에 "회원가입 →" 링크 (login 페이지)
          - 'badge'         : 오른쪽에 userType 뱃지 (step1~4)
          - 'none'          : 오른쪽 없음 (complete 페이지)
-->
<div th:fragment="header(mode)" class="bg-surface border-b border-line px-4 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">

        <!-- 로고 -->
        <a th:href="@{/}" class="flex items-center gap-2.5 group">
            <img th:src="@{/images/logo/logo.png}" alt="이음 로고" class="h-9 w-auto">
            <div class="leading-tight">
                <div class="text-[14px] font-bold text-ink">이음</div>
                <div class="text-[9px] text-gray-400 font-medium tracking-wide -mt-0.5">Care Match</div>
            </div>
        </a>

        <!-- 로그인 링크 (type-select) -->
        <a th:if="${mode == 'login-link'}"
           th:href="@{/login}"
           class="text-sm text-gray-500 hover:text-indigo-600 font-medium transition-colors">
            이미 계정이 있으신가요?
            <span class="text-indigo-600 font-semibold ml-1">로그인 →</span>
        </a>

        <!-- 회원가입 링크 (login) -->
        <a th:if="${mode == 'register-link'}"
           th:href="@{/register/type-select}"
           class="text-sm text-gray-500 hover:text-indigo-600 transition-colors font-medium">
            계정이 없으신가요?
            <span class="text-indigo-600 font-semibold ml-1">회원가입 →</span>
        </a>

        <!-- 유형 뱃지 (step 페이지) -->
        <th:block th:if="${mode == 'badge'}">
            <span th:if="${userType == 'caregiver'}"
                  class="px-3 py-1 bg-teal-50 text-teal-700 text-xs font-semibold rounded-full border border-teal-100">
                활동지원사 가입
            </span>
            <span th:if="${userType == 'disabled'}"
                  class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full border border-indigo-100">
                가입
            </span>
        </th:block>

        <!-- 빈 오른쪽 (complete) -->
        <span th:if="${mode == 'none'}"></span>

    </div>
</div>

</body>
</html>
