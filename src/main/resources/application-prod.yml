spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IEUM_DB_URL}
    username: ${IEUM_DB_USERNAME}
    password: ${IEUM_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      max-lifetime: 580000        # 9분 40초 — MySQL wait_timeout(기본 600초)보다 짧게
      connection-timeout: 5000    # 커넥션 대기는 5초까지만 — 30초는 톰캣 스레드까지 말라죽는다
      validation-timeout: 3000
      idle-timeout: 300000
      keepalive-time: 120000      # 2분마다 커넥션 유지 핑 전송
      connection-test-query: SELECT 1
      leak-detection-threshold: 20000  # 20초 넘게 안 돌려주면 점유 스레드 스택을 로그로 남긴다
      # 드라이버 기본값(socketTimeout=0)이면 죽은 커넥션에서 무한 대기 → 커넥션이 영구 점유된다
      data-source-properties:
        connectTimeout: 5000
        socketTimeout: 30000
        tcpKeepAlive: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true
matching:
  scheduler:
    # 운영 환경에서만 시간 자동 전이 활성화(단일 인스턴스·재시작 배포 전제)
    enabled: true
ieum:
  seed:
    # 데모 계정·더미 데이터는 운영에 절대 심지 않는다(기본값이지만 의도를 명시).
    # 관리자가 필요하면 시드를 켜지 말고 ieum.admin.bootstrap.* 환경변수를 쓴다 —
    # 시드를 켜면 소스에 비밀번호가 드러난 데모 계정까지 함께 심어진다.
    enabled: false
  dev:
    # 개발용 이메일 인증 우회. application.properties의 test.com을 비워 덮는다 —
    # 운영에 남으면 해당 도메인 주소로 가입할 때 인증 단계가 통째로 건너뛰어진다.
    email-verify-skip-domain: ""
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
