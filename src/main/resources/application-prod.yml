spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IEUM_DB_URL}
    username: ${IEUM_DB_USERNAME}
    password: ${IEUM_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
