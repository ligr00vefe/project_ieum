spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IEUM_DB_URL}
    username: ${IEUM_DB_USERNAME}
    password: ${IEUM_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true
matching:
  scheduler:
    # 운영 환경에서만 시간 자동 전이 활성화(단일 인스턴스·재시작 배포 전제)
    enabled: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
