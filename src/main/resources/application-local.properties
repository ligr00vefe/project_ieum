# ===== 로컬 개발 프로파일 =====
# 실제 팀 DB 접속은 application-secret.properties(gitignored)가 오버라이드한다.
# secret 미설정 개발자는 아래 환경변수(IEUM_DB_*)로 자신의 DB를 주입한다.
# (아래 db7/1234 는 환경변수·secret 둘 다 없을 때의 마지막 fallback 예시값)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${IEUM_DB_URL:jdbc:mysql://localhost:3306/db7?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${IEUM_DB_USERNAME:db7}
spring.datasource.password=${IEUM_DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
