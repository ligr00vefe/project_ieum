spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IEUM_DB_URL:jdbc:mysql://localhost:3306/db7?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${IEUM_DB_USERNAME:db7}
    password: ${IEUM_DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  # 로컬 개발: Mailpit 로컬 SMTP 서버 사용 (https://mailpit.axllent.org)
  # mailpit 실행 시 localhost:1025 SMTP, localhost:8025 Web UI
  mail:
    host: ${IEUM_MAIL_HOST:localhost}
    port: ${IEUM_MAIL_PORT:1025}
    username: ${IEUM_MAIL_USERNAME:local@ieum.dev}
    password: ${IEUM_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
