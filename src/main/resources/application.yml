spring:
  application:
    name: ieum
  profiles:
    default: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB
  thymeleaf:
    cache: false
server:
  port: 8080
ieum:
  upload:
    certification-path: ${IEUM_CERTIFICATION_UPLOAD_PATH:${user.home}/ieum/uploads/certifications}
