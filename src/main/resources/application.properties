spring.profiles.include=secret

# App name
spring.application.name=ieum

# Server port
server.port=8080

# Context path
server.servlet.context-path=/

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
# 뷰 렌더링이 지연로딩에 의존하는 화면이 많아 전역 해제는 불가(WebMvcConfig 주석 참고).
# 커넥션을 30분씩 물던 SSE 경로(/api/**)만 WebMvcConfig에서 OSIV 대상에서 제외한다.
spring.jpa.open-in-view=true

# thymeleaf
spring.thymeleaf.cache=false

# 매칭 수명주기 자동전이 스케줄러 (1분마다)
matching.scheduler.enabled=true
matching.scheduler.fixed-delay-ms=60000

# db \uC811\uC18D \uC124\uC815 \uD30C\uC77C \uC774\uB984: application-secret.properties
# UserName \uC744 \uCC3E\uC544\uBC14\uAFB8\uAE30 \uAE30\uB2A5\uC73C\uB85C \uD558\uBA74 \uC27D\uAC8C \uBC14\uAFC0 \uC218 \uC788\uC74C.
# == \uBCF8\uBB38 ======================================
## Spring Data Source mysql
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://clustern.iptime.org:30306/dev_UserName
#spring.datasource.username=UserName
#spring.datasource.password=pw

# 개발용: test.com 도메인 계정 이메일 인증 자동 패스
ieum.dev.email-verify-skip-domain=test.com

# 관리자 최초 1회 생성. 값은 저장소에 두지 않고 환경변수로만 주입한다
# (IEUM_ADMIN_BOOTSTRAP_EMAIL / IEUM_ADMIN_BOOTSTRAP_PASSWORD).
# 둘 중 하나라도 비면 동작하지 않고, ADMIN이 이미 있으면 건너뛴다.
ieum.admin.bootstrap.email=
ieum.admin.bootstrap.password=

# 데모 계정·더미 데이터 시딩 스위치. 기본 off.
# 이 저장소는 공개돼 있어 시드 계정의 비밀번호가 소스만 읽어도 드러난다 — 운영에서는 절대 켜지 않는다.
# 로컬 데모가 필요하면 이 파일이 아니라 gitignore 대상인 application-secret.properties에
# ieum.seed.enabled=true 를 넣는다(프로파일 파일이 이 값을 덮는다).
ieum.seed.enabled=false
