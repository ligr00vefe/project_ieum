# ===== 활성 프로파일 =====
spring.profiles.include=secret
spring.profiles.default=local

# ===== 애플리케이션 =====
spring.application.name=ieum

# ===== 서버 =====
server.port=8080
server.servlet.context-path=/

# ===== 파일 업로드(Multipart) =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== 업로드 경로 =====
ieum.upload.certification-path=${IEUM_CERTIFICATION_UPLOAD_PATH:${user.home}/ieum/uploads/certifications}

# ===== 매칭 시간 자동전이 스케줄러 =====
# 기본 off. prod에서만 on(application-prod.properties), test는 명시 off.
matching.scheduler.enabled=false
matching.scheduler.fixed-delay-ms=60000

# ===== DB 접속 =====
# 실제 접속 정보는 application-secret.properties(gitignored)가 제공하며
# spring.profiles.include=secret 로 로드되어 프로파일 datasource를 오버라이드한다.
