# App name
spring.application.name=ieum

# Server port
server.port=8080

# Context path
server.servlet.context-path=/

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
# 뷰 렌더링이 지연로딩에 의존하는 화면이 많아 전역 해제는 불가(WebMvcConfig 주석 참고).
# 커넥션을 30분씩 물던 SSE 경로(/api/**)만 WebMvcConfig에서 OSIV 대상에서 제외한다.
spring.jpa.open-in-view=true

# thymeleaf
spring.thymeleaf.cache=false

# 매칭 수명주기 자동전이 스케줄러 (1분마다)
matching.scheduler.enabled=true
matching.scheduler.fixed-delay-ms=60000
